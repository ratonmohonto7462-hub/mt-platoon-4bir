<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>MT PLATOON - LOGIN</title> <style> *{box-sizing:border-box;font-family:Arial,sans-serif} body{margin:0;background:#fff;padding:24px} h1{font-size:34px;line-height:1.2;margin:30px 0 30px} label{color:#555;font-size:17px} input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:8px 0 22px} button{width:100%;background:#111;color:#fff;border:none;padding:18px;border-radius:50px;font-size:22px;font-weight:bold;cursor:pointer;margin-top:10px} a{color:#111;font-weight:bold} .center{text-align:center;margin-top:20px;font-size:17px} #msg{color:red;text-align:center;margin-top:12px;font-weight:bold;display:none} #ok{color:green;text-align:center;margin-top:12px;font-weight:bold;display:none} </style> </head> <body> <h1>Log into Your MT<br>Garage Account</h1> <label>Army Number</label> <input id="sena" placeholder="Enter Army Number" inputmode="numeric" autocomplete="off"> <label>Mobile Number</label> <input id="mobile" placeholder="01XXXXXXXXX" inputmode="numeric" autocomplete="off"> <label>Password</label> <input id="pass" type="password" placeholder="••••••••" autocomplete="off"> <button onclick="doLogin()" id="btn">Login</button> <div id="msg"></div> <div id="ok"></div> <div class="center">Don't have an account?<br><a href="create-profile.html">Create one</a></div> <div class="center" style="color:green;font-size:12px">Version: NEW APP - 95106bb74</div> <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script> <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script> <script> var firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:95106bb74fab8444fdca80", measurementId: "G-PTEBJFVKZF" }; if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); var db = firebase.firestore(); async function doLogin(){ var sena = document.getElementById('sena').value.trim(); var mobile = document.getElementById('mobile').value.trim(); var pass = document.getElementById('pass').value.trim(); var msg = document.getElementById('msg'); var ok = document.getElementById('ok'); var btn = document.getElementById('btn'); msg.style.display='none'; ok.style.display='none'; if(!sena || !mobile || !pass){ msg.style.display='block'; msg.innerText='সব ঘর পূরণ করো'; return; } btn.innerText='Checking...'; btn.disabled = true; try{ var d = await db.collection('users').doc(sena).get(); if(!d.exists){ msg.style.display='block'; msg.innerText='Account নাই। আগে Create one চাপো'; btn.innerText='Login'; btn.disabled=false; return; } var found = d.data(); var dbMobile = String(found.mobile || '').trim(); var dbPass = String(found.pass || '').trim(); if(dbMobile !== mobile){ msg.style.display='block'; msg.innerText='Mobile Number ভুল'; btn.innerText='Login'; btn.disabled=false; return; } if(dbPass !== pass){ msg.style.display='block'; msg.innerText='Password ভুল'; btn.innerText='Login'; btn.disabled=false; return; } if(String(found.status||'').toLowerCase() !== 'approved'){ msg.style.display='block'; msg.innerText='এখনো Approved হয় নাই'; btn.innerText='Login'; btn.disabled=false; return; } ok.style.display='block'; ok.innerText='Login হইছে! Dashboard এ যাইতেছি...'; localStorage.setItem('sena_no', sena); localStorage.setItem('mt_army', sena); localStorage.setItem('mt_name', found.name || ''); localStorage.setItem('mt_mobile', mobile); localStorage.setItem('mt_role', 'USER'); localStorage.setItem('index_ok', 'yes'); localStorage.setItem('mt_login', 'yes'); setTimeout(function(){ location.href='dashboard.html'; }, 500); }catch(e){ msg.style.display='block'; msg.innerText='Error: '+e.message; btn.innerText='Login'; btn.disabled=false; } } </script> </body> </html>
