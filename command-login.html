<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT PLATOON - LOGIN</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;padding:24px}
h1{font-size:34px;line-height:1.2;margin:30px 0 30px}
label{color:#555;font-size:17px}
input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:8px 0 22px}
button{width:100%;background:#111;color:#fff;border:none;padding:18px;border-radius:50px;font-size:22px;font-weight:bold;cursor:pointer;margin-top:10px}
a{color:#111;font-weight:bold}
.center{text-align:center;margin-top:20px;font-size:17px}
#msg{color:red;text-align:center;margin-top:12px;font-weight:bold;display:none}
</style>
</head>
<body>
<h1>Log into Your MT<br>Garage Account</h1>

<label>Army Number</label>
<input id="sena" placeholder="Enter Army Number" inputmode="numeric">
<label>Mobile Number</label>
<input id="mobile" placeholder="01XXXXXXXXX" inputmode="numeric">
<label>Password</label>
<input id="pass" type="password" placeholder="••••••••">
<button onclick="doLogin()" id="btn">Login</button>
<div id="msg"></div>
<div class="center">Don't have an account?<br><a href="create-profile.html">Create one</a></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
// ⚠️ এই 5 লাইন তোমার পুরানো ফাইল থেকে কপি কইরা এখানে বসাও
// তোমার পুরানো ফাইলে firebaseConfig যেইটা আছে ঐটাই বসাও
var firebaseConfig = {
  apiKey: "তোমার পুরানো ফাইলের apiKey",
  authDomain: "mt-messenger-63922.firebaseapp.com",
  projectId: "mt-messenger-63922",
  storageBucket: "mt-messenger-63922.appspot.com",
  messagingSenderId: "তোমার পুরানো ফাইলের টা",
  appId: "তোমার পুরানো ফাইলের টা"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

async function doLogin(){
  var sena = document.getElementById('sena').value.trim();
  var mobile = document.getElementById('mobile').value.trim();
  var pass = document.getElementById('pass').value.trim();
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  if(!sena || !mobile || !pass){ msg.style.display='block'; msg.innerText='সব ঘর পূরণ করো'; return; }
  btn.innerText='Checking...';
  try{
    var doc = await db.collection('users').doc(sena).get();
    if(!doc.exists){
      msg.style.display='block'; msg.innerText='Account নাই। আগে Create one চাপো';
      btn.innerText='Login'; return;
    }
    var u = doc.data();
    // Firebase এ field নাম sena / mobile / pass - এইটা মিলাইলাম
    var dbMobile = String(u.mobile || u.phone || '');
    var dbPass = String(u.pass || u.password || '');
    if(dbMobile !== mobile){ msg.style.display='block'; msg.innerText='Mobile Number ভুল'; btn.innerText='Login'; return; }
    if(dbPass !== pass){ msg.style.display='block'; msg.innerText='Password ভুল'; btn.innerText='Login'; return; }
    if(u.status && u.status !== 'approved'){ msg.style.display='block'; msg.innerText='এখনো Approved হয় নাই, MT CLK কে কও'; btn.innerText='Login'; return; }

    // ✅ Login হইছে - এখন Dashboard / Home চিনবো
    localStorage.setItem('sena_no', sena);
    localStorage.setItem('mt_army', sena);
    localStorage.setItem('mt_name', u.name || '');
    localStorage.setItem('mt_mobile', mobile);
    localStorage.setItem('mt_role', 'USER');
    localStorage.setItem('index_ok', 'yes');
    location.href = 'dashboard.html';
  }catch(e){
    msg.style.display='block'; msg.innerText='Error: '+e.message;
    btn.innerText='Login';
  }
}
</script>
</body>
</html>
