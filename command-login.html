<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT PLATOON - LOGIN</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;padding:24px}
h1{font-size:34px;line-height:1.2;margin:30px 0 30px}
label{color:#555;font-size:17px}
input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:8px 0 22px}
button{width:100%;background:#111;color:#fff;border:none;padding:18px;border-radius:50px;font-size:22px;font-weight:bold;cursor:pointer;margin-top:10px}
a{color:#111;font-weight:bold}
.center{text-align:center;margin-top:20px;font-size:17px}
#msg{color:red;text-align:center;margin-top:12px;font-weight:bold;display:none}
#ok{color:green;text-align:center;margin-top:12px;font-weight:bold;display:none}
</style>
</head>
<body>
<h1>Log into Your MT<br>Garage Account</h1>

<label>Army Number</label>
<input id="sena" placeholder="Enter Army Number" inputmode="numeric" autocomplete="off">
<label>Mobile Number</label>
<input id="mobile" placeholder="01XXXXXXXXX" inputmode="numeric" autocomplete="off">
<label>Password</label>
<input id="pass" type="password" placeholder="••••••••" autocomplete="off">
<button onclick="doLogin()" id="btn">Login</button>
<div id="msg"></div>
<div id="ok"></div>
<div class="center">Don't have an account?<br><a href="create-profile.html">Create one</a></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
// ===== FIREBASE THIK RAKHA - HAT DEWA HOY NAI =====
var firebaseConfig = {
  apiKey: "AIzaSyA99iSvbxKItztZTn8w7ImDHnAbem25ji0",
  authDomain: "mt-platoon-4bir.firebaseapp.com",
  projectId: "mt-platoon-4bir",
  storageBucket: "mt-platoon-4bir.firebasestorage.app",
  messagingSenderId: "720139134198",
  appId: "1:720139134198:web:ea8e10926d90bbfddcb8d7",
  measurementId: "G-1B1Y32W1FH"
};
// ================================================
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

async function doLogin(){
  var sena = document.getElementById('sena').value.trim();
  var mobile = document.getElementById('mobile').value.trim();
  var pass = document.getElementById('pass').value.trim();
  var msg = document.getElementById('msg');
  var ok = document.getElementById('ok');
  var btn = document.getElementById('btn');
  msg.style.display='none'; ok.style.display='none';
  if(!sena || !mobile || !pass){ msg.style.display='block'; msg.innerText='সব ঘর পূরণ করো'; return; }
  btn.innerText='Checking...'; btn.disabled = true;
  try{
    var found = null;
    try{ var s1 = await db.collection('users').where('sena','==',sena).get(); if(!s1.empty) found = s1.docs[0].data(); }catch(e){}
    if(!found){ try{ var d1 = await db.collection('users').doc(sena).get(); if(d1.exists) found = d1.data(); }catch(e){} }
    if(!found){ try{ var s2 = await db.collection('profiles').where('sena','==',sena).get(); if(!s2.empty) found = s2.docs[0].data(); }catch(e){} }
    if(!found){ try{ var d2 = await db.collection('profiles').doc(sena).get(); if(d2.exists) found = d2.data(); }catch(e){} }
    if(!found){ msg.style.display='block'; msg.innerText='Account নাই। আগে Create one চাপো'; btn.innerText='Login'; btn.disabled=false; return; }
    var dbMobile = String(found.mobile || found.phone || found.mobileNumber || '').trim();
    var dbPass = String(found.pass || found.password || '').trim();
    if(dbMobile !== mobile){ msg.style.display='block'; msg.innerText='Mobile Number ভুল'; btn.innerText='Login'; btn.disabled=false; return; }
    if(dbPass !== pass){ msg.style.display='block'; msg.innerText='Password ভুল'; btn.innerText='Login'; btn.disabled=false; return; }
    var st = String(found.status || 'approved').toLowerCase();
    if(st !== 'approved'){ msg.style.display='block'; msg.innerText='এখনো Approved হয় নাই, MT CLK কে কও। Status: '+st; btn.innerText='Login'; btn.disabled=false; return; }
    ok.style.display='block'; ok.innerText='Login হইছে! Dashboard এ যাইতেছি...';
    localStorage.setItem('sena_no', sena);
    localStorage.setItem('mt_army', sena);
    localStorage.setItem('mt_name', found.name || found.fullName || '');
    localStorage.setItem('mt_mobile', mobile);
    localStorage.setItem('mt_role', 'USER');
    localStorage.setItem('index_ok', 'yes');
    localStorage.setItem('mt_login', 'yes');
    setTimeout(function(){ location.href='dashboard.html'; }, 500);
  }catch(e){
    msg.style.display='block'; msg.innerText='Error: '+e.message;
    btn.innerText='Login'; btn.disabled=false;
  }
}
</script>
</body>
</html>
