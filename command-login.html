l<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><style>body{margin:0;font-family:system-ui;background:#0a1a12;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{width:90%;max-width:360px;background:#143d27;padding:25px;border-radius:16px;border:1px solid #2a5a3a}input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #2a5a3a;background:#0a1a12;color:#fff}button{width:100%;padding:13px;background:#00c853;color:#000;font-weight:800;border:none;border-radius:8px;cursor:pointer}</style></head><body><div class="box"><h3 style="text-align:center">4 BIR - MT PLATOON LOGIN</h3><input id="mobile" placeholder="Mobile Number"><input id="sena_no" placeholder="Sena No - 4521328"><input id="pwd" type="password" placeholder="Password"><button onclick="loginUser()">LOGIN</button></div><script>function loginUser(){let m=document.getElementById("mobile").value.trim();let s=document.getElementById("sena_no").value.trim();let p=document.getElementById("pwd").value.trim();if(!m||!s||!p){alert("সব ঘর পূরণ করো");return;}localStorage.setItem("mobile",m);localStorage.setItem("sena_no",s);localStorage.setItem("mt_army",s);localStorage.setItem("mt_profile_login","true");window.location.replace("home.html");}</script></body></html>
