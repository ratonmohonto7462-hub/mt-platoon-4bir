<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT PLATOON 4 BIR - LOGIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: Arial}
body{background:#0a0a0a;color:#d4af37;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.wrap{width:100%;max-width:420px;text-align:center}
.logo{width:145px;height:145px;margin:0 auto 18px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 2px #d4af37, 0 0 30px rgba(212,175,55,0.8);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.title{font-weight:900;font-size:24px;color:#e5c15a}
.title small{display:block;font-size:12px;letter-spacing:3px;color:#b89b4a;margin-top:4px}
.divider{width:100%;height:1px;background:linear-gradient(90deg, transparent, #d4af37, transparent);margin:20px 0;position:relative}
.divider::after{content:'❧';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0a0a;padding:0 10px;color:#d4af37}
.card{border:1.5px solid #d4af37;background:rgba(15,15,15,0.9);padding:28px 22px;border-radius:6px;box-shadow:0 0 30px rgba(212,175,55,0.15);text-align:left}
.login-head{font-size:32px;font-weight:900;color:#e5c15a}
.login-sub{font-size:12px;color:#a08a4a;margin:8px 0 22px}
.label{font-size:13px;color:#e5c15a;margin:18px 0 7px;font-weight:700}
.select-area{position:relative;z-index:100}
.main-box{border:1px solid #b89b4a;background:#111;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:#ddd}
.dropdown{position:absolute;top:105%;left:0;right:0;background:#151515;border:1px solid #8a7a3a;display:none;z-index:200}
.dropdown.open{display:block}
.opt{padding:14px 16px;cursor:pointer;color:#ccc;border-bottom:1px solid #222}
.opt.sel{background:#201e0a;color:#e5c15a}
.pwd-box{position:relative;margin-top:5px}
.pwd-box input{width:100%;padding:14px 16px 14px 42px;border:1px solid #b89b4a;background:#111;color:#ddd;outline:none}
.lock{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#d4af37}
.loginBtn{margin:28px auto 0;display:block;width:200px;background:linear-gradient(180deg,#f3d67a,#c8a43a);color:#1a1a0a;font-weight:900;font-size:20px;letter-spacing:2px;padding:14px;border:none;cursor:pointer}
.footer{margin-top:26px;font-size:9px;letter-spacing:2px;color:#6b5d2e;text-align:center}
.creator{margin-top:8px;font-size:11px;color:#8a7a3a;text-align:center;font-weight:600}
.creator span{color:#d4af37}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.png" alt="MT GARAGE"></div>
  <div class="title">MT PLATOON 4 BIR<small>BANGLADESH ARMY</small></div>
  <div class="divider"></div>
  <div class="card">
    <div class="login-head">LOGIN</div>
    <div class="login-sub">Authorized Personnel Only • Secure Access</div>
    <div class="label">ROLE / UNIT</div>
    <div class="select-area">
      <div class="main-box" onclick="toggleDrop()"><span id="selText">COMMAND / MT CLK</span><span class="arrow">▼</span></div>
      <div class="dropdown" id="drop">
        <div class="opt" onclick="selectOpt('COMMAND',this)">COMMAND</div>
        <div class="opt" onclick="selectOpt('MT CLK',this)">MT CLK</div>
      </div>
    </div>
    <div class="label">PASSWORD</div>
    <div class="pwd-box"><span class="lock">🔒</span><input type="password" id="pwd" placeholder="পাসওয়ার্ড লিখুন"></div>
    <button class="loginBtn" onclick="doLogin()">LOGIN</button>
  </div>
  <div class="footer">MT PLATOON 4 • BIR • BANGLADESH ARMY • CONFIDENTIAL</div>
  <div class="creator">Create By <span>Snk Raton 4 Bir MT</span></div>
</div>
<script>
let cur="";function toggleDrop(){document.getElementById('drop').classList.toggle('open')}
function selectOpt(v,el){cur=v;document.getElementById('selText').innerText=v;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('drop').classList.remove('open');}
function doLogin(){
 let p=document.getElementById('pwd').value;
 if(!cur){alert('ROLE / UNIT Select করুন');return;}
 if(!p){alert('পাসওয়ার্ড দিন');return;}
 if(cur==="COMMAND" && p==="4-Bir-mt"){localStorage.setItem('mt_role','COMMAND');location.href="dashboard.html";}
 else if(cur==="MT CLK" && p==="Admin7462"){localStorage.setItem('mt_role','MT CLK');location.href="dashboard.html";}
 else{alert('Password ভুল!\\nCOMMAND = 4-Bir-mt\\nMT CLK = Admin7462');}
}
window.addEventListener('click',e=>{if(!e.target.closest('.select-area')) document.getElementById('drop').classList.remove('open')});
</script>
</body>
</html>
