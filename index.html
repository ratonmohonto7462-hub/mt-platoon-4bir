<script> 
 let selectedRole = "mt"; 
 function toggleDrop(){document.getElementById('roleDropdown').classList.toggle('show')} 
 function setRole(r){selectedRole=r;document.getElementById('roleText').innerText=r==='mt'?'COMMAND':'MT CLK';document.querySelectorAll('.role-opt').forEach(o=>o.classList.toggle('active',o.dataset.val===r));document.getElementById('roleDropdown').classList.remove('show')} 
 
 function doLogin(){
   let p=document.getElementById("pass").value;
   
   // COMMAND - mt4bir
   if(selectedRole==="mt" && p==="mt4bir"){
     localStorage.setItem("role","command"); // আগে mt ছিল, এখন command করলাম
     location.href="dashboard.html";
     return;
   }
   
   // MT CLK - admin7462 - শুধু এটাই Edit পারবে
   if(selectedRole==="clk" && p==="admin7462"){
     localStorage.setItem("role","mt_clk"); // আগে clk ছিল, এখন mt_clk
     location.href="dashboard.html";
     return;
   }
   
   alert("ভুল পাসওয়ার্ড!");
 } 
 
 function tick(){const n=new Date();document.getElementById('dt').innerText=`DATE: ${n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Dhaka'}).toUpperCase()} | TIME: ${n.toLocaleTimeString('en-GB',{hour12:false,timeZone:'Asia/Dhaka'})} UTC+6`;}tick();setInterval(tick,1000); 
 window.addEventListener('click',e=>{if(!document.getElementById('roleWrap').contains(e.target))document.getElementById('roleDropdown').classList.remove('show')}); 
</script>
