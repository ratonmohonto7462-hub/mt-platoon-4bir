<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT PLATOON 4 BIR</title>
<style>
 body{margin:0;background:#e8ecf1;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
.card{width:360px;background:white;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
.header{background:#0a7a00;color:white;text-align:center;padding:28px 20px 22px}
.header h1{margin:0;font-size:26px;font-weight:900}
.header p{margin:6px 0 0;font-size:13px;letter-spacing:1.5px;opacity:0.9}
.body{padding:28px 22px 30px;text-align:center}
.role-title{font-weight:900;font-size:20px;margin-bottom:18px}
.role-wrap{display:flex;gap:12px;margin-bottom:24px}
.role-btn{flex:1;padding:18px 10px;border-radius:18px;border:2px solid #ddd;background:#f1f1f1;font-weight:800;font-size:16px;cursor:pointer;transition:0.2s}
.role-btn.active{background:#7d0a0a;color:white;border-color:#7d0a0a}
.pass-title{font-weight:900;font-size:18px;margin-bottom:12px}
.pass-input{width:100%;box-sizing:border-box;padding:16px;border-radius:14px;border:1px solid #cbd5e1;background:#e8f0fe;font-size:16px;outline:none;margin-bottom:18px;text-align:center}
.login-btn{width:100%;padding:16px;background:#0a7a00;color:white;border:none;border-radius:14px;font-size:20px;font-weight:900;cursor:pointer}
.msg{margin-top:12px;font-weight:700;font-size:14px;color:red;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="header"><h1>MT PLATOON 4 BIR</h1><p>AUTHORISED ACCESS ONLY</p></div>
  <div class="body">
    <div class="role-title">ROLE SELECT করুন</div>
    <div class="role-wrap">
      <button id="btn1" class="role-btn" onclick="selectRole('mt','btn1')">MT PLATOON<br>4 BIR</button>
      <button id="btn2" class="role-btn" onclick="selectRole('clk','btn2')">MT CLK<br>Admin</button>
    </div>
    <div class="pass-title">PASSWORD</div>
    <input id="pass" type="password" class="pass-input" placeholder="••••••">
    <button class="login-btn" onclick="doLogin()">LOGIN</button>
    <div id="msg" class="msg"></div>
  </div>
</div>
<script>
const PASSWORDS = { mt: "mt4bir", clk: "admin7462" };
let selectedRole = null;
function selectRole(role, btnId){
  selectedRole = role;
  document.getElementById('btn1').classList.remove('active');
  document.getElementById('btn2').classList.remove('active');
  document.getElementById(btnId).classList.add('active');
}
function doLogin(){
  const pass = document.getElementById('pass').value.trim();
  if(!selectedRole){ document.getElementById('msg').innerText = "ROLE SELECT করুন"; return; }
  if(pass === PASSWORDS[selectedRole]){
    localStorage.setItem("role", selectedRole);
    window.location.href = "dashboard.html";
  } else { document.getElementById('msg').innerText = "ভুল পাসওয়ার্ড!"; }
}
</script>
</body>
</html>
