<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT 4 BIR Login</title>
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b2e0b;font-family:Arial} .box{background:white;padding:22px;border-radius:18px;width:90%;max-width:360px;text-align:center} select,input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box} button{width:100%;padding:12px;background:#0a6b2e;color:white;border:none;border-radius:10px;font-weight:900}</style>
</head><body><div class="box">
<h2>MT PLATOON 4 BIR</h2>
<select id="role"><option value="mt">MT PLATOON 4 BIR</option><option value="clk">MT CLK Admin</option></select>
<input id="pass" type="password" placeholder="Password দিন">
<button onclick="login()">LOGIN</button>
</div>
<script>
function login(){
let r=document.getElementById("role").value;
let p=document.getElementById("pass").value;
if(r==="mt" && p==="mt4bir"){localStorage.setItem("role","mt"); location.href="dashboard.html"; return;}
if(r==="clk" && p==="admin7462"){localStorage.setItem("role","clk"); location.href="dashboard.html"; return;}
alert("ভুল পাসওয়ার্ড!");
}
</script></body></html>
