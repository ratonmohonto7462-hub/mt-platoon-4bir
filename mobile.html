<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOBILE NAMIO TALIKA - MT PLATOON 4 BIR</title>
<style>
body{margin:0;font-family:SolaimanLipi,Arial;background:#f5f5f5}
.dashboard-header{background:green;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.dashboard-header h1{margin:0;font-size:16px}
.logout{background:red;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;font-weight:bold}
.container{padding:15px;max-width:1200px;margin:0 auto}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;box-sizing:border-box;font-size:16px}
.btn-add{width:100%;padding:14px;background:green;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
.table-title{text-align:center;font-size:22px;font-weight:bold;margin:20px 0 5px}
.table-sub{text-align:center;font-size:18px;font-weight:bold;margin:0 0 15px;color:green}
.btn-print{background:blue;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:10px auto;display:block}
table{width:100%;border-collapse:collapse;background:white}
th{background:green;color:white;padding:10px;border:1px solid #ccc}
td{padding:8px;text-align:center;border:1px solid #ddd}
.btn-delete{background:red;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer}
.btn-edit{background:orange;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<div class="dashboard-header">
<h1>MT PLATOON 4 BIR</h1>
<button class="logout" onclick="location.href='index.html'">Back</button>
</div>

<div class="container">
<div id="adminControls">
<input type="text" id="senaNo" placeholder="সেনা নং">
<select id="podobi"><option value="">পদবি সিলেক্ট করুন</option><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option></select>
<input type="text" id="name" placeholder="নাম">
<input type="text" id="mobile" placeholder="মোবাইল 01XXXXXXXXX">
<button class="btn-add" onclick="addData()">Add করুন</button>
</div>

<div class="table-title">এমটি প্লাটুনের নামীয় তালিকা</div>
<div class="table-sub">৪ বীর (এমটি)</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

<table>
<thead><tr><th>ক্র/নং</th><th>সেনা নং</th><th>পদবী</th><th>নাম</th><th>মোবাইল</th><th>একশন</th></tr></thead>
<tbody id="dataTable"></tbody>
</table>
</div>

<script>
let data = JSON.parse(localStorage.getItem('namioData')) || [];
let editIndex = -1;

function addData(){
  let sena=document.getElementById('senaNo').value;
  let podo=document.getElementById('podobi').value;
  let name=document.getElementById('name').value;
  let mobile=document.getElementById('mobile').value;
  if(!sena||!podo||!name||!mobile){alert('সব ঘর পূরণ করুন');return;}

  if(editIndex==-1) data.push({sena,podo,name,mobile});
  else{ data[editIndex]={sena,podo,name,mobile}; editIndex=-1; document.querySelector('.btn-add').innerText='Add করুন'; }

  localStorage.setItem('namioData', JSON.stringify(data));
  clearForm(); loadData();
}
function clearForm(){ senaNo.value=''; podobi.value=''; name.value=''; mobile.value=''; }
function editData(i){ editIndex=i; senaNo.value=data[i].sena; podobi.value=data[i].podo; name.value=data[i].name; mobile.value=data[i].mobile; document.querySelector('.btn-add').innerText='Update করুন'; }
function deleteData(i){ if(confirm('Delete করবেন?')){ data.splice(i,1); localStorage.setItem('namioData', JSON.stringify(data)); loadData(); } }
function loadData(){
  let tbody=document.getElementById('dataTable'); tbody.innerHTML='';
  data.forEach((item,i)=>{
    tbody.innerHTML+=`<tr><td>${i+1}</td><td>${item.sena}</td><td>${item.podo}</td><td>${item.name}</td><td><a href="tel:${item.mobile}">${item.mobile}</a></td><td><button class="btn-edit" onclick="editData(${i})">Edit</button> <button class="btn-delete" onclick="deleteData(${i})">Del</button></td></tr>`;
  });
}
loadData();
</script>
</body>
</html>
