<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>দিবাকালীন কর্তব্য</title><style>
/* স্ক্রিনে জুম কম - শুধু দেখার জন্য */
body{margin:0;background:#dbeafe;font-family:sans-serif;zoom:0.62}
.card{margin:8px;padding:0;border-radius:12px;border:3px solid #000;background:#fff;overflow:hidden}
.card-head{padding:10px;text-align:center;font-weight:900;font-size:17px;background:#14532d;color:#fff;border-bottom:3px solid #000}
.back-btn{margin:10px;padding:10px 18px;background:#000;color:#fff;border-radius:10px;border:0;font-weight:800;display:inline-block;text-decoration:none}
.add-grid{display:flex;flex-wrap:wrap;gap:5px;padding:10px;background:#fffbeb;border-bottom:3px solid #000}
input,select{padding:9px;border:2px solid #000;border-radius:8px;font-weight:700;font-size:13px;flex:1 1 85px;min-width:80px}
button{background:#0a5c26;color:#fff;border:0;padding:7px 11px;border-radius:8px;font-weight:800;cursor:pointer;margin:1px}
table{border-collapse:collapse;width:100%;min-width:750px}th,td{border:2px solid #000;padding:6px;text-align:center;font-size:13px;font-weight:800}
.th-g{background:#14532d !important;color:#fff !important}
.red-note{
  border:2px solid #cc0000 !important;
  padding:6px 4px;
  text-align:center;
  font-weight:800;
  font-size:11px;
  background:#ffe6e6 !important;
  color:#cc0000 !important;
  margin-top:6px;
  line-height:1.3;
  white-space:normal;
}
.role-badge{padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}.role-platoon{background:#fef08a;border:2px solid #000}.role-clk{background:#14532d;color:#fff;border:2px solid #000}

/* প্রিন্টে জুম আগের মতোই থাকবে */
@media print{
  .no-print{display:none !important}
  body{zoom:1 !important; background:#fff !important}
  .card{margin:2px !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
}
</style></head><body>

<a href="duty.html" class="back-btn no-print">⬅️ Back to Folder</a>

<div class="card no-print" style="padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<span id="roleShow" class="role-badge"></span>
<b>তারিখ: <input type="text" id="dDate" style="width:120px;text-align:center"></b>
<button onclick="window.print()" style="background:#1e40af;margin-left:auto">🖨️ Print</button>
</div>

<div class="card">
<div class="card-head">দিবাকালীন কর্তব্য - <span id="headDate"></span></div>
<div class="add-grid no-print" id="addArea">
<select id="dRank"><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option></select>
<input id="dName" placeholder="নাম">
<input id="dDuty" placeholder="ডিউটির নাম">
<input id="dTime" placeholder="সময়" style="max-width:90px">
<input id="dBA" placeholder="বিএ নং" style="max-width:100px">
<input id="dVehicle" placeholder="গাড়ির ধরন">
<button onclick="addDiba()">Add</button>
</div>
<div style="padding:10px;overflow:auto">
<table id="dTable"></table>
<div class="red-note">ডিউটিতে কারো কষ্ট থাকলে কর্পোরাল মোঃ মেহেদী হাসান (এমটি এনসিও) সাথে যোগাযোগ করুন।</div>
</div>
</div>

<div id="editPop" style="display:none;position:fixed;top:10%;left:5%;right:5%;background:#fff;border:3px solid #000;padding:12px;border-radius:12px;z-index:99">
<b>এডিট করুন</b><br><br>
<select id="eRank" style="width:100%"><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option></select><br><br>
<input id="eName" placeholder="নাম" style="width:95%"><br><br>
<input id="eDuty" placeholder="ডিউটির নাম" style="width:95%"><br><br>
<input id="eTime" placeholder="সময়" style="width:44%"> <input id="eBA" placeholder="বিএ নং" style="width:44%"><br><br>
<input id="eVehicle" placeholder="গাড়ির ধরন" style="width:95%"><br><br>
<button onclick="saveEdit()">Update</button> <button onclick="document.getElementById('editPop').style.display='none'" style="background:gray">Close</button>
</div>

<script>
var urlRole = new URLSearchParams(location.search).get('role');
var storedRole = localStorage.getItem('role');
var USER_ROLE = (urlRole || storedRole || 'mt').toLowerCase();
var IS_VIEWER = (USER_ROLE === 'mt');
if(urlRole) localStorage.setItem('role', USER_ROLE);
function applyRole(){
var t = IS_VIEWER ? '👁️ VIEW - MT' : '✏️ EDIT - MT CLK';
var c = IS_VIEWER ? 'role-badge role-platoon' : 'role-badge role-clk';
document.getElementById('roleShow').innerText=t; document.getElementById('roleShow').className=c;
document.getElementById('addArea').style.display = IS_VIEWER ? 'none' : 'flex';
}
function todayDMY(){var d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
document.getElementById('dDate').value = localStorage.getItem('mt_dibaDate') || todayDMY();
var dibaData = JSON.parse(localStorage.getItem('mt_dibaDuty')||'[]');
var editId=null;
function addDiba(){
if(IS_VIEWER)return;
var curDate=document.getElementById('dDate').value;
var count=dibaData.filter(x=>x.date==curDate).length;
var o={id:Date.now(),date:curDate,serial:count+1,rank:document.getElementById('dRank').value,name:document.getElementById('dName').value,duty:document.getElementById('dDuty').value,time:document.getElementById('dTime').value,ba:document.getElementById('dBA').value,vehicle:document.getElementById('dVehicle').value};
if(!o.name){alert('নাম লেখো');return;}
dibaData.push(o); localStorage.setItem('mt_dibaDuty',JSON.stringify(dibaData)); clearForm(); renderDiba();
}
function clearForm(){['dName','dDuty','dTime','dBA','dVehicle'].forEach(id=>document.getElementById(id).value='');}
function delDiba(id){if(IS_VIEWER)return; if(!confirm('ডিলিট করবে?'))return; dibaData=dibaData.filter(x=>x.id!=id); reSerial(); }
function reSerial(){var cur=document.getElementById('dDate').value; var list=dibaData.filter(x=>x.date==cur).sort((a,b)=>a.id-b.id); list.forEach((it,i)=>{it.serial=i+1}); localStorage.setItem('mt_dibaDuty',JSON.stringify(dibaData)); renderDiba();}
function openEdit(id){if(IS_VIEWER)return; var r=dibaData.find(x=>x.id==id); editId=id; document.getElementById('eRank').value=r.rank; document.getElementById('eName').value=r.name; document.getElementById('eDuty').value=r.duty; document.getElementById('eTime').value=r.time; document.getElementById('eBA').value=r.ba; document.getElementById('eVehicle').value=r.vehicle; document.getElementById('editPop').style.display='block';}
function saveEdit(){var r=dibaData.find(x=>x.id==editId); r.rank=document.getElementById('eRank').value; r.name=document.getElementById('eName').value; r.duty=document.getElementById('eDuty').value; r.time=document.getElementById('eTime').value; r.ba=document.getElementById('eBA').value; r.vehicle=document.getElementById('eVehicle').value; localStorage.setItem('mt_dibaDuty',JSON.stringify(dibaData)); document.getElementById('editPop').style.display='none'; renderDiba();}
function renderDiba(){
var cur=document.getElementById('dDate').value;
localStorage.setItem('mt_dibaDate',cur);
document.getElementById('headDate').innerText=cur;
var list=dibaData.filter(x=>x.date==cur).sort((a,b)=>a.id-b.id);
var h='<tr><th class="th-g">ক্র/নং</th><th class="th-g">পদবি</th><th class="th-g">নাম</th><th class="th-g">ডিউটির নাম</th><th class="th-g">সময়</th><th class="th-g">বিএ নং</th><th class="th-g">গাড়ির ধরন</th>'+(IS_VIEWER?'':'<th class="th-g">Edit/Del</th>')+'</tr>';
if(list.length==0){h+='<tr><td colspan=8>কোনো ডিউটি নাই</td></tr>';}
else{
list.forEach(r=>{
h+='<tr><td>'+r.serial+'</td><td>'+r.rank+'</td><td>'+r.name+'</td><td>'+r.duty+'</td><td>'+r.time+'</td><td>'+r.ba+'</td><td>'+r.vehicle+'</td>'+(IS_VIEWER?'':'<td><button onclick="openEdit('+r.id+')" style="background:#1e40af">Edit</button><button onclick="delDiba('+r.id+')" style="background:#dc2626">X</button></td>')+'</tr>';
});
}
document.getElementById('dTable').innerHTML=h;
}
document.getElementById('dDate').addEventListener('change',renderDiba);
applyRole(); renderDiba();
</script></body></html>
