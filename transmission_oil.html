<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ট্রান্সমিশন অয়েল - 4 BIR</title>
<style>
body{margin:0;font-family:Arial;background:#eef3f7}
.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.back{background:#d50000;color:white;border:none;padding:8px 18px;border-radius:12px;font-weight:900}
.wrap{max-width:1150px;margin:10px auto;padding:10px}
.box{background:white;border-radius:14px;padding:12px;border:1px solid #ccc}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}}
input,button{padding:9px;border-radius:8px;border:1px solid #888;width:100%;box-sizing:border-box}
.btn{background:#0a4d0a;color:white;font-weight:900;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
th,td{border:1px solid #333;padding:5px;text-align:center}
th{background:#d6e9d8;font-size:11px;line-height:1.2}
#printHead{text-align:center;color:#0a4d0a;font-weight:900;margin-bottom:8px}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="top no-print"><b>ট্রান্সমিশন অয়েল বদলি - 4 BIR</b><button class="back" onclick="location.href='lube_oil.html'">BACK</button></div>
<div class="wrap">
<div class="box no-print">
<div class="row">
<input id="ba" placeholder="বিএ নং">
<input id="model" placeholder="গাড়ির মডেল">
<input id="date" type="date">
<input id="km" type="number" placeholder="KM">
<input id="nextdate" type="date">
<input id="nextkm" type="number" placeholder="Next KM">
<input id="qty" type="number" placeholder="তেলের পরিমাণ (L)">
<input id="days" type="number" placeholder="দিন">
</div>
<br>
<button class="btn" onclick="addData()">Save</button>
</div>

<div class="box" style="margin-top:12px">
<div id="printHead">ট্রান্সমিশন অয়েল বদলি রিপোর্ট - 4 BIR</div>
<div style="overflow:auto">
<table>
<thead>
<tr>
<th>বিএ নং</th>
<th>গাড়ির মডেল</th>
<th>বদলির তারিখ</th>
<th>KM</th>
<th>পরবর্তী বদলির তারিখ</th>
<th>Next KM</th>
<th>তেলের পরিমাণ</th>
<th>দিন</th>
<th class="no-print">অ্যাকশন</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<br>
<div class="no-print"><button class="btn" onclick="window.print()">PDF / Print</button></div>
</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("transmission_oil_4bir") || "[]");
function addData(){
 let r={
  ba:document.getElementById("ba").value,
  model:document.getElementById("model").value,
  date:document.getElementById("date").value,
  km:document.getElementById("km").value,
  nextdate:document.getElementById("nextdate").value,
  nextkm:document.getElementById("nextkm").value,
  qty:document.getElementById("qty").value,
  days:document.getElementById("days").value
 };
 if(!r.ba) return alert("বিএ নং দিন");
 data.push(r); localStorage.setItem("transmission_oil_4bir", JSON.stringify(data)); render();
 document.querySelectorAll(".row input").forEach(i=>i.value="");
}
function render(){
 let tbody=document.getElementById("tbody");
 tbody.innerHTML="";
 data.forEach((r,i)=>{
  tbody.innerHTML+=`<tr><td>${r.ba}</td><td>${r.model}</td><td>${r.date}</td><td>${r.km}</td><td>${r.nextdate}</td><td>${r.nextkm}</td><td>${r.qty} L</td><td>${r.days}</td><td class="no-print"><button onclick="del(${i})" style="background:red;color:white;border:none;padding:3px 7px;border-radius:5px">X</button></td></tr>`;
 });
}
function del(i){ data.splice(i,1); localStorage.setItem('transmission_oil_4bir',JSON.stringify(data)); render(); }
render();
</script>
</body>
</html>
