<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Own Profile</title></head><body style="margin:0;background:#f0f0f0;font-family:Arial">

<div style="max-width:420px;margin:20px auto;background:#fff;padding:24px;border-radius:18px;text-align:center">
<img id="pImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #0e5d3e">
<h2 id="pName">Loading...</h2>
<p id="pRank" style="color:#0e5d3e;font-weight:700;margin:0"></p>
<div style="text-align:left;margin-top:18px;background:#fdfbe9;padding:14px;border-radius:12px">
<p>BA No: <b id="pBa">-</b></p>
<p>Name: <b id="pFull">-</b></p>
<p>Blood: <b id="pBlood">-</b></p>
<p>Unit: <b id="pUnit">-</b></p>
</div>
<button onclick="history.back()" style="margin-top:20px;padding:12px;width:100%;background:#0a1a12;color:#ffcc00;border:none;border-radius:10px;font-weight:900">Back</button>
<p id="msg" style="font-size:12px;color:#888;margin-top:10px"></p>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxc9Yj6YR8bmMYkgNxoIYVWRHDERqQjq5j_I_M72sVqvkSERvazxXyPPKrlObgtIpuHZA/exec";

let raw = localStorage.getItem('mt_army') || localStorage.getItem('sena_no') || "4521328";
let sena = raw.toString().replace(/[০-৯]/g, d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,'') || "4521328";
document.getElementById('pBa').innerText = sena;
document.getElementById('pName').innerText = sena;
document.getElementById('msg').innerText = "Loading from API...";

async function loadAPI(){
  try{
    // 3 টা ভাবে Try করবে তোমার Script এর জন্য
    let urls = [
      API_URL + "?ba_no=" + sena,
      API_URL + "?ba=" + sena + "&action=getUser",
      API_URL + "?action=read&ba=" + sena
    ];
    
    let data = null;
    for(let u of urls){
      try{
        let res = await fetch(u);
        let txt = await res.text();
        try{ data = JSON.parse(txt); }catch(e){ data = null; }
        if(data) { console.log("API Response:", data); break; }
      }catch(e){}
    }

    if(!data){
      // যদি সব Fail করে তাইলে Direct Fetch without param
      let res = await fetch(API_URL);
      data = await res.json();
    }

    // তোমার Sheet এর Data Array হতে পারে
    let user = null;
    if(Array.isArray(data)){
      user = data.find(x => String(x.ba_no||x.ba||x.BA||"").replace(/\D/g,'') == sena);
    } else if(data.data && Array.isArray(data.data)){
      user = data.data.find(x => String(x.ba_no||x.ba||"").replace(/\D/g,'') == sena);
    } else if(data.result){
      user = data.result;
    } else {
      user = data;
    }

    if(user){
      document.getElementById('pName').innerText = user.name || user.fullName || user.Name || sena;
      document.getElementById('pFull').innerText = user.name || user.fullName || sena;
      document.getElementById('pRank').innerText = user.rank || user.Rank || "";
      document.getElementById('pBlood').innerText = user.blood || user.bloodGroup || user.Blood || "-";
      document.getElementById('pUnit').innerText = user.unit || user.Unit || "MT Platoon 4 BIR";
      let pic = user.photo || user.pic || user.image || user.Photo;
      if(pic) document.getElementById('pImg').src = pic;
      document.getElementById('msg').innerText = "";
    }else{
      document.getElementById('pName').innerText = sena;
      document.getElementById('msg').innerText = "API থেকে BA "+sena+" পাওয়া যায়নি";
    }
  }catch(e){
    document.getElementById('msg').innerText = "API Error: "+e.message;
    document.getElementById('pName').innerText = sena;
  }
}
loadAPI();
</script>
</body></html>
