<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Own Profile</title></head><body style="margin:0;background:#f0f0f0;font-family:Arial">

<div style="max-width:420px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden">
<div style="background:#0a1a12;color:#ffcc00;text-align:center;padding:14px;font-weight:900">Own Profile</div>
<div style="padding:20px;text-align:center">
<img id="pImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:120px;height:120px;border-radius:50%;border:4px solid #0e5d3e;object-fit:cover">
<h2 id="pName">Loading...</h2>
<p id="pPodobi" style="margin:0;color:#0e5d3e;font-weight:700"></p>

<div style="text-align:left;background:#fffbe6;padding:14px;border-radius:12px;margin-top:16px;line-height:30px">
Sena No: <b id="sena"></b><br>
Podobi: <b id="podobi"></b><br>
Name: <b id="name"></b><br>
Company: <b id="company"></b><br>
Unit: <b id="unit"></b><br>
Blood: <b id="blood"></b><br>
Mobile: <b id="mobile"></b>
</div>
<p id="msg" style="color:red;font-size:12px"></p>
<button onclick="location.href='/'" style="margin-top:16px;width:100%;padding:12px;background:#0a1a12;color:#ffcc00;border:none;border-radius:10px;font-weight:900">Back</button>
</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzXeX2zsFVXt8JtADM8m2bZrzFZP9NF2ZSUsOFnUI5j7JML_m_6RdILHrG3gtTsvUXf/exec";
let sena = (localStorage.getItem('mt_army')||localStorage.getItem('sena_no')||"4521328").toString().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,'');
document.getElementById('sena').innerText = sena;

fetch(API+"?sena_no="+sena)
.then(r=>r.json())
.then(d=>{
  console.log(d);
  if(d.error){ document.getElementById('msg').innerText=d.error; document.getElementById('pName').innerText=sena; return; }
  document.getElementById('pName').innerText = d.Name || d.name || sena;
  document.getElementById('sena').innerText = d.Sena_No || d.sena_no || sena;
  document.getElementById('podobi').innerText = d.Podobi || d.podobi || "-";
  document.getElementById('pPodobi').innerText = d.Podobi || d.podobi || "";
  document.getElementById('name').innerText = d.Name || d.name || "-";
  document.getElementById('company').innerText = d.Company || d.company || "-";
  document.getElementById('unit').innerText = d.Unit || d.unit || "-";
  document.getElementById('blood').innerText = d.Blood || d.blood || "-";
  document.getElementById('mobile').innerText = d.Mobile || d.mobile || "-";
  let photo = d.Photo || d.photo;
  if(photo) document.getElementById('pImg').src = photo;
})
.catch(e=>{
  document.getElementById('msg').innerText = "API Error: "+e.message;
  document.getElementById('pName').innerText = sena;
});
</script>
</body></html>
