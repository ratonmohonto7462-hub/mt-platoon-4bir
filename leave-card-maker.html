<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Card 3 in 1 Page - 4BIR</title>
<style>
  @page{size:A4;margin:5mm 8mm}
  *{box-sizing:border-box;font-family:'Noto Sans Bengali',SolaimanLipi,Arial}
  body{margin:0;background:#ccc}
  .header{background:#0a2214;color:#fff;padding:10px 14px;display:flex;gap:10px}
  .header a{color:#fff;text-decoration:none;font-size:20px}
  .wrap{max-width:560px;margin:auto;padding:8px}
  .inputs{background:#fff;border-radius:12px;padding:10px;display:grid;gap:8px}
  .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  input{padding:10px;border:1px solid #bbb;border-radius:8px}
  .btn{background:#0e4d2a;color:#ffcc00;border:none;padding:12px;border-radius:8px;font-weight:900}

  /* A4 3 COPY */
  .a4{width:210mm;height:297mm;background:#fff;margin:10px auto;padding:4mm 7mm;display:flex;flex-direction:column;justify-content:space-between}
  .copy{border:1px solid #000;padding:3mm 4mm;height:92mm;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .copy:before{content:"✂";position:absolute;top:-8px;left:6px;background:#fff;font-size:12px;padding:0 4px}
  .copy:after{content:"✂";position:absolute;top:-8px;right:6px;background:#fff;font-size:12px;padding:0 4px}
  .topLine{font-size:9.2px;line-height:12px;text-align:justify;white-space:nowrap;overflow:hidden}
  .title{text-align:center;font-weight:900;text-decoration:underline;font-size:13px;margin:2px 0}
  .body{font-size:11.5px;line-height:20px}
  .dot{border-bottom:1px dotted #000;display:inline-block;text-align:center;font-weight:700;font-size:11px;min-width:20px;padding:0 2px}
  .wNo{width:55px}.wPod{width:48px}.wName{width:115px}.wUnit{width:32px}.wCom{width:28px}.wDate{width:18px}.wMot{width:28px}
  .wGram{width:72px}.wPo{width:62px}.wThana{width:58px}.wTele{width:68px}.wZela{width:50px}.wMob{width:78px}
  .cutline{border-top:1px dashed #000;margin:1px 0}

  @media print{
    body{background:#fff} .header,.inputs{display:none} .wrap{max-width:100%;padding:0} .a4{margin:0;width:100%}
  }
</style></head><body>
<div class="header"><a href="/">←</a><b>Leave Card - 3 Copy / 1 Page</b></div>
<div class="wrap">
  <div class="inputs">
    <div class="r2"><input id="no" placeholder="নং ৪০১১০২৮" value="৪০১১০২৮"><input id="podobi" placeholder="পদবী" value="সৈনিক"></div>
    <input id="name" placeholder="নাম" value="রতন চন্দ্র মহন্ত">
    <div class="r2"><input id="gram" placeholder="গ্রাম" value="বাবপুর"><input id="po" placeholder="পোঃ" value="উত্তর পানাপুকুর"></div>
    <div class="r2"><input id="thana" placeholder="থানা" value="গংগাচড়া"><input id="zela" placeholder="জেলা" value="রংপুর"></div>
    <div class="r2"><input id="tele" placeholder="টেলিগ্রাম" value=""><input id="mob" placeholder="মোবাইল" value="01737912094"></div>
    <button class="btn" onclick="window.print()">🖨️ Print - 3 Copy Full A4</button>
  </div>

  <div class="a4" id="print">
    <!-- 3 COPY SAME -->
    <div class="copy" id="c1"></div>
    <div class="copy" id="c2"></div>
    <div class="copy" id="c3"></div>
  </div>
</div>

<script>
function gen(){
  let no=document.getElementById('no').value, pod=document.getElementById('podobi').value, name=document.getElementById('name').value, gram=document.getElementById('gram').value, po=document.getElementById('po').value, thana=document.getElementById('thana').value, zela=document.getElementById('zela').value, tele=document.getElementById('tele').value, mob=document.getElementById('mob').value;
  let html = `
    <div class="topLine">আমি এই মর্মে প্রত্যয়ন করছি যে, যে কোন প্রকার ছুটি থাকাকালীন আমি কোন প্রকার মটর সাইকেলে আরোহন করবো না এবং চালাবো না বলে নিম্নে স্বাক্ষর করলাম।</div>
    <div class="title">ছুটির সনদ পত্র</div>
    <div class="body">
      নং<span class="dot wNo">${no}</span>পদবী<span class="dot wPod">${pod}</span>নাম<span class="dot wName">${name}</span>ইউনিট<span class="dot wUnit">৪ বীর</span><br>
      <span class="dot wCom">সদর</span>কোম্পানী/শাখা ঢাকা সেনানিবাস। তাহাকে<span class="dot wDate"></span>/<span class="dot wDate"></span>/২০২৬ ইং তারিখ হইতে<span class="dot wDate"></span>/<span class="dot wDate"></span>/২০২৬ ইং তারিখ পর্যন্ত মোট<span class="dot wMot"></span>দিনের সাময়িক/বাৎসরিক/চিত্তবিনোদন/ডাক্তারী ছুটি মঞ্জুর করা হলো।
      <div class="title" style="font-size:11px;margin:3px 0">ছুটি থাকাকালীন তাহার ঠিকানা নিম্নরূপ</div>
      গ্রাম<span class="dot wGram">${gram}</span>পোষ্ট<span class="dot wPo">${po}</span>থানা/উপজেলা<span class="dot wThana">${thana}</span>টেলিগ্রাম অফিস<span class="dot wTele">${tele}</span>জেলা<span class="dot wZela">${zela}</span><br>
      স্থান<span class="dot" style="width:28px">ঢাকা</span>সেনানিবাস। তারিখ<span class="dot wDate"></span>/<span class="dot wDate"></span>/২০২৬ ইং। মোবাঃ<span class="dot wMob">${mob}</span>
    </div>
  `;
  document.getElementById('c1').innerHTML=html;
  document.getElementById('c2').innerHTML=html;
  document.getElementById('c3').innerHTML=html;
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',gen));
gen();
</script>
</body></html>
