<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Card - First Dot Add</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;font-family:SolaimanLipi,'Noto Sans Bengali'}
body{margin:0;background:#e5e5e5}
.panel{max-width:560px;margin:8px auto;background:#fff;padding:10px;border-radius:10px}
.panel input,.panel select{width:100%;padding:8px;margin:2px 0;border:1.2px solid #777;border-radius:5px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.btn{width:100%;padding:11px;background:#000;color:#fff;border:none;border-radius:7px;font-weight:900;margin-top:5px}
.btn2{padding:7px 9px;background:#0a7;color:#fff;border:none;border-radius:5px;font-weight:700}
.a4{width:210mm;height:297mm;background:#fff;margin:0 auto;display:flex;flex-direction:column;padding:0 10mm}
.copy{width:190mm;height:92mm;min-height:92mm;max-height:92mm;padding:0.5mm 0;display:flex;flex-direction:column;justify-content:flex-start;gap:2.2mm;margin-bottom:2mm;border-bottom:0.5px dashed #aaa}
.copy:last-child{border:none;margin-bottom:0}
.top{font-size:7.5pt;line-height:8.5pt;width:190mm;white-space:nowrap;text-align:left}
.title{font-size:10pt;font-weight:900;text-decoration:underline;text-align:center;margin:0.5mm 0}
.line{font-size:8.8pt;line-height:11.5pt;white-space:nowrap;display:flex;align-items:center;width:190mm}
.dot{border-bottom:1px dotted #000;flex-grow:1;margin:0 1.2mm;min-width:4mm;text-align:center;font-weight:700;font-size:8.5pt}
.b{font-weight:900;flex-shrink:0}
.sd{border-bottom:1px dotted #000;text-align:center;font-weight:700;margin:0 1mm}
.sd8{width:8mm;min-width:8mm;max-width:8mm}
.sd12{width:12mm;min-width:12mm;max-width:12mm}
.sd24{width:24mm;min-width:24mm;max-width:24mm}
.gap2{margin-top:7mm}
.label{font-size:9pt;font-weight:700;color:#555;margin-top:4px}
@media print{body{background:#fff} .panel{display:none} .a4{padding:0 10mm}}
</style></head><body>

<div class="panel">
<div class="r"><input id="no" value="৪৪১১০০৮" placeholder="নং"><input id="pod" value="সৈনিক" placeholder="পদবী"></div>
<input id="name" value="রতন চন্দ্র মহন্ত" placeholder="নাম">

<div class="label">৪ বীর এর পরের লাইন - প্রথম ঘর (........ কোম্পানী/শাখা)</div>
<input id="firstDot" placeholder="এই ঘরে লিখলে প্রথম ........ তে Add হবে - যেমন: আলফা">

<div class="label">কোম্পানী/শাখা - ২য় ঘর (সদর)</div>
<div class="r"><select id="company"></select><div style="display:flex;gap:4px"><input id="newCompany" placeholder="নতুন কোম্পানী"><button class="btn2" onclick="addCompany()">Add</button></div></div>

<div class="r"><input id="gram" value="বাবপুর"><input id="po" value="উত্তর পানাপুকুর"></div>
<div class="r"><input id="thana" value="গংগাচড়া"><input id="zela" value="রংপুর"></div>
<input id="tele" placeholder="টেলিগ্রাম অফিস">
<input id="mob" value="০১৭০৭-৯১২০৯৪">
<button class="btn" onclick="window.print()">Save as PDF - ISO A4</button>
</div>

<div class="a4" id="a4"></div>

<script>
let companies = JSON.parse(localStorage.getItem('companies')||'["সদর","ঢাকা","আলফা","ব্রাভো","চার্লি"]');
function loadCompanies(){ const s=document.getElementById('company'); s.innerHTML=''; companies.forEach(c=>{ let o=document.createElement('option'); o.value=c; o.textContent=c; s.appendChild(o); }); }
function addCompany(){ let v=document.getElementById('newCompany').value.trim(); if(!v) return; if(!companies.includes(v)){ companies.push(v); localStorage.setItem('companies',JSON.stringify(companies)); loadCompanies(); document.getElementById('company').value=v; } document.getElementById('newCompany').value=''; render(); }
loadCompanies();
function render(){
 const V=id=>document.getElementById(id).value.trim();
 const d={no:V('no'),pod:V('pod'),name:V('name'),first:V('firstDot'),comp:V('company'),gram:V('gram'),po:V('po'),thana:V('thana'),zela:V('zela'),tele:V('tele'),mob:V('mob')};
 const dot=t=> t?`<span class="dot">${t}</span>`:`<span class="dot"></span>`;
 let one=`
 <div class="copy">
  <div class="top">আমি এই মর্মে প্রত্যয়ন করছি যে, যে কোন প্রকার ছুটি থাকাকালীন আমি কোন প্রকার মটর সাইকেলে আরোহন করবো না এবং চালাবো না বলে নিম্নে স্বাক্ষর করলাম।</div>
  <div class="title">ছুটির সনদ পত্র</div>
  <div class="line"><span class="b">নং</span>${dot(d.no)}<span class="b">পদবী</span>${dot(d.pod)}<span class="b">নাম</span>${dot(d.name)}<span class="b">ইউনিট</span><span class="dot">৪ বীর</span></div>
  <div class="line">${dot(d.first)}<span class="b">কোম্পানী/শাখা</span><span class="dot">${d.comp}</span><span class="b">সেনানিবাস। তাহাকে</span><span class="dot"></span><span class="b">/</span><span class="dot"></span><span class="b">/২০২৬</span></div>
  <div class="line"><span class="b">হইতে</span><span class="dot"></span><span class="b">/</span><span class="dot"></span><span class="b">/২০২৬ ইং পর্যন্ত মোট</span><span class="dot"></span><span class="b">দিনের ছুটি মঞ্জুর করা হলো।</span></div>
  <div class="title" style="font-size:8.5pt">ছুটি থাকাকালীন তাহার ঠিকানা নিম্নরূপ</div>
  <div class="line"><span class="b">গ্রাম</span>${dot(d.gram)}<span class="b">পোষ্ট</span>${dot(d.po)}<span class="b">থানা/উপজেলা</span>${dot(d.thana)}</div>
  <div class="line"><span class="b">টেলিগ্রাম অফিস</span>${dot(d.tele)}<span class="b">জেলা</span>${dot(d.zela)}</div>
  <div class="line gap2"><span class="b">স্থান</span><span class="sd sd8"></span><span class="sd sd12">ঢাকা</span><span class="sd sd8"></span><span class="b">সেনানিবাস।</span></div>
  <div class="line"><span class="b">তারিখ</span><span class="sd sd8"></span><span class="b">/</span><span class="sd sd8"></span><span class="b">/২০২৬ ইং। মোবাঃ</span><span class="sd sd24">${d.mob}</span></div>
 </div>`;
 document.getElementById('a4').innerHTML=one+one+one;
}
document.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',render));
document.getElementById('company').addEventListener('change',render);
render();
</script>
</body></html>
