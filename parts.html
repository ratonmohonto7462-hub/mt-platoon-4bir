<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PARTS</title>
<style>
body{background:#1a1a1a;color:#fff;padding:12px;font-family:sans-serif;margin:0}
*{ -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none !important; user-select:none !important; }
.back-btn{position:sticky !important;top:10px;z-index:999;background:#d4af37;border:0;padding:8px 14px;border-radius:8px;font-weight:700}
.top-card{position:relative;border-radius:20px;overflow:hidden;margin:12px 0;height:220px;background:#333;display:flex;align-items:flex-end}
.top-card img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.top-card .name{position:relative;z-index:2;width:100%;padding:40px 15px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.top-card .name b{font-size:22px;display:block}
.top-card .name span{font-size:13px;color:#ccc}
</style></head>
<body>
<button class="back-btn" onclick="location.href='dashboard.html'">⬅ BACK</button>

<div class="top-card">
  <img src="engine.jpg" onerror="this.style.display='none'">
  <div class="name"><b>GEAR BOX</b><span>Jeep - Gear Box</span></div>
</div>

<div class="top-card">
  <img src="radiator.jpg" onerror="this.style.display='none'">
  <div class="name"><b>RADIATOR</b><span>Jeep - Radiator</span></div>
</div>

<div class="top-card">
  <img src="piston.jpg" onerror="this.style.display='none'">
  <div class="name"><b>PISTON</b><span>Jeep - Piston</span></div>
</div>

</body></html>
