<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Platoon 4 BIR - 200 Parts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f8fafc;font-family:Arial}
.header{padding:20px;text-align:center;background:#1e293b;color:#fff}
.header h1{font-size:20px;font-weight:800} .header p{font-size:12px;color:#60a5fa;margin-top:4px}
.search{margin:12px;padding:0 12px}
.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;text-align:center;padding-bottom:10px}
.pic{width:100%;height:140px;background:#fff;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.name{font-size:10px;font-weight:700;color:#111;margin-top:8px;padding:0 6px;line-height:1.2;text-transform:uppercase;min-height:28px}
.no{font-size:9px;color:#64748b;margin-top:4px}
.cat{grid-column:1 / -1;background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:800;margin-top:12px}
</style>
</head>
<body>

<div class="header"><h1>All Parts Inventory</h1><p>MT PLATOON 4 BIR • 200 PARTS</p></div>
<div class="search"><input type="text" id="s" placeholder="Search Engine, Brake Pad, Radiator..." onkeyup="f()"></div>
<div class="grid" id="g"></div>

<script>
const list=[
["CAB ASSY HIGH ROOF","01"],["CAB SHELL HIGH ROOF","02"],["CAB ASSY LOW ROOF","03"],["DOOR SHELL","09"],["FRONT BUMPER","12"],["SIDE MIRROR","14"],["HEADLIGHT","16"],
["ENGINE 6.7L","21"],["RADIATOR","22"],["AIR FILTER","23"],["OIL FILTER","24"],["FUEL FILTER","25"],["TURBO","26"],["WATER PUMP","28"],
["BRAKE PAD FRONT","61"],["BRAKE PAD REAR","62"],["BRAKE SHOE","63"],["BRAKE DRUM","64"],["BRAKE DISC","66"],["AIR TANK","73"],
["CLUTCH PLATE","91"],["GEARBOX","95"],["DRIVE SHAFT","97"],["SHOCK ABSORBER","101"],["LEAF SPRING","104"],["STEERING BOX","110"],["WHEEL HUB","116"],["TYRE","121"]
];

function make200(){
  let a=[...list];
  for(let i=a.length+1;i<=200;i++) a.push([`PART ${i}`,`${i}`]);
  return a;
}

const grid=document.getElementById('g');
make200().forEach(p=>{
  let d=document.createElement('div'); d.className='card';
  // 100% Working Image Link - Bangladesh এ কাজ করে
  let img=`https://placehold.co/300x200/ffffff/000000?text=${p[0].replace(/ /g,'+')}`;
  d.innerHTML=`<div class="pic"><img src="${img}" alt="${p[0]}"></div><div class="name">${p[0]}</div><div class="no">${p[1]}</div>`;
  grid.appendChild(d);
});

function f(){
  let q=document.getElementById('s').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display=c.innerText.toLowerCase().includes(q)?'':'none';
  });
}
</script>

</body>
</html>
