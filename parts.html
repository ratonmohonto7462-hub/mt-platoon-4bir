<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PARTS</title>
<style>
body{background:#1a1a1a;color:#fff;padding:12px;font-family:sans-serif;margin:0}
*{ -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none !important; user-select:none !important; }
.back-btn{position:sticky !important;top:10px;z-index:999;background:#d4af37;border:0;padding:8px 14px;border-radius:8px;font-weight:700}
h2{color:#fff;margin:15px 0 5px 5px}
/* উপরের বড় ছবির কার্ড - তোমার ছবির মতো */
.top-card{position:relative;border-radius:20px;overflow:hidden;margin:12px 0;height:220px;background:#333}
.top-card img{width:100%;height:100%;object-fit:cover}
.top-card .name{position:absolute;left:0;right:0;bottom:0;padding:40px 15px 12px;background:linear-gradient(transparent,rgba(0,0,0,0.85))}
.top-card .name b{font-size:20px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-card .name span{font-size:13px;color:#ccc}
/* নিচের সিরিয়াল কার্ড - Downloads / Videos এর মতো */
.item{background:#262626;border-radius:15px;padding:14px;margin:10px 0;display:flex;align-items:center;gap:14px}
.item .icon{font-size:24px}
.item b{font-size:17px;display:block}
.item span{font-size:13px;color:#aaa}
</style></head>
<body>
<button class="back-btn" onclick="location.href='dashboard.html'">⬅ BACK</button>
<h2>PARTS</h2>

<!-- 1 নম্বর - উপরের বড় ছবি -->
<div class="top-card">
  <img src="engine.jpg">
  <div class="name"><b>ENGINE</b><span>【entity-Jeep¦canonical_name=Jeep】 - Engine Parts</span></div>
</div>

<!-- 2 নম্বর - তার নিচে সেম আরেকটা -->
<div class="top-card">
  <img src="gearbox.jpg">
  <div class="name"><b>GEAR BOX</b><span>【entity-Jeep¦canonical_name=Jeep】 - Gear Box</span></div>
</div>

<!-- 3 নম্বর -->
<div class="top-card">
  <img src="radiator.jpg">
  <div class="name"><b>RADIATOR</b><span>【entity-Jeep¦canonical_name=Jeep】 - Radiator</span></div>
</div>

<h2 style="margin-top:25px">Categories</h2>
<div class="item"><div class="icon">⬇️</div><div><b>Downloads</b><span>14 MB</span></div></div>
<div class="item"><div class="icon">🎬</div><div><b>Videos</b><span>3.2 GB</span></div></div>
<div class="item"><div class="icon">📄</div><div><b>Documents</b><span>496 MB</span></div></div>

</body></html>
