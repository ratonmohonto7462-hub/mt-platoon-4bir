<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTS</title>
<style>
body{background:#1a1a1a;color:#fff;padding:12px;font-family:sans-serif;margin:0}
.top{display:flex;gap:10px}
.back-btn{background:#d4af37;border:0;padding:10px 16px;border-radius:10px;font-weight:800}
.add-btn{flex:1;background:#25D366;border:0;border-radius:10px;font-weight:900;font-size:16px}
.search{width:100%;padding:12px;margin:14px 0;border-radius:25px;border:1px solid #d4af37;background:#111;color:#fff;box-sizing:border-box;font-size:15px}
.card{background:#222;border:1px solid #444;border-radius:14px;padding:12px;margin-bottom:12px}
.card img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.card h3{margin:8px 0 4px 0;color:#d4af37}
.card p{margin:0;color:#bbb;font-size:13px}
.del{width:100%;padding:8px;background:#c62828;color:#fff;border:0;border-radius:8px;margin-top:8px;font-weight:700}
.empty{text-align:center;margin-top:60px;font-size:18px}
</style>
</head>
<body>

<div class="top">
<button class="back-btn" onclick="location.href='index.html'">⬅ BACK</button>
<button class="add-btn" onclick="goAdd()">+ ADD PARTS</button>
</div>

<input class="search" id="search" placeholder="🔍   Search Parts..." oninput="renderParts()">

<div id="list"></div>

<script>
function goAdd(){
  // MT CLK ছাড়া Add করতে পারবে না
  let role = (localStorage.getItem("mt_role") || "").toUpperCase();
  if(!role.includes("MT CLK")){
    alert('⛔ Only MT CLK can add');
    return;
  }
  location.href = 'add-parts.html';
}

function renderParts(){
  let q = document.getElementById('search').value.toLowerCase();
  let list = JSON.parse(localStorage.getItem("parts") || "[]");
  let box = document.getElementById('list');

  let filtered = list.filter(p => (p.name + " " + (p.desc||"")).toLowerCase().includes(q));

  if(filtered.length === 0){
    box.innerHTML = '<div class="empty">No Parts Yet</div>';
    return;
  }

  let h = "";
  filtered.forEach((p, i) => {
    // আসল index খুঁজে বের করা, যাতে Delete ঠিকমতো কাজ করে
    let realIndex = list.indexOf(p);
    h += `<div class="card">
      <img src="${p.imageUrl}">
      <h3>${p.name}</h3>
      <p>${p.desc || ""}</p>
      <button class="del" onclick="delPart(${realIndex})">🗑️ Delete</button>
    </div>`;
  });
  box.innerHTML = h;
}

function delPart(i){
  if(!confirm("Delete করবা?")) return;
  let list = JSON.parse(localStorage.getItem("parts") || "[]");
  list.splice(i, 1);
  localStorage.setItem("parts", JSON.stringify(list));
  renderParts();
}

renderParts();
</script>
</body>
</html>
