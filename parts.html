  }
  let d=document.createElement('div'); d.className='card';
  d.innerHTML=`<div class="pic"><img src="${p[3]}" onerror="this.src='https://via.placeholder.com/300x200/f8fafc/64748b?text=${encodeURIComponent(p[0])}'"></div><div class="name">${p[0]}</div><div class="no">${p[1]} • ${p[2]}</div>`;
  grid.appendChild(d);
});

function filterParts(){
  let q=document.getElementById('search').value.toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    let ok=c.innerText.toLowerCase().includes(q);
    c.style.display=ok?'':'none'; if(ok) shown++;
  });
  document.getElementById('count').innerText=`Showing ${shown} / 200 parts`;
  document.querySelectorAll('.cat').forEach(cat=>{
    let next=cat.nextElementSibling;
    let hasVisible=false;
    while(next && !next.classList.contains('cat')){
      if(next.style.display!=='none' && next.classList.contains('card')) hasVisible=true;
      next=next.nextElementSibling;
    }
    cat.style.display=hasVisible || q=='' ? '' : 'none';
  });
}
