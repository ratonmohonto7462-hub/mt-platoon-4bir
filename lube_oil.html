<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUBE OIL REPORT - 4 BIR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8eef1;font-family:Arial,sans-serif}
.header{background:#0a5a1f;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.header h1{font-size:18px;font-weight:900;letter-spacing:0.5px}
.back{background:#e10600;color:#fff;border:none;padding:8px 22px;border-radius:10px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.card{background:#fff;border:2px solid #0a5a1f;border-radius:22px;padding:16px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.icon{font-size:46px;margin-bottom:6px}
.card p{font-size:16px;font-weight:800;color:#000;line-height:1.2}
.badge{margin-top:10px;display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
.badge-low{background:#ff2b2b;color:#fff;animation:blink 1s infinite}
.badge-ok{background:#0a5a1f;color:#fff}
.badge-warn{background:#ff9800;color:#fff}
@keyframes blink{50%{opacity:0.6}}
</style>
</head>
<body>
<div class="header">
<h1>LUBE OIL REPORT - 4 BIR</h1>
<button class="back" onclick="history.back()">BACK</button>
</div>

<div class="grid">
  <div class="card" onclick="location.href='lube-details.html?type=engine'">
    <div class="icon">🛢️</div>
    <p>ইঞ্জিন অয়েল<br>বদলি</p>
    <span id="b-engine" class="badge badge-ok">✓ 11 টা OK</span>
  </div>

  <div class="card" onclick="location.href='lube-details.html?type=transmission'">
    <div class="icon">⚙️</div>
    <p>ট্রান্সমিশন অয়েল<br>বদলি</p>
    <span id="b-trans" class="badge badge-ok">✓ 11 টা OK</span>
  </div>

  <div class="card" onclick="location.href='lube-details.html?type=coolant'">
    <div class="icon">💧</div>
    <p>কুলেন্ট<br>বদলি</p>
    <span id="b-cool" class="badge badge-ok">✓ 11 টা OK</span>
  </div>

  <div class="card" onclick="location.href='lube-details.html?type=atf'">
    <div class="icon">⚙️</div>
    <p>এটিএফ<br>বদলি</p>
    <span id="b-atf" class="badge badge-low">3 টা LOW</span>
  </div>
</div>

<script>
// AUTO CALCULATION - তোর Sheet থেকে পরে আসবে
// Demo: যদি 15 দিনের কম বাকি থাকে তাহলে LOW দেখাবে
const demo = {
  engine: {total:11, low:0},
  transmission: {total:11, low:1},
  coolant: {total:11, low:0},
  atf: {total:11, low:3}
};

function setBadge(id, data){
  let el = document.getElementById(id);
  if(data.low>0){
    el.className = data.low<=2 ? "badge badge-warn" : "badge badge-low";
    el.innerText = `⚠ ${data.low} টা LOW`;
  } else {
    el.className = "badge badge-ok";
    el.innerText = `✓ ${data.total} টা OK`;
  }
}
setBadge("b-engine", demo.engine);
setBadge("b-trans", demo.transmission);
setBadge("b-cool", demo.coolant);
setBadge("b-atf", demo.atf);
</script>
</body>
</html>
