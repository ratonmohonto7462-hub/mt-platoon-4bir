<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>OFFICER MOBILE NUMBER</title> <style>
body{margin:0;font-family:Arial;background:#eef2f7;zoom:0.62}
.top{background:#0a4d0a;color:white;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:14px;font-weight:900}
.top-right{display:flex;gap:6px}
.btn-print-top{background:#0d6efd;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:900;cursor:pointer;font-size:12px}
.logout{background:#d50000;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:900;cursor:pointer;font-size:12px}
.wrap{padding:14px;max-width:1100px;margin:0 auto}
.input, .selectBox{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box;font-size:16px;background:white;display:block;cursor:pointer}
.selectBox{position:relative}
.selectBox:after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:#555}
.btn-add{width:100%;padding:14px;background:#0a4d0a;color:white;border:none;border-radius:10px;font-size:17px;font-weight:900;cursor:pointer;margin-top:4px}
.tit{text-align:center;font-size:20px;font-weight:900;margin:14px 0;color:#0a4d0a;text-decoration:underline}
table{width:100%;border-collapse:collapse;background:white;font-size:13px}
th{background:#0a4d0a;color:white;padding:8px 4px;border:1px solid #000;white-space:nowrap;font-size:12px}
td{padding:7px 4px;border:1px solid #000;text-align:center;white-space:nowrap;font-size:12px}
#popupOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0006;z-index:100;align-items:center;justify-content:center}
.popup{background:white;width:85%;max-width:320px;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0005;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.popupHead{background:#0a4d0a;color:white;padding:12px;text-align:center;font-weight:900;font-size:14px}
.popupItem{padding:14px 16px;border-bottom:1px solid #eee;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.popupItem:active{background:#e8f5e9}
.popupClose{background:#f1f1f1;padding:10px;text-align:center;font-weight:900;color:#d50000;cursor:pointer}
@media print{ .top,#box{display:none!important} body{background:white;zoom:1!important}.wrap{padding:0} }
</style> </head> <body>
<div class="top"><b>OFFICER MOBILE NUMBER</b><div class="top-right"><button class="btn-print-top" onclick="window.print()">🖨️ প্রিন্ট</button><button class="logout" onclick="location.href='communication.html'">BACK</button></div></div>
<div class="wrap">
<div id="box">
<input id="baNo" class="input" placeholder="বিএ নং">
<div class="selectBox" id="padobiBox" onclick="openPop('padobi')">পদবি</div>
<input type="hidden" id="padobi">
<input id="name" class="input" placeholder="নাম">
<input id="batch" class="input" placeholder="ব্যাচ">
<input id="number" class="input" type="number" placeholder="মোবাইল নাম্বার">
<input id="remarks" class="input" placeholder="মন্তব্য">
<button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button>
<p id="msg" style="text-align:center;color:green;font-weight:900"></p>
</div>
<div class="tit">OFFICER MOBILE NUMBER - 4 BIR</div>
<table> <thead><tr><th>ক্র/নং</th><th>বিএ নং</th><th>পদবি</th><th>নাম</th><th>ব্যাচ</th><th>মোবাইল</th><th>মন্তব্য</th><th>একশন</th></tr></thead> <tbody id="tbl"><tr><td colspan="8">কোনো ডাটা নাই</td></tr></tbody> </table>
</div>

<div id="popupOverlay" onclick="closePop()">
<div class="popup" onclick="event.stopPropagation()">
<div class="popupHead" id="popupTitle">Select</div>
<div id="popupList"></div>
<div class="popupClose" onclick="closePop()">বন্ধ করুন</div>
</div>
</div>

<script>
let role=(localStorage.getItem('role')||'').toLowerCase();
let isClk=role==='clk';
let contacts=JSON.parse(localStorage.getItem('mt_officer_v1')||'[]');
let editIndex=-1;
let padobiList=['লেঃ','ক্যাপ্টেন','মেজর','লেঃ কর্ণেল','কর্ণেল','ব্রিগেডিয়ার','জেনারেল'];
let currentType='';

window.onload=function(){ if(!isClk){ document.getElementById('box').style.display='none'; } render(); };

function openPop(type){
 currentType=type;
 document.getElementById('popupOverlay').style.display='flex';
 document.getElementById('popupTitle').innerText='পদবি সিলেক্ট করুন';
 let html=''; padobiList.forEach(v=>{ html+=`<div class="popupItem" onclick="selectVal('${v}')">${v}</div>`; });
 document.getElementById('popupList').innerHTML=html;
}
function closePop(){ document.getElementById('popupOverlay').style.display='none'; }
function selectVal(v){
 document.getElementById('padobi').value=v; 
 document.getElementById('padobiBox').innerText=v; 
 document.getElementById('padobiBox').style.fontWeight='900'; 
 document.getElementById('padobiBox').style.color='#000';
 closePop();
}
function saveLS(){ localStorage.setItem('mt_officer_v1', JSON.stringify(contacts)); }
function render(){
 let tb=document.getElementById('tbl'); tb.innerHTML='';
 if(!contacts.length){ tb.innerHTML='<tr><td colspan="8">কোনো ডাটা নাই</td></tr>'; return; }
 contacts.forEach((x,i)=>{
  let act = isClk ? `<button onclick="editD(${i})" style="background:orange;color:white;border:none;padding:5px 8px;border-radius:6px;font-weight:900;margin:1px">Edit</button> <button onclick="delD(${i})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:6px;font-weight:900;margin:1px">Del</button>` : `View`;
  tb.innerHTML+=`<tr><td>${i+1}</td><td>${x.baNo}</td><td>${x.padobi}</td><td style="text-align:left">${x.name}</td><td>${x.batch}</td><td>${x.number}</td><td>${x.remarks}</td><td>${act}</td></tr>`;
 });
}
function editD(i){
 if(!isClk)return; editIndex=i; let x=contacts[i];
 document.getElementById('baNo').value=x.baNo;
 document.getElementById('padobi').value=x.padobi; document.getElementById('padobiBox').innerText=x.padobi;
 document.getElementById('name').value=x.name;
 document.getElementById('batch').value=x.batch;
 document.getElementById('number').value=x.number;
 document.getElementById('remarks').value=x.remarks;
 document.getElementById('mainBtn').innerText='Update করুন'; window.scrollTo(0,0);
}
function delD(i){ if(!isClk)return; if(!confirm('Delete করবেন?'))return; contacts.splice(i,1); saveLS(); render(); }
function addData(){
 if(!isClk){ alert('Permission নাই'); return; }
 let baNo=document.getElementById('baNo').value.trim();
 let pa=document.getElementById('padobi').value.trim();
 let na=document.getElementById('name').value.trim();
 let ba=document.getElementById('batch').value.trim();
 let nu=document.getElementById('number').value.trim();
 let re=document.getElementById('remarks').value.trim();
 if(!baNo||!pa||!na||!nu){ alert('বিএ নং, পদবি, নাম, মোবাইল লাগবে'); return; }
 let obj={baNo:baNo,padobi:pa,name:na,batch:ba,number:nu,remarks:re};
 if(editIndex==-1){ contacts.push(obj); } else{ contacts[editIndex]=obj; editIndex=-1; document.getElementById('mainBtn').innerText='Add করুন'; }
 saveLS();
 document.getElementById('baNo').value=''; 
 document.getElementById('padobi').value=''; document.getElementById('padobiBox').innerText='পদবি'; document.getElementById('padobiBox').style.color='';
 document.getElementById('name').value=''; document.getElementById('batch').value=''; document.getElementById('number').value=''; document.getElementById('remarks').value='';
 document.getElementById('msg').innerText='✅ Done'; setTimeout(()=>{document.getElementById('msg').innerText='';},1500);
 render();
}
</script> </body> </html>
