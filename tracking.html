<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;color:#fff;padding:14px;padding-bottom:80px}
h1{font-size:18px;margin-bottom:12px}
.card{background:#162040;padding:14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;border:1px solid #1e293b}
.card b{color:#38bdf8}.live{color:#22c55e;font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1226;display:flex;justify-content:space-around;padding:12px 0}
.nav div{font-size:12px;color:#94a3b8;text-align:center}
.nav div.mid{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:20px;margin-top:-18px;font-weight:800}
</style></head><body>
<h1>🛰️ Live Tracking - 10 Trucks</h1>
<div id="list"></div>
<div class="nav">
<div onclick="location.href='../index.html'">🏡<br>Home</div>
<div class="mid" onclick="location.href='live.html'">🛰️<br>Live Convoy</div>
<div onclick="location.href='../group.html'">👥<br>Group</div>
</div>
<script>
let box=document.getElementById('list');
for(let i=1;i<=10;i++){
let speed=Math.floor(50+Math.random()*20);
box.innerHTML+=`<div class="card"><div><b>Truck-${String(i).padStart(2,'0')}</b><br><small>Dhaka → Jessore</small></div><div style="text-align:right"><b>${speed} km/h</b><br><span class="live">● LIVE • ${i*12}km</span></div></div>`;
}
</script>
</body></html>
