<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map - Live Convoy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
#map{height:100vh;width:100vw}
.top{position:fixed;top:0;left:0;right:0;background:#0b1226cc;backdrop-filter:blur(10px);padding:12px 16px;z-index:999;color:#fff;display:flex;justify-content:space-between;font-family:system-ui}
.nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#0b1226;display:flex;gap:15px;padding:10px 20px;border-radius:30px;z-index:999;border:1px solid #1e293b}
.nav div{font-size:12px;color:#94a3b8;text-align:center;cursor:pointer;font-family:system-ui}
.nav div.mid{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:20px;font-weight:800}
</style></head><body>
<div class="top"><div><b>Convoy Map</b><br><small style="color:#94a3b8">10 Trucks • Everyone sees everyone</small></div><div style="color:#10b981">● LIVE</div></div>
<div id="map"></div>
<div class="nav">
<div onclick="location.href='live.html'">🛰️ Live</div>
<div onclick="location.href='tracking.html'">📋 Tracking</div>
<div style="color:#22c55e">🗺️ Map</div>
</div>
<script>
const route=[[23.81,90.41],[23.72,90.25],[23.55,89.95],[23.35,89.75],[23.05,89.45],[22.85,89.2]];
const map=L.map('map',{zoomControl:false}).setView([23.4,89.9],9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
L.polyline(route,{color:'#38bdf8',weight:5,opacity:0.9}).addTo(map);
for(let i=1;i<=10;i++){
let b=route[i%route.length];
let p=[b[0]+(Math.random()-0.5)*0.3,b[1]+(Math.random()-0.5)*0.3];
L.marker(p,{icon:L.divIcon({html:`<div style="background:#22c55e;color:#fff;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 10px #000">🚚 T-${String(i).padStart(2,'0')}</div>`,className:''})}).addTo(map);
}
</script>
</body></html>
