<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbx7G1ssKkFX83T38zNRibDh3p8K87G8olL-qfcEKJxL_PS19re2P4kar_ywQ4hxG_k_OQ/exec";

fetch(SHEET_URL).then(r=>r.json()).then(d=>{
  if(d.text){
    document.getElementById('joruriText').innerText='🚨 '+d.text+' 🚨';
  }
});

if(localStorage.getItem('role') === 'clk'){
  document.getElementById('editJoruriBtn').style.display='block';
}

function editJoruri(){
  let newText = prompt("নতুন জরুরি আদেশ লিখুন:");
  if(!newText) return;
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', body: new URLSearchParams({text: newText})})
  .then(()=>{ alert("✅ সেভ হয়েছে!"); location.reload(); });
}
</script>
