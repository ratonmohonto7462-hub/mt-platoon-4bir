<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT Dashboard</title>
<style>body{margin:0;background:#08121a;color:#fff;font-family:Arial}.card{margin:10px;background:#101f2e;border:1px solid #c8a951;border-radius:14px;padding:12px}</style>
</head><body>
<div style="padding:12px;display:flex;justify-content:space-between;align-items:center;background:#0e1e2f;border-bottom:1px solid #c8a951">
<b style="color:#ffdb70">MT Dashboard</b>
<button onclick="location.href='seniority.html'" style="background:#c8a951;padding:8px 14px;border-radius:8px;font-weight:900">Seniority →</button>
</div>
<div id="dashList" style="padding:10px"></div>
<script>
const SENIORITY_SCRIPT="https://script.google.com/macros/s/AKfycby8BQ0Dyo5s4otJEbRJcZXNiW3pyqDY9800nm8X7kGeOz49RVlQ1bdoF5IdByxL-l226w/exec";
function fmtDate(d){ if(!d) return "-"; let dt=new Date(d); if(isNaN(dt)) return d; let dd=String(dt.getDate()).padStart(2,'0'); let mm=String(dt.getMonth()+1).padStart(2,'0'); return `${dd}-${mm}-${dt.getFullYear()}`; }
function formatMotDin(jogdan){ if(!jogdan) return "-"; let join=new Date(jogdan); if(isNaN(join)) return "-"; let now=new Date(); let y=now.getFullYear()-join.getFullYear(); let m=now.getMonth()-join.getMonth(); let d=now.getDate()-join.getDate(); if(d<0){ m--; let prev=new Date(now.getFullYear(),now.getMonth(),0).getDate(); d+=prev; } if(m<0){ y--; m+=12; } if(y>0 && m>0) return `${y} বছর ${m} মাস ${d} দিন`; if(y>0) return `${y} বছর ${d} দিন`; if(m>0 && d>0) return `${m} মাস ${d} দিন`; if(m>0) return `${m} মাস`; return `${d} দিন`; }
async function loadDash(){
 let t = await fetch(SENIORITY_SCRIPT+"?t="+Date.now()).then(r=>r.text());
 let rows = JSON.parse(t);
 let h="";
 for(let i=1;i<rows.length;i++){
  let c=rows[i];
  if(!c[2]) continue;
  let jogdan=c[3]; let pl=c[4]||0, cl=c[5]||0, np=c[6]||0; let total=parseInt(pl||0)+parseInt(cl||0)+parseInt(np||0);
  let motDin=formatMotDin(jogdan);
  h+=`<div class="card">
  <b style="color:#ffdb70">${c[2]} - ${c[0]}</b><br>
  <small>যোগদান: ${fmtDate(jogdan)} | যোগদানের পর: ${motDin}</small><br>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px">
   <div style="background:#1a160a;border:1px solid #c8a951;border-radius:8px;padding:6px;text-align:center"><small>২৬ সালে মোট</small><br><b style="color:#ffdb70">${total}</b></div>
   <div style="background:#0c1a28;border-radius:8px;padding:6px;text-align:center"><small>পিলিপ</small><br><b>${pl}</b></div>
   <div style="background:#0c1a28;border-radius:8px;padding:6px;text-align:center"><small>সিলিপ</small><br><b>${cl}</b></div>
   <div style="background:#0c1a28;border-radius:8px;padding:6px;text-align:center"><small>নাইটপাশ</small><br><b>${np}</b></div>
  </div>
  <small style="margin-top:6px;display:block">📱 ${c[11]||''} ${c[12]?'/ '+c[12]:''}</small>
  </div>`;
 }
 document.getElementById("dashList").innerHTML=h;
}
loadDash();
</script>
</body></html>
