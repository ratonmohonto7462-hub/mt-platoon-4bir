<script>
const DUTY_ID="1cGdPNeo-G1Xx1USo6KZlvYTKVzMcQ_t8V9eUlGADL-I";
const SENIORITY_ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
const MOBILE_ID="1CvMdG_fTG4mGnL-epIh3fsPhGVwwBX0rbkMPN7AqHJE";

const DUTY_CSV=`https://docs.google.com/spreadsheets/d/${DUTY_ID}/gviz/tq?tqx=out:csv`;
const SENIORITY_CSV=`https://docs.google.com/spreadsheets/d/${SENIORITY_ID}/gviz/tq?tqx=out:csv`;
const MOBILE_CSV=`https://docs.google.com/spreadsheets/d/${MOBILE_ID}/gviz/tq?tqx=out:csv`;

let DUTY_DATA=[], SENIORITY_DATA=[], MOBILE_DATA=[], ALL_SEARCH=[];

function parseCSV(text){
  let lines=text.split("\n").filter(l=>l.trim().length>0);
  let result=[];
  for(let i=1;i<lines.length;i++){
    let cols=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());
    if(cols[0]||cols[1]||cols[2]) result.push(cols);
  }
  return result;
}

async function loadAll(){
  // Seniority
  try{
    let sCSV=await fetch(SENIORITY_CSV).then(r=>r.text());
    let sRows=parseCSV(sCSV);
    SENIORITY_DATA=sRows.map(c=>({no:c[0], rank:c[1], name:c[2], sutyStart:c[3], mobile:c[4]})).filter(x=>x.name);
    localStorage.setItem("senioritySheetCache",JSON.stringify(SENIORITY_DATA));
  }catch(e){ SENIORITY_DATA=JSON.parse(localStorage.getItem("senioritySheetCache")||"[]"); }
  
  // Duty
  try{
    let dCSV=await fetch(DUTY_CSV).then(r=>r.text());
    let dRows=parseCSV(dCSV);
    DUTY_DATA=dRows.map(c=>({no:c[0], rank:c[1], name:c[2], duty:c[3], date:c[4], sutyStart:c[5]})).filter(x=>x.name);
    localStorage.setItem("dutySheetCache",JSON.stringify(DUTY_DATA));
  }catch(e){ DUTY_DATA=JSON.parse(localStorage.getItem("dutySheetCache")||"[]"); }
  
  // Mobile Number - নতুন
  try{
    let mCSV=await fetch(MOBILE_CSV).then(r=>r.text());
    let mRows=parseCSV(mCSV);
    MOBILE_DATA=mRows.map(c=>({no:c[0], rank:c[1], name:c[2], mobile:c[3], group:c[4]})).filter(x=>x.name||x.mobile);
    localStorage.setItem("mobileSheetCache",JSON.stringify(MOBILE_DATA));
    console.log("Mobile Loaded:", MOBILE_DATA);
  }catch(e){ MOBILE_DATA=JSON.parse(localStorage.getItem("mobileSheetCache")||"[]"); }

  updateSeniorityTicker();
  buildSearchCache();
  checkNotifications();
}

function updateSeniorityTicker(){
  if(SENIORITY_DATA.length==0){document.getElementById('seniorityText').innerText="⭐ Seniority Sheet Publish করুন ⭐";return;}
  let txt=SENIORITY_DATA.slice(0,5).map((s,i)=>`⭐ ${s.no||i+1} No: ${s.rank} ${s.name}`).join("  •  ");
  document.getElementById('seniorityText').innerText=txt+"  •  "+txt+"  •  ";
}

function buildSearchCache(){
  ALL_SEARCH=[];
  SENIORITY_DATA.forEach(s=>ALL_SEARCH.push({type:"SUTY SENIORITY", name:`${s.no} No: ${s.rank} ${s.name}`, sub:`Mobile: ${s.mobile||''} Suty: ${s.sutyStart||''}`, link:"seniority.html"}));
  DUTY_DATA.forEach(d=>ALL_SEARCH.push({type:"DUTY ROSTER", name:`${d.rank} ${d.name} - ${d.duty}`, sub:`Date: ${d.date||''}`, link:"duty.html"}));
  MOBILE_DATA.forEach(m=>ALL_SEARCH.push({type:"MT MOBILE", name:`${m.rank} ${m.name} - ${m.mobile}`, sub:`Group: ${m.group||''}`, link:"contact.html"}));
  // Vehicle local cache
  let veh=JSON.parse(localStorage.getItem("vehicleSheetCache")||"[]");
  veh.forEach(v=>ALL_SEARCH.push({type:"VEHICLE", name:`${v.ba||v[0]||''} - ${v.km||''}`, link:"vehicle.html"}));
}

function doSearch(q){
  let res=document.getElementById("searchResults");
  if(!q||q.trim().length<1){res.style.display="none";return;}
  let low=q.toLowerCase();
  let filt=ALL_SEARCH.filter(d=>d.name.toLowerCase().includes(low)||d.type.toLowerCase().includes(low)||(d.sub&&d.sub.toLowerCase().includes(low)));
  if(filt.length==0){res.innerHTML=`<div style='padding:10px;color:#888'>🔍 "${q}" পাওয়া যায়নি কোনো Sheet এ</div>`}
  else{res.innerHTML=filt.slice(0,20).map(d=>`<div onclick="location.href='${d.link}'" style="padding:10px;border-bottom:1px solid #1a3d22;cursor:pointer"><b style="color:#c8a951;font-size:10px">${d.type}</b><br><span style="color:white;font-size:13px">${d.name}</span><br><span style="color:#8aa88f;font-size:11px">${d.sub||''}</span></div>`).join("")}
  res.style.display="block";
}

function checkNotifications(){
  let notifs=[];let today=new Date();
  SENIORITY_DATA.forEach(p=>{
    if(p.sutyStart){
      let start=new Date(p.sutyStart); if(isNaN(start)) return;
      let ret=new Date(start); ret.setDate(ret.getDate()+75);
      let diff=Math.ceil((ret-today)/(1000*60*60*24));
      if(diff<=7 && diff>=0) notifs.push(`👤 <b>${p.rank} ${p.name}</b> - Suty 2M 15D - ${diff} দিন বাকি`);
      if(diff<0 && diff>=-2) notifs.push(`🔔 <b>${p.rank} ${p.name}</b> - Suty Return Overdue!`);
    }
  });
  DUTY_DATA.forEach(p=>{
    if(p.sutyStart){let start=new Date(p.sutyStart); if(isNaN(start)) return; let ret=new Date(start); ret.setDate(ret.getDate()+75); let diff=Math.ceil((ret-today)/(1000*60*60*24)); if(diff<=7 && diff>=0) notifs.push(`📋 Duty: <b>${p.rank} ${p.name}</b> - Suty 2M 15D - ${diff} দিন বাকি`);}
  });
  let vehicles=JSON.parse(localStorage.getItem("vehicleSheetCache")||"[]");
  vehicles.forEach(v=>{if(v.nextOil){let next=new Date(v.nextOil); let diff=Math.ceil((next-today)/(1000*60*60*24)); if(diff<=7 && diff>=0) notifs.push(`🚚 <b>Vehicle ${v.ba||v[0]}</b> - Oil বদলির ${diff} দিন বাকি`);}});
  if(notifs.length==0) notifs.push("✅ কোনো নতুন Notification নেই - সব OK");
  document.getElementById('notifCount').innerText=notifs[0].includes("কোনো")?0:notifs.length;
  document.getElementById('notifList').innerHTML=notifs.map(n=>`<div style="padding:10px;border-bottom:1px solid #1a3d22;font-size:13px">${n}</div>`).join("");
}

loadAll();
setInterval(loadAll,60000);
</script>
