<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 BIR MOBILE NUMBER</title> <style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px;border:1px solid #1a2a40}.top{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#4caf50;font-size:14px;display:block}.top small{color:#8a9bb5;font-size:10px}.back{font-size:28px;color:#4caf50;background:none;border:none}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #4caf50;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.addBtn{margin:0 14px 10px;width:calc(100% - 28px);padding:12px;background:#0a1a0a;border:1px solid #4caf50;color:#4caf50;border-radius:12px;font-weight:900}.card{background:#111a2d;border-left:4px solid #4caf50;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #1a3a1a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#4caf50}.rankBadge{width:52px;height:60px;background:linear-gradient(#4caf50,#1b5e20);border-radius:0 0 50% 50%;float:left;margin:10px 12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff}.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.btnRow{display:flex;gap:8px}.callBtn{flex:1;background:#0f172a;border:1px solid #4caf50;color:#4caf50;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.waBtn{flex:1;background:#0a1a0a;border:1px solid #25D366;color:#25D366;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.editBtn{flex:1;background:#0a1a0a;border:1px solid #4caf50;color:#4caf50;border-radius:8px;padding:9px;font-weight:900;font-size:12px}.delBtn{flex:1;background:#4a0a0a;border:1px solid #ff4444;color:#ff6666;border-radius:8px;padding:9px;font-weight:900;font-size:12px}#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f172a;border:1px solid #4caf50;border-radius:18px;width:100%;max-width:400px}#formBox h3{margin:0;padding:12px;background:#0a1a0a;color:#4caf50;text-align:center}.formInner{padding:12px}.formInner label{font-size:11px;color:#4caf50;font-weight:900;display:block;margin:8px 0 3px 0}.formInner input{width:100%;padding:9px;border-radius:8px;border:1px solid #1e2f4a;background:#111a2d;color:#fff}.roleTag{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}.role-cmd{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a}.role-mt{background:#1a3d22;color:#ffdb70;border:1px solid #4caf50}.viewNote{text-align:center;background:#1a1510;border:1px dashed #4caf50;color:#4caf50;padding:8px;margin:10px 14px;border-radius:8px;font-size:11px}</style></head><body> <div class="phone"><div class="top"><button class="back" onclick="location.href='dashboard.html'">‹</button><div><b>4 BIR MOBILE NUMBER</b><small id="count">🪖 Loading...</small></div><span id="roleBadge" class="roleTag"></span></div><div id="viewNote" class="viewNote" style="display:none">👁️ VIEW ONLY - COMMAND</div><div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search..." oninput="render()"></div></div><button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD 4 BIR</button><div id="list"><p style="padding:40px;text-align:center;color:#4caf50">⏳ Loading from Sheet...</p></div></div> <div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3 id="formTitle">Add 4 BIR</h3><div class="formInner"><label>Rank</label><input id="f_rank"><label>Name</label><input id="f_name"><label>Army No</label><input id="f_no"><label>Company</label><input id="f_coy"><label>Mobile</label><input id="f_mob"><input type="hidden" id="f_row"><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeForm()" style="flex:1;padding:10px;border-radius:8px;background:#1e2f4a;color:#fff;border:none">Cancel</button><button onclick="saveForm()" style="flex:1;padding:10px;border-radius:8px;background:#4caf50;color:#000;font-weight:900;border:none">Save to Sheet</button></div><p id="msg" style="text-align:center;font-size:11px"></p></div></div></div> <script>
 // === FINAL UNIVERSAL ROLE FIX ===
 let mtRoleRaw = localStorage.getItem("mt_role") || localStorage.getItem("role") || "";
 let urlRole = new URLSearchParams(window.location.search).get("role");
 if(urlRole){ mtRoleRaw = urlRole; localStorage.setItem("mt_role", mtRoleRaw); }
 if(!mtRoleRaw){ location.href='index.html'; }
 let ROLE_UP = mtRoleRaw.toUpperCase().trim();
 let CAN_EDIT = ROLE_UP.includes("MT") || ROLE_UP.includes("CLK") || ROLE_UP.includes("ADMIN");
 let IS_COMMAND = !CAN_EDIT;

 function applyRole(){
   let ab=document.getElementById('addBtn');
   let badge=document.getElementById('roleBadge');
   let viewNote=document.getElementById('viewNote');
   if(ab) ab.style.display = CAN_EDIT ? 'block' : 'none';
   if(badge){ badge.innerText = IS_COMMAND ? "VIEW - COMMAND" : "EDIT - MT CLK"; badge.className = IS_COMMAND ? "roleTag role-cmd" : "roleTag role-mt"; }
   if(viewNote) viewNote.style.display = IS_COMMAND ? 'block' : 'none';
 }

 const API_URL = "https://script.google.com/macros/s/AKfycbxlfYjXaNu5cXyJ6MoTgmCBgUSr-GBZ_KQGfKb-ojFZRQ-8GLzNENQ-9PLPsodAiX7x/exec";
 function armyNoVal(s){if(!s)return 999999999;let m=String(s).match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
 let data=[];
 async function loadFromSheet(){ try{ let res = await fetch(API_URL+"?t="+Date.now()); let txt = await res.text(); data = JSON.parse(txt); render(); }catch(e){ document.getElementById('list').innerHTML=`<p style='padding:20px;text-align:center;color:#ff4444'>❌ Failed<br><small>${e}</small><br><br><button onclick='loadFromSheet()'>Retry</button></p>`; } }
 function openAdd(){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only - Only MT CLK can ADD'); document.getElementById('f_row').value='';['f_rank','f_name','f_no','f_coy','f_mob'].forEach(id=>document.getElementById(id).value='');document.getElementById('formTitle').innerText='Add 4 BIR';document.getElementById('formModal').style.display='flex' }
 function openEdit(row){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); let o=data.find(x=>x.row==row);document.getElementById('f_row').value=o.row;document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_no').value=o.no;document.getElementById('f_coy').value=o.coy;document.getElementById('f_mob').value=o.mobile;document.getElementById('formTitle').innerText='Edit 4 BIR';document.getElementById('formModal').style.display='flex' }
 function closeForm(){document.getElementById('formModal').style.display='none'}
 async function saveForm(){ if(!CAN_EDIT) return; let p={rank:document.getElementById('f_rank').value.trim(),name:document.getElementById('f_name').value.trim(),no:document.getElementById('f_no').value.trim(),coy:document.getElementById('f_coy').value.trim(),mobile:document.getElementById('f_mob').value.trim(),row:document.getElementById('f_row').value?parseInt(document.getElementById('f_row').value):0}; p.action=p.row?"edit":"add"; if(!p.name||!p.mobile){alert("Name & Mobile লাগবে");return;} document.getElementById('msg').innerText="⏳ Saving..."; await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(p)}); document.getElementById('msg').innerText="✅ Saved!"; setTimeout(()=>location.reload(),1000); }
 async function del(row){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); if(!confirm('Delete?'))return;await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row})});location.reload();}
 function render(){ data.sort((a,b)=>armyNoVal(a.no)-armyNoVal(b.no)); let q=document.getElementById('s').value.toLowerCase();let html=''; data.forEach((o,idx)=>{ if(q&&!(String(o.name)+String(o.no)+String(o.coy)).toLowerCase().includes(q))return; let wa=String(o.mobile||'').replace(/\D/g,'');if(wa.startsWith('0'))wa='88'+wa;if(!wa.startsWith('88')&&wa.length==11)wa='88'+wa; let editDel = CAN_EDIT ? `<div class="btnRow"><button class="editBtn" onclick="openEdit(${o.row})">✏️ Edit</button><button class="delBtn" onclick="del(${o.row})">🗑️ Del</button></div>` : ''; html+=`<div class="card"><div style="padding:12px 12px 0 0;display:flex"><div class="rankBadge">${o.rank}</div><div><b>${o.rank} ${o.name}</b><br><small style="color:#4caf50">${o.no} • ${o.coy} • #${idx+1}</small></div></div><div class="details"><div><span class="label">Army No:</span></div><div><span class="label">COY:</span></div><div><span class="val" style="color:#4caf50">${o.no}</span></div><div><span class="val">${o.coy}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile}</span></div></div><div class="btns">${editDel}<div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div></div>`; }); document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center">No Data</div>'; document.getElementById('count').innerText=`🪖 ${data.length} Numbers`; applyRole(); }
 applyRole(); loadFromSheet();
 </script></body></html>
