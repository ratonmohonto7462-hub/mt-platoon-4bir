<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 BIR - 4 BIR</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px;border:1px solid #1a2a40}.top{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#4caf50;font-size:14px;display:block}.top small{color:#8a9bb5;font-size:10px}.back{font-size:28px;color:#4caf50;background:none;border:none}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #4caf50;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.addBtn{margin:0 14px 10px;width:calc(100% - 28px);padding:12px;background:#0a1a0a;border:1px solid #4caf50;color:#4caf50;border-radius:12px;font-weight:900}.card{background:#111a2d;border-left:4px solid #4caf50;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #1a3a1a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#4caf50}.rankBadge{width:52px;height:60px;background:linear-gradient(#4caf50,#1b5e20);border-radius:0 0 50% 50%;float:left;margin:10px 12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#fff}.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.btnRow{display:flex;gap:8px}.callBtn{flex:1;background:#0f172a;border:1px solid #4caf50;color:#4caf50;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.waBtn{flex:1;background:#0a1a0a;border:1px solid #25D366;color:#25D366;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.editBtn{flex:1;background:#0a1a0a;border:1px solid #4caf50;color:#4caf50;border-radius:8px;padding:9px;font-weight:900;font-size:12px}.delBtn{flex:1;background:#4a0a0a;border:1px solid #ff4444;color:#ff6666;border-radius:8px;padding:9px;font-weight:900;font-size:12px}#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f172a;border:1px solid #4caf50;border-radius:18px;width:100%;max-width:400px}#formBox h3{margin:0;padding:12px;background:#0a1a0a;color:#4caf50;text-align:center}.formInner{padding:12px}.formInner label{font-size:11px;color:#4caf50;font-weight:900;display:block;margin:8px 0 3px 0}.formInner input{width:100%;padding:9px;border-radius:8px;border:1px solid #1e2f4a;background:#111a2d;color:#fff}</style></head><body>
<div class="phone"><div class="top"><button class="back" onclick="location.href='contact.html'">‹</button><div><b>4 BIR LIST - Seniority Wise</b><small>🪖 Army No Auto Sort • 4 BIR</small></div></div><div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search..." oninput="render()"></div></div><button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD 4 BIR</button><div id="list"></div></div>
<div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3>Add 4 BIR</h3><div class="formInner"><label>Rank</label><input id="f_rank"><label>Name</label><input id="f_name"><label>Army No</label><input id="f_no"><label>Company</label><input id="f_coy"><label>Mobile</label><input id="f_mob"><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeForm()" style="flex:1;padding:10px;border-radius:8px;background:#1e2f4a;color:#fff;border:none">Cancel</button><button onclick="saveForm()" style="flex:1;padding:10px;border-radius:8px;background:#4caf50;color:#000;font-weight:900;border:none">Save</button></div></div></div></div>
<script>
let role=(localStorage.getItem('role')||'').toLowerCase();let isClk=role.includes('clk');document.getElementById('addBtn').style.display=isClk?'block':'none';
function armyNoVal(s){if(!s)return 999999999;let m=s.match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
function load(){let d=localStorage.getItem('bir_4bir');if(d){try{return JSON.parse(d)}catch(e){}}return[{rank:"SUB",name:"SUB. JAHANGIR",no:"45210987",coy:"Alpha Coy",mobile:"01712-340001"},{rank:"SGT",name:"SGT. KAMAL",no:"45210988",coy:"Bravo Coy",mobile:"01712-340002"},{rank:"CPL",name:"CPL. RASHID",no:"45210989",coy:"Charlie Coy",mobile:"01712-340003"}];}
let data=load();function save(){localStorage.setItem('bir_4bir',JSON.stringify(data));}
let editIdx=-1;function openAdd(){editIdx=-1;['f_rank','f_name','f_no','f_coy','f_mob'].forEach(id=>document.getElementById(id).value='');document.getElementById('formModal').style.display='flex'}
function openEdit(i){editIdx=i;let o=data[i];document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_no').value=o.no;document.getElementById('f_coy').value=o.coy;document.getElementById('f_mob').value=o.mobile;document.getElementById('formModal').style.display='flex'}
function closeForm(){document.getElementById('formModal').style.display='none'}
function saveForm(){let o={rank:document.getElementById('f_rank').value.trim(),name:document.getElementById('f_name').value.trim(),no:document.getElementById('f_no').value.trim(),coy:document.getElementById('f_coy').value.trim(),mobile:document.getElementById('f_mob').value.trim()};if(!o.name||!o.mobile)return;if(editIdx==-1)data.push(o);else data[editIdx]=o;save();closeForm();render()}
function del(i){if(confirm('Delete?')){data.splice(i,1);save();render()}}
function render(){data.sort((a,b)=>armyNoVal(a.no)-armyNoVal(b.no));save();let q=document.getElementById('s').value.toLowerCase();let html='';data.forEach((o,idx)=>{if(q&&!(o.name+o.no).toLowerCase().includes(q))return;let wa=o.mobile.replace(/\D/g,'');let btns=isClk?`<div class="btns"><div class="btnRow"><button class="editBtn" onclick="openEdit(${idx})">✏️ Edit</button><button class="delBtn" onclick="del(${idx})">🗑️ Del</button></div><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`:`<div class="btns"><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`;html+=`<div class="card"><div style="padding:12px 12px 0 0;display:flex"><div class="rankBadge">${o.rank}</div><div><b>${o.rank} ${o.name}</b><br><small style="color:#4caf50">${o.no} • ${o.coy} • Senior #${idx+1}</small></div></div><div class="details"><div><span class="label">Army No:</span></div><div><span class="label">COY:</span></div><div><span class="val" style="color:#4caf50">${o.no}</span></div><div><span class="val">${o.coy}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile}</span></div></div>${btns}</div>`});document.getElementById('list').innerHTML=html;}
render();
</script></body></html>
