<script>
 // === ROLE FIX ===
 let ROLE = (localStorage.getItem('role') || '').toLowerCase().trim();
 let CAN_EDIT = ROLE.includes('mt_clk') || ROLE === 'clk';
 function applyRole(){
   let ab = document.getElementById('addBtn');
   if(ab) ab.style.display = CAN_EDIT ? 'block' : 'none';
 }

 const API_URL = "https://script.google.com/macros/s/AKfycbxlfYjXaNu5cXyJ6MoTgmCBgUSr-GBZ_KQGfKb-ojFZRQ-8GLzNENQ-9PLPsodAiX7x/exec";
 function armyNoVal(s){if(!s)return 999999999;let m=String(s).match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
 let data=[];
 async function loadFromSheet(){ try{ let res = await fetch(API_URL+"?t="+Date.now()); if(!res.ok) throw new Error("HTTP "+res.status); let txt = await res.text(); data = JSON.parse(txt); render(); }catch(e){ document.getElementById('list').innerHTML=`<p style='padding:20px;text-align:center;color:#ff4444'>❌ Failed<br><small>${e}</small><br><br><button onclick='loadFromSheet()'>Retry</button></p>`; } }
 
 function openAdd(){
  if(!CAN_EDIT) return alert('COMMAND View Only - Edit করতে MT CLK Login লাগবে');
  document.getElementById('f_row').value='';['f_rank','f_name','f_no','f_coy','f_mob'].forEach(id=>document.getElementById(id).value='');document.getElementById('formTitle').innerText='Add 4 BIR';document.getElementById('formModal').style.display='flex'
 }
 function openEdit(row){
  if(!CAN_EDIT) return;
  let o=data.find(x=>x.row==row);document.getElementById('f_row').value=o.row;document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_no').value=o.no;document.getElementById('f_coy').value=o.coy;document.getElementById('f_mob').value=o.mobile;document.getElementById('formTitle').innerText='Edit 4 BIR';document.getElementById('formModal').style.display='flex'
 }
 function closeForm(){document.getElementById('formModal').style.display='none'}
 async function saveForm(){
  if(!CAN_EDIT) return;
  let p={rank:document.getElementById('f_rank').value.trim(),name:document.getElementById('f_name').value.trim(),no:document.getElementById('f_no').value.trim(),coy:document.getElementById('f_coy').value.trim(),mobile:document.getElementById('f_mob').value.trim(),row:document.getElementById('f_row').value?parseInt(document.getElementById('f_row').value):0}; p.action=p.row?"edit":"add"; if(!p.name||!p.mobile){alert("Name & Mobile লাগবে");return;} document.getElementById('msg').innerText="⏳ Saving..."; await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(p)}); document.getElementById('msg').innerText="✅ Saved! Reloading..."; setTimeout(()=>location.reload(),1000);
 }
 async function del(row){
  if(!CAN_EDIT) return;
  if(!confirm('Delete?'))return;await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row})});location.reload();
 }
 function render(){
  data.sort((a,b)=>armyNoVal(a.no)-armyNoVal(b.no)); let q=document.getElementById('s').value.toLowerCase();let html=''; data.forEach((o,idx)=>{ if(q&&!(String(o.name)+String(o.no)+String(o.coy)).toLowerCase().includes(q))return; let wa=String(o.mobile||'').replace(/\D/g,'');if(wa.startsWith('0'))wa='88'+wa;if(!wa.startsWith('88')&&wa.length==11)wa='88'+wa;
  let editDel = CAN_EDIT ? `<div class="btnRow"><button class="editBtn" onclick="openEdit(${o.row})">✏️ Edit</button><button class="delBtn" onclick="del(${o.row})">🗑️ Del</button></div>` : '';
  html+=`<div class="card"><div style="padding:12px 12px 0 0;display:flex"><div class="rankBadge">${o.rank}</div><div><b>${o.rank} ${o.name}</b><br><small style="color:#4caf50">${o.no} • ${o.coy} • Senior #${idx+1}</small></div></div><div class="details"><div><span class="label">Army No:</span></div><div><span class="label">COY:</span></div><div><span class="val" style="color:#4caf50">${o.no}</span></div><div><span class="val">${o.coy}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile}</span></div></div><div class="btns">${editDel}<div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div></div>`; }); document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center;color:#6b7a90">No Data in Sheet</div>'; document.getElementById('count').innerText=`🪖 ${data.length} Numbers`; applyRole();
 }
 applyRole();
 loadFromSheet();
</script>
