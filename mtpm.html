<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪖 MTPM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f0e9;padding-bottom:80px}
.header{background:#0f3d22;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}
.back{background:#ffcc00;border:none;padding:7px 14px;border-radius:20px;font-weight:800;cursor:pointer}
.profile-circle{width:44px;height:44px;background:#ffcc00;color:#0f3d22;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.search{margin:12px;background:#fff;padding:12px;border-radius:12px}
.search input{width:100%;border:none;outline:none;font-size:15px}
.admin-bar{background:#fff;margin:0 12px 12px;padding:12px;border-radius:12px;display:none}
.admin-bar b{font-size:14px}
.admin-bar div{display:flex;gap:8px;margin-top:8px}
.admin-bar button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.add{background:#ffcc00}.edit{background:#0f3d22;color:#fff}.del{background:#e11d48;color:#fff}
.chat-list{padding:0 12px;display:flex;flex-direction:column;gap:10px}
.chat-item{background:#fff;padding:12px;border-radius:14px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative}
.chat-item img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chat-item h3{font-size:15px}
.chat-item p{font-size:13px;color:#666;margin-top:2px}
.time{margin-left:auto;font-size:11px;color:#999}
.badge{position:absolute;left:44px;top:8px;background:red;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:2px solid #fff}
.online{width:11px;height:11px;background:#22c55e;border-radius:50%;position:absolute;left:44px;top:44px;border:2px solid #fff}
/* Chat Window */
#chatWindow{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column}
#chatWindow header{background:#0f3d22;color:#fff;padding:12px;display:flex;gap:10px;align-items:center}
#chatWindow header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
#chatWindow header button{margin-left:auto;background:#ffcc00;border:none;padding:7px 12px;border-radius:20px;font-weight:800}
.msgs{flex:1;padding:14px;overflow-y:auto;background:#f8f7f3;display:flex;flex-direction:column;gap:8px}
.msg{background:#fff;padding:9px 12px;border-radius:12px;max-width:80%;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg.me{background:#ffcc00;align-self:flex-end}
.input{display:flex;padding:10px;gap:8px;border-top:1px solid #eee}
.input input{flex:1;padding:11px;border:1px solid #ddd;border-radius:20px;outline:none}
.input button{background:#0f3d22;color:#fff;border:none;padding:11px 18px;border-radius:20px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #eee}
.bottom div{text-align:center;font-size:13px;color:#777}
.bottom .active{color:#0f3d22;font-weight:800}
.bottom span{font-size:22px}
</style>
</head>
<body>

<div class="header">
  <h1>🪖 MTPM</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="back" onclick="history.back()">← Home</button>
    <div class="profile-circle" id="profileIcon">R</div>
  </div>
</div>

<div class="search"><input placeholder="🔍 MTPM এ খুঁজো..." onkeyup="searchChat(this.value)"></div>

<!-- Admin Only - 4521328 -->
<div class="admin-bar" id="adminBar">
  <b>👑 Admin Panel - সেনা 4521328</b>
  <div>
    <button class="add" onclick="addGroup()">+ Add Group</button>
    <button class="edit" onclick="editGroup()">Edit</button>
    <button class="del" onclick="deleteGroup()">Delete</button>
  </div>
</div>

<div class="chat-list" id="chatList">
  <!-- Chat Head 1 -->
  <div class="chat-item" onclick="openChat('MT Platoon Main','https://images.unsplash.com/photo-1541186877-5a745edf29c3?w=200')">
    <div style="position:relative">
      <img src="https://images.unsplash.com/photo-1541186877-5a745edf29c3?w=200">
      <div class="badge">3</div>
      <div class="online"></div>
    </div>
    <div><h3>MT Platoon Main</h3><p>সকাল ৬ টায় সবাই রেডি থাকবা...</p></div>
    <span class="time">10:30</span>
  </div>

  <div class="chat-item" onclick="openChat('Squad - Alpha','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200')">
    <div style="position:relative">
      <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200">
      <div class="badge">1</div>
      <div class="online"></div>
    </div>
    <div><h3>Squad - Alpha</h3><p>হ্যাঁ ভাই, আমি আসতেছি</p></div>
    <span class="time">09:15</span>
  </div>

  <div class="chat-item" onclick="openChat('Commander Sir','https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200')">
    <div style="position:relative">
      <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200">
      <div class="online"></div>
    </div>
    <div><h3>Commander Sir</h3><p>ভালো কাজ করছো সবাই</p></div>
    <span class="time">গতকাল</span>
  </div>
</div>

<!-- Chat Window -->
<div id="chatWindow">
  <header>
    <span onclick="closeChat()" style="cursor:pointer;font-size:20px">←</span>
    <img id="chatImg" src="">
    <div><b id="chatName"></b><br><small style="color:#ffcc00">● Online</small></div>
    <button onclick="closeChat()">✕</button>
  </header>
  <div class="msgs" id="msgs">
    <div class="msg">আসসালামু আলাইকুম সবাই 👋</div>
    <div class="msg">আজকে প্যারেড কয়টায়?</div>
    <div class="msg me">সকাল ৬ টায় রেডি থাকবা</div>
  </div>
  <div class="input">
    <input id="chatText" placeholder="মেসেজ লিখো...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<div class="bottom">
  <div onclick="location.href='index.html'"><span>🏠</span><br>Home</div>
  <div><span>📍</span><br>Live Tracking</div>
  <div class="active"><span>👥</span><br>MTPM</div>
</div>

<script>
// Admin চেক - Home থেকে সেনা নাম্বার আসবে, না থাকলে জিজ্ঞেস করবে
const ADMIN_SENA = "4521328";
let sena = localStorage.getItem("senaNo");
if(!sena){
  sena = prompt("তোমার সেনা নাম্বার দাও:");
  if(sena) localStorage.setItem("senaNo", sena);
}
let myName = localStorage.getItem("userName") || "R";
document.getElementById('profileIcon').innerText = myName.charAt(0).toUpperCase();

if(sena === ADMIN_SENA){
  document.getElementById('adminBar').style.display = "block";
}

function openChat(name, img){
  document.getElementById('chatName').innerText = name;
  document.getElementById('chatImg').src = img;
  document.getElementById('chatWindow').style.display = "flex";
}
function closeChat(){ document.getElementById('chatWindow').style.display = "none"; }
function sendMsg(){
  let t = document.getElementById('chatText').value.trim();
  if(!t) return;
  let d = document.createElement('div'); d.className = "msg me"; d.innerText = t;
  document.getElementById('msgs').appendChild(d);
  document.getElementById('chatText').value = "";
}
function searchChat(v){
  let items = document.querySelectorAll('.chat-item');
  items.forEach(it=>{
    it.style.display = it.innerText.toLowerCase().includes(v.toLowerCase()) ? "flex" : "none";
  });
}
// Admin Only Functions
function addGroup(){
  if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; }
  let n = prompt("নতুন গ্রুপের নাম দাও:");
  if(n) alert("✅ গ্রুপ যোগ হইছে: " + n);
}
function editGroup(){
  if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; }
  alert("✏️ Edit - Admin 4521328");
}
function deleteGroup(){
  if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; }
  if(confirm("ডিলিট করবা?")) alert("🗑️ ডিলিট হইছে");
}
</script>
</body>
</html>
