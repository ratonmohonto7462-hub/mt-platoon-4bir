<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> <title>💬 MTPM</title> <style> *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif} body{background:#f2f0e9;padding-bottom:80px} .header{background:#0f3d22;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center} .header h1{font-size:22px} .back{background:#ffcc00;border:none;padding:7px 14px;border-radius:20px;font-weight:800;cursor:pointer} .profile-circle{width:44px;height:44px;background:#ffcc00;color:#0f3d22;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900} .search{margin:12px;background:#fff;padding:12px;border-radius:12px} .search input{width:100%;border:none;outline:none;font-size:15px} .admin-bar{background:#fff;margin:0 12px 12px;padding:12px;border-radius:12px;display:none} .admin-bar b{font-size:14px} .admin-bar div{display:flex;gap:8px;margin-top:8px} .admin-bar button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;cursor:pointer} .add{background:#ffcc00}.edit{background:#0f3d22;color:#fff}.del{background:#e11d48;color:#fff} .chat-list{padding:0 12px;display:flex;flex-direction:column;gap:10px} .chat-item{background:#fff;padding:12px;border-radius:14px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative} .chat-item img{width:52px;height:52px;border-radius:50%;object-fit:cover} .group-logo{width:52px;height:52px;border-radius:50%;background:#0f3d22;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0} .chat-item h3{font-size:15px} .chat-item p{font-size:13px;color:#666;margin-top:2px} .time{margin-left:auto;font-size:11px;color:#999;flex-shrink:0} .online{width:11px;height:11px;background:#22c55e;border-radius:50%;position:absolute;left:44px;top:44px;border:2px solid #fff} #chatWindow{display:none;position:fixed;inset:0;background:#f8f7f3;z-index:100;flex-direction:column} #chatWindow header{background:#0f3d22;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;flex-shrink:0} #chatWindow header img{width:40px;height:40px;border-radius:50%;object-fit:cover} #chatWindow header .h-logo{width:40px;height:40px;border-radius:50%;background:#ffcc00;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0} #chatWindow header button{margin-left:auto;background:#ffcc00;border:none;padding:7px 12px;border-radius:20px;font-weight:800;flex-shrink:0} .msgs{flex:1;padding:14px 14px 90px;overflow-y:auto;display:flex;flex-direction:column;gap:8px} .msg{background:#fff;padding:9px 12px 6px;border-radius:12px;max-width:80%;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);word-break:break-word} .msg.me{background:#ffcc00;align-self:flex-end} .msg-time{font-size:10px;color:#777;display:block;text-align:right;margin-top:4px} .msg.me .msg-time{color:#555} .input{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px;gap:8px;border-top:1px solid #eee;background:#fff;z-index:101;padding-bottom:calc(10px + env(safe-area-inset-bottom))} .input input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;outline:none;font-size:15px} .input button{background:#0f3d22;color:#fff;border:none;padding:12px 18px;border-radius:20px;font-weight:700} .bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #eee} .bottom div{text-align:center;font-size:13px;color:#777} .bottom .active{color:#0f3d22;font-weight:800} .bottom span{font-size:22px} </style> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> </head> <body> <div class="header"> <h1>🪖 MTPM</h1> <div style="display:flex;gap:10px;align-items:center"> <button class="back" onclick="history.back()">← Home</button> <div class="profile-circle" id="profileIcon">R</div> </div> </div> <div class="search"><input placeholder="🔍 MTPM এ খুঁজো..." onkeyup="searchChat(this.value)"></div> <div class="admin-bar" id="adminBar"> <b>👑 Admin Panel - সেনা 4521328</b> <div> <button class="add" onclick="addGroup()">+ Add Group</button> <button class="edit" onclick="editGroup()">Edit</button> <button class="del" onclick="deleteGroup()">Delete</button> </div> </div> <div class="chat-list" id="chatList"> <div class="chat-item" onclick="openChat('MT Platoon Main','GROUP','GROUP')"> <div style="position:relative"><div class="group-logo">🪖</div><div class="online"></div></div> <div><h3>MT Platoon Main</h3><p>সবাই এই গ্রুপে মেসেজ করো...</p></div><span class="time">Now</span></div> <div id="otherUsers"></div> </div> <div id="chatWindow"> <header> <span onclick="closeChat()" style="cursor:pointer;font-size:20px">←</span> <div id="chatImgWrap"></div> <div><b id="chatName"></b><br><small style="color:#ffcc00">● Online</small></div> <button onclick="closeChat()">✕</button> </header> <div class="msgs" id="msgs"></div> <div class="input"> <input id="chatText" placeholder="মেসেজ লিখো..."> <button onclick="sendMsg()">Send</button> </div> </div> <div class="bottom"> <div onclick="location.href='index.html'"><span>🏠</span><br>Home</div> <div><span>📍</span><br>Live Tracking</div> <div class="active"><span>👥</span><br>MTPM</div> </div> <script> const firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:4d24320f792d7e86fdca80" }; let db = null; try{ if(window.firebase){ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } }catch(e){ alert("Firebase Error: "+e.message); } const ADMIN_SENA = "4521328"; let sena = (localStorage.getItem("senaNo") || localStorage.getItem("mt_sena") || localStorage.getItem("sena_no") || localStorage.getItem("mt_army") || localStorage.getItem("sena") || "").toString().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,''); let myName = localStorage.getItem("userName") || localStorage.getItem("mt_name") || localStorage.getItem("name") || "R"; let currentChatId = "MT Platoon Main"; let unsub = null; function formatTime(ts){ try{ let d = null; if(!ts) d = new Date(); else if(ts.seconds) d = new Date(ts.seconds*1000); else if(ts.toDate) d = ts.toDate(); else d = new Date(ts); let h = d.getHours(); let m = d.getMinutes().toString().padStart(2,'0'); let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12; if(h===0) h=12; return h + ":" + m + " " + ampm; }catch(e){ return ""; } } document.getElementById('profileIcon').innerText = myName.charAt(0).toUpperCase(); if(sena === ADMIN_SENA){ document.getElementById('adminBar').style.display = "block"; } loadUsers(); checkProfile(); async function checkProfile(){ try{ if(!sena || !db) return; const snap = await db.collection("users").doc(sena).get(); if(!snap.exists) return; let d = snap.data(); if(d.status && d.status !== "approved"){ alert("⏳ Profile Pending"); location.href='dashboard.html'; return; } myName = d.Name || d.name || myName; localStorage.setItem("userName", myName); localStorage.setItem("mt_name", myName); localStorage.setItem("sena_no", sena); document.getElementById('profileIcon').innerText = myName.charAt(0).toUpperCase(); }catch(e){ console.log(e); } } async function loadUsers(){ try{ if(!db) return; const snap = await db.collection("users").get(); let html=""; let users=[]; snap.forEach(d=>{ let u = {id:d.id, ...d.data()}; let usena = String(u.Sena_No || u.sena || u.id); if(usena !== sena && d.id !== sena) users.push(u); }); users.sort((a,b)=> Number(a.sena||a.Sena_No||a.id) - Number(b.sena||b.Sena_No||b.id)); users.forEach(u=>{ let img = u.Photo || u.photo || ""; let nm = u.Name || u.name || ""; let sn = String(u.Sena_No || u.sena || u.id); let avatar = img ? `<img src="${img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ""; let fallback = `<div style="width:52px;height:52px;border-radius:50%;background:#0f3d22;color:#fff;display:${img?'none':'flex'};align-items:center;justify-content:center;font-size:22px;font-weight:900">${(nm||'U').charAt(0).toUpperCase()}</div>`; html += `<div class="chat-item" onclick="openChat('${sn} - ${nm}','${img}','${sn}')"> <div style="position:relative">${avatar}${fallback}<div class="online"></div></div> <div><h3>${sn} - ${nm}</h3><p>${u.Podobi||u.podobi||''} • ${u.Company||u.company||''}</p></div><span class="time"></span></div>`; }); document.getElementById('otherUsers').innerHTML = html; }catch(e){ console.log(e); } } function searchChat(v){ let items = document.querySelectorAll('.chat-item'); items.forEach(it=>{ it.style.display = it.innerText.toLowerCase().includes(v.toLowerCase()) ? "flex" : "none"; }); } function openChat(name, img, otherSena){ let myDisplay = sena + " - " + myName; let chatIds = [name]; if(otherSena && otherSena !== "GROUP" && sena){ let pair = [String(sena), String(otherSena)].sort(); currentChatId = "DM_" + pair[0] + "_" + pair[1]; chatIds = [currentChatId, name, myDisplay]; } else { currentChatId = name; chatIds = [name]; } document.getElementById('chatName').innerText = name; let wrap = document.getElementById('chatImgWrap'); if(img === "GROUP" || !img){ wrap.innerHTML = `<div class="h-logo">🪖</div>`; } else { wrap.innerHTML = `<img src="${img}" style="width:40px;height:40px;border-radius:50%;object-fit:cover" onerror="this.outerHTML='<div class=h-logo>👤</div>'">`; } document.getElementById('chatWindow').style.display = "flex"; document.getElementById('msgs').innerHTML = "<p style='text-align:center;color:#999'>Loading...</p>"; if(unsub) unsub(); if(!db){ document.getElementById('msgs').innerHTML = "<p style='text-align:center;color:red'>Firebase লোড হয় নাই</p>"; return; } unsub = db.collection("mtpm_messages").where("chatId","in",chatIds).onSnapshot((snap)=>{ let box = document.getElementById('msgs'); box.innerHTML = ""; if(snap.empty){ box.innerHTML = "<p style='text-align:center;color:#999;padding:20px'>কোনো মেসেজ নাই, প্রথম মেসেজ করো 👋</p>"; return; } let arr=[]; snap.forEach(d=>arr.push(d.data())); arr.sort((a,b)=> (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)); arr.forEach(m=>{ let div = document.createElement('div'); div.className = "msg" + (m.sena===sena ? " me" : ""); div.innerHTML = (m.sena!==sena ? `<b style="font-size:11px;color:#0f3d22">${m.name||m.sena}</b><br>` : "") + (m.text||"") + `<span class="msg-time">${formatTime(m.createdAt)}</span>`; box.appendChild(div); }); box.scrollTop = box.scrollHeight; },(err)=>{ document.getElementById('msgs').innerHTML = "Error: "+err.message; }); } function closeChat(){ document.getElementById('chatWindow').style.display = "none"; if(unsub) unsub(); } async function sendMsg(){ let t = document.getElementById('chatText').value.trim(); if(!t){ alert("আগে মেসেজ লিখো!"); return; } if(!db){ alert("Firebase লোড হয় নাই!"); return; } if(!sena){ sena = prompt("তোমার সেনা নম্বর দাও:"); if(!sena) return; sena = sena.toString().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,''); localStorage.setItem("sena_no", sena); localStorage.setItem("senaNo", sena); localStorage.setItem("mt_sena", sena); if(sena === ADMIN_SENA){ document.getElementById('adminBar').style.display = "block"; } } document.getElementById('chatText').value = ""; try{ await db.collection("mtpm_messages").add({ chatId: currentChatId, sena: sena, name: myName, text: t, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); }catch(e){ alert("মেসেজ যায় নাই: "+e.message); document.getElementById('chatText').value = t; } } async function addGroup(){ if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; } let n = prompt("নতুন গ্রুপের নাম দাও:"); if(!n) return; await db.collection("mtpm_messages").add({ chatId: n, sena: sena, name: myName, text: "👋 গ্রুপ তৈরি হইছে - "+n, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); alert("✅ গ্রুপ যোগ হইছে: " + n); loadUsers(); } function editGroup(){ alert("✏️ Edit - Admin 4521328"); } async function deleteGroup(){ if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; } if(!confirm("ডিলিট করবা? "+currentChatId)) return; const snap = await db.collection("mtpm_messages").where("chatId","==",currentChatId).get(); for(let d of snap.docs){ await db.collection("mtpm_messages").doc(d.id).delete(); } alert("🗑️ ডিলিট হইছে"); closeChat(); loadUsers(); } document.getElementById('chatText')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMsg(); }); </script> </body> </html>
