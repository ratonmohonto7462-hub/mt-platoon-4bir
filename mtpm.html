<!DOCTYPE html> <html lang="bn"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>💬 MTPM</title> <style> *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif} body{background:#f2f0e9;padding-bottom:80px} .header{background:#0f3d22;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center} .header h1{font-size:22px} .back{background:#ffcc00;border:none;padding:7px 14px;border-radius:20px;font-weight:800;cursor:pointer} .profile-circle{width:44px;height:44px;background:#ffcc00;color:#0f3d22;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900} .search{margin:12px;background:#fff;padding:12px;border-radius:12px} .search input{width:100%;border:none;outline:none;font-size:15px} .admin-bar{background:#fff;margin:0 12px 12px;padding:12px;border-radius:12px;display:none} .admin-bar b{font-size:14px} .admin-bar div{display:flex;gap:8px;margin-top:8px} .admin-bar button{flex:1;padding:9px;border:none;border-radius:8px;font-weight:700;cursor:pointer} .add{background:#ffcc00}.edit{background:#0f3d22;color:#fff}.del{background:#e11d48;color:#fff} .chat-list{padding:0 12px;display:flex;flex-direction:column;gap:10px} .chat-item{background:#fff;padding:12px;border-radius:14px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative} .chat-item img{width:52px;height:52px;border-radius:50%;object-fit:cover} .chat-item h3{font-size:15px} .chat-item p{font-size:13px;color:#666;margin-top:2px} .time{margin-left:auto;font-size:11px;color:#999} .online{width:11px;height:11px;background:#22c55e;border-radius:50%;position:absolute;left:44px;top:44px;border:2px solid #fff} #chatWindow{display:none;position:fixed;inset:0;background:#fff;z-index:100;flex-direction:column} #chatWindow header{background:#0f3d22;color:#fff;padding:12px;display:flex;gap:10px;align-items:center} #chatWindow header img{width:40px;height:40px;border-radius:50%;object-fit:cover} #chatWindow header button{margin-left:auto;background:#ffcc00;border:none;padding:7px 12px;border-radius:20px;font-weight:800} .msgs{flex:1;padding:14px;overflow-y:auto;background:#f8f7f3;display:flex;flex-direction:column;gap:8px} .msg{background:#fff;padding:9px 12px;border-radius:12px;max-width:80%;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)} .msg.me{background:#ffcc00;align-self:flex-end} .input{display:flex;padding:10px;gap:8px;border-top:1px solid #eee} .input input{flex:1;padding:11px;border:1px solid #ddd;border-radius:20px;outline:none} .input button{background:#0f3d22;color:#fff;border:none;padding:11px 18px;border-radius:20px} .bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #eee} .bottom div{text-align:center;font-size:13px;color:#777} .bottom .active{color:#0f3d22;font-weight:800} .bottom span{font-size:22px} </style> </head> <body> <div class="header"> <h1>🪖 MTPM</h1> <div style="display:flex;gap:10px;align-items:center"> <button class="back" onclick="history.back()">← Home</button> <div class="profile-circle" id="profileIcon">R</div> </div> </div> <div class="search"><input placeholder="🔍 MTPM এ খুঁজো..." onkeyup="searchChat(this.value)"></div> <div class="admin-bar" id="adminBar"> <b>👑 Admin Panel - সেনা 4521328</b> <div> <button class="add" onclick="addGroup()">+ Add Group</button> <button class="edit" onclick="editGroup()">Edit</button> <button class="del" onclick="deleteGroup()">Delete</button> </div> </div> <div class="chat-list" id="chatList"><p style="text-align:center;padding:20px;color:#777">Loading...</p></div> <div id="chatWindow"> <header> <span onclick="closeChat()" style="cursor:pointer;font-size:20px">←</span> <img id="chatImg" src=""> <div><b id="chatName"></b><br><small style="color:#ffcc00">● Online</small></div> <button onclick="closeChat()">✕</button> </header> <div class="msgs" id="msgs"></div> <div class="input"> <input id="chatText" placeholder="মেসেজ লিখো..."> <button onclick="sendMsg()">Send</button> </div> </div> <div class="bottom"> <div onclick="location.href='index.html'"><span>🏠</span><br>Home</div> <div><span>📍</span><br>Live Tracking</div> <div class="active"><span>👥</span><br>MTPM</div> </div> <script type="module"> import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; import { getFirestore, doc, getDoc, collection, query, where, getDocs, addDoc, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:4d24320f792d7e86fdca80", measurementId: "G-E1M0WH2RD9" }; const app = initializeApp(firebaseConfig); const db = getFirestore(app); const ADMIN_SENA = "4521328"; let sena = (localStorage.getItem("senaNo") || localStorage.getItem("mt_sena") || localStorage.getItem("sena_no") || localStorage.getItem("mt_army") || "").toString().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,''); let myName = localStorage.getItem("userName") || localStorage.getItem("mt_name") || localStorage.getItem("name") || "R"; let currentChatId = "MT Platoon Main"; let unsub = null; document.getElementById('profileIcon').innerText = myName.charAt(0).toUpperCase(); if(sena === ADMIN_SENA){ document.getElementById('adminBar').style.display = "block"; } loadChatList(); checkProfile(); async function checkProfile(){ try{ if(!sena) return; const snap = await getDoc(doc(db,"users",sena)); if(!snap.exists()) return; let d = snap.data(); if(d.status && d.status !== "approved"){ alert("⏳ Profile Pending"); location.href='dashboard.html'; return; } myName = d.Name || d.name || myName; localStorage.setItem("userName", myName); localStorage.setItem("mt_name", myName); localStorage.setItem("sena_no", sena); document.getElementById('profileIcon').innerText = myName.charAt(0).toUpperCase(); }catch(e){ console.log("profile check fail", e); } } async function loadChatList(){ let list = document.getElementById('chatList'); let html = `<div class="chat-item" onclick="openChat('MT Platoon Main','https://images.unsplash.com/photo-1541186877-5a745edf29c3?w=200')"> <div style="position:relative"><img src="https://images.unsplash.com/photo-1541186877-5a745edf29c3?w=200"><div class="online"></div></div> <div><h3>MT Platoon Main</h3><p>সবাই এই গ্রুপে মেসেজ করো...</p></div><span class="time">Now</span></div>`; list.innerHTML = html; try{ const snap = await getDocs(collection(db,"users")); let users = []; snap.forEach(d=>{ if(d.id !== sena) users.push({id:d.id, ...d.data()}); }); users.sort((a,b)=> Number(a.sena||a.Sena_No||a.id) - Number(b.sena||b.Sena_No||b.id)); users.forEach(u=>{ let img = u.Photo || u.photo || "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200"; let nm = u.Name || u.name || ""; let sn = u.Sena_No || u.sena || u.id; html += `<div class="chat-item" onclick="openChat('${sn} - ${nm}','${img}')"> <div style="position:relative"><img src="${img}"><div class="online"></div></div> <div><h3>${sn} - ${nm}</h3><p>${u.Podobi||u.podobi||''} • ${u.Company||u.company||''}</p></div><span class="time"></span></div>`; }); list.innerHTML = html; }catch(e){ console.log("users list fail", e); } } window.openChat = function(name, img){ currentChatId = name; document.getElementById('chatName').innerText = name; document.getElementById('chatImg').src = img; document.getElementById('chatWindow').style.display = "flex"; document.getElementById('msgs').innerHTML = "<p style='text-align:center;color:#999'>Loading...</p>"; if(unsub) unsub(); const q = query(collection(db,"mtpm_messages"), where("chatId","==",name)); unsub = onSnapshot(q, (snap)=>{ let box = document.getElementById('msgs'); box.innerHTML = ""; if(snap.empty){ box.innerHTML = "<p style='text-align:center;color:#999;padding:20px'>কোনো মেসেজ নাই, প্রথম মেসেজ করো 👋</p>"; return; } let arr=[]; snap.forEach(d=>arr.push(d.data())); arr.sort((a,b)=> (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)); arr.forEach(m=>{ let div = document.createElement('div'); div.className = "msg" + (m.sena===sena ? " me" : ""); div.innerHTML = (m.sena!==sena ? `<b style="font-size:11px;color:#0f3d22">${m.name||m.sena}</b><br>` : "") + (m.text||""); box.appendChild(div); }); box.scrollTop = box.scrollHeight; },(err)=>{ document.getElementById('msgs').innerHTML = "Error: "+err.message; }); } window.closeChat = function(){ document.getElementById('chatWindow').style.display = "none"; if(unsub) unsub(); } window.sendMsg = async function(){ let t = document.getElementById('chatText').value.trim(); if(!t) return; document.getElementById('chatText').value = ""; await addDoc(collection(db,"mtpm_messages"), { chatId: currentChatId, sena: sena, name: myName, text: t, createdAt: serverTimestamp() }); } window.searchChat = function(v){ let items = document.querySelectorAll('.chat-item'); items.forEach(it=>{ it.style.display = it.innerText.toLowerCase().includes(v.toLowerCase()) ? "flex" : "none"; }); } window.addGroup = async function(){ if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; } let n = prompt("নতুন গ্রুপের নাম দাও:"); if(!n) return; await addDoc(collection(db,"mtpm_messages"), { chatId: n, sena: sena, name: myName, text: "👋 গ্রুপ তৈরি হইছে - "+n, createdAt: serverTimestamp() }); alert("✅ গ্রুপ যোগ হইছে: " + n); loadChatList(); } window.editGroup = function(){ if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; } alert("✏️ Edit - Admin 4521328"); } window.deleteGroup = async function(){ if(sena !== ADMIN_SENA){ alert("শুধু Admin পারবে"); return; } if(!confirm("ডিলিট করবা? "+currentChatId)) return; const q = query(collection(db,"mtpm_messages"), where("chatId","==",currentChatId)); const snap = await getDocs(q); for(let d of snap.docs){ await deleteDoc(doc(db,"mtpm_messages",d.id)); } alert("🗑️ ডিলিট হইছে"); closeChat(); loadChatList(); } document.getElementById('chatText')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMsg(); }); </script> </body> </html>
