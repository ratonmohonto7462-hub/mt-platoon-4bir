<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000}
#map{height:100vh;width:100vw}
.top{position:fixed;top:0;left:0;right:0;background:#0b1226cc;padding:10px;color:#fff;z-index:999;text-align:center;font-family:system-ui}
.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#0b1226;display:flex;gap:12px;padding:8px 15px;border-radius:20px;z-index:999}
.nav div{font-size:11px;color:#94a3b8;font-family:system-ui;text-align:center}
</style>
</head>
<body>
<div class="top">🛰️ Live Map - 10 Trucks • <span style="color:#22c55e">LIVE</span></div>
<div id="map"></div>
<div class="nav">
<div onclick="location.href='convoy-home.html'">🚚 Home</div>
<div style="color:#22c55e">📍 Map</div>
<div onclick="location.href='convoy-message.html'">💬 Message</div>
</div>
<script>
const map=L.map('map',{zoomControl:false}).setView([23.4,89.9],9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
for(let i=1;i<=10;i++){
let lat=23.81-(Math.random()*1.5); let lng=90.41-(Math.random()*1.5);
L.marker([lat,lng],{icon:L.divIcon({html:`<div style="background:#22c55e;color:#fff;padding:3px 8px;border-radius:15px;font-size:10px;border:2px solid #fff">🚚 T-${String(i).padStart(2,'0')}</div>`,className:''})}).addTo(map);
}
</script>
</body>
</html>
