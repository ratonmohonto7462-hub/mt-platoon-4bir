<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Map - MT 4 BIR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;overflow:hidden}
#map{position:fixed;top:0;left:0;width:100%;height:100vh;z-index:1}
#searchBar{position:fixed;top:12px;left:12px;right:12px;z-index:9999;background:#fff;border-radius:30px;display:flex;align-items:center;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#searchBar input{flex:1;border:none;outline:none;font-size:17px;padding:8px}
#searchBar button{background:#1a73e8;color:#fff;border:none;padding:9px 15px;border-radius:20px;font-weight:700}
#kmCard{position:fixed;bottom:70px;left:12px;right:12px;z-index:9999;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 15px rgba(0,0,0,.35);display:none}
#kmBig{font-size:21px;font-weight:900}
#kmSub{font-size:13px;color:#555;margin-top:2px}
#btnRow{display:flex;gap:8px;margin-top:10px}
#btnRow button{flex:1;border:none;padding:12px;border-radius:20px;font-weight:800}
#startBtn{background:#0b6b6b;color:#fff}
#backBtn{position:fixed;top:70px;left:14px;z-index:9999;background:#0f2e2a;color:#ffcc00;padding:8px 14px;border-radius:20px;border:none;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#navBanner{position:fixed;top:0;left:0;right:0;z-index:10000;background:#0b6b6b;color:#fff;padding:14px 16px;display:none;align-items:center;gap:12px}
#navBanner b{font-size:22px}
#navBottom{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#fff;padding:12px 14px;display:none;box-shadow:0 -2px 15px rgba(0,0,0,.3);border-radius:20px 20px 0 0}
#speedBox{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<div id="map"></div>

<div id="searchBar">
<input id="searchInput" placeholder="Search here">
<button onclick="calcRoute()">🔍</button>
</div>

<button id="backBtn" onclick="goBackToTracking()">← Back</button>

<div id="kmCard">
<div id="kmBig"></div>
<div id="kmSub"></div>
<div id="btnRow">
<button id="startBtn" onclick="startNavInSite()">▲ Start</button>
</div>
</div>

<div id="navBanner">
<span style="font-size:30px">↑</span>
<div><b id="nextTurn"></b><div id="nextDist" style="font-size:14px;opacity:.9"></div></div>
<button onclick="stopNav()" style="margin-left:auto;background:#fff;color:#0b6b6b;border:none;padding:8px 14px;border-radius:15px;font-weight:900">✕ বন্ধ</button>
</div>

<div id="navBottom">
<div id="speedBox">
<div><b id="remainTime" style="font-size:26px;color:#e65100"></b><div id="remainDist" style="font-size:14px"></div></div>
<div style="text-align:right"><b id="speed" style="font-size:28px">0</b><div style="font-size:12px">km/h</div></div>
</div>
</div>

<script>
let map = L.map('map').setView([23.8103,90.4125],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let myLat=23.8103, myLng=90.4125, destLat=0, destLng=0, destName="";
let routeLine=null, myMarker=null, destMarker=null, routeCoords=[], watchId=null;

function goBackToTracking(){
  if(window.history.length > 1){
    window.history.back();
  } else {
    window.location.href = '../index.html';
  }
}

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    myLat=p.coords.latitude; myLng=p.coords.longitude;
    map.setView([myLat,myLng],14);
    if(myMarker) map.removeLayer(myMarker);
    myMarker=L.circleMarker([myLat,myLng],{radius:10,color:'#1a73e8',fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
  });
}

async function calcRoute(){
  destName=document.getElementById('searchInput').value;
  if(!destName) return;
  document.getElementById('kmCard').style.display='block';
  document.getElementById('kmBig').innerText="হিসাব করতেছি...";
  document.getElementById('kmSub').innerText="";
  try{
    let geo=await fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(destName+", Bangladesh"));
    let g=await geo.json(); if(!g[0]){document.getElementById('kmBig').innerText="জায়গা পাইলাম না"; return;}
    destLat=parseFloat(g[0].lat); destLng=parseFloat(g[0].lon);
    if(destMarker) map.removeLayer(destMarker);
    destMarker=L.marker([destLat,destLng]).addTo(map).bindPopup(destName);
    let r=await fetch(`https://router.project-osrm.org/route/v1/driving/${myLng},${myLat};${destLng},${destLat}?overview=full&geometries=geojson&steps=true`);
    let data=await r.json(); let route=data.routes[0];
    let km=route.distance/1000;
    let mins=Math.round(route.duration/60);
    let timeText=Math.floor(mins/60)+" hr "+(mins%60)+" min";
    routeCoords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
    if(routeLine) map.removeLayer(routeLine);
    routeLine=L.polyline(routeCoords,{color:'#1a73e8',weight:6}).addTo(map);
    map.fitBounds(routeLine.getBounds());
    // শুধু তোমার সার্চ করা জায়গার আসল হিসাব দেখবো, কোনো Example না
    document.getElementById('kmBig').innerText="🛣️ "+km.toFixed(1)+" km • "+timeText;
    document.getElementById('kmSub').innerText="তোমার লোকেশন থেকে "+destName+" পর্যন্ত";
    if(route.legs[0].steps[1]){
      document.getElementById('nextTurn').innerText = route.legs[0].steps[1].maneuver.instruction || "";
      document.getElementById('nextDist').innerText = destName;
    }
  }catch(e){ document.getElementById('kmBig').innerText="নেট চেক করো ভাই"; }
}

function startNavInSite(){
  if(!routeCoords.length){ alert("আগে জায়গা সার্চ করো"); return; }
  document.getElementById('searchBar').style.display='none';
  document.getElementById('kmCard').style.display='none';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('navBanner').style.display='flex';
  document.getElementById('navBottom').style.display='block';
  watchId=navigator.geolocation.watchPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    let speed = pos.coords.speed ? Math.round(pos.coords.speed*3.6) : 0;
    document.getElementById('speed').innerText=speed;
    if(myMarker) map.removeLayer(myMarker);
    myMarker=L.circleMarker([myLat,myLng],{radius:12,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
    map.setView([myLat,myLng],16);
    let d=Math.sqrt(Math.pow(destLat-myLat,2)+Math.pow(destLng-myLng,2))*111;
    document.getElementById('remainDist').innerText=d.toFixed(1)+" km বাকি • "+destName;
    let mins=Math.round(d/40*60);
    document.getElementById('remainTime').innerText=Math.floor(mins/60)+" hr "+(mins%60)+" min";
    if(d<0.2){ document.getElementById('nextTurn').innerText="🎉 পৌঁছাই গেছো!"; }
  },{enableHighAccuracy:true});
}

function stopNav(){
  if(watchId) navigator.geolocation.clearWatch(watchId);
  document.getElementById('navBanner').style.display='none';
  document.getElementById('navBottom').style.display='none';
  document.getElementById('searchBar').style.display='flex';
  document.getElementById('kmCard').style.display='block';
  document.getElementById('backBtn').style.display='block';
}
document.getElementById('searchInput').addEventListener('change',calcRoute);
</script>
</body>
</html>
