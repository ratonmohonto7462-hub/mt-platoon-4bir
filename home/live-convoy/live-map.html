<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Map - MT 4 BIR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;overflow:hidden}
#map{height:100vh;width:100%;z-index:1}
/* গুগল ম্যাপের মতো উপরের সার্চ */
#topSearch{position:fixed;top:12px;left:12px;right:12px;z-index:9999;background:#fff;border-radius:30px;display:flex;align-items:center;padding:6px 6px 6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#topSearch input{flex:1;border:none;outline:none;font-size:17px;padding:8px}
#topSearch .mic{font-size:22px;padding:0 8px}
#topSearch .profile{width:36px;height:36px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
/* চিপস */
#chips{position:fixed;top:62px;left:12px;right:12px;z-index:9999;display:flex;gap:8px;overflow-x:auto}
.chip{background:#fff;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.3);border:none}
/* ডান পাশের বাটন */
#rightBtns{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:9999;display:flex;flex-direction:column;gap:12px}
.rbtn{width:52px;height:52px;background:#fff;border-radius:50%;border:none;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:24px;display:flex;align-items:center;justify-content:center}
.rbtn.blue{background:#0b7a7a;color:#fff;border-radius:14px}
#myLoc{position:fixed;right:12px;bottom:220px;z-index:9999}
/* নিচের সাদা বক্স */
#bottomSheet{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#fff;border-radius:20px 20px 0 0;padding:14px 14px 0;box-shadow:0 -2px 15px rgba(0,0,0,.3)}
#bottomSheet .handle{width:40px;height:4px;background:#ccc;border-radius:10px;margin:0 auto 10px}
#placeName{font-size:24px;font-weight:700;display:flex;justify-content:space-between}
#weather{font-size:14px;text-align:right}
/* নিচের মেনু */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#f1f5f4;display:flex;justify-content:space-around;padding:10px 0 12px;border-top:1px solid #ddd;margin-top:70px}
#bottomNav div{text-align:center;font-size:14px;color:#444}
#bottomNav .active{color:#000;font-weight:700}
</style>
</head>
<body>

<div id="topSearch">
<span style="font-size:22px">📍</span>
<input id="searchInput" placeholder="Search here">
<span class="mic">🎤</span>
<div class="profile">R</div>
</div>

<div id="chips">
<button class="chip" onclick="searchPlace('Restaurant')">✨ Ask Maps</button>
<button class="chip" onclick="searchPlace('Home')">🏠 Home</button>
<button class="chip" onclick="searchPlace('Restaurants')">🍴 Restaurants</button>
<button class="chip" onclick="searchPlace('Hospital')">🏥 Hospital</button>
<button class="chip" onclick="searchPlace('Petrol Pump')">⛽ Petrol</button>
</div>

<div id="map"></div>

<div id="rightBtns">
<button class="rbtn" onclick="toggleMap()" title="Layer">🗂️</button>
<button class="rbtn" onclick="goMyLocation()">🧭</button>
<button class="rbtn blue" onclick="getDirections()">➡️</button>
</div>

<div id="bottomSheet">
<div class="handle"></div>
<div id="placeName"><span id="placeTxt">Banani</span><div id="weather">🌤️ 25°<br><span style="color:red;font-size:12px">● 192 AQI</span></div></div>
<div style="height:55px"></div>
</div>

<div id="bottomNav">
<div class="active">📍<br>Explore</div>
<div onclick="location.href='../index.html'">🔖<br>You</div>
<div>➕<br>Contribute</div>
</div>

<script>
var map = L.map('map', {zoomControl:false}).setView([23.8103, 90.4125], 15);

// *** ১ম ছবির মতো Hybrid - স্যাটেলাইট + রাস্তা + নাম ***
var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {maxZoom:21}).addTo(map);
// সাদা রাস্তার ম্যাপ
var googleRoad = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {maxZoom:21});
// শুধু স্যাটেলাইট
var googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {maxZoom:21});

var mode = 0; // 0=Hybrid, 1=Road, 2=Sat
function toggleMap(){
  map.eachLayer(l=>{ if(l._url && l._url.includes('google.com')) map.removeLayer(l); });
  mode = (mode+1)%3;
  if(mode==0) map.addLayer(googleHybrid);
  if(mode==1) map.addLayer(googleRoad);
  if(mode==2) map.addLayer(googleSat);
}

var myMarker = null;
var searchMarker = null;

function goMyLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      let lat=pos.coords.latitude, lng=pos.coords.longitude;
      map.setView([lat,lng], 16);
      if(!myMarker) myMarker = L.marker([lat,lng]).addTo(map).bindPopup("📍 তুমি এখানে").openPopup();
      else myMarker.setLatLng([lat,lng]);
      document.getElementById('placeTxt').innerText = "Your Location";
    });
  }
}

async function searchPlace(q){
  q = q || document.getElementById('searchInput').value;
  if(!q) return;
  let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + " Bangladesh")}`);
  let data = await res.json();
  if(data.length>0){
    let lat=parseFloat(data[0].lat), lng=parseFloat(data[0].lon);
    map.setView([lat,lng], 15);
    if(searchMarker) map.removeLayer(searchMarker);
    searchMarker = L.marker([lat,lng]).addTo(map).bindPopup(`<b>${data[0].display_name}</b>`).openPopup();
    document.getElementById('placeTxt').innerText = q;
  }
}
document.getElementById('searchInput').addEventListener('change', ()=> searchPlace());

function getDirections(){
  if(myMarker){
    let ll = myMarker.getLatLng();
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${ll.lat},${ll.lng}`);
  } else {
    window.open(`https://www.google.com/maps`);
  }
}

goMyLocation();
</script>
</body>
</html>
