<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Map - MT 4 BIR</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#000;overflow:hidden}#top{position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f2e2a;color:#facc15;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px}#map{height:100vh;width:100%}#status{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:#000;color:#22c55e;padding:6px 14px;border-radius:20px;z-index:9999;border:1px solid #22c55e;font-size:11px}#talkBtn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:14px 28px;border-radius:50px;border:3px solid #fff;font-weight:900;z-index:9999;box-shadow:0 5px 20px rgba(0,0,0,0.5)}</style></head><body>
<div id="top"><button onclick="location.href='/home/index.html'" style="background:#1a4d3a;color:#ffcc00;border:none;padding:5px 12px;border-radius:15px;font-weight:900">← Back</button><span>🛰️ LIVE MAP - MT PLATOON</span><span style="font-size:10px">4 BIR</span></div>
<div id="status">● Map Loading...</div>
<div id="map"></div>
<button id="talkBtn">🎙️ HOLD TO TALK</button>
<script>
var map = L.map('map').setView([23.8103, 90.4125], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'MT Platoon'}).addTo(map);
document.getElementById('status').innerText='● Map Ready';
if(navigator.geolocation){
navigator.geolocation.watchPosition(p=>{
var lat=p.coords.latitude,lng=p.coords.longitude;
L.marker([lat,lng]).addTo(map).bindPopup("📍 You - MT Driver").openPopup();
map.setView([lat,lng],15);
document.getElementById('status').innerText='● Live Location On';
},null,{enableHighAccuracy:true});
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA99iSvbxKItztZTn8w7ImDHnAbem25ji0", authDomain: "mt-platoon-4bir.firebaseapp.com", projectId: "mt-platoon-4bir", storageBucket: "mt-platoon-4bir.firebasestorage.app", messagingSenderId: "720139134198", appId: "1:720139134198:web:ea8e10926d90bbfddcb8d7" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
const myId='truck_'+Math.floor(Math.random()*10000); let localStream, pcs={};
const btn=document.getElementById('talkBtn'), st=document.getElementById('status');
try{
localStream=await navigator.mediaDevices.getUserMedia({audio:true});
localStream.getAudioTracks().forEach(t=>t.enabled=false);
const roomRef=collection(db,"convoys","MT-04","signals");
onSnapshot(roomRef,s=>{s.docChanges().forEach(async c=>{const d=c.doc.data(); if(d.from===myId) return; if(d.type==='join') createPeer(d.from,true); if(d.type==='offer') createPeer(d.from,false,d.offer); if(d.type==='answer'){try{await pcs[d.from]?.setRemoteDescription(d.answer)}catch{}} if(d.type==='ice'){try{await pcs[d.from]?.addIceCandidate(d.candidate)}catch{}}})});
await addDoc(roomRef,{type:'join',from:myId});
async function createPeer(pid,init,off=null){if(pcs[pid]) return; const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); pcs[pid]=pc; localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); pc.ontrack=e=>{const a=document.createElement('audio'); a.srcObject=e.streams[0]; a.autoplay=true; document.body.appendChild(a);}; pc.onicecandidate=e=>{if(e.candidate) addDoc(roomRef,{type:'ice',from:myId,to:pid,candidate:e.candidate});}; if(init){const o=await pc.createOffer(); await pc.setLocalDescription(o); addDoc(roomRef,{type:'offer',from:myId,to:pid,offer:o});} else{await pc.setRemoteDescription(off); const a=await pc.createAnswer(); await pc.setLocalDescription(a); addDoc(roomRef,{type:'answer',from:myId,to:pid,answer:a});}}
function setTalk(s){localStream.getAudioTracks().forEach(t=>t.enabled=s); btn.innerText=s?"🔴 BROADCASTING...":"🎙️ HOLD TO TALK"; btn.style.background=s?"#16a34a":"#ef4444"; st.innerText=s?"🔴 YOU ARE TALKING":`● ${Object.keys(pcs).length+1} Drivers Online`;}
btn.onmousedown=()=>setTalk(true); btn.onmouseup=()=>setTalk(false); btn.ontouchstart=e=>{e.preventDefault(); setTalk(true)}; btn.ontouchend=e=>{e.preventDefault(); setTalk(false)}; st.innerText="● Ready - Hold To Talk";
}catch(e){ st.innerText="● Map Ready - Mic Allow করলে কথা বলতে পারবে"; }
</script>
</body></html>
