<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  #map { height:100vh; width:100%; z-index:1; }

  #ektaGhor {
    position:fixed; bottom:16px; left:12px; right:76px;
    background:rgba(15,23,42,0.92); color:white;
    padding:12px; border-radius:12px; font-family:sans-serif;
    font-size:13px; line-height:1.6; z-index:1000;
  }
  #ektaGhor b { color:#22c55e; }
  #ektaGhor .east { color:#38bdf8; }
  #allowBtn {
    width:100%; padding:12px; background:#22c55e; border:none;
    border-radius:10px; color:white; font-size:17px;
    font-weight:bold; margin-top:8px;
  }
  #myLocBtn {
    position:fixed; bottom:22px; right:14px; width:56px; height:56px;
    background:white; border:none; border-radius:50%;
    box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:1000;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="ektaGhor">
  নর্দিং: <b id="latText">--</b> ° উত্তর<br>
  ইস্টিং: <b id="lngText" class="east">--</b> ° পূর্ব<br>
  একুরেসি: <span id="accText">এখনো চালু হয় নাই</span><br>
  <button id="allowBtn" onclick="amarLocation()">Allow</button>
</div>

<button id="myLocBtn" onclick="amarLocation()">🎯</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map', { zoomControl: false }).setView([23.8103, 90.4125], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  var amarDot = null;
  var amarCircle = null;

  function amarLocation() {
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = Math.round(pos.coords.accuracy);

      document.getElementById('latText').innerText = lat.toFixed(6);
      document.getElementById('lngText').innerText = lng.toFixed(6);
      document.getElementById('accText').innerText = acc + " মিটার • প্রিসাইস চালু";

      if (amarDot) map.removeLayer(amarDot);
      if (amarCircle) map.removeLayer(amarCircle);

      amarCircle = L.circle([lat, lng], { radius: acc, color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:0.15, weight:1 }).addTo(map);
      amarDot = L.circleMarker([lat, lng], { radius:9, color:'white', weight:3, fillColor:'#2563eb', fillOpacity:1 }).addTo(map);
      map.setView([lat, lng], 17);

    }, function() {
      alert("Allow দাও দোস্ত");
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  window.addEventListener('load', function() {
    setTimeout(function() { amarLocation(); }, 600);
  });
</script>

</body>
</html>
