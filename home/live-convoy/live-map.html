<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Map - MT 4 BIR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;overflow:hidden}
#topSearch{position:fixed;top:12px;left:12px;right:12px;z-index:9999;background:#fff;border-radius:30px;display:flex;align-items:center;padding:8px 10px 8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#topSearch input{flex:1;border:none;outline:none;font-size:17px;padding:6px}
#topSearch button{background:#1a73e8;color:#fff;border:none;padding:9px 16px;border-radius:20px;font-weight:700}
#mapFrame{position:fixed;top:0;left:0;width:100%;height:100vh;border:none}
#backBtn{position:fixed;bottom:20px;left:14px;z-index:9999;background:#0f2e2a;color:#ffcc00;padding:10px 16px;border-radius:20px;border:none;font-weight:900}
#myLoc{position:fixed;bottom:20px;right:14px;z-index:9999;background:#fff;width:48px;height:48px;border-radius:50%;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px}
</style>
</head>
<body>

<div id="topSearch">
<input id="searchInput" value="Mohammadpur, Dhaka" placeholder="Search Google Maps">
<button onclick="searchMap()">Search</button>
</div>

<!-- আসল গুগল ম্যাপ -->
<iframe id="mapFrame" src="https://www.google.com/maps?q=Mohammadpur,Dhaka&z=15&output=embed" allowfullscreen></iframe>

<button id="backBtn" onclick="location.href='../index.html'">← Back</button>
<button id="myLoc" onclick="goMyLocation()">📍</button>

<script>
function searchMap(){
  let q = document.getElementById('searchInput').value;
  if(!q) return;
  // আসল গুগল ম্যাপে খুঁজবে
  document.getElementById('mapFrame').src = "https://www.google.com/maps?q=" + encodeURIComponent(q) + "&z=15&output=embed";
}

document.getElementById('searchInput').addEventListener('change', searchMap);

function goMyLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      let lat = pos.coords.latitude;
      let lng = pos.coords.longitude;
      // তোমার লাইভ লোকেশনে আসল গুগল ম্যাপ খুলবে
      document.getElementById('mapFrame').src = "https://www.google.com/maps?q=" + lat + "," + lng + "&z=16&output=embed";
      document.getElementById('searchInput').value = "My Location";
    });
  } else {
    alert("GPS অন করো ভাই");
  }
}
</script>
</body>
</html>
