<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Map - Convoy</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;font-family:sans-serif}
#map{height:100vh;width:100%}
#topBar{position:fixed;top:12px;left:12px;right:12px;background:white;padding:14px;border-radius:14px;z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,0.3)}
#topBar input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;font-size:15px}
#topBar button{width:100%;padding:13px;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:8px;font-size:16px}
#convoyBar{position:fixed;top:185px;left:12px;right:12px;background:white;padding:10px;border-radius:12px;z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,0.25)}
.chip{display:inline-block;background:#dcfce7;color:#166534;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold;margin:3px 2px}
#info{position:fixed;bottom:16px;left:12px;right:12px;background:rgba(15,23,42,0.92);color:white;padding:12px;border-radius:12px;font-size:13px;z-index:1000}
.numIcon{background:#2563eb;color:white;border:2px solid white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
.leadIcon{background:#dc2626;color:white;border:2px solid white;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:bold}
</style>
</head>
<body>
<div id="map"></div>
<div id="topBar">
  <b style="font-size:18px">🚛 কনভয় লাইভ</b>
  <p style="color:#64748b;font-size:13px;margin-top:4px">শুধু তোমার সেনা নং দাও, বাকি সব অটো আসবো</p>
  <input id="groupCode" value="PLATOON-4" readonly style="background:#f1f5f9;color:#64748b">
  <input id="amarSenaNo" placeholder="তোমার সেনা নং দাও - যেমন 4521328" inputmode="numeric">
  <button onclick="joinGroup()">✅ লগইন করে লাইভ দেখো</button>
  <p id="welcome" style="text-align:center;font-weight:bold;color:#16a34a;margin-top:8px"></p>
</div>
<div id="convoyBar"><b>কনভয় - <span id="totalText">0 জন অনলাইন</span></b><div id="chipList"></div></div>
<div id="info">নর্দিং: <b id="latText">--</b> | ইস্টিং: <b id="lngText">--</b><br><span id="statusText">সেনা নং দিয়ে লগইন করো</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBsHN7OzzutZqbYyeHM4e0hzjkI-77gXVc",
  authDomain: "convoy-live-group.firebaseapp.com",
  databaseURL: "https://convoy-live-group-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "convoy-live-group",
  storageBucket: "convoy-live-group.firebasestorage.app",
  messagingSenderId: "705067687114",
  appId: "1:705067687114:web:37468ab2617dd0915b2833"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var map = L.map('map').setView([23.8103,90.4125],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
var markers={}, polylines=[], groupCode="PLATOON-4", amarSenaNo="", membersMap={}, amarInfo=null;

function joinGroup(){
  amarSenaNo=document.getElementById('amarSenaNo').value.trim();
  if(!amarSenaNo){alert("সেনা নং দাও দোস্ত");return;}
  // ১. তুমি অ্যাড আছো কিনা চেক করো - তুমি অ্যাড করছো কিনা
  db.ref('convoy/'+groupCode+'/members/'+amarSenaNo).once('value', function(snap){
    var me = snap.val();
    if(!me){
      alert("তোমার সেনা নং পাই নাই দোস্ত! অ্যাডমিন (জুয়েল) রে কও তোমারে অ্যাড করতে।");
      return;
    }
    amarInfo = me;
    document.getElementById('welcome').innerText = "আসসালামু আলাইকুম, "+me.name+" • #"+me.serial;
    document.getElementById('statusText').innerText = "লগইন হইছে: "+me.name+" | লাইভ চালু...";
    document.getElementById('topBar').style.display='none';
    document.getElementById('convoyBar').style.top='12px';

    // ২. সব মেম্বারদের নাম শোনো - তুমি অ্যাড করছো যাদের
    db.ref('convoy/'+groupCode+'/members').on('value',function(s){ membersMap=s.val()||{}; });

    // ৩. সব গাড়ির লাইভ লোকেশন শোনো - সবাই সবাইরে দেখবো
    db.ref('convoy/'+groupCode+'/locations').on('value', function(snap2){
      var data=snap2.val()||{};
      document.getElementById('totalText').innerText=Object.keys(data).length+" জন অনলাইন";
      var chipDiv=document.getElementById('chipList'); chipDiv.innerHTML="";
      for(var k in markers){ map.removeLayer(markers[k]); } markers={};
      polylines.forEach(function(p){ map.removeLayer(p); }); polylines=[];
      var points=[];
      Object.values(data).forEach(function(u){
        var info = membersMap[u.senaNo] || {};
        var sName = info.name || "সৈনিক";
        var sSerial = info.serial || 99;
        var sGari = info.gari || "";
        points.push([u.lat,u.lng]);
        var chip=document.createElement('span'); chip.className='chip';
        chip.innerText="#"+sSerial+" "+sName+" ●"; chipDiv.appendChild(chip);
        var isMe = (u.senaNo==amarSenaNo);
        var iconHtml='<div class="'+(sSerial==1?'leadIcon':'numIcon')+'" style="'+(isMe?'background:#16a34a;':"")+'">'+sSerial+'</div>';
        var icon=L.divIcon({html:iconHtml,className:'',iconSize:[36,36],iconAnchor:[18,18]});
        var mk=L.marker([u.lat,u.lng],{icon:icon}).addTo(map);
        mk.bindPopup("<b>#"+sSerial+" "+sName+"</b>"+(isMe?" (তুমি)":"")+"<br>সেনা নং: "+u.senaNo+"<br>গাড়ি: "+sGari+"<br>স্পিড: "+u.speed+" km/h<br>আপডেট: "+u.time);
        markers[u.senaNo]=mk;
      });
      if(points.length>1){ var pl=L.polyline(points,{color:'#2563eb',weight:4,dashArray:'8,6'}).addTo(map); polylines.push(pl); }
      // আমার লোকেশনে ম্যাপ ফোকাস
      if(data[amarSenaNo]){ map.setView([data[amarSenaNo].lat, data[amarSenaNo].lng], 15); }
    });
    setInterval(amarLocationPathao, 5000); amarLocationPathao();
  });
}

function amarLocationPathao(){
  if(!amarSenaNo || !amarInfo) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude, lng=pos.coords.longitude;
    var speed=pos.coords.speed?Math.round(pos.coords.speed*3.6):0;
    document.getElementById('latText').innerText=lat.toFixed(6);
    document.getElementById('lngText').innerText=lng.toFixed(6);
    db.ref('convoy/'+groupCode+'/locations/'+amarSenaNo).set({
      senaNo:amarSenaNo, lat:lat, lng:lng, speed:speed, time:new Date().toLocaleTimeString('bn-BD')
    });
  },function(){ alert("লোকেশন Allow দাও দোস্ত, নাইলে দেখা যাইবো না"); },{enableHighAccuracy:true});
}
</script>
</body>
</html>
