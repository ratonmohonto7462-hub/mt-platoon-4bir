<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Map - MT Platoon 4 BIR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#000}
#top{position:absolute;top:0;left:0;right:0;z-index:999;background:#0f2e2a;color:#facc15;padding:10px;text-align:center;font-weight:800}
#map{height:100vh;width:100%}
</style>
</head>
<body>
<div id="top">🛰️ LIVE CONVOY TRACKING - 10 TRUCKS - MT PLATOON 4 BIR</div>
<div id="map"></div>
<script>
var map = L.map('map').setView([23.6, 89.8], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'MT Platoon 4 BIR'}).addTo(map);
var trucks = [
{id:'Truck-01',lat:23.8103,lng:90.4125,speed:'62 km/h'},
{id:'Truck-02',lat:23.6,lng:90.0,speed:'58 km/h'},
{id:'Truck-03',lat:23.3,lng:89.6,speed:'55 km/h'},
{id:'Truck-04',lat:23.0,lng:89.5,speed:'60 km/h'},
{id:'Truck-05',lat:22.8,lng:89.3,speed:'50 km/h'},
{id:'Truck-06',lat:23.9,lng:90.2,speed:'57 km/h'},
{id:'Truck-07',lat:24.2,lng:89.7,speed:'63 km/h'},
{id:'Truck-08',lat:23.1,lng:89.8,speed:'54 km/h'},
{id:'Truck-09',lat:22.9,lng:89.0,speed:'59 km/h'},
{id:'Truck-10',lat:23.7,lng:89.2,speed:'61 km/h'}
];
trucks.forEach(t=>{
var icon = L.divIcon({html:`<div style="background:#22c55e;color:#000;font-weight:900;padding:2px 6px;border-radius:10px;font-size:10px;border:2px solid #fff">🚚 ${t.id}</div>`,iconSize:[70,20]});
L.marker([t.lat,t.lng],{icon:icon}).addTo(map).bindPopup(`<b>${t.id}</b><br>Dhaka → Jessore<br>Speed: ${t.speed}<br><span style="color:green">● LIVE</span>`);
});
</script>
</body>
</html>
