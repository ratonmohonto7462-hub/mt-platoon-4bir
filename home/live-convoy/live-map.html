<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0}#map{height:100vh;width:100%}</style></head><body><div id="map"></div><script>var map=L.map('map').setView([23.81,90.41],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);map.locate({setView:true, maxZoom:16});map.on('locationfound', e=>{L.marker(e.latlng).addTo(map).bindPopup("You Here").openPopup()});</script></body></html>
