<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#000;overflow:hidden}#top{position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f2e2a;color:#facc15;padding:10px;display:flex;justify-content:space-between;font-weight:900}#map{height:100vh;width:100%}</style></head><body><div id="top"><button onclick="location.href='/home/index.html'" style="background:#1a4d3a;color:#ffcc00;border:none;padding:5px 12px;border-radius:15px">← Back</button><span>🛰️ LIVE MAP</span><span>MT 4 BIR</span></div><div id="map"></div><script>var map=L.map('map').setView([23.8103,90.4125],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'MT'}).addTo(map);if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup("You").openPopup();map.setView([p.coords.latitude,p.coords.longitude],15);});}</script></body></html>
