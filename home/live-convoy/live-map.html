<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Convoy Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
  body { background:#0f172a; color:white; }
  #topBar { padding:12px; text-align:center; background:#1e293b; }
  #topBar h2 { font-size:18px; }
  #topBar p { font-size:13px; color:#cbd5e1; margin-top:4px; }
  #mapTap { text-align:center; background:#22c55e; padding:10px; font-weight:bold; font-size:14px; color:white; }
  #map { height:58vh; width:100%; }
  #infoBox { padding:14px; background:#1e293b; margin:10px; border-radius:12px; }
  #infoBox p { font-size:14px; margin:5px 0; }
  #northBox { background:#0f172a; padding:12px; border-radius:10px; margin:8px 0; border-left:4px solid #22c55e; }
  #eastBox { background:#0f172a; padding:12px; border-radius:10px; margin:8px 0; border-left:4px solid #38bdf8; }
  #allowBtn { width:100%; padding:16px; background:#22c55e; border:none; border-radius:12px; color:white; font-size:18px; font-weight:bold; margin-top:10px; }
  #preciseBtn { width:100%; padding:14px; background:#f59e0b; border:none; border-radius:12px; color:black; font-size:16px; font-weight:bold; margin-top:10px; display:none; }
</style>
</head>
<body>

<div id="topBar">
  <h2>🎯 লাইভ কনভয় ম্যাপ</h2>
  <p>ম্যাপে চাপ দাও, Allow দাও, সব চালু হয়ে যাবে</p>
</div>

<div id="mapTap">👆 ম্যাপে চাপ দাও</div>
<div id="map"></div>

<div id="infoBox">
  <p>📍 <b>অবস্থান:</b> <span id="status">এখনো চালু হয় নাই</span></p>

  <!-- নর্দিং লাইন -->
  <div id="northBox">
    <p style="margin:0; font-size:13px; color:#a7f3d0;">⬆️⬇️ নর্দিং লাইন (উত্তর-দক্ষিণ)</p>
    <p style="margin:4px 0 0 0; font-size:18px; font-weight:bold;">ল্যাটিটিউড: <span id="latText" style="color:#22c55e;">--</span> ° উত্তর</p>
  </div>

  <!-- ইস্টিং লাইন -->
  <div id="eastBox">
    <p style="margin:0; font-size:13px; color:#bae6fd;">➡️⬅️ ইস্টিং লাইন (পূর্ব-পশ্চিম)</p>
    <p style="margin:4px 0 0 0; font-size:18px; font-weight:bold;">লংগিটিউড: <span id="lngText" style="color:#38bdf8;">--</span> ° পূর্ব</p>
  </div>

  <p>📡 <b>একুরেসি:</b> <span id="accuracy">--</span></p>
  <p>✅ <b>প্রিসাইস:</b> <span id="precise">চেক করতেছি...</span></p>

  <button id="allowBtn" onclick="allowDao()">📍 Allow দাও - লোকেশন চালু করো</button>
  <button id="preciseBtn" onclick="preciseChaluKoro()">⚙️ Precise চালু করো - এখানে চাপ দাও</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([23.8103, 90.4125], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  var amarMarker = null;

  function allowDao() {
    document.getElementById('status').innerText = "জিপিএস খুঁজতেছি...";

    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = Math.round(pos.coords.accuracy);

      document.getElementById('latText').innerText = lat.toFixed(6);
      document.getElementById('lngText').innerText = lng.toFixed(6);
      document.getElementById('accuracy').innerText = acc + " মিটার";

      if (acc <= 100) {
        document.getElementById('precise').innerText = "চালু - একদম ঠিক";
        document.getElementById('precise').style.color = "#22c55e";
        document.getElementById('status').innerText = "তুমি এখানে আছো!";
        document.getElementById('preciseBtn').style.display = "none";
        document.getElementById('mapTap').innerText = "✅ লোকেশন চালু হয়ে গেছে!";
      } else {
        document.getElementById('precise').innerText = "বন্ধ - ভুল জায়গা দেখাবে";
        document.getElementById('precise').style.color = "#f87171";
        document.getElementById('status').innerText = "প্রিসাইস বন্ধ, ভুল জায়গা দেখাবে";
        document.getElementById('preciseBtn').style.display = "block";
        document.getElementById('mapTap').innerText = "⚠️ নিচে Precise চালু করো বাটনে চাপ দাও";
      }

      if (amarMarker) map.removeLayer(amarMarker);
      amarMarker = L.marker([lat, lng]).addTo(map);
      amarMarker.bindPopup("তুমি এখানে আছো!").openPopup();
      map.setView([lat, lng], 16);

    }, function() {
      alert("দোস্ত, Allow দাও। Allow না দিলে ম্যাপ চলবো না!");
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  function preciseChaluKoro() {
    window.location.href = "intent:#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end";
  }

  map.on('click', function() {
    allowDao();
  });

  window.addEventListener('load', function() {
    setTimeout(function() { allowDao(); }, 800);
  });
</script>

</body>
</html>
