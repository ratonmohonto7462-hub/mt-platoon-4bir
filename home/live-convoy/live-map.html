<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Map - MT 4 BIR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;overflow:hidden}
#mapWrap{position:fixed;top:0;left:0;width:100%;height:100vh;touch-action:none}
#mapFrame{width:100%;height:100%;border:none;touch-action:pan-x pan-y}
#searchBar{position:fixed;top:12px;left:12px;right:12px;z-index:9999;background:#fff;border-radius:30px;display:flex;align-items:center;padding:6px 6px 6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#searchBar input{flex:1;border:none;outline:none;font-size:17px;padding:8px}
#searchBar button{background:#1a73e8;color:#fff;border:none;padding:9px 15px;border-radius:20px;font-weight:700}
#bottomBar{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#fff;border-radius:20px 20px 0 0;padding:14px 16px 18px;box-shadow:0 -2px 15px rgba(0,0,0,.25);display:none}
#placeName{font-size:22px;font-weight:700}
#placeSub{font-size:14px;color:#666;margin-top:2px}
#dirBtns{display:flex;gap:10px;margin-top:12px}
#dirBtns button{flex:1;border:none;padding:12px;border-radius:25px;font-weight:800;font-size:15px}
#goBtn{background:#0b6b6b;color:#fff}
#appBtn{background:#1a73e8;color:#fff;width:100%;margin-top:10px;border:none;padding:12px;border-radius:25px;font-weight:800;font-size:15px}
#backBtn{position:fixed;top:70px;left:14px;z-index:10000;background:#0f2e2a;color:#ffcc00;padding:8px 14px;border-radius:20px;border:none;font-weight:900}
</style>
</head>
<body>

<div id="searchBar">
<input id="searchInput" placeholder="Search here - যেমন: বনানী">
<button onclick="searchPlace()">🔍</button>
</div>

<button id="backBtn" onclick="location.href='../index.html'">← Back</button>

<div id="mapWrap">
<iframe id="mapFrame" src="https://www.google.com/maps?q=Dhaka&z=13&output=embed" allowfullscreen></iframe>
</div>

<div id="bottomBar">
<div id="placeName">বনানী</div>
<div id="placeSub">তোমার লোকেশন থেকে</div>
<div id="dirBtns">
<button id="goBtn" onclick="showRoute()">➡️ Directions</button>
<button onclick="openInApp()">📱 Google Maps App এ খুলো - ১ আঙুলে চলবো</button>
</div>
<button id="appBtn" onclick="openInApp()">📱 অ্যাপে খুললে 2 Finger লাগবো না</button>
</div>

<script>
let myLoc = "Dhaka";
let currentPlace = "";
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
    myLoc = pos.coords.latitude + "," + pos.coords.longitude;
    document.getElementById('mapFrame').src = "https://www.google.com/maps?q=" + myLoc + "&z=15&output=embed";
  });
}
function searchPlace(){
  let q = document.getElementById('searchInput').value;
  if(!q) return;
  currentPlace = q;
  document.getElementById('mapFrame').src = "https://www.google.com/maps?q=" + encodeURIComponent(q) + "&z=14&output=embed";
  document.getElementById('placeName').innerText = q;
  document.getElementById('bottomBar').style.display = 'block';
}
function showRoute(){
  if(!currentPlace) return;
  document.getElementById('mapFrame').src = "https://www.google.com/maps?saddr=" + encodeURIComponent(myLoc) + "&daddr=" + encodeURIComponent(currentPlace) + "&output=embed";
}
function openInApp(){
  if(!currentPlace) currentPlace = document.getElementById('searchInput').value || "Banani";
  // এইটা চাপ দিলে ফোনের আসল গুগল ম্যাপ অ্যাপ খুলবো, ওইখানে ১ আঙুলেই চলে
  window.open("https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(myLoc) + "&destination=" + encodeURIComponent(currentPlace) + "&travelmode=driving");
}
document.getElementById('searchInput').addEventListener('change', searchPlace);
</script>
</body>
</html>
