<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walkie Talkie - MT Platoon 4 BIR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
#top{background:#0f2e2a;color:#facc15;padding:10px;width:100%;text-align:center;font-weight:800;position:fixed;top:0}
#status{margin-top:60px;color:#22c55e;font-weight:700}
#btn{margin-top:30px;width:200px;height:200px;border-radius:50%;background:radial-gradient(#ef4444,#991b1b);border:6px solid #fff;font-size:22px;font-weight:900;color:#fff;box-shadow:0 0 30px #ef444480;cursor:pointer;user-select:none}
#btn:active{background:radial-gradient(#22c55e,#166534);box-shadow:0 0 40px #22c55e}
#users{margin-top:20px;color:#aaa;font-size:13px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="top">📻 MT PLATOON 4 BIR - WALKIE TALKIE</div>
<div id="status">● CONNECTING...</div>
<button id="btn">🔴<br>PUSH TO<br>TALK</button>
<div id="users">10 Trucks Online - Channel: CONVOY-01</div>

<script>
// === 1. Firebase Config (তোরটা দিয়ে Replace করবি পরে, এখন Demo DB দিলাম) ===
const firebaseConfig = {
  databaseURL: "https://mt-platoon-demo-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// === 2. Audio Setup ===
let localStream;
let isTalking = false;
const statusEl = document.getElementById('status');
const btn = document.getElementById('btn');

navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  localStream = stream;
  statusEl.innerText = "● LIVE - READY TO TALK";
  statusEl.style.color = "#22c55e";
}).catch(()=>{
  statusEl.innerText = "● MIC PERMISSION DEN - ALLOW MIC";
  statusEl.style.color = "red";
});

// === 3. Push To Talk Logic ===
btn.addEventListener('touchstart', startTalk);
btn.addEventListener('mousedown', startTalk);
btn.addEventListener('touchend', stopTalk);
btn.addEventListener('mouseup', stopTalk);

function startTalk(e){
  e.preventDefault();
  if(isTalking) return;
  isTalking = true;
  btn.innerHTML = "🟢<br>TALKING...";
  statusEl.innerText = "● BROADCASTING TO 10 TRUCKS...";
  // এখানে Audio Broadcast হবে Firebase দিয়ে
  db.ref('walkie/CONVOY-01/status').set({talking:true,time:Date.now()});
}

function stopTalk(e){
  e.preventDefault();
  isTalking = false;
  btn.innerHTML = "🔴<br>PUSH TO<br>TALK";
  statusEl.innerText = "● LIVE - READY TO TALK";
  db.ref('walkie/CONVOY-01/status').set({talking:false,time:Date.now()});
}

// === 4. Listen Others ===
db.ref('walkie/CONVOY-01/status').on('value', snap=>{
  let data = snap.val();
  if(data && data.talking){
    if(!isTalking){
      statusEl.innerText = "● SOMEONE IS TALKING - LISTEN...";
      statusEl.style.color = "#facc15";
      // Beep sound
      new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
    }
  } else {
    if(!isTalking){
      statusEl.innerText = "● LIVE - READY TO TALK";
      statusEl.style.color = "#22c55e";
    }
  }
});
</script>
</body>
</html>
