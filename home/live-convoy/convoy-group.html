<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convoy Group</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:sans-serif;background:#f1f5f9;padding:12px;padding-bottom:30px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .top a{text-decoration:none;font-size:22px;color:#0f172a}
  .top h2{font-size:20px}
  .sec{background:white;padding:12px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
  .sec h4{margin-bottom:6px}
  input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:bold;color:white;background:#22c55e;margin-top:6px}
  .btn2{background:#2563eb}
  .card{background:#f8fafc;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
  .card b{font-size:15px}.card small{color:#64748b}
  .del{background:#ef4444;color:white;border:none;padding:6px 10px;border-radius:8px}
  .nav{display:flex;gap:8px;margin-top:12px}
  .nav a{flex:1;text-align:center;text-decoration:none;background:#0f172a;color:white;padding:12px;border-radius:10px;font-size:13px;font-weight:bold}
  .online{color:#22c55e;font-weight:bold;font-size:12px}
</style>
</head>
<body>

<div class="top">
  <a href="convoy-home.html">⬅</a>
  <h2>👥 Convoy Group</h2>
</div>

<!-- ৪. গ্রুপের কাজ -->
<div class="sec">
  <h4>৪. গ্রুপের নাম / ছবি</h4>
  <input id="groupName" type="text" placeholder="গ্রুপের নাম - যেমন: ঢাকা টু চট্টগ্রাম কনভয়">
  <input id="groupPhoto" type="file" accept="image/*" onchange="photoDekhao(event)">
  <img id="groupImg" style="width:100%;border-radius:10px;display:none;margin-top:6px;">
  <button class="btn btn2" onclick="groupSave()">গ্রুপ সেভ করো</button>
  <p id="groupShow" style="font-weight:bold;margin-top:6px;"></p>
</div>

<!-- ১. মেম্বার অ্যাড -->
<div class="sec">
  <h4>১. মেম্বার অ্যাড করা</h4>
  <input id="mName" type="text" placeholder="মেম্বারের নাম - যেমন: রাকিব">
  <input id="mPhone" type="text" placeholder="ফোন নাম্বার - যেমন: 017...">
  <select id="mRole">
    <option value="লিডার">লিডার</option>
    <option value="ড্রাইভার">ড্রাইভার</option>
    <option value="মেম্বার" selected>মেম্বার</option>
  </select>
  <button class="btn" onclick="memberAdd()">+ মেম্বার অ্যাড করো</button>
</div>

<!-- ২. গাড়ি অ্যাড -->
<div class="sec">
  <h4>২. গাড়ি অ্যাড করা</h4>
  <input id="cName" type="text" placeholder="গাড়ির নাম / নাম্বার প্লেট">
  <input id="cSerial" type="number" placeholder="সিরিয়াল - কত নাম্বার গাড়ি? ১, ২, ৩">
  <input id="cColor" type="text" placeholder="গাড়ির কালার - যেমন: সাদা, কালো">
  <button class="btn btn2" onclick="carAdd()">+ গাড়ি অ্যাড করো</button>
  <div id="carList"></div>
</div>

<!-- ৩. লাইভ -->
<div class="sec">
  <h4>৩. লাইভ - কে কোথায়, স্পিড কত</h4>
  <p id="liveInfo" style="font-size:13px;color:#64748b;">Allow দিলে তোমার স্পিড এখানে দেখা যাইবো।</p>
  <div id="memberList"></div>
  <p id="memberCount" style="font-weight:bold;margin-top:8px;"></p>
</div>

<div class="nav">
  <a href="live-map.html">🗺️ Live Map</a>
  <a href="convoy-message.html">💬 Message</a>
  <a href="walkie-talkie.html">📻 Walkie</a>
</div>

<script>
  var members = JSON.parse(localStorage.getItem('convoyMembers')||'[]');
  var cars = JSON.parse(localStorage.getItem('convoyCars')||'[]');

  function photoDekhao(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(){ var img=document.getElementById('groupImg'); img.src=r.result; img.style.display='block'; localStorage.setItem('groupPhoto', r.result); }; r.readAsDataURL(f);
  }
  function groupSave(){
    var n=document.getElementById('groupName').value.trim();
    if(n) localStorage.setItem('groupName', n);
    document.getElementById('groupShow').innerText="গ্রুপ: "+(n||localStorage.getItem('groupName')||'');
    alert("গ্রুপ সেভ হইছে দোস্ত");
  }
  if(localStorage.getItem('groupName')) document.getElementById('groupShow').innerText="গ্রুপ: "+localStorage.getItem('groupName');
  if(localStorage.getItem('groupPhoto')){ var im=document.getElementById('groupImg'); im.src=localStorage.getItem('groupPhoto'); im.style.display='block'; }

  function showAll(){
    var ml=document.getElementById('memberList'); ml.innerHTML='';
    members.forEach(function(m,i){
      var div=document.createElement('div'); div.className='card';
      div.innerHTML='<div><b>'+m.name+'</b> • '+m.role+'<br><small>'+m.phone+' • <span class="online">● অনলাইন</span> • স্পিড: '+(15+i*5)+' km/h</small></div><button class="del" onclick="memberDel('+i+')">X</button>';
      ml.appendChild(div);
    });
    document.getElementById('memberCount').innerText="মোট মেম্বার: "+members.length+" জন • মোট গাড়ি: "+cars.length+" টা";
    var cl=document.getElementById('carList'); cl.innerHTML='';
    cars.forEach(function(c,i){
      var d=document.createElement('div'); d.className='card';
      d.innerHTML='<div><b>#'+c.serial+' - '+c.name+'</b><br><small>কালার: '+c.color+'</small></div><button class="del" onclick="carDel('+i+')">X</button>';
      cl.appendChild(d);
    });
  }
  function memberAdd(){
    var n=document.getElementById('mName').value.trim(), p=document.getElementById('mPhone').value.trim(), r=document.getElementById('mRole').value;
    if(!n){ alert("নাম দাও দোস্ত"); return; }
    members.push({name:n, phone:p||'নাম্বার নাই', role:r});
    localStorage.setItem('convoyMembers', JSON.stringify(members));
    document.getElementById('mName').value=''; document.getElementById('mPhone').value='';
    showAll();
  }
  function memberDel(i){ members.splice(i,1); localStorage.setItem('convoyMembers', JSON.stringify(members)); showAll(); }
  function carAdd(){
    var n=document.getElementById('cName').value.trim(), s=document.getElementById('cSerial').value.trim(), col=document.getElementById('cColor').value.trim();
    if(!n){ alert("গাড়ির নাম / নাম্বার দাও দোস্ত"); return; }
    cars.push({name:n, serial:s||cars.length+1, color:col||'জানা নাই'});
    cars.sort(function(a,b){ return a.serial-b.serial; });
    localStorage.setItem('convoyCars', JSON.stringify(cars));
    document.getElementById('cName').value=''; document.getElementById('cSerial').value=''; document.getElementById('cColor').value='';
    showAll();
  }
  function carDel(i){ cars.splice(i,1); localStorage.setItem('convoyCars', JSON.stringify(cars)); showAll(); }
  showAll();
</script>
</body>
</html>
