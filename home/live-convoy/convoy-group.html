<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Convoy Group Live Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui} body{background:#0f172a;color:#fff;padding-bottom:70px} h1{font-size:15px;padding:10px;background:#162040} #map{height:65vh;width:100%} #list{padding:8px;max-height:30vh;overflow:auto} .row{background:#162040;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:12px} .row b{color:#38bdf8} .nav{position:fixed;bottom:0;left:0;right:0;background:#0b1226;display:flex;justify-content:space-around;padding:10px 0;z-index:9999} .nav a{font-size:11px;color:#94a3b8;text-align:center;text-decoration:none} .nav a.mid{background:#3b82f6;color:#fff;padding:8px 16px;border-radius:20px;margin-top:-15px;font-weight:800}</style></head><body>

trucks.forEach((pos,i)=>{

 l.innerHTML+=`<div class="row"><div><b>Truck-${String(i+1).padStart(2,'0')}</b><br><small>Dhaka → Jessore</small></div><div style="text-align:right;color:#22c55e">● Live<br><small>${50+Math.floor(Math.random()*15)} km/h</small></div></div>`;
