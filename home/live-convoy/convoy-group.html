<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>কনভয় গ্রুপ - ঢাকা টু ঘাটাইল</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f1f5f9;padding:12px}
.card{background:white;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}
.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}
.member{background:#f8fafc;padding:12px;border-radius:12px;margin-top:10px;position:relative}
.member b{font-size:18px}.del{position:absolute;right:10px;top:10px;background:#dc2626;color:white;border:none;width:36px;height:36px;border-radius:8px;font-size:18px}
.online{color:#16a34a;font-weight:bold}
</style>
</head>
<body>
<a href="index.html">←</a>
<b style="font-size:22px">👥 কনভয় গ্রুপ</b>

<div class="card">
<b>গ্রুপের নাম / ছবি</b>
<input id="groupName" placeholder="গ্রুপের নাম - যেমন: ঢাকা টু ঘাটাইল" value="ঢাকা টু ঘাটাইল">
<input id="groupCode" value="PLATOON-4" placeholder="গ্রুপ কোড - PLATOON-4">
<button class="blue" onclick="saveGroup()">গ্রুপ সেভ করো</button>
<p style="margin-top:8px">গ্রুপ: <b id="groupShow">ঢাকা টু ঘাটাইল</b> | কোড: <b>PLATOON-4</b></p>
</div>

<div class="card">
<b>১. মেম্বার + গাড়ি একসাথে অ্যাড করো</b>
<p style="margin-top:6px;color:#2563eb;font-weight:bold">👤 সদস্যের তথ্য</p>
<input id="senaNo" placeholder="সেনা নং - যেমন: ১২৩৪৫৬৭">
<select id="podobi"><option>পদবি বাছো</option><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option><option>ওয়ারেন্ট অফিসার</option><option>লেফটেন্যান্ট</option><option>ক্যাপ্টেন</option></select>
<input id="nam" placeholder="নাম - যেমন: রতন">
<input id="baNo" placeholder="বি এ নং - যেমন: BA-১২৩৪৫">
<input id="mobile" placeholder="মোবাইল নম্বর - যেমন: ০১৭৩৭৯১২০৯৪">
<p style="margin-top:10px;color:#b45309;font-weight:bold">🚛 গাড়ির তথ্য</p>
<select id="gariProkar"><option>গাড়ির প্রকার বাছো</option><option>পিকআপ</option><option>ট্রাক</option><option>জিপ</option><option>বাস</option><option>অ্যাম্বুলেন্স</option></select>
<input id="serial" type="number" placeholder="সিরিয়াল নং - কত নাম্বার গাড়ি? ১, ২, ৩">
<textarea id="montobbo" placeholder="মন্তব্য - যেমন: সামনে থাকবো, পানি আছে"></textarea>
<button class="green" onclick="addMember()">+ মেম্বার + গাড়ি অ্যাড করো</button>
</div>

<div class="card">
<b>২. লাইভ - কে কোথায়, স্পিড কত</b>
<p style="color:#64748b;margin-top:4px">Allow দিলে তোমার স্পিড এখানে দেখা যাইবো।</p>
<div id="list"></div>
</div>

<a href="live-map.html"><button class="blue">🗺️ লাইভ ম্যাপ দেখো - সবাই সবারটা</button></a>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
// ===== তোমার Firebase =====
var firebaseConfig = { apiKey: "AIzaSyBsHN7OzzutZqbYyeHM4e0hzjkI-77gXVc", authDomain: "convoy-live-group.firebaseapp.com", databaseURL: "https://convoy-live-group-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "convoy-live-group", storageBucket: "convoy-live-group.firebasestorage.app", messagingSenderId: "705067687114", appId: "1:705067687114:web:6c0687162a3604cc5b2833" };
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
// ===========================
var GROUP_CODE = "PLATOON-4";
var WALKIE_CONVOY = "CONVOY-01";

function saveGroup(){
GROUP_CODE = document.getElementById('groupCode').value.trim().toUpperCase() || "PLATOON-4";
document.getElementById('groupShow').innerText = document.getElementById('groupName').value;
alert("গ্রুপ সেভ হইছে! কোড: "+GROUP_CODE);
loadMembers();
}

function addMember(){
var senaNo = document.getElementById('senaNo').value.trim();
var podobi = document.getElementById('podobi').value;
var nam = document.getElementById('nam').value.trim();
var baNo = document.getElementById('baNo').value.trim();
var mobile = document.getElementById('mobile').value.trim();
var gari = document.getElementById('gariProkar').value;
var serial = document.getElementById('serial').value.trim();
var montobbo = document.getElementById('montobbo').value.trim();
if(!senaNo || !nam || !serial){ alert("সেনা নং, নাম, সিরিয়াল দাও দোস্ত"); return; }

// ১. কনভয় গ্রুপে সেভ - লাইভ ম্যাপ এইখান থেকে নাম নিবো
db.ref('convoy/'+GROUP_CODE+'/members/'+senaNo).set({
senaNo: senaNo,
podobi: podobi,
name: podobi+" "+nam,
fullName: nam,
baNo: baNo,
mobile: mobile,
gari: gari,
serial: parseInt(serial),
montobbo: montobbo
}).then(function(){
// ২. FIX - ওয়াকিটকির CONVOY-01 এও Add করে দাও, নাইলে ওয়াকিটকিতে ঢুকতে পারবে না
return db.ref('walkie/'+WALKIE_CONVOY+'/'+senaNo).set({army: senaNo, online: true, name: nam});
}).then(function(){
alert("হইছে! "+nam+" অ্যাড হইছে, এখন লাইভ ম্যাপেও + CONVOY ওয়াকিটকিতেও ঢুকতে পারবে");
document.getElementById('senaNo').value="";
document.getElementById('nam').value="";
document.getElementById('serial').value="";
document.getElementById('baNo').value="";
document.getElementById('mobile').value="";
document.getElementById('montobbo').value="";
}).catch(function(err){ alert("ভুল হইছে: "+err.message); });
}

function loadMembers(){
db.ref('convoy/'+GROUP_CODE+'/members').on('value', function(snap){
var members = snap.val() || {};
var locRef = db.ref('convoy/'+GROUP_CODE+'/locations');
locRef.once('value', function(lsnap){
var locs = lsnap.val() || {};
var html = "";
Object.values(members).sort(function(a,b){return a.serial-b.serial}).forEach(function(m){
var loc = locs[m.senaNo];
var speed = loc ? loc.speed : 0;
var online = loc ? "● অনলাইন" : "○ অফলাইন";
html += '<div class="member"><button class="del" onclick="delMember(\''+m.senaNo+'\')">X</button>' +
'<b>'+m.name+' • #'+m.serial+'</b><br>' +
'সেনা নং: '+m.senaNo+'<br>বি এ নং: '+m.baNo+'<br>গাড়ির প্রকার: '+m.gari+'<br>মোবাইল: '+m.mobile+'<br>মন্তব্য: '+m.montobbo+'<br>' +
'<span class="online">'+online+' • স্পিড: '+speed+' km/h</span></div>';
});
document.getElementById('list').innerHTML = html || "এখনো কেউ অ্যাড হয় নাই";
});
});
}

function delMember(senaNo){
if(confirm("ডিলিট করবো?")){
// দুই জায়গা থেকেই ডিলিট
db.ref('convoy/'+GROUP_CODE+'/members/'+senaNo).remove();
db.ref('walkie/'+WALKIE_CONVOY+'/'+senaNo).remove();
db.ref('convoy/'+GROUP_CODE+'/locations/'+senaNo).remove();
}
}
loadMembers();
</script>
</body>
</html>
