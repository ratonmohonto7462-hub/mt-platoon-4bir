<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9;padding-bottom:85px}
.header{background:#0f2e2a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.header b{letter-spacing:1px}
.r{background:#facc15;color:#000;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.call-bar{background:#1a5c4a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}

.img-box img{width:100%;height:100%;object-fit:cover}
.add{position:absolute;top:10px;right:10px;background:#facc15;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.convoy-btns{padding:12px;display:grid;gap:8px;background:#fff}
.convoy-btns button{padding:12px;border:none;border-radius:10px;font-weight:700;color:#fff;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1a2f;display:flex;justify-content:space-around;align-items:center;padding:10px 0;border-top:1px solid #1e3a3a;z-index:999}
.nav div{text-align:center;font-size:11px;color:#94a3b8;cursor:pointer;line-height:1.2}
.nav div.mid{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:20px;margin-top:-20px;font-weight:800;box-shadow:0 4px 12px #3b82f680}

</head>
<body>
<div class="header"><b>⋮ MT PLATOON</b><div class="r">R</div></div>

</div>

<div class="mid" onclick="window.location.href='https://mtplatoon4bir.xyz/home/live-convoy/convoy-group.html'">🛰️<br>Live Convoy Tracking</div>
