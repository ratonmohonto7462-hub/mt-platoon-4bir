<script>
 // === ROLE SYSTEM - এই 5 লাইন শুরুতে বসাও ===
 const urlRole = new URLSearchParams(location.search).get('role');
 if(urlRole) localStorage.setItem('role', urlRole);
 const ROLE = (localStorage.getItem('role') || 'mt_clk').toLowerCase();
 const IS_COMMAND_VIEW = ROLE.includes('command') || ROLE.includes('cmd') || ROLE.includes('co') || ROLE.includes('dsto') || ROLE.includes('officer_view');
 const CAN_EDIT = !IS_COMMAND_VIEW;

 function applyRole(){
   document.getElementById('roleShow').innerText = IS_COMMAND_VIEW ? '👁️ VIEW - COMMAND' : '✏️ EDIT - MT CLK';
   document.getElementById('addBtn').style.display = CAN_EDIT ? 'block' : 'none';
 }

 function armyNoVal(s){if(!s)return 999999999;let m=String(s).match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
 let data=[];
 async function loadFromSheet(){ ... } // তোমার আগের function Same থাকবে

 function render(){ 
   data.sort((a,b)=>armyNoVal(a.ba)-armyNoVal(b.ba)); 
   // ...
   // Edit/Del Button এ Role Check
   let editDelHtml = CAN_EDIT ? `<div class="btnRow"><button class="editBtn" onclick="openEdit(${o.row})">✏️ Edit</button><button class="delBtn" onclick="del(${o.row})">🗑️ Del</button></div>` : '';
   
   html+=`<div class="card">...<div class="btns">${editDelHtml}<div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div></div>`;
 }
 // load এর পরে applyRole() call করো
 loadFromSheet().then(()=>{ applyRole(); });
</script>
