<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officer Contact - 4 BIR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px;border:1px solid #1a2a40;position:relative}
.top{padding:14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#d4b56a;font-size:16px;display:block}.top small{color:#8a9bb5;font-size:10px}
.back{font-size:28px;color:#d4b56a;background:none;border:none}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #c8a951;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:12px}
.addBtn{margin:0 14px 10px 14px;width:calc(100% - 28px);padding:12px;background:#132a18;border:1px solid #c8a951;color:#c8a951;border-radius:12px;font-weight:900}
.stats{background:#111a2d;border:1px solid #1e2f4a;border-radius:12px;margin:8px 14px;padding:8px 12px;font-size:11px}.stats b{color:#d4b56a}
.card{background:#111a2d;border-left:4px solid #d4b56a;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #2a3a5a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#d4b56a}
.rankBadge{width:52px;height:60px;background:linear-gradient(#d4b56a,#8a6a2a);border-radius:0 0 50% 50%;display:flex;align-items:center;justify-content:center;float:left;margin:10px 12px;font-weight:900;font-size:9px;color:#1a1a0a;text-align:center}
.cardHead{padding:12px 12px 0 0;display:flex;justify-content:space-between}.cardHead h3{margin:0;font-size:14px}.cardHead h3 small{color:#d4b56a;font-size:11px;display:block}
.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}
.btns{display:flex;gap:8px;padding:0 12px 12px 12px}.callBtn{flex:1;background:#0f172a;border:1px solid #d4b56a;color:#d4b56a;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.editBtn{flex:1;background:#1a3d22;border:1px solid #c8a951;color:#c8a951;border-radius:8px;padding:9px;font-weight:900}.delBtn{flex:1;background:#4a0a0a;border:1px solid #ff4444;color:#ff6666;border-radius:8px;padding:9px;font-weight:900}.viewOnly{flex:1;background:#0a0a0a;border:1px solid #1e2f4a;color:#6b7a90;padding:9px;border-radius:8px;text-align:center;font-size:11px}
#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f172a;border:1px solid #c8a951;border-radius:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}#formBox h3{margin:0;padding:12px;background:#122e18;color:#c8a951;text-align:center;font-size:14px}.formInner{padding:12px}.formInner label{font-size:11px;color:#c8a951;font-weight:900;display:block;margin:8px 0 3px 0}.formInner input{width:100%;padding:9px;border-radius:8px;border:1px solid #1e2f4a;background:#111a2d;color:#fff}.formBtns{display:flex;gap:8px;margin-top:12px}.saveBtn{flex:1;background:#c8a951;color:#000;border:none;padding:10px;border-radius:8px;font-weight:900}.cancelBtn{flex:1;background:#1e2f4a;color:#fff;border:none;padding:10px;border-radius:8px}
</style></head><body>
<div class="phone">
<div class="top"><button class="back" onclick="location.href='contact.html'">‹</button><div><b>OFFICER CONTACT LIST</b><small>🛡️ BANGLADESH ARMY • 4 BIR</small></div><button onclick="location.href='dashboard.html'" style="background:#1a3d22;border:1px solid #c8a951;color:#c8a951;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:900">BACK</button></div>
<div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search name, rank, BA No..." oninput="render()"></div></div>
<button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD NEW OFFICER</button>
<div class="stats"><b>Total:</b> <span id="total">0</span> • <span id="roleShow"></span></div>
<div id="list"></div>
</div>

<div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3 id="ftitle">Add Officer</h3><div class="formInner">
<label>Rank (MAJOR/CAPTAIN/LT)</label><input id="f_rank">
<label>Name</label><input id="f_name">
<label>BA No</label><input id="f_ba">
<label>Batch</label><input id="f_batch">
<label>Mobile</label><input id="f_mob">
<label>Remarks</label><input id="f_rem">
<div class="formBtns"><button class="cancelBtn" onclick="closeForm()">Cancel</button><button class="saveBtn" onclick="saveForm()">✅ Save</button></div>
</div></div></div>

<script>
let role=(localStorage.getItem('role')||'').toLowerCase();
let isClk=role.includes('clk');
let isCommand=role.includes('command')||role.includes('co')||role.includes('cmd')||role.includes('officer')||!isClk;
document.getElementById('roleShow').innerText=isClk?'MT CLK - Full Access':'COMMAND - View Only';
document.getElementById('addBtn').style.display=isClk?'block':'none';

function load(){let d=localStorage.getItem('officers_4bir');if(d){try{return JSON.parse(d)}catch(e){}}return[
{rank:"MAJOR",name:"MAJ. RAHMAN AHMED",ba:"BA-12847",batch:"BMA — 74TH BMA (2014)",mobile:"01712-345678",remarks:"Company Commander — Alpha Coy"},
{rank:"CAPTAIN",name:"CAPT. SANJIDA HAQUE",ba:"BA-13592",batch:"BMA — 79TH BMA (2019)",mobile:"01811-998877",remarks:"Signals Officer"},
{rank:"LIEUTENANT",name:"LT. TANVIR KHAN",ba:"BA-14203",batch:"BMA — 82ND BMA (2022)",mobile:"01913-225544",remarks:"Platoon Commander"}
];}
let officers=load();
function save(){localStorage.setItem('officers_4bir',JSON.stringify(officers));}
let editIdx=-1;
function openAdd(){if(!isClk){alert('⛔ শুধু MT CLK Add করতে পারবে');return}editIdx=-1;document.getElementById('ftitle').innerText='Add Officer';document.getElementById('f_rank').value='';document.getElementById('f_name').value='';document.getElementById('f_ba').value='';document.getElementById('f_batch').value='';document.getElementById('f_mob').value='';document.getElementById('f_rem').value='';document.getElementById('formModal').style.display='flex'}
function openEdit(i){if(!isClk){alert('⛔ Permission নেই');return}editIdx=i;let o=officers[i];document.getElementById('ftitle').innerText='Edit Officer';document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_ba').value=o.ba;document.getElementById('f_batch').value=o.batch;document.getElementById('f_mob').value=o.mobile;document.getElementById('f_rem').value=o.remarks;document.getElementById('formModal').style.display='flex'}
function closeForm(){document.getElementById('formModal').style.display='none'}
function saveForm(){if(!isClk)return;let o={rank:document.getElementById('f_rank').value.trim()||'OFFICER',name:document.getElementById('f_name').value.trim(),ba:document.getElementById('f_ba').value.trim(),batch:document.getElementById('f_batch').value.trim(),mobile:document.getElementById('f_mob').value.trim(),remarks:document.getElementById('f_rem').value.trim()};if(!o.name||!o.mobile){alert('Name & Mobile দাও');return}if(editIdx==-1)officers.push(o);else officers[editIdx]=o;save();closeForm();render()}
function del(i){if(!isClk){alert('Permission নেই');return}if(confirm('Delete?')){officers.splice(i,1);save();render()}}

function render(){
let q=document.getElementById('s').value.toLowerCase();
document.getElementById('total').innerText=officers.length;
let html='';
officers.forEach((o,idx)=>{
if(q && !(o.name+o.rank+o.ba+o.mobile).toLowerCase().includes(q)) return;
let btns=isClk?`<div class="btns"><button class="editBtn" onclick="openEdit(${idx})">✏️ Edit</button><button class="delBtn" onclick="del(${idx})">🗑️ Delete</button><a class="callBtn" href="tel:${o.mobile.replace(/\s/g,'')}">📞</a></div>`:`<div class="btns"><div class="viewOnly">👁️ View Only - COMMAND</div><a class="callBtn" href="tel:${o.mobile.replace(/\s/g,'')}">📞 Call</a><a class="callBtn" href="https://wa.me/${o.mobile.replace(/\D/g,'')}">💬 WA</a></div>`;
html+=`<div class="card"><div class="cardHead"><div style="display:flex"><div class="rankBadge">${o.rank.substring(0,4)}</div><h3><small>${o.rank}</small>${o.name}</h3></div></div><div class="details"><div><span class="label">BA No:</span></div><div><span class="label">BATCH:</span></div><div><span class="val">${o.ba}</span></div><div><span class="val" style="font-size:10px">${o.batch}</span></div><div class="full"><span class="label">MOBILE:</span> <span class="val" style="color:#d4b56a">${o.mobile}</span></div><div class="full"><span class="label">REMARKS:</span> <span class="val">${o.remarks}</span></div></div>${btns}</div>`;
});
document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center;color:#6b7a90">No data</div>';
}
render();
</script></body></html>
