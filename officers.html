<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officers - 4 BIR</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px;border:1px solid #1a2a40}.top{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#d4b56a;font-size:15px;display:block}.top small{color:#8a9bb5;font-size:10px}.back{font-size:28px;color:#d4b56a;background:none;border:none}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #c8a951;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:12px}.addBtn{margin:0 14px 10px;width:calc(100% - 28px);padding:12px;background:#132a18;border:1px solid #c8a951;color:#c8a951;border-radius:12px;font-weight:900}.stats{background:#111a2d;border:1px solid #1e2f4a;border-radius:12px;margin:8px 14px;padding:8px 12px;font-size:11px}.stats b{color:#d4b56a}.card{background:#111a2d;border-left:4px solid #d4b56a;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #2a3a5a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#d4b56a}.rankBadge{width:52px;height:60px;background:linear-gradient(#d4b56a,#8a6a2a);border-radius:0 0 50% 50%;float:left;margin:10px 12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:8px;color:#000;text-align:center;line-height:1}.cardHead{padding:12px 12px 0 0}.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.btnRow{display:flex;gap:8px}.callBtn{flex:1;background:#0f172a;border:1px solid #c8a951;color:#c8a951;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.waBtn{flex:1;background:#0a1a0a;border:1px solid #25D366;color:#25D366;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.editBtn{flex:1;background:#1a3d22;border:1px solid #c8a951;color:#c8a951;border-radius:8px;padding:9px;font-weight:900;font-size:12px}.delBtn{flex:1;background:#4a0a0a;border:1px solid #ff4444;color:#ff6666;border-radius:8px;padding:9px;font-weight:900;font-size:12px}#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f172a;border:1px solid #c8a951;border-radius:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}#formBox h3{margin:0;padding:12px;background:#122e18;color:#c8a951;text-align:center;font-size:14px}.formInner{padding:12px}.formInner label{font-size:11px;color:#c8a951;font-weight:900;display:block;margin:8px 0 3px 0}.formInner input{width:100%;padding:9px;border-radius:8px;border:1px solid #1e2f4a;background:#111a2d;color:#fff}</style></head><body>
<div class="phone"><div class="top"><button class="back" onclick="location.href='contact.html'">‹</button><div><b>OFFICER LIST - Seniority Wise</b><small>🛡️ BA No অনুযায়ী Auto Sort • 4 BIR</small></div></div>
<div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search..." oninput="render()"></div></div>
<button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD OFFICER</button>
<div class="stats"><b>Total:</b> <span id="total">0</span> • <span id="roleShow"></span></div><div id="list"></div></div>
<div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3 id="ftitle">Add Officer</h3><div class="formInner"><label>Rank</label><input id="f_rank"><label>Name</label><input id="f_name"><label>BA No</label><input id="f_ba"><label>Batch</label><input id="f_batch"><label>Mobile</label><input id="f_mob"><label>Remarks</label><input id="f_rem"><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeForm()" style="flex:1;padding:10px;border-radius:8px;background:#1e2f4a;color:#fff;border:none">Cancel</button><button onclick="saveForm()" style="flex:1;padding:10px;border-radius:8px;background:#c8a951;color:#000;font-weight:900;border:none">Save</button></div></div></div></div>
<script>
let role=(localStorage.getItem('role')||'').toLowerCase();let isClk=role.includes('clk');document.getElementById('roleShow')?document.getElementById('roleShow').innerText=isClk?'MT CLK':'COMMAND':null;document.getElementById('addBtn').style.display=isClk?'block':'none';
function armyNoVal(s){if(!s)return 999999999;let m=s.match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
function load(){let d=localStorage.getItem('officers_4bir');if(d){try{return JSON.parse(d)}catch(e){}}return[{rank:"MAJOR",name:"MAJ. RAHMAN AHMED",ba:"BA-12847",batch:"74TH BMA",mobile:"01712-345678",remarks:"Alpha Coy"},{rank:"CAPTAIN",name:"CAPT. SANJIDA HAQUE",ba:"BA-13592",batch:"79TH BMA",mobile:"01811-998877",remarks:"Signals"},{rank:"LIEUTENANT",name:"LT. TANVIR KHAN",ba:"BA-14203",batch:"82ND BMA",mobile:"01913-225544",remarks:"Platoon"}];}
let data=load();function save(){localStorage.setItem('officers_4bir',JSON.stringify(data));}
let editIdx=-1;function openAdd(){editIdx=-1;['f_rank','f_name','f_ba','f_batch','f_mob','f_rem'].forEach(id=>document.getElementById(id).value='');document.getElementById('formModal').style.display='flex'}
function openEdit(i){editIdx=i;let o=data[i];document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_ba').value=o.ba;document.getElementById('f_batch').value=o.batch;document.getElementById('f_mob').value=o.mobile;document.getElementById('f_rem').value=o.remarks;document.getElementById('formModal').style.display='flex'}
function closeForm(){document.getElementById('formModal').style.display='none'}
function saveForm(){let o={rank:document.getElementById('f_rank').value.trim(),name:document.getElementById('f_name').value.trim(),ba:document.getElementById('f_ba').value.trim(),batch:document.getElementById('f_batch').value.trim(),mobile:document.getElementById('f_mob').value.trim(),remarks:document.getElementById('f_rem').value.trim()};if(!o.name||!o.mobile)return;if(editIdx==-1)data.push(o);else data[editIdx]=o;save();closeForm();render()}
function del(i){if(confirm('Delete?')){data.splice(i,1);save();render()}}
function render(){data.sort((a,b)=>armyNoVal(a.ba)-armyNoVal(b.ba));save();let q=document.getElementById('s').value.toLowerCase();document.getElementById('total').innerText=data.length;let html='';data.forEach((o,idx)=>{if(q&&!(o.name+o.ba+o.mobile).toLowerCase().includes(q))return;let wa=o.mobile.replace(/\D/g,'');let btns=isClk?`<div class="btns"><div class="btnRow"><button class="editBtn" onclick="openEdit(${idx})">✏️ Edit</button><button class="delBtn" onclick="del(${idx})">🗑️ Del</button></div><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`:`<div class="btns"><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`;html+=`<div class="card"><div class="cardHead"><div style="display:flex"><div class="rankBadge">${o.rank.slice(0,4)}</div><div><b style="font-size:13px">${o.rank} ${o.name}</b><br><small style="color:#c8a951">${o.ba} • Senior #${idx+1}</small></div></div></div><div class="details"><div><span class="label">BA No:</span></div><div><span class="label">Batch:</span></div><div><span class="val" style="color:#c8a951">${o.ba}</span></div><div><span class="val">${o.batch}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile}</span></div></div>${btns}</div>`});document.getElementById('list').innerHTML=html;}
render();
</script></body></html>
