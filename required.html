<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Required Mobile Number</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#1a3a1a,#2d5a27,#4a7c43);min-height:100vh}
.header{background:#122e1d;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
.back{background:#7d0000;color:white;border:none;padding:6px 14px;border-radius:8px;font-weight:900;cursor:pointer}

/* এক লাইনে - জুম কমানো */
.form{display:flex;gap:6px;padding:8px;flex-wrap:nowrap;overflow-x:auto}
.form input{
 flex:1; min-width:70px;
 padding:10px 8px; border-radius:10px; border:none;
 font-size:13px; font-weight:700;
 background:#fffffff2; box-shadow:0 2px 6px #0002;
 white-space:nowrap;
}
.addBtn{
 min-width:85px; padding:10px 12px;
 background:#122e1d; color:white; border:none; border-radius:10px;
 font-weight:900; font-size:13px; cursor:pointer; white-space:nowrap;
}

.title{text-align:center;margin:10px 0 6px 0;font-weight:900;color:white;font-size:16px}
.printBtn{display:block;margin:0 auto 10px auto;background:#2d5a27;color:white;border:none;padding:7px 16px;border-radius:10px;font-weight:900;font-size:13px}

table{width:98%;margin:0 auto 15px auto;border-collapse:collapse;background:#f5f7f5ef;border-radius:12px;overflow:hidden;font-size:12px}
th{background:#122e1d;color:white;padding:8px 4px;font-size:12px}
td{padding:7px 4px;border:1px solid #ccc;text-align:center;font-weight:600}
.edit{background:#ffaa00;color:white;border:none;padding:4px 7px;border-radius:6px;font-weight:900;font-size:11px}
.del{background:#7d0000;color:white;border:none;padding:4px 7px;border-radius:6px;font-weight:900;font-size:11px}

/* প্রিন্টে ওপরের ঘর হাইড */
@media print{
 .header, .form, .printBtn, .back{display:none !important}
 body{background:white !important}
 .title{color:black !important; text-shadow:none !important}
 table{width:100% !important; background:white !important; box-shadow:none !important; font-size:14px}
 th{background:#000 !important; color:white !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style></head><body>

<div class="header"><b>REQUIRED MOBILE NUMBER</b><button class="back" onclick="location.href='dashboard.html'">BACK</button></div>

<div class="form">
<input id="podobi" placeholder="পদবী">
<input id="name" placeholder="নাম">
<input id="niyojito" placeholder="নিয়োজিত">
<input id="mobile" placeholder="মোবাইল নম্বর" type="tel">
<input id="montobbo" placeholder="মন্তব্য">
<button class="addBtn" onclick="addData()">Add করুন</button>
</div>

<div class="title">REQUIRED MOBILE NUMBER</div>
<button class="printBtn" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

<table><thead><tr><th>ক্র/নং</th><th>পদবী</th><th>নাম</th><th>নিয়োজিত</th><th>মোবাইল</th><th>মন্তব্য</th><th>একশন</th></tr></thead><tbody id="tbody"></tbody></table>

<script>
let data=JSON.parse(localStorage.getItem('required_mobile_v2')||'[]');
let role=localStorage.getItem('role')||'mt'; let isClerk=role==='clk';
function save(){localStorage.setItem('required_mobile_v2',JSON.stringify(data))}
function render(){
 let tb=document.getElementById('tbody'); tb.innerHTML='';
 data.forEach((d,i)=>{
  let btns=isClerk?`<button class="edit" onclick="editData(${i})">Edit</button> <button class="del" onclick="delData(${i})">Del</button>`:'-';
  tb.innerHTML+=`<tr><td>${i+1}</td><td>${d.podobi}</td><td>${d.name}</td><td>${d.niyojito||''}</td><td>${d.mobile}</td><td>${d.montobbo}</td><td>${btns}</td></tr>`;
 });
}
function addData(){
 if(!isClerk){alert('View Only');return;}
 let podobi=document.getElementById('podobi').value, name=document.getElementById('name').value, niyojito=document.getElementById('niyojito').value, mobile=document.getElementById('mobile').value, montobbo=document.getElementById('montobbo').value;
 if(!name||!mobile){alert('নাম ও মোবাইল দিন');return;}
 data.push({podobi,name,niyojito,mobile,montobbo}); save(); render();
 document.getElementById('podobi').value='';document.getElementById('name').value='';document.getElementById('niyojito').value='';document.getElementById('mobile').value='';document.getElementById('montobbo').value='';
}
function editData(i){ let d=data[i]; let podobi=prompt("পদবী:",d.podobi); if(podobi===null)return; let name=prompt("নাম:",d.name); if(name===null)return; let niyojito=prompt("নিয়োজিত:",d.niyojito); if(niyojito===null)return; let mobile=prompt("মোবাইল:",d.mobile); if(mobile===null)return; let montobbo=prompt("মন্তব্য:",d.montobbo); if(montobbo===null)return; data[i]={podobi,name,niyojito,mobile,montobbo}; save(); render();}
function delData(i){ if(confirm("ডিলেট করবা?")){data.splice(i,1); save(); render();}}
render();
</script></body></html>
