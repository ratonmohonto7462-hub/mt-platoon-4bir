<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Required - 4 BIR</title> <style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px;border:1px solid #1a2a40}.top{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#ffcc00;font-size:14px;display:block}.top small{color:#8a9bb5;font-size:10px}.back{font-size:28px;color:#ffcc00;background:none;border:none}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #ffcc00;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.addBtn{margin:0 14px 10px;width:calc(100% - 28px);padding:12px;background:#2a1a0a;border:1px solid #ffcc00;color:#ffcc00;border-radius:12px;font-weight:900}.card{background:#111a2d;border-left:4px solid #ffcc00;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #3a2a0a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#ffcc00}.rankBadge{width:52px;height:60px;background:linear-gradient(#ffcc00,#a07a00);border-radius:0 0 50% 50%;float:left;margin:10px 12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}.details{clear:both;padding:8px 14px;font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.btnRow{display:flex;gap:8px}.callBtn{flex:1;background:#0f172a;border:1px solid #ffcc00;color:#ffcc00;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.waBtn{flex:1;background:#0a1a0a;border:1px solid #25D366;color:#25D366;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.editBtn{flex:1;background:#2a1a0a;border:1px solid #ffcc00;color:#ffcc00;border-radius:8px;padding:9px;font-weight:900;font-size:12px}.delBtn{flex:1;background:#4a0a0a;border:1px solid #ff4444;color:#ff6666;border-radius:8px;padding:9px;font-weight:900;font-size:12px}#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f172a;border:1px solid #ffcc00;border-radius:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto}#formBox h3{margin:0;padding:12px;background:#2a1a0a;color:#ffcc00;text-align:center}.formInner{padding:12px}.formInner label{font-size:11px;color:#ffcc00;font-weight:900;display:block;margin:8px 0 3px 0}.formInner input,.formInner select{width:100%;padding:9px;border-radius:8px;border:1px solid #1e2f4a;background:#111a2d;color:#fff}</style></head><body> <div class="phone"><div class="top"><button class="back" onclick="location.href='contact.html'">‹</button><div><b>REQUIRED MOBILE NUMBER- </b><small id="count">⭐ Loading...</small></div></div><div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search..." oninput="render()"></div></div><button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD REQUIRED</button><div id="list"><p style="padding:40px;text-align:center;color:#ffcc00">⏳ Loading from Sheet...</p></div></div> <div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3 id="formTitle">Add Required</h3><div class="formInner"><label>Rank - Select</label><select id="f_rank"><option value="SGT">সার্জেন্ট (SGT)</option><option value="CPL">কর্পোরাল (CPL)</option><option value="LCPL">ল্যান্স কর্পোরাল (LCPL)</option><option value="SNK">সৈনিক (SNK)</option></select><label>Name</label><input id="f_name"><label>Army No</label><input id="f_no"><label>Mobile</label><input id="f_mob"><label>Duty</label><input id="f_rem"><input type="hidden" id="f_row"><div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeForm()" style="flex:1;padding:10px;border-radius:8px;background:#1e2f4a;color:#fff;border:none">Cancel</button><button onclick="saveForm()" style="flex:1;padding:10px;border-radius:8px;background:#ffcc00;color:#000;font-weight:900;border:none">Save to Sheet</button></div><p id="formMsg" style="text-align:center;font-size:11px;margin-top:8px"></p></div></div></div> <script>
const API_URL = "https://script.google.com/macros/s/AKfycbwn_FlAYodKFUsyExE-eatdFGe_eELvfsNeMnGkVmr3HIjcC2mekvNNXguUioEuYpeC/exec";
let role=(localStorage.getItem('role')||'').toLowerCase();let isClk=role.includes('clk')||true;document.getElementById('addBtn').style.display=isClk?'block':'none';
function rankOrder(r){r=(r||'').toUpperCase();if(r.includes('SGT')||r.includes('সার্জেন্ট'))return 1;if(r.includes('CPL')&&!r.includes('LCPL'))return 2;if(r.includes('LCPL')||r.includes('ল্যান্স'))return 3;if(r.includes('SNK')||r.includes('সৈনিক'))return 4;return 5;}
function armyNoVal(s){if(!s)return 999999999;let m=s.match(/\d+/g);if(!m)return 999999999;return parseInt(m.join('').slice(-8));}
let data=[];
async function loadFromSheet(){
  try{
    let res = await fetch(API_URL);
    data = await res.json();
    render();
  }catch(e){
    document.getElementById('list').innerHTML="<p style='padding:20px;text-align:center;color:#ff4444'>❌ Failed to load!<br><button onclick='loadFromSheet()' style='margin-top:10px'>Retry</button></p>";
  }
}
function openAdd(){document.getElementById('f_row').value='';document.getElementById('f_name').value='';document.getElementById('f_no').value='';document.getElementById('f_mob').value='';document.getElementById('f_rem').value='';document.getElementById('formTitle').innerText='Add Required';document.getElementById('formModal').style.display='flex'}
function openEdit(row){let o=data.find(x=>x.row==row);document.getElementById('f_row').value=o.row;document.getElementById('f_rank').value=o.rank;document.getElementById('f_name').value=o.name;document.getElementById('f_no').value=o.no;document.getElementById('f_mob').value=o.mobile;document.getElementById('f_rem').value=o.remarks;document.getElementById('formTitle').innerText='Edit Required';document.getElementById('formModal').style.display='flex'}
function closeForm(){document.getElementById('formModal').style.display='none'}
async function saveForm(){
  let p={rank:document.getElementById('f_rank').value.trim(),name:document.getElementById('f_name').value.trim(),no:document.getElementById('f_no').value.trim(),mobile:document.getElementById('f_mob').value.trim(),remarks:document.getElementById('f_rem').value.trim(),row:document.getElementById('f_row').value?parseInt(document.getElementById('f_row').value):0};
  p.action=p.row?"edit":"add";
  if(!p.name||!p.mobile){alert("Name & Mobile লাগবে!");return;}
  document.getElementById('formMsg').innerText="⏳ Saving to Sheet...";
  await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(p)});
  document.getElementById('formMsg').innerText="✅ Saved! Reloading...";
  setTimeout(()=>location.reload(),1000);
}
async function del(row){if(!confirm('Delete?'))return;await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row:row})});alert("Deleted!");location.reload();}
function render(){
  data.sort((a,b)=>{let ra=rankOrder(a.rank),rb=rankOrder(b.rank);if(ra!==rb)return ra-rb;return armyNoVal(a.no)-armyNoVal(b.no);});
  let q=document.getElementById('s').value.toLowerCase();let html='';
  data.forEach((o,idx)=>{
    if(q&&!(o.name+o.no+o.rank+o.mobile).toLowerCase().includes(q))return;
    let wa=o.mobile.replace(/\D/g,'');if(wa.startsWith('0'))wa='88'+wa;
    let rankBangla=o.rank=='SGT'?'সার্জেন্ট':o.rank=='CPL'?'কর্পোরাল':o.rank=='LCPL'?'ল্যান্স কর্পোরাল':'সৈনিক';
    let btns=isClk?`<div class="btns"><div class="btnRow"><button class="editBtn" onclick="openEdit(${o.row})">✏️ Edit</button><button class="delBtn" onclick="del(${o.row})">🗑️ Del</button></div><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`:`<div class="btns"><div class="btnRow"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`;
    html+=`<div class="card"><div style="padding:12px 12px 0 0;display:flex"><div class="rankBadge">${o.rank}</div><div><b style="font-size:13px">${o.rank} ${o.name}</b><br><small style="color:#ffcc00">${rankBangla} • ${o.no} • Senior #${idx+1}</small></div></div><div class="details"><div><span class="label">Army No:</span> <span class="val" style="color:#ffcc00">${o.no}</span></div><div><span class="label">Duty:</span> <span class="val">${o.remarks}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile}</span></div></div>${btns}</div>`;
  });
  document.getElementById('list').innerHTML=html||'<div style="padding:20px;text-align:center;color:#6b7a90">No Data in Sheet</div>';
  document.getElementById('count').innerText=`⭐ ${data.length} Numbers`;
}
loadFromSheet();
</script></body></html>
