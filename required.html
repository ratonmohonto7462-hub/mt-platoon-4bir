<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Required - 4 BIR</title>
<style>/* Same style as above */*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:80px;border:1px solid #1a2a40}.top{padding:14px;display:flex;align-items:center;gap:12px}.top b{color:#ffcc00;font-size:17px;display:block}.top small{color:#8a9bb5;font-size:11px}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #ffcc00;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.stats{background:#2a1a0a;border:1px solid #ffcc00;border-radius:12px;margin:8px 14px;padding:10px 14px;font-size:12px}.stats b{color:#ffcc00}.card{background:#111a2d;border-left:4px solid #ffcc00;border-radius:14px;margin:12px 14px;overflow:hidden;border:1px solid #3a2a0a;position:relative}.card::before{content:'';position:absolute;top:0;left:0;right:40%;height:3px;background:#ffcc00}.rankBadge{width:52px;height:60px;background:linear-gradient(#ffcc00,#a07a00);border-radius:0 0 50% 50%;display:flex;align-items:center;justify-content:center;float:left;margin:10px 12px;font-weight:900;font-size:16px}.cardHead{padding:14px 14px 0 0;display:flex;justify-content:space-between}.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;gap:10px;padding:0 14px 14px}.callBtn{flex:1;background:#0f172a;border:1px solid #ffcc00;color:#ffcc00;border-radius:10px;padding:10px;text-align:center;text-decoration:none;font-weight:900}</style></head><body>
<div class="phone">
<div class="top"><button onclick="history.back()" style="background:none;border:none;color:#ffcc00;font-size:28px">‹</button><div><b>REQUIRED CONTACT LIST</b><small>⭐ EMERGENCY • 4 BIR</small></div></div>
<div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search emergency numbers..." oninput="render()"></div></div>
<div class="stats"><b>Total Required:</b> <span id="total">12</span> — Emergency: 8 • 24/7</div>
<div id="list"></div>
</div>
<script>
let data=[{icon:"🚑",name:"MEDICAL - MI ROOM",mobile:"01769-123456",remarks:"24 Hours Medical Support"},{icon:"🔧",name:"MT WORKSHOP",mobile:"01769-123457",remarks:"Vehicle Emergency Repair"},{icon:"🚨",name:"DUTY OFFICER",mobile:"01769-123458",remarks:"Night Duty Officer - 4 BIR"}];
function render(){let q=document.getElementById('s').value.toLowerCase();let f=data.filter(d=>d.name.toLowerCase().includes(q));document.getElementById('total').innerText=f.length;document.getElementById('list').innerHTML=f.map(o=>`<div class="card"><div class="cardHead"><div style="display:flex;gap:0"><div class="rankBadge">${o.icon}</div><div><b style="color:#fff">${o.name}</b><br><small style="color:#ffcc00">${o.remarks}</small></div></div></div><div class="details"><div class="full"><span class="label">MOBILE:</span> <span class="val" style="font-size:14px;color:#ffcc00">${o.mobile}</span></div></div><div class="btns"><a class="callBtn" href="tel:${o.mobile}">📞 Call Now</a><a class="callBtn" href="https://wa.me/${o.mobile.replace(/\D/g,'')}">💬 WhatsApp</a></div></div>`).join('')}
render();
</script></body></html>
