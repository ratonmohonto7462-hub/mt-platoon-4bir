<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - MT PLATOON</title>
<style>body{margin:0;font-family:Arial;background:#f4f4f4} .top{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between} .wrap{padding:16px;max-width:500px;margin:0 auto} .card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;border-left:5px solid #ff9800} .card.active{border-left-color:#00c853} .btn{padding:8px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin-right:6px} .btn-a{background:#00c853} .btn-r{background:#ff3d00;color:#fff} #loginBox{height:100vh;display:flex;align-items:center;justify-content:center} input{width:100%;padding:14px;border:1.5px solid #111;border-radius:10px;margin-top:10px}</style>
</head><body>
<div id="loginBox"><div style="background:#fff;padding:24px;border-radius:16px;width:90%;max-width:320px"><h2>Admin Login</h2><input id="apass" type="password" placeholder="Admin Password"><button onclick="checkAdmin()" style="width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:30px;margin-top:12px;font-weight:700">Login</button><p style="text-align:center;font-size:12px;color:#888">Password: mtadmin123</p></div></div>

<div id="mainBox" style="display:none"><div class="top"><span>MT PLATOON - ADMIN</span><span onclick="location.href='dashboard.html'">X</span></div>
<div class="wrap"><h3>Pending Profiles</h3><div id="list">Loading...</div></div></div>

<script>
const API="https://script.google.com/macros/s/AKfycby8BQ0Dyo5s4otJEbRJcZXNiW3pyqDY9800nm8X7kGeOz49RVlQ1bdoF5IdByxL-l226w/exec";
function checkAdmin(){ if(document.getElementById('apass').value==="mtadmin123"){ document.getElementById('loginBox').style.display="none"; document.getElementById('mainBox').style.display="block"; loadData(); } else alert("Wrong Password!"); }

function loadData(){
 fetch(API+"?action=get_profiles").then(r=>r.json()).then(data=>{
   let html="";
   data.forEach(row=>{
     let status=row.status||row[6]||"PENDING";
     if(status.toLowerCase()!=="active"){
       html+=`<div class="card"><b>${row.sena_no||row[0]} - ${row.name||row[2]}</b><br>Mobile: ${row.mobile||row[4]}<br>Rank: ${row.podobi||row[1]} | Blood: ${row.blood||row[5]}<br>Status: <b style="color:orange">${status}</b><br><br><button class="btn btn-a" onclick="approve('${row.sena_no||row[0]}')">✓ Approve</button><button class="btn btn-r" onclick="reject('${row.sena_no||row[0]}')">X Reject</button></div>`;
     }
   });
   if(!html) html="<p style='text-align:center;color:green'>✅ কোনো Pending Request নাই!</p>";
   document.getElementById('list').innerHTML=html;
 }).catch(()=>{ document.getElementById('list').innerHTML="<p>Google Sheet থেকে Data Load হচ্ছে না। তুমি সরাসরি Sheet থেকে Status 'Active' করে দাও।</p>"; });
}
function approve(sena){ if(confirm(sena+" কে Approve করবা?")){ fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"approve",sena_no:sena})}); alert("Approved! এখন Sheet এ গিয়ে Status 'Active' করে দাও"); location.reload(); } }
function reject(sena){ if(confirm(sena+" কে Reject করবা?")){ fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"reject",sena_no:sena})}); alert("Rejected!"); } }
</script>
</body></html>
