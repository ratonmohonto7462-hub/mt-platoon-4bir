<button onclick="loadPending()" style="padding:10px;background:#c8a951;color:#000;font-weight:900;border:none;border-radius:8px;width:100%">🔄 Pending List Load করো</button>
<div id="pendingList" style="margin-top:12px"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbxZJp_zBnLEaZ8ujZ_XrVpGH-T7rl7QArZANGi5kon2AqU23SxxbIpEQPe7p2e9NlO4/exec";
function loadPending(){
 fetch(API+"?action=getAllProfiles&t="+Date.now()).then(r=>r.text()).then(t=>{
   let data=JSON.parse(t);
   document.getElementById('pendingList').innerHTML = data.map((p,i)=>`
     <div style="background:#132a18;border:1px solid #c8a951;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center">
       <div><b style="color:#fff">${p.name}</b><br><small style="color:#c8a951">${p.sena} - ${p.status}</small></div>
       <button onclick="approve('${p.sena}')" style="background:#22c55e;color:#000;padding:8px 14px;border:none;border-radius:20px;font-weight:900">${p.status=='Active'?'✅':'Approve'}</button>
     </div>
   `).join('');
 });
}
function approve(sena){
 fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"approve", sena_no:sena})});
 alert("✅ "+sena+" Approved! Sheet এ Active হয়ে গেছে");
 loadPending();
}
</script>
