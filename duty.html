<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT Platoon - Fixed Add</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f7}
.card{background:white;margin:10px;padding:12px;border-radius:12px;overflow:auto}
button{padding:12px 18px;background:#0a5c26;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px}
select,input{padding:12px;border:1px solid #666;border-radius:8px;font-size:16px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1px solid #444;padding:8px;text-align:center}
.name-col{background:#eee;position:sticky;left:0;min-width:180px;text-align:left;font-weight:bold}
th{background:#0a5c26;color:white}
.night-card{background:#fff9c4;border:2px solid #f9a825}
.night-title{background:#f9a825;padding:8px;border-radius:8px;font-weight:bold;text-align:center;font-size:18px}
</style>
</head>
<body>
<div class="card">
<select id="rank"><option>সার্জেন্ট</option><option>কর্পোরাল</option
