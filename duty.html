<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT Platoon 4 BIR - Duty</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f7}
.header{background:#0a5c26;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:white;margin:10px;padding:12px;border-radius:12px;overflow:auto}
select,input{padding:12px;border:1px solid #777;border-radius:8px;font-size:16px}
button{padding:12px 18px;background:#0a5c26;color:white;border:none;border-radius:8px;font-weight:bold;font-size:16px}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1px solid #555;padding:8px;text-align:center}
.name-col{background:#eee;position:sticky;left:0;min-width:180px;text-align:left;font-weight:bold}
th{background:#0a5c26;color:white}
</style>
</head>
<body>

<div class="header">
<b onclick="location.href='/'">← BACK</b>
<b>MT PLATOON 4 BIR</b>
<b onclick="window.print()">PRINT</b>
</div>

<div class="card">
  <select id="rank">
    <option>সার্জেন্ট</option>
    <option>কর্পোরাল</option>
    <option>ল্যান্স কর্পোরাল</option>
    <option selected>সৈনিক</option>
  </select>
  <input id="mName" placeholder="নাম লেখো">
  <button onclick="addMember()">Add Member</button>
</div>

<div class="card">
<b>ডিউটি অনুযায়ী সামারি - এক লাইনে</b>
<table id="summary" style="min-width:100%;margin-top:10px"></table>
</div>

<div class="card">
<div style="overflow:auto">
<table id="main"></table>
</div>
</div>

<div id="box" style="display:none;position:fixed;top:20%;left:5%;right:5%;background:white;border:3px solid #0a5c26;padding:20px;border-radius:12px">
<b id="bInfo"></b><br><br>
<select id="dutyType" style="width:100%">
<option value="">No Duty</option>
<option>স্টান বাই</option>
<option>মোবাইল টহল (১ম)</option>
<option>মোবাইল টহল (২য়)</option>
<option>মোবাইল টহল (৩য়)</option>
<option>এমটি পার্ক (১ম)</option>
<option>এমটি পার্ক (২য়)</option>
<option>এমটি পার্ক (৩য়)</option>
</select><br><br>
<button onclick="saveDuty()">SAVE</button>
<button onclick="document.getElementById('box').style.display='none'" style="background:gray">Close</button>
</div>

<script>
var members = [];
var roster = {};
var dates = [];
var selId = null, selDate = null;

var now = new Date();
var y = now.getFullYear();
var m = now.getMonth();
var total = new Date(y, m+1, 0).getDate();
for(var i=1;i<=total;i++){
  var mm = String(m+1).padStart(2,'0');
  var dd = String(i).padStart(2,'0');
  dates.push(y+'-'+mm+'-'+dd);
}

function addMember(){
  var r = document.getElementById('rank').value;
  var n = document.getElementById('mName').value.trim();
  if(n==""){ alert('নাম লেখো'); return; }
  var id = 'm'+Date.now()+Math.random();
  members.push({id:id, rank:r, name:n});
  document.getElementById('mName').value='';
  render();
}

function render(){
  var main = document.getElementById('main');
  var h = '<tr><th class="name-col">নাম / তারিখ</th>';
  for(var i=0;i<dates.length;i++){ h+='<th>'+dates[i].slice(8)+'</th>'; }
  h+='</tr>';
  for(var j=0;j<members.length;j++){
    var mem = members[j];
    h+='<tr><td class="name-col">'+mem.rank+' '+mem.name+'</td>';
    for(var k=0;k<dates.length;k++){
      var dt = dates[k];
      var key = mem.id+'_'+dt;
      var v = roster[key] ? roster[key] : '';
      h+='<td onclick="openBox(\''+mem.id+'\',\''+dt+'\')" style="cursor:pointer">'+v+'</td>';
    }
    h+='</tr>';
  }
  if(members.length==0){ h+='<tr><td colspan='+(dates.length+1)+'>এখনো কেউ Add হয়নি, উপরে নাম লিখে Add চাপো</td></tr>'; }
  main.innerHTML = h;

  var duties = ["স্টান বাই","মোবাইল টহল (১ম)","মোবাইল টহল (২য়)","মোবাইল টহল (৩য়)","এমটি পার্ক (১ম)","এমটি পার্ক (২য়)","এমটি পার্ক (৩য়)"];
  var s = '';
  for(var d=0; d<duties.length; d++){
    var duty = duties[d];
    var list = [];
    for(var a=0;a<dates.length;a++){
      var dt2 = dates[a];
      for(var b=0;b<members.length;b++){
        var mem2 = members[b];
        var kk = mem2.id+'_'+dt2;
        if(roster[kk]==duty){ list.push(dt2.slice(8)+' - '+mem2.rank+' '+mem2.name); }
      }
    }
    s+='<tr><td style="background:#e8f5e9;font-weight:bold;width:150px">'+duty+'</td><td style="text-align:left;white-space:nowrap">'+(list.join(' , ')||'—')+'</td></tr>';
  }
  document.getElementById('summary').innerHTML = s;
}

function openBox(mid, dt){
  selId = mid; selDate = dt;
  var mem = null;
  for(var i=0;i<members.length;i++){ if(members[i].id==mid){ mem=members[i]; break; } }
  document.getElementById('bInfo').innerText = mem.rank+' '+mem.name+' - '+dt;
  document.getElementById('dutyType').value = roster[mid+'_'+dt] || '';
  document.getElementById('box').style.display='block';
}
function saveDuty(){
  var v = document.getElementById('dutyType').value;
  var k = selId+'_'+selDate;
  if(v){ roster[k]=v; } else { delete roster[k]; }
  document.getElementById('box').style.display='none';
  render();
}
render();
</script>
</body>
</html>
