<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Fixed</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f7}
.header{background:#0a5c26;color:#fff;padding:12px;display:flex;justify-content:space-between}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px;overflow:auto}
input,select{padding:10px;border:1px solid #999;border-radius:8px;margin:3px}
button{background:#0a5c26;color:#fff;border:none;padding:10px 15px;border-radius:8px;font-weight:bold}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{border:1px solid #777;padding:7px;text-align:center;font-size:13px}
td.name-col{text-align:left;min-width:160px;background:#eee;position:sticky;left:0;font-weight:bold}
th{background:#0a5c26;color:white;position:sticky;top:0}
.duty-cell{background:#fff;cursor:pointer}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="header no-print">
  <b onclick="location.href='dashboard.html'">← BACK</b>
  <b id="headTitle">DUTY ROSTER</b>
  <button onclick="window.print()">PRINT</button>
</div>

<div class="card no-print">
  <input id="rank" placeholder="Rank">
  <input id="mName" placeholder="Name লেখো">
  <button type="button" onclick="addMember()">Add Member</button>
  <button type="button" onclick="resetAll()" style="background:#a00">Reset</button>

  <div id="editBox" style="display:none;margin-top:10px;background:#d4edda;padding:10px;border-radius:10px">
    <b id="editInfo"></b><br><br>
    <select id="dutyType" style="font-size:16px;width:70%">
      <option value="">-- No Duty --</option>
      <option>স্টান বাই</option>
      <option>মোবাইল টহল</option>
      <option>এমটি পার্ক</option>
    </select>
    <button type="button" onclick="saveDuty()">SAVE</button>
  </div>
</div>

<div class="card"><b>তারিখ অনুযায়ী সামারি</b><table id="summary" style="min-width:100%;margin-top:8px"></table></div>

<div class="card">
  <div id="mainWrap" style="overflow:auto"><table id="main"></table></div>
</div>

<script>
var members = [];
var roster = {};
try{ members = JSON.parse(localStorage.getItem('mt_m')||'[]'); roster = JSON.parse(localStorage.getItem('mt_r')||'{}'); }catch(e){}

var curDates = [];
var selMid = null; var selDate = null;

function makeDates(){
  var d = new Date();
  var y = d.getFullYear(); var m = d.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  curDates = [];
  for(var i=1;i<=days;i++){
    var mm = String(m+1).padStart(2,'0'); var dd = String(i).padStart(2,'0');
    curDates.push(y+'-'+mm+'-'+dd);
  }
  document.getElementById('headTitle').innerText = 'DUTY - '+y+'-'+(m+1);
}

function addMember(){
  var r = document.getElementById('rank').value;
  var n = document.getElementById('mName').value.trim();
  if(n==''){ alert('নাম লেখো'); return; }
  var id = 'm'+Date.now();
  members.push({id:id, rank:r, name:n});
  try{ localStorage.setItem('mt_m', JSON.stringify(members)); }catch(e){}
  document.getElementById('mName').value='';
  render();
}

function render(){
  var main = document.getElementById('main');
  var h = '<tr><th class="name-col">নাম / তারিখ</th>';
  curDates.forEach(function(dt){ h+='<th>'+dt.slice(8)+'</th>'; });
  h+='</tr>';
  members.forEach(function(mem){
    h+='<tr><td class="name-col">'+mem.rank+' '+mem.name+'</td>';
    curDates.forEach(function(dt){
      var key = mem.id+'_'+dt;
      var val = roster[key]||'';
      h+='<td class="duty-cell" onclick="openEdit(\''+mem.id+'\',\''+dt+'\')">'+val+'</td>';
    });
    h+='</tr>';
  });
  if(members.length==0) h+='<tr><td colspan='+(curDates.length+1)+'>এখনো কেউ Add হয়নি</td></tr>';
  main.innerHTML = h;

  var s = document.getElementById('summary');
  var sh = '<tr><th>তারিখ</th><th>ডিউটি</th></tr>';
  curDates.forEach(function(dt){
    var list=[];
    members.forEach(function(mem){
      var k=mem.id+'_'+dt; if(roster[k]) list.push(mem.rank+' '+mem.name+'['+roster[k]+']');
    });
    if(list.length>0) sh+='<tr><td>'+dt+'</td><td style="text-align:left">'+list.join(', ')+'</td></tr>';
  });
  s.innerHTML = sh;
}

function openEdit(mid, dt){
  selMid=mid; selDate=dt;
  var m = members.find(function(x){return x.id==mid});
  document.getElementById('editInfo').innerText = m.rank+' '+m.name+' - '+dt;
  document.getElementById('dutyType').value = roster[mid+'_'+dt]||'';
  document.getElementById('editBox').style.display='block';
}
function saveDuty(){
  var v = document.getElementById('dutyType').value;
  var k = selMid+'_'+selDate;
  if(v) roster[k]=v; else delete roster[k];
  try{ localStorage.setItem('mt_r', JSON.stringify(roster)); }catch(e){}
  document.getElementById('editBox').style.display='none';
  render();
}
function resetAll(){ if(confirm('সব মুছবে?')){ members=[]; roster={}; localStorage.removeItem('mt_m'); localStorage.removeItem('mt_r'); render(); } }

makeDates(); render();
</script>
</body>
</html>
