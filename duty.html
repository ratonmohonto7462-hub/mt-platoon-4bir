<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT Duty Roster - Fixed</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f7}
.header{background:#0a5c26;color:white;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card{background:white;margin:10px;padding:12px;border-radius:12px;overflow:auto}
input,select{padding:9px;border:1px solid #aaa;border-radius:7px}
button{background:#0a5c26;color:white;border:none;padding:9px 14px;border-radius:7px;font-weight:bold}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{border:1px solid #999;padding:6px;text-align:center;font-size:13px}
td.name-col{text-align:left;min-width:160px;background:#f1f1f1;position:sticky;left:0;font-weight:bold}
th{position:sticky;top:0;background:#0a5c26;color:white;z-index:3}
td.duty-cell{cursor:pointer;min-width:80px}
td.duty-cell:hover{background:#fff59d}
@media print{.no-print{display:none !important}}
</style>
</head>
<body>

<div class="header no-print">
  <div onclick="location.href='dashboard.html'"><b>← BACK</b></div>
  <b>MT PLATOON 4 BIR</b>
  <button onclick="window.print()">PRINT</button>
</div>

<div class="card no-print">
  <input id="monthPick" type="month">
  <input id="rank" placeholder="Rank: সৈনিক" style="width:95px">
  <input id="mName" placeholder="Name: রতন" style="width:115px">
  <button onclick="addMember()">Add Member</button>
  <button onclick="clearAll()" style="background:#b00;margin-left:5px">Clear All</button>

  <div id="editBox" style="display:none;margin-top:10px;background:#e8ffe8;padding:10px;border:2px solid #0a5c26;border-radius:10px">
    <b id="editInfo"></b><br><br>
    <select id="dutyType" style="width:65%;font-size:16px">
      <option value="">-- No Duty --</option>
      <option>স্টান বাই</option>
      <option>মোবাইল টহল</option>
      <option>এমটি পার্ক</option>
    </select>
    <button onclick="saveDuty()">SAVE</button>
    <button onclick="closeBox()" style="background:gray">X</button>
  </div>
</div>

<div class="card">
  <b>তারিখ অনুযায়ী ডিউটির সামারি (উপরের চার্ট)</b>
  <table id="summaryTable" style="min-width:100%;margin-top:8px"></table>
</div>

<div class="card">
  <div id="title" style="text-align:center;font-weight:bold;margin-bottom:6px"></div>
  <div style="overflow:auto">
    <table id="mainTable"></table>
  </div>
</div>

<script>
let members = JSON.parse(localStorage.getItem('mt_members_v2')||'[]');
let roster = JSON.parse(localStorage.getItem('mt_roster_v2')||'{}');
let curDates=[];
let sel={mid:null,date:null};

let mp=document.getElementById('monthPick');
mp.value = new Date().toISOString().slice(0,7);
mp.addEventListener('change', buildDates);
buildDates();

function buildDates(){
  let val=mp.value;
  let y,m;
  if(val.includes('-')){ let p=val.split('-'); y=parseInt(p[0]); m=parseInt(p[1]); }
  else { let d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
  if(!y||!m){ let d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
  let days=new Date(y,m,0).getDate();
  curDates=[];
  for(let i=1;i<=days;i++){
    let dd=String(i).padStart(2,'0'), mm=String(m).padStart(2,'0');
    curDates.push(y+'-'+mm+'-'+dd);
  }
  document.getElementById('title').innerText='Duty Roster - '+y+'-'+String(m).padStart(2,'0');
  render();
}

function addMember(){
  let r=document.getElementById('rank').value.trim();
  let n=document.getElementById('mName').value.trim();
  if(!n){ alert('Name লেখো দোস্ত'); return; }
  let id='id_'+Date.now();
  members.push({id:id, rank:r, name:n});
  localStorage.setItem('mt_members_v2', JSON.stringify(members));
  document.getElementById('mName').value='';
  render();
  alert('Add হয়ে গেছে: '+r+' '+n);
}

function render(){
  let mt=document.getElementById('mainTable');
  let html='<tr><th class="name-col">নাম / তারিখ</th>';
  curDates.forEach(d=>{ html+='<th>'+d.slice(8)+'</th>'; });
  html+='</tr>';
  members.forEach(mem=>{
    html+='<tr><td class="name-col">'+mem.rank+' '+mem.name+'</td>';
    curDates.forEach(d=>{
      let key=mem.id+'_'+d;
      let v=roster[key]||'';
      html+='<td class="duty-cell" onclick="openBox(\''+mem.id+'\',\''+d+'\')">'+v+'</td>';
    });
    html+='</tr>';
  });
  if(members.length==0) html+='<tr><td class="name-col" colspan="'+(curDates.length+1)+'">কোনো মেম্বার নাই, উপরে নাম লিখে Add Member চাপো</td></tr>';
  mt.innerHTML=html;

  let st=document.getElementById('summaryTable');
  let shtml='<tr><th>তারিখ</th><th>ডিউটি আছে যাদের</th></tr>';
  curDates.forEach(d=>{
    let list=[];
    members.forEach(mem=>{
      let k=mem.id+'_'+d;
      if(roster[k]) list.push(mem.rank+' '+mem.name+' ['+roster[k]+']');
    });
    if(list.length>0) shtml+='<tr><td><b>'+d+'</b></td><td style="text-align:left">'+list.join(', ')+'</td></tr>';
  });
  if(shtml.includes('<tr><th>')){ /* keep */ }
  st.innerHTML=shtml;
}

function openBox(mid,date){
  sel.mid=mid; sel.date=date;
  let m=members.find(x=>x.id==mid);
  document.getElementById('editInfo').innerText=m.rank+' '+m.name+' - '+date+' তারিখ';
  document.getElementById('dutyType').value=roster[mid+'_'+date]||'';
  document.getElementById('editBox').style.display='block';
  window.scrollTo(0,0);
}

  let v=document.getElementById('d
