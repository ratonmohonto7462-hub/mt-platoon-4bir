<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Roster - MT PLATOON</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f7}
.header{background:#0a5c26;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.card{background:white;margin:15px;padding:15px;border-radius:15px;box-shadow:0 2px 5px #0001}
input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
button{background:#0a5c26;color:white;padding:10px 15px;border:none;border-radius:8px;width:100%;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
.search{background:#fff3cd;padding:10px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
  <b onclick="location.href='dashboard.html'">← MT PLATOON 4 BIR</b>
  <b>DUTY ROSTER</b>
</div>

<div class="card">
  <h3>Add Member</h3>
  <input id="rank" placeholder="Rank (e.g. Sepoy)">
  <input id="name" placeholder="Name">
  <input id="armyNo" placeholder="Army No">
  <button onclick="addMember()">Add Member</button>
</div>

<div class="card">
  <h3>Assign Duty</h3>
  <select id="memberSelect"></select>
  <input id="dutyDate" type="date">
  <select id="dutyType"><option>Guard</option><option>Sentry</option><option>Patrol</option><option>Day Duty</option></select>
  <button onclick="addDuty()">Assign Duty</button>
</div>

<div class="card">
  <h3>Duty History</h3>
  <input id="search" placeholder="Search by Name or Date..." onkeyup="renderDuty()">
  <table>
    <thead><tr><th>Date</th><th>Name</th><th>Duty</th><th>X</th></tr></thead>
    <tbody id="dutyTable"></tbody>
  </table>
</div>

<script>
let members = JSON.parse(localStorage.getItem('mt_members')||'[]');
let duties = JSON.parse(localStorage.getItem('mt_duties')||'[]');

function save(){ localStorage.setItem('mt_members',JSON.stringify(members)); localStorage.setItem('mt_duties',JSON.stringify(duties)); render(); }

function addMember(){
  let r=document.getElementById('rank').value, n=document.getElementById('name').value, a=document.getElementById('armyNo').value;
  if(!n) return alert('Name likho');
  members.push({id:Date.now(), rank:r, name:n, armyNo:a}); save();
  document.getElementById('rank').value='';document.getElementById('name').value='';document.getElementById('armyNo').value='';
}
function addDuty(){
  let mid=document.getElementById('memberSelect').value, date=document.getElementById('dutyDate').value, type=document.getElementById('dutyType').value;
  if(!mid||!date) return alert('Member & Date dao');
  duties.push({id:Date.now(), memberId:mid, date:date, type:type}); save();
}
function render(){
  let sel=document.getElementById('memberSelect'); sel.innerHTML='';
  members.forEach(m=>{ let o=document.createElement('option'); o.value=m.id; o.textContent=m.rank+' '+m.name; sel.appendChild(o); });
  renderDuty();
}
function renderDuty(){
  let q=document.getElementById('search').value.toLowerCase();
  let tbody=document.getElementById('dutyTable'); tbody.innerHTML='';
  let sorted=[...duties].sort((a,b)=>b.date.localeCompare(a.date));
  sorted.forEach(d=>{
    let m=members.find(x=>x.id==d.memberId); if(!m) return;
    let str=(d.date+' '+m.name+' '+m.rank).toLowerCase();
    if(q && !str.includes(q)) return;
    tbody.innerHTML+=`<tr><td>${d.date}</td><td>${m.rank} ${m.name}</td><td>${d.type}</td><td><button onclick="delDuty(${d.id})" style="background:red;padding:2px 8px">X</button></td></tr>`;
  });
}
function delDuty(id){ duties=duties.filter(d=>d.id!=id); save(); }
render();
</script>
</body>
</html>
