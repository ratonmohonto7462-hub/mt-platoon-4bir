<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicle Problem - MT PLATOON</title>
<style> *{margin:0;padding:0;box-sizing:border-box;font-family:Arial} body{background:#f2f2f2;padding-bottom:80px} .top{background:#0a1a12;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center} .call{background:#0e5d3e;color:#ffcc00;padding:11px 15px;font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center} .gc-btn{background:#ffcc00;color:#000;padding:5px 12px;border-radius:15px;font-size:13px;cursor:pointer} .sec{padding:15px} .nav{position:fixed;bottom:0;left:0;right:0;background:#143d27;display:flex;justify-content:space-around;padding:12px 0} .nav div{color:#fff;text-align:center;cursor:pointer} .btn-add{background:#b91c1c;color:#fff;padding:10px 18px;border:none;border-radius:25px;font-weight:900;cursor:pointer;width:100%;font-size:15px;margin-bottom:15px} .vehicle-card{background:#fff;border-radius:12px;padding:14px;margin-top:12px;border:1px solid #ddd;border-left:5px solid #ff4444;position:relative;box-shadow:0 2px 5px rgba(0,0,0,0.1)} .vehicle-card b{color:#0e5d3e} .del{position:absolute;top:8px;right:8px;background:#ff4444;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:900;cursor:pointer} #vehicleModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;justify-content:center;align-items:center;padding:20px} .modal-box{background:#fff;width:100%;max-width:360px;border-radius:15px;padding:20px} .modal-box h3{color:#b91c1c;margin-bottom:15px;text-align:center} .modal-box input, .modal-box textarea{width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font-size:14px} .modal-box .btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:5px;font-size:14px} </style>
</head>
<body>
<div class="top">
<b onclick="location.href='home.html'">⬅ 4 BIR - MT PLATOON</b>
<b onclick="location.href='own-profile.html'" style="background:#ffcc00;color:#000;padding:7px 13px;border-radius:50%;cursor:pointer">R</b>
</div>
<div class="call">
<span>🚛 Vehicle Problem Report</span>
<span class="gc-btn" onclick="location.href='home.html'">🏠 Home</span>
</div>
<div class="sec">
<h3 style="color:#b91c1c;text-align:center;margin-bottom:5px">🚛 VEHICLE PROBLEM BOARD</h3>
<p style="text-align:center;font-size:12px;color:#666;margin-bottom:15px">ফরমেট: সেনা নং | পদবী | নাম | বিএ নং | সমস্যা - সবাই Add করতে পারবে</p>
<button class="btn-add" onclick="openVehicle()">+ Add Vehicle Problem</button>
<div id="vehicleList"><p style="text-align:center;padding:20px">Loading...</p></div>
</div>
<div id="vehicleModal">
<div class="modal-box">
<h3>🚛 Vehicle Problem Add</h3>
<input id="vSena" placeholder="সেনা নং - 4521328">
<input id="vPodobi" placeholder="পদবী - Sldr / Cpl">
<input id="vName" placeholder="নাম - Ruhul">
<input id="vBa" placeholder="বিএ নং - BA-12345 / গাড়ি নং">
<textarea id="vProblem" placeholder="সমস্যা বিস্তারিত লিখো..." rows="4"></textarea>
<button class="btn" style="background:#b91c1c;color:#fff" onclick="saveVehicle()">✅ Submit</button>
<button class="btn" style="background:#ddd" onclick="closeVehicle()">Cancel</button>
</div>
</div>
<div class="nav">
<div onclick="location.href='home.html'">🏡<br>Home</div>
<div style="color:#22c55e;font-weight:900">🚛<br>Vehicle</div>
<div onclick="location.href='group.html'">👥<br>Group</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, getDocs, addDoc, deleteDoc, doc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:4d24320f792d7e86fdca80", measurementId: "G-E1M0WH2RD9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let sena = (localStorage.getItem('sena_no')||localStorage.getItem('mt_sena')||localStorage.getItem('mt_army')||"").toString().replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,'');
let myProfile = null;
function isAdmin(){ return sena === "4521328"; }

// Profile Check - Profile না থাকলে / Pending থাকলে Add করতে পারবে না, দেখতে পারবে
async function checkProfile(){
  if(sena){
    try{
      const snap = await getDoc(doc(db,"users",sena));
      if(snap.exists()) myProfile = snap.data();
    }catch(e){}
  }
  // Auto Fill - নিজের Profile থেকে Sena / Podobi / Name বসায় দিবে
  if(myProfile){
    document.getElementById('vSena').value = myProfile.sena || sena;
    document.getElementById('vPodobi').value = myProfile.podobi || "";
    document.getElementById('vName').value = myProfile.name || "";
  } else if(sena){
    document.getElementById('vSena').value = sena;
  }
}
checkProfile();

let vehicles = [];
async function renderVehicles(){
  let list = document.getElementById('vehicleList');
  try{
    const q = query(collection(db,"vehicle_problems"), orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    vehicles = [];
    snap.forEach(d=>{ vehicles.push({ id:d.id, ...d.data() }); });
  }catch(e){
    const snap = await getDocs(collection(db,"vehicle_problems"));
    vehicles = []; snap.forEach(d=>{ vehicles.push({ id:d.id, ...d.data() }); }); vehicles.reverse();
  }
  if(vehicles.length==0){
    list.innerHTML = `<div style="text-align:center;color:#888;padding:30px;background:#fff;border-radius:10px">কোনো Vehicle Problem নাই<br><small>প্রথম Problem Add করো</small></div>`;
    return;
  }
  list.innerHTML = "";
  vehicles.forEach((v)=>{
    list.innerHTML += `<div class="vehicle-card"> ${isAdmin()?`<button class="del" onclick="deleteVehicle('${v.id}')">Del</button>`:''}
    <div style="font-size:13px;line-height:1.7">
    <b>সেনা নং:</b> ${v.sena} &nbsp; | &nbsp; <b>পদবী:</b> ${v.podobi}<br>
    <b>নাম:</b> ${v.name} &nbsp; | &nbsp; <b>বিএ/গাড়ি নং:</b> ${v.ba}<br>
    <div style="margin-top:8px;padding:8px;background:#fff3f3;border-radius:6px"><b style="color:#b91c1c">সমস্যা:</b> ${v.problem}</div>
    <div style="margin-top:8px;font-size:11px;color:#888">📅 ${v.date||''}</div>
    </div></div>`;
  });
}
renderVehicles();

window.openVehicle = function(){
  if(!sena || !myProfile || myProfile.status !== "approved"){
    alert("⏳ Profile Approved না হইলে Vehicle Problem Add করতে পারবা না। আগে Profile তৈরি + Approve করো!");
    return;
  }
  document.getElementById('vehicleModal').style.display='flex';
}
window.closeVehicle = function(){ document.getElementById('vehicleModal').style.display='none'; }

window.saveVehicle = async function(){
  let senaV = document.getElementById('vSena').value.trim();
  let podobi = document.getElementById('vPodobi').value.trim();
  let name = document.getElementById('vName').value.trim();
  let ba = document.getElementById('vBa').value.trim();
  let problem = document.getElementById('vProblem').value.trim();
  if(!senaV || !podobi || !name || !ba || !problem){ alert("সব ঘর পূরণ করো!"); return; }
  await addDoc(collection(db,"vehicle_problems"), { sena:senaV, podobi, name, ba, problem, date: new Date().toLocaleString('bn-BD'), createdAt: serverTimestamp() });
  renderVehicles(); closeVehicle();
  document.getElementById('vBa').value=''; document.getElementById('vProblem').value='';
  alert("✅ Vehicle Problem Add Done!");
}

window.deleteVehicle = async function(id){
  if(!isAdmin()){ alert("শুধু Admin Delete করতে পারবে"); return; }
  if(confirm("Delete করবে?")){ await deleteDoc(doc(db,"vehicle_problems",id)); renderVehicles(); }
}
</script>
</body>
</html>
