<script type="module">
... আগের সব একই থাকবে ...

window.doLogin=async()=>{
let sena = document.getElementById('senaNo').value.trim();
let pass = document.getElementById('mobilePass').value.trim();
if(!sena || !pass){alert('Sena No & Mobile Password দিন');return;}

try{
const q = query(collection(db,"profiles"), where("sena_no","==",sena), where("mobile","==",pass));
const snap = await getDocs(q);
if(snap.empty){alert("সেনা নং বা মোবাইল ভুল, অথবা Admin এখনো Approve করেনি!");return;}
const data = snap.docs[0].data();
if(data.status !== "approved"){alert("Pending আছে, Admin Approve করেনি");return;}

localStorage.setItem('sena_no', sena);
localStorage.setItem('sena_name', data.name);

// সবাই Command Dashboard এ যাবে - তুমি সহ
location.href='command-dashboard.html';

}catch(e){alert("Error: "+e.message);}
}
</script>
