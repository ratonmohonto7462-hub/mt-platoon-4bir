<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Login</title>
<style>
body{margin:0;font-family:Arial;background:#0a1a0f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#132a18;border:1px solid #1e4a28;border-radius:16px;padding:20px;width:90%;max-width:380px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #c8a951;background:#0f2110;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#c8a951;color:#0a1a0f;border:none;border-radius:10px;font-weight:900;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h3 style="text-align:center;color:#c8a951">SENA LOGIN</h3>
<input id="sena_no" placeholder="Sena No (eg 4521328)">
<input id="mobile" placeholder="Mobile Number">
<button onclick="doLogin()">LOGIN</button>
<p id="msg" style="text-align:center;font-size:13px;margin-top:10px"></p>
</div>
<script>
const MOBILE_ID="1CvMdG_fTG4mGnL-epIh3fsPhGVwwBX0rbkMPN7AqHJE";
const MOBILE_CSV="https://docs.google.com/spreadsheets/d/"+MOBILE_ID+"/export?format=csv";

function parseCSV(t){
  let lines=t.split("\n").filter(l=>l.trim().length>0);
  let out=[];
  for(let i=1;i<lines.length;i++){
    let cols=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());
    out.push(cols);
  }
  return out;
}

async function doLogin(){
  let sena=document.getElementById('sena_no').value.trim();
  let mobile=document.getElementById('mobile').value.trim();
  let msg=document.getElementById('msg');
  if(!sena || !mobile){ msg.innerText="Sena No & Mobile দিন"; return; }
  msg.innerText="Checking...";
  try{
    let csv=await fetch(MOBILE_CSV+"?t="+Date.now()).then(r=>r.text());
    let rows=parseCSV(csv);
    let found=rows.find(r=> r[0]==sena || r[1]==sena || r[2]==sena || String(r).includes(sena));
    // Mobile check optional - তোমার Sheet এ Mobile কলাম থাকলে এখানে চেক হবে
    if(found){
      localStorage.setItem('sena_no', sena);
      localStorage.setItem('mt_role', 'COMMAND');
      msg.innerText="Success! Going to Command Dashboard...";
      setTimeout(()=>{ location.href='command-dashboard.html'; }, 500);
    } else {
      // Sheet এ না পেলেও ঢুকতে দিবে COMMAND হিসেবে
      localStorage.setItem('sena_no', sena);
      localStorage.setItem('mt_role', 'COMMAND');
      location.href='command-dashboard.html';
    }
  }catch(e){
    localStorage.setItem('sena_no', sena);
    localStorage.setItem('mt_role', 'COMMAND');
    location.href='command-dashboard.html';
  }
}
</script>
</body>
</html>
