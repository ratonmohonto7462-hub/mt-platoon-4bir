<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT Platoon Group</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:10px}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px}
.member{padding:8px;border-bottom:1px solid #334155;display:flex;justify-content:space-between}
.msg{padding:6px 10px;background:#334155;border-radius:8px;margin:5px 0}
input,button{padding:10px;border-radius:8px;border:none;margin:4px 0}
button{background:#22c55e;color:#000;font-weight:bold;width:100%}
#chatBox{max-height:300px;overflow-y:auto;background:#1e293b;padding:10px;border-radius:10px}
</style>
</head>
<body>

<h2>🇧🇩 MT Platoon 4 BIR - Group</h2>

<div class="card">
<h3>Members</h3>
<div id="members">Loading members...</div>
</div>

<div class="card">
<h3>Group Chat</h3>
<div id="chatBox">Loading chat...</div>
<input id="msgInput" placeholder="Message likho..." style="width:70%">
<button onclick="sendMsg()" style="width:28%">Send</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzaoyIu0aETzIv0MC94SIJgcJ_nIQgbTLECGig_xhezPEYaGfoi91PLBjUgjAsEevbBzw/exec";
const MY_SENA = localStorage.getItem("sena_no") || "4521328";
const MY_NAME = localStorage.getItem("name") || "Roton Chandro Mohonto";

// 1. Load Members
function loadMembers(){
  fetch(API+"?action=getMembers")
  .then(r=>r.json())
  .then(data=>{
    let html="";
    data.forEach(m=>{
      html+=`<div class="member"><span>${m.sena} - ${m.name}</span><span>${m.status||'Active'}</span></div>`;
    });
    if(data.length==0) html="No member found";
    document.getElementById("members").innerHTML=html;
  });
}

// 2. Load Chat
function loadChat(){
  fetch(API+"?action=getMessages")
  .then(r=>r.json())
  .then(data=>{
    let html="";
    data.forEach(c=>{
      html+=`<div class="msg"><b>${c.name}:</b> ${c.text} <small style="opacity:.6">${c.time||''}</small></div>`;
    });
    document.getElementById("chatBox").innerHTML=html;
  });
}

// 3. Send Message
function sendMsg(){
  let text=document.getElementById("msgInput").value;
  if(!text) return;
  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"sendMessage", sena:MY_SENA, name:MY_NAME, text:text, time:new Date().toLocaleString()})
  }).then(()=>{
    document.getElementById("msgInput").value="";
    loadChat();
  });
}

loadMembers();
loadChat();
setInterval(loadChat,5000); // 5 sec por por auto refresh
</script>

</body>
</html>
