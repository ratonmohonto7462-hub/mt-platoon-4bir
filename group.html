<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group - Seniority</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0}
.top{background:#0a1a12;color:#fff;padding:14px;text-align:center}
.list{padding:10px}
.item{background:#fff;padding:12px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;border-left:4px solid #0e5d3e}
</style>
</head>
<body>
<div class="top"><b>Group Members - Seniority Wise</b></div>
<div class="list" id="list"></div>
<script>
let members = [];
let keysToTry = ['approvedMembers','approved','members','memberList','approved_members','allMembers'];

for(let k of keysToTry){
  try{
    let v = JSON.parse(localStorage.getItem(k) || '[]');
    if(Array.isArray(v) && v.length){
      // jodi approved flag thake, sudhu approved gula nibo
      let approvedOnly = v.filter(m => !('approved' in m) || m.approved === true || m.approved === 'true' || m.status === 'approved');
      members = members.concat(approvedOnly.length ? approvedOnly : v);
    }
  }catch(e){}
}

// duplicate senaNo thakle 1 bar rakhbo
let seen = {};
members = members.filter(m => {
  let key = String(m.senaNo || m.name || '');
  if(seen[key]) return false;
  seen[key] = true;
  return true;
});

// seniority = sena number, choto number age = besi senior
members.sort((a,b)=> Number(a.senaNo) - Number(b.senaNo));

document.getElementById('list').innerHTML = members.length ? members.map((m,i)=> `<div class="item"><span>${i+1}. ${m.senaNo} - ${m.name}</span><span>${m.rank||''}</span></div>`).join('') : '<p style="text-align:center;margin-top:20px">কোনো মেম্বার এখনো Add হয়নি</p>';
</script>
</body>
</html>
