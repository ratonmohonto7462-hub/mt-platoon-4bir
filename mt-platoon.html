<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT PLATOON Mobile - 4 BIR</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:90px}.top{padding:14px;display:flex;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.top b{color:#c8a951;font-size:14px}.back{font-size:28px;color:#c8a951;background:none;border:none;cursor:pointer}.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #c8a951;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.card{background:#111a2d;border-left:4px solid #c8a951;border-radius:14px;margin:12px 14px;border:1px solid #2a3a5a;overflow:hidden}.details{clear:both;padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}.btns{display:flex;gap:8px;padding:8px 12px 12px}.callBtn{flex:1;background:#0f172a;border:1px solid #c8a951;color:#c8a951;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.waBtn{flex:1;background:#0a1a0a;border:1px solid #25D366;color:#25D366;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.loading{padding:40px;text-align:center;color:#c8a951}</style></head><body>
<div class="phone"><div class="top"><button class="back" onclick="location.href='contact.html'">‹</button><div><b>MT PLATOON - Mobile Number</b><small id="cnt" style="color:#8a9bb5;display:block">Loading...</small></div></div>
<div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search Name / Army No..." oninput="render()"></div></div><div id="list"><div class="loading">⏳ Sheet থেকে Data আসছে...</div></div></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw2sl41kOPN1meSmv2B1TL5mYNlFp9xAR9jVCwMQeDV-A7EBAp1CwoeKiy21QbBe8IfpA/exec";
let data=[];
async function load(){
  try{
    let res = await fetch(API_URL);
    data = await res.json();
    document.getElementById('cnt').innerText = data.length + " Numbers - Live from Google Sheet";
    render();
  }catch(e){
    document.getElementById('list').innerHTML = "<p style='padding:20px;text-align:center;color:#ff6666'>Error! Sheet Public করো<br>"+e+"</p>";
  }
}
function render(){
  let q=document.getElementById('s').value.toLowerCase();
  let h='';
  data.forEach(o=>{
    if(q && !(`${o.name} ${o.army} ${o.mobile} ${o.licence}`.toLowerCase().includes(q))) return;
    let wa=(o.mobile||'').replace(/\D/g,'');
    if(wa.startsWith('0')) wa='88'+wa;
    h+=`<div class="card"><div style="padding:12px"><b>${o.rank||''} ${o.name||''}</b><br><small style="color:#c8a951">No: ${o.no||''} • ${o.army||''}</small></div><div class="details"><div><span class="label">Army No:</span></div><div><span class="label">Licence:</span></div><div><span class="val" style="color:#c8a951">${o.army||'-'}</span></div><div><span class="val" style="color:#22c55e;font-weight:900">${o.licence||'-'}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile||'-'}</span></div></div><div class="btns"><a class="callBtn" href="tel:${o.mobile}">📞 Call</a><a class="waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a></div></div>`;
  });
  document.getElementById('list').innerHTML=h||"<p style='padding:20px;text-align:center'>No Data - Sheet এ Data Add করো</p>";
}
load();
</script></body></html>
