<!DOCTYPE html> <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT PLATOON</title> <style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh}.top{padding:12px;display:flex;gap:8px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}.back{font-size:28px;color:#c8a951;background:none;border:none}.addBox{margin:14px;background:#111a2d;border:1px solid #25D366;border-radius:14px;padding:14px}.addBox input{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #2a3a5a;background:#0a1120;color:#fff}.row{display:flex;gap:8px}.row input{flex:1}.saveBtn{width:100%;margin-top:10px;padding:12px;background:#25D366;color:#000;border:none;border-radius:10px;font-weight:900}.search{margin:12px;background:#111a2d;border:1px solid #c8a951;border-radius:20px;padding:11px 14px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.card{background:#111a2d;border-left:4px solid #c8a951;border-radius:14px;margin:12px;border:1px solid #2a3a5a}.btns{display:flex;gap:6px;padding:10px}.btn{flex:1;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px;border:1px solid}</style> </head><body> <div class="phone"> <div class="top"><button class="back" onclick="location.href='communication.html'">‹</button><div style="flex:1"><b>MT PLATOON</b><small id="roleShow" style="display:block;color:#25D366">Loading...</small></div></div> <div id="addBox" class="addBox"> <h3 style="margin:0 0 10px;color:#25D366;font-size:14px">➕ Add / Edit Number</h3> <input type="hidden" id="editRow"> <div class="row"><input id="army" placeholder="সেনা নং *"><input id="rank" placeholder="পদবী"></div> <input id="name" placeholder="নাম *"> <div class="row"><input id="mobile" placeholder="মোবাইল নং *"><input id="licence" placeholder="লাইসেন্স"></div> <button class="saveBtn" onclick="saveData()">💾 Save to Sheet</button><p id="msg" style="text-align:center;font-size:12px"></p> </div> <div class="search">🔍 <input id="s" placeholder="Search নাম / সেনা নং..." oninput="render()"></div> <div id="list"><p style="padding:40px;text-align:center;color:#c8a951">⏳ Loading...</p></div> </div> <script>
 const API_URL = "https://script.google.com/macros/s/AKfycbxx_76hlM74drJ3I9D98O7PsPdlCVWdwDIh8ATULd-WlrIzTSbgVavPlaXwHeLk17M-Mw/exec";
 // === FINAL ROLE FIX ===
 let mtRoleRaw = localStorage.getItem("mt_role") || localStorage.getItem("role") || "";
 if(!mtRoleRaw){ location.href='index.html'; }
 let ROLE_UP = mtRoleRaw.toUpperCase().trim();
 let CAN_EDIT = ROLE_UP.includes("MT CLK") || ROLE_UP.includes("ADMIN") || ROLE_UP === "MT CLK";
 if(ROLE_UP.includes("COMMAND")) CAN_EDIT = false;

 function applyRole(){ let ab=document.getElementById('addBox'); let rs=document.getElementById('roleShow'); if(CAN_EDIT){ if(rs){ rs.innerText = '✏️ EDIT - MT CLK - Full Access'; rs.style.color = '#25D366'; } if(ab) ab.style.display = 'block'; } else { if(rs){ rs.innerText = '👁️ VIEW - COMMAND - View Only'; rs.style.color = '#ffcc00'; } if(ab) ab.style.display = 'none'; } }
 let data=[]; async function load(){ try{ let res = await fetch(API_URL); let txt = await res.text(); data = JSON.parse(txt); render(); }catch(e){ document.getElementById('list').innerHTML = "<p style='padding:20px;text-align:center;color:#ff4444'>❌ "+e+"<br><button onclick='load()'>Retry</button></p>"; } }
 function render(){ let q=document.getElementById('s').value.toLowerCase(); let h=''; data.forEach(o=>{ if(q && !`${o.name} ${o.army} ${o.mobile}`.toLowerCase().includes(q)) return; let wa=(o.mobile||'').toString().replace(/\D/g,''); if(wa.startsWith('0')) wa='88'+wa; let editDel = CAN_EDIT ? `<a class="btn" style="border-color:orange;color:orange;cursor:pointer" onclick="editData(${o.row})">✏️ Edit</a><a class="btn" style="border-color:#ff4444;color:#ff4444;cursor:pointer" onclick="deleteData(${o.row})">🗑️ Del</a>` : ''; h+=`<div class="card"><div style="padding:12px"><b>${o.rank||''} ${o.name||''}</b><br><small style="color:#c8a951">সেনা নং: ${o.army||''} • লাইসেন্স: ${o.licence||''}</small></div><div style="padding:0 12px 8px;font-size:12px">📱 ${o.mobile||''}</div><div class="btns"><a class="btn" style="background:#0f172a;border-color:#c8a951;color:#c8a951" href="tel:${o.mobile}">📞 Call</a><a class="btn" style="background:#0a1a0a;border-color:#25D366;color:#25D366" href="https://wa.me/${wa}">💬 WA</a>${editDel}</div></div>`; }); document.getElementById('list').innerHTML=h||"<p style='padding:20px;text-align:center'>No Data</p>"; applyRole(); }
 async function saveData(){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); let r=document.getElementById('editRow').value; let p={army:document.getElementById('army').value, rank:document.getElementById('rank').value, name:document.getElementById('name').value, mobile:document.getElementById('mobile').value, licence:document.getElementById('licence').value, action:r?"edit":"add", row:r?parseInt(r):0}; if(!p.name||!p.mobile||!p.army){alert("সেনা নং, নাম ও মোবাইল লাগবে!");return;} document.getElementById('msg').innerText="⏳ Saving..."; await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(p)}); document.getElementById('msg').innerText="✅ Saved! Reloading..."; setTimeout(()=>location.reload(),1200); }
 function editData(r){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); let o=data.find(x=>x.row===r);document.getElementById('editRow').value=o.row;document.getElementById('army').value=o.army;document.getElementById('rank').value=o.rank;document.getElementById('name').value=o.name;document.getElementById('mobile').value=o.mobile;document.getElementById('licence').value=o.licence;window.scrollTo(0,0);}
 async function deleteData(r){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); if(!confirm("Delete করবা?"))return;await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row:r})});alert("Deleted!");location.reload();}
 applyRole(); load();
</script></body></html>
