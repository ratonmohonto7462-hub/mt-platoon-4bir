<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT PLATOON - 4 BIR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070d1a;color:#fff}
.phone{max-width:430px;margin:0 auto;background:#0a1120;min-height:100vh;padding-bottom:20px}
.top{padding:14px;display:flex;gap:10px;border-bottom:1px solid #1e2f4a;position:sticky;top:0;background:#0a1120;z-index:10}
.top b{color:#c8a951;font-size:15px}.back{font-size:28px;color:#c8a951;background:none;border:none;cursor:pointer}
.addBox{margin:14px;background:#111a2d;border:1px solid #25D366;border-radius:14px;padding:14px}
.addBox h3{margin:0 0 10px;color:#25D366;font-size:14px}
.addBox input{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #2a3a5a;background:#0a1120;color:#fff;outline:none}
.row{display:flex;gap:8px}.row input{flex:1}
.saveBtn{width:100%;margin-top:10px;padding:11px;background:#25D366;color:#000;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.searchWrap{padding:10px 14px}.search{width:100%;background:#111a2d;border:1px solid #c8a951;border-radius:20px;padding:11px 14px;display:flex;gap:8px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.card{background:#111a2d;border-left:4px solid #c8a951;border-radius:14px;margin:12px 14px;border:1px solid #2a3a5a}
.details{padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px}
.label{color:#8a9bb5}.val{color:#fff;font-weight:700}.full{grid-column:1/span 2}
.btns{display:flex;gap:6px;padding:8px 12px 12px;flex-wrap:wrap}
.btn{flex:1;border-radius:8px;padding:9px;text-align:center;text-decoration:none;font-weight:900;font-size:12px;border:1px solid}
.callBtn{background:#0f172a;border-color:#c8a951;color:#c8a951}
.waBtn{background:#0a1a0a;border-color:#25D366;color:#25D366}
.editBtn{background:#1a160a;border-color:orange;color:orange;cursor:pointer}
.delBtn{background:#1a0a0a;border-color:#ff4444;color:#ff4444;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
<div class="top"><button class="back" onclick="location.href='index.html'">‹</button>
<div style="flex:1"><b>MT PLATOON - Mobile Number</b><small id="roleInfo" style="color:#8a9bb5;display:block"></small><small id="cnt" style="color:#8a9bb5;display:block">Loading...</small></div>
</div>

<!-- CLK হলে Add Box দেখাবে, COMMAND হলে না -->
<div id="addBox" class="addBox">
<h3>➕ নতুন Number Add (Sheet এ যাবে)</h3>
<input type="hidden" id="editRow">
<div class="row"><input id="no" placeholder="No"><input id="rank" placeholder="Rank"></div>
<input id="name" placeholder="Name *">
<div class="row"><input id="army" placeholder="Army No *"><input id="licence" placeholder="Licence (MC/3Ton)"></div>
<input id="mobile" placeholder="Mobile No *">
<button class="saveBtn" onclick="saveData()">💾 Save to Sheet</button>
<p id="saveMsg" style="text-align:center;font-size:12px;margin-top:8px"></p>
</div>

<div class="searchWrap"><div class="search">🔍 <input id="s" placeholder="Search Name / Army No..." oninput="render()"></div></div>
<div id="list"><p style="padding:40px;text-align:center;color:#c8a951">⏳ Sheet থেকে Data আসছে...</p></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw2sl41kOPN1meSmv2B1TL5mYNlFp9xAR9jVCwMQeDV-A7EBAp1CwoeKiy21QbBe8IfpA/exec";
let data=[];

// Main Website থেকে Role নিবে
let role = localStorage.getItem("userRole") || "COMMAND";
let isCLK = role.toUpperCase().includes("CLK");
document.getElementById('roleInfo').innerText = "Login: " + role + (isCLK ? " - Full Access" : " - View Only");
document.getElementById('addBox').style.display = isCLK ? "block" : "none";

async function load(){
 try{
   let res = await fetch(API_URL);
   data = await res.json();
   document.getElementById('cnt').innerText = data.length + " Numbers - Live";
   render();
 }catch(e){
   document.getElementById('list').innerHTML = "<p style='padding:20px;text-align:center;color:#ff6666'>Failed! Apps Script New Version Deploy করো</p>";
 }
}
function render(){
 let q=document.getElementById('s').value.toLowerCase();
 let h='';
 data.forEach(o=>{
   if(q && !(`${o.name} ${o.army} ${o.mobile} ${o.licence}`.toLowerCase().includes(q))) return;
   let wa=(o.mobile||'').replace(/\D/g,''); if(wa.startsWith('0')) wa='88'+wa;
   let editDel = isCLK ? `<button class="btn editBtn" onclick="editData(${o.row})">✏️ Edit</button><button class="btn delBtn" onclick="deleteData(${o.row})">🗑️ Delete</button>` : '';
   h+=`<div class="card"><div style="padding:12px"><b>${o.rank||''} ${o.name||''}</b><br><small style="color:#c8a951">No: ${o.no||''} • ${o.army||''}</small></div><div class="details"><div><span class="label">Army No:</span></div><div><span class="label">Licence:</span></div><div><span class="val" style="color:#c8a951">${o.army||'-'}</span></div><div><span class="val" style="color:#22c55e">${o.licence||'-'}</span></div><div class="full"><span class="label">Mobile:</span> <span class="val">${o.mobile||'-'}</span></div></div><div class="btns"><a class="btn callBtn" href="tel:${o.mobile}">📞 Call</a><a class="btn waBtn" href="https://wa.me/${wa}">💬 WhatsApp</a>${editDel}</div></div>`;
 });
 document.getElementById('list').innerHTML=h||"<p style='padding:20px;text-align:center'>No Data</p>";
}
async function saveData(){
 let row=document.getElementById('editRow').value;
 let payload={no:document.getElementById('no').value,rank:document.getElementById('rank').value,name:document.getElementById('name').value,army:document.getElementById('army').value,mobile:document.getElementById('mobile').value,licence:document.getElementById('licence').value,action: row ? "edit" : "add",row: row ? parseInt(row) : 0};
 if(!payload.name || !payload.mobile){alert("Name & Mobile লাগবে!");return;}
 document.getElementById('saveMsg').innerText="⏳ Saving...";
 await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
 document.getElementById('saveMsg').innerText="✅ Saved! Reloading...";
 setTimeout(()=>location.reload(),1500);
}
function editData(r){let o=data.find(x=>x.row===r);document.getElementById('editRow').value=o.row;document.getElementById('no').value=o.no;document.getElementById('rank').value=o.rank;document.getElementById('name').value=o.name;document.getElementById('army').value=o.army;document.getElementById('mobile').value=o.mobile;document.getElementById('licence').value=o.licence;window.scrollTo(0,0);}
async function deleteData(r){if(!confirm("Delete করবা?"))return;await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row:r})});alert("Deleted!");location.reload();}
load();
</script>
</body>
</html>
