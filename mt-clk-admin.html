<script> 
let cur="";function toggleDrop(){document.getElementById('drop').classList.toggle('open')} 
function selectOpt(v,el){cur=v;document.getElementById('selText').innerText=v;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('drop').classList.remove('open');} 
function doLogin(){ 
  let p=document.getElementById('pwd').value; 
  if(!cur){alert('ROLE / UNIT Select করুন');return;} 
  if(!p){alert('পাসওয়ার্ড দিন');return;} 
  if(cur==="COMMAND" && p==="4-Bir-mt"){
    localStorage.setItem('mt_role','COMMAND');
    location.href="dashboard.html";
  } 
  else if(cur==="MT CLK" && p==="Admin7462"){
    localStorage.setItem('mt_role','MT CLK');
    location.href="dashboard.html";
  } 
  else if(cur==="ADMIN" && p==="Admin2026"){
    localStorage.setItem('mt_role','ADMIN');
    location.href="mt-clk-admin.html";
  } 
  else{
    alert('Password ভুল!\nCOMMAND = 4-Bir-mt\nMT CLK = Admin7462\nADMIN = Admin2026');
  } 
} 
window.addEventListener('click',e=>{if(!e.target.closest('.select-area')) document.getElementById('drop').classList.remove('open')}); 
</script>
