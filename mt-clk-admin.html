<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Platoon - Login</title>
<style>
body{margin:0;font-family:system-ui;background:#0a1a12;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:90%;max-width:360px;background:#143d27;padding:25px;border-radius:16px;border:1px solid #2a5a3a}
input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #2a5a3a;background:#0a1a12;color:#fff}
button{width:100%;padding:13px;background:#00c853;color:#000;font-weight:800;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h3 style="text-align:center">4 BIR - MT PLATOON LOGIN</h3>
<input id="mobile" placeholder="Mobile Number">
<input id="sena_no" placeholder="Sena No - 4521328">
<input id="pwd" type="password" placeholder="Password">
<button onclick="loginUser()">LOGIN</button>
</div>

<script>
function loginUser(){
  const mobile = document.getElementById("mobile").value.trim();
  const sena = document.getElementById("sena_no").value.trim();
  const pwd = document.getElementById("pwd").value.trim();
  if(!mobile || !sena || !pwd){ alert("সব ঘর পূরণ করো"); return; }

  // সব Key Save যাতে কোন Dashboard এ Pending না দেখায়
  localStorage.setItem("mobile", mobile);
  localStorage.setItem("sena_no", sena);
  localStorage.setItem("mt_army", sena);
  localStorage.setItem("mt_mobile", mobile);
  localStorage.setItem("mt_role", "COMMAND");
  localStorage.setItem("name", "Roton Chandro Mohonto");
  localStorage.setItem("mt_approved_"+sena, "true");
  localStorage.removeItem("pending_sena");

  // সবাই Home Page এ যাবে
  location.href='command-Homepage.html';
}
</script>
</body>
</html>
