<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইঞ্জিন অয়েল বদলি</title><style>body{margin:0;font-family:Arial;background:#eef2f5}.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.logout{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900}.wrap{padding:14px;max-width:1100px;margin:0 auto}.card{background:white;padding:16px;border-radius:16px;box-shadow:0 4px 12px #0001;margin-bottom:14px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-add{width:100%;padding:14px;background:#0a4d0a;color:white;border:none;border-radius:12px;font-weight:900;font-size:16px}.tit{text-align:center;font-weight:900;margin:14px 0;color:#0a4d0a;font-size:19px}.btn-print{background:#1a73e8;color:white;border:none;padding:10px 20px;border-radius:10px;font-weight:900;display:block;margin:12px auto;cursor:pointer}table{width:100%;border-collapse:collapse;background:white;font-size:14px}th{background:#0a4d0a;color:white;padding:11px;border:1px solid #000}td{padding:10px;border:1px solid #000;text-align:center}.over{color:red;font-weight:900}.ok{color:green;font-weight:900}@media print{.top,#box,.btn-print{display:none!important}th:last-child,td:last-child{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:none}}</style></head><body><div class="top"><b>ইঞ্জিন অয়েল বদলি - 4 BIR</b><button class="logout" onclick="location.href='oil.html'">BACK</button></div><div class="wrap"><div id="box" class="card"><div class="grid2"><input id="vehicle" placeholder="বিএ নং (যেমন: BA-1234)"><input type="date" id="fdate"></div><div class="grid2"><input type="date" id="nextdate"><input id="remarks" placeholder="মন্তব্য (ঐচ্ছিক)"></div><button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button><p id="msg" style="text-align:center;color:green;font-weight:900"></p></div><div class="tit">ইঞ্জিন অয়েল বদলি রিপোর্ট</div><button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button><div class="card" style="overflow:auto"><table><thead><tr><th>বিএ নং</th><th>বদলির তারিখ</th><th>পরবর্তী বদলির তারিখ</th><th>দিন</th><th>একশন</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script>const KEY="EngineOilFinal";let editIdx=-1;window.onload=function(){document.getElementById('fdate').valueAsDate=new Date();let nd=new Date();nd.setMonth(nd.getMonth()+3);document.getElementById('nextdate').valueAsDate=nd;load();};function getData(){return JSON.parse(localStorage.getItem(KEY)||"[]");}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}function calcDays(nextStr){let today=new Date();today.setHours(0,0,0,0);let nxt=new Date(nextStr);nxt.setHours(0,0,0,0);let diff=Math.ceil((nxt-today)/(1000*60*60*24));return diff;}function load(){let d=getData();let tb=document.getElementById('tbl');tb.innerHTML='';if(!d.length){tb.innerHTML='<tr><td colspan="5">কোনো ডাটা নাই</td></tr>';return;}d.forEach((x,i)=>{let days=calcDays(x.nextdate);let dayTxt=days>0?`${days} দিন বাকি`:days==0?`আজকেই`:`${Math.abs(days)} দিন Over`;let cls=days<=7?'over':'ok';tb.innerHTML+=`<tr><td>${x.vehicle}</td><td>${x.fdate}</td><td>${x.nextdate}</td><td class="${cls}">${dayTxt}</td><td><button onclick="editD(${i})" style="background:orange;color:white;border:none;padding:5px 8px;border-radius:5px">Edit</button> <button onclick="delD(${i})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:5px">Del</button></td></tr>`});}function editD(i){let x=getData()[i];editIdx=i;vehicle.value=x.vehicle;fdate.value=x.fdate;nextdate.value=x.nextdate;remarks.value=x.remarks||'';mainBtn.innerText='Update করুন';window.scrollTo(0,0);}function delD(i){if(!confirm('Delete করবেন?'))return;let d=getData();d.splice(i,1);saveData(d);load();}function addData(){let ve=vehicle.value.trim(),fd=fdate.value,nd=nextdate.value,re=remarks.value.trim();if(!ve||!fd||!nd){alert('বিএ নং, বদলির তারিখ, পরবর্তী তারিখ লাগবে');return;}let d=getData();let obj={vehicle:ve,fdate:fd,nextdate:nd,remarks:re};if(editIdx==-1){d.push(obj);msg.innerText='✅ Add হয়েছে';}else{d[editIdx]=obj;editIdx=-1;mainBtn.innerText='Add করুন';msg.innerText='✅ Update হয়েছে';}saveData(d);vehicle.value=remarks.value='';load();}</script></body></html>
