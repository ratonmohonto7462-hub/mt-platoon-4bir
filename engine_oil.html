<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ইঞ্জিন অয়েল - 4 BIR</title><style>body{margin:0;font-family:Arial;background:#eef3f7}.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.back{background:#d50000;color:white;border:none;padding:8px 18px;border-radius:12px;font-weight:900}.wrap{max-width:1150px;margin:10px auto;padding:10px}.box{background:white;border-radius:14px;padding:12px;border:1px solid #ccc}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}}input,button{padding:9px;border-radius:8px;border:1px solid #888;width:100%;box-sizing:border-box}.btn{background:#0a4d0a;color:white;font-weight:900;border:none;cursor:pointer}.btn-print{background:#000;color:#fff;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}th,td{border:1px solid #333;padding:5px;text-align:center}th{background:#d6e9d8}@media print{.no-print{display:none !important}body{background:#fff}.wrap{margin:0;padding:0}.box{border:none}}</style></head><body><div class="top no-print"><b>ইঞ্জিন অয়েল বদলি - 4 BIR</b><div><button class="back" onclick="location.href='dashboard.html'">BACK</button> <button onclick="localStorage.clear();location.href='index.html'" style="background:black;color:white;border:none;padding:8px 12px;border-radius:10px;font-weight:700">Logout</button></div></div><div class="wrap"><div id="formBox" class="box no-print"><div class="row"><input id="ba" placeholder="বিএ নং"><input id="model" placeholder="গাড়ির মডেল"><input id="date" type="date"><input id="km" type="number" placeholder="KM"><input id="nextdate" type="date"><input id="nextkm" type="number" placeholder="Next KM"><input id="qty" type="number" placeholder="পরিমাণ (L)"><input id="days" type="number" placeholder="দিন"></div><br><button class="btn" onclick="addData()">Save to Google Sheet</button><button class="btn btn-print" onclick="window.print()">🖨️ Print / PDF</button></div><div class="box"><div style="text-align:center;color:#0a4d0a;font-weight:900;margin-bottom:8px">ইঞ্জিন অয়েল রিপোর্ট - 4 BIR <span id="roleBadge" style="background:#ddd;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:8px"></span></div><div style="overflow:auto"><table><thead><tr><th>বিএ নং</th><th>মডেল</th><th>বদলির তারিখ</th><th>KM</th><th>পরবর্তী তারিখ</th><th>Next KM</th><th>পরিমাণ</th><th>দিন</th><th class="no-print del-col">X</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div><script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbyNxW7u9Jb4fkUDmVjy-zA-2-V8MyeWD_zCqAm4WBwAmXnyTr0FlGSlGdRIsJyk3FkPpw/exec";
const role=localStorage.getItem("role"); if(!role) location.href="index.html";
document.getElementById("roleBadge").innerText=role==="mt"?"MT PLATOON (View Only)":"MT CLK (Admin)";
if(role==="mt"){document.getElementById("formBox").style.display="none"; document.querySelectorAll(".del-col").forEach(e=>e.style.display="none");}
let data=JSON.parse(localStorage.getItem("engine_oil_4bir")||"[]");
function addData(){if(role==="mt") return alert("⛔ MT PLATOON Add করতে পারবে না!"); let r={ba:ba.value,model:model.value,date:date.value,km:km.value,nextdate:nextdate.value,nextkm:nextkm.value,qty:qty.value,days:days.value,type:"engine"}; if(!r.ba) return alert("বিএ নং দিন"); data.push(r);localStorage.setItem("engine_oil_4bir",JSON.stringify(data));render();fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams(r)});document.querySelectorAll(".row input").forEach(i=>i.value="");}
function render(){tbody.innerHTML="";data.forEach((r,i)=>{tbody.innerHTML+=`<tr><td>${r.ba}</td><td>${r.model}</td><td>${r.date}</td><td>${r.km}</td><td>${r.nextdate}</td><td>${r.nextkm}</td><td>${r.qty}</td><td>${r.days}</td>${role==="mt"?"":`<td class="no-print del-col"><button onclick="del(${i})" style="background:red;color:white;border:none;padding:3px 7px;border-radius:5px">X</button></td>`}</tr>`;});}
function del(i){if(role==="mt") return alert("⛔ Delete করার অনুমতি নেই!"); data.splice(i,1);localStorage.setItem('engine_oil_4bir',JSON.stringify(data));render();}render();
</script></body></html>
