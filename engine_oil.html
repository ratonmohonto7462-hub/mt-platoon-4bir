<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ইঞ্জিন অয়েল বদলি - 4 BIR</title>
<style>
body{margin:0;font-family:Arial;background:#e8eef3}
.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px;font-weight:900}
.logout{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900;cursor:pointer}
.wrap{padding:14px;max-width:900px;margin:0 auto}
.card{background:white;padding:18px;border-radius:22px;box-shadow:0 4px 14px #0001;margin-bottom:16px}
input{width:100%;padding:14px 16px;border:1.5px solid #bbb;border-radius:14px;margin-bottom:12px;box-sizing:border-box;font-size:15px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-add{width:100%;padding:15px;background:#0a4d0a;color:white;border:none;border-radius:14px;font-size:17px;font-weight:900;cursor:pointer}
.tit{text-align:center;font-size:20px;font-weight:900;margin:18px 0 10px;color:#0a4d0a}
.btn-print{background:#1a73e8;color:white;border:none;padding:10px 22px;border-radius:10px;font-weight:900;display:block;margin:12px auto;cursor:pointer;font-size:15px}
table{width:100%;border-collapse:collapse;background:white;font-size:14px}
th{background:#0a4d0a;color:white;padding:11px 6px;border:1px solid #000}
td{padding:9px 6px;border:1px solid #000;text-align:center;word-break:break-word}
.view-only{color:#b00000;font-weight:900;text-align:center;padding:10px}
@media print{
 .top,#box,.btn-print,.logout{display:none!important}
  th:last-child,td:last-child{display:none!important}
  body{background:white}
 .wrap{padding:0}
 .card{box-shadow:none;border:none;border-radius:0;padding:0}
}
</style>
</head>
<body>
<div class="top"><b>ইঞ্জিন অয়েল বদলি - 4 BIR</b><button class="logout" onclick="location.href='oil.html'">BACK TO FUEL</button></div>

<div class="wrap">
<div id="box" class="card">
<div class="grid2">
<input type="date" id="fdate">
<input id="vehicle" placeholder="গাড়ী নং">
</div>
<div class="grid2">
<input id="qty" type="number" placeholder="পরিমাণ (L)">
<input id="km" type="number" placeholder="KM">
</div>
<div class="grid2">
<input id="nextkm" type="number" placeholder="Next KM">
<input id="remarks" placeholder="মন্তব্য">
</div>
<button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button>
<p id="msg" style="text-align:center;font-weight:900;color:green;margin:10px 0 0"></p>
</div>

<div class="tit">ইঞ্জিন অয়েল বদলি রিপোর্ট</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

<div class="card" style="overflow:auto;padding:12px">
<table>
<thead><tr><th>তারিখ</th><th>গাড়ী</th><th>L</th><th>KM</th><th>Next</th><th>মন্তব্য</th><th>একশন</th></tr></thead>
<tbody id="tbl"></tbody>
</table>
<p id="roleMsg" class="view-only" style="display:none">MT Platoon - শুধু দেখতে পারবে (Edit/Delete CLK করবে)</p>
</div>
</div>

<script>
const KEY="EngineOil_MTCLK";
let role=(localStorage.getItem('role')||'').toLowerCase();
let editIdx=-1;

window.onload=function(){
  document.getElementById('fdate').valueAsDate=new Date();
  // Role check
  if(role==='mt'){
    document.getElementById('box').style.display='none';
    document.getElementById('roleMsg').style.display='block';
  }
  load();
};

function getData(){ return JSON.parse(localStorage.getItem(KEY)||"[]"); }
function saveData(d){ localStorage.setItem(KEY, JSON.stringify(d)); }

function load(){
  let d=getData();
  let tb=document.getElementById('tbl');
  tb.innerHTML='';
  if(!d.length){ tb.innerHTML='<tr><td colspan="7">কোনো ডাটা নাই</td></tr>'; return; }
  d.forEach((x,i)=>{
    let act = role==='clk'? `<button onclick="editD(${i})" style="background:orange;color:white;border:none;padding:5px 8px;border-radius:6px">Edit</button> <button onclick="delD(${i})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:6px">Del</button>` : `-`;
    tb.innerHTML+=`<tr><td>${x.date}</td><td>${x.vehicle}</td><td>${x.qty}</td><td>${x.km}</td><td>${x.nextkm}</td><td>${x.remarks||''}</td><td>${act}</td></tr>`;
  });
}

function editD(i){
  if(role!=='clk'){ alert('শুধু CLK Edit করতে পারবে'); return; }
  let x=getData()[i];
  editIdx=i;
  fdate.value=x.date; vehicle.value=x.vehicle; qty.value=x.qty;
  km.value=x.km; nextkm.value=x.nextkm; remarks.value=x.remarks;
  mainBtn.innerText='Update করুন';
  window.scrollTo(0,0);
}

function delD(i){
  if(role!=='clk'){ alert('শুধু CLK Delete করতে পারবে'); return; }
  if(!confirm('Delete করবেন?')) return;
  let d=getData(); d.splice(i,1); saveData(d); load();
}

function addData(){
  if(role!=='clk'){ alert('শুধু CLK Add করতে পারবে'); return; }
  let dt=fdate.value, ve=vehicle.value.trim(), qt=qty.value||0, k=km.value||0, nk=nextkm.value||0, re=remarks.value.trim();
  if(!dt||!ve){ alert('তারিখ ও গাড়ী নং লাগবে'); return; }
  let d=getData();
  let obj={date:dt, vehicle:ve, qty:qt, km:k, nextkm:nk, remarks:re};
  if(editIdx==-1){ d.push(obj); msg.innerText='✅ Add হয়েছে'; }
  else{ d[editIdx]=obj; editIdx=-1; mainBtn.innerText='Add করুন'; msg.innerText='✅ Update হয়েছে'; }
  saveData(d);
  vehicle.value=qty.value=km.value=nextkm.value=remarks.value='';
  load();
}
</script>
</body>
</html>
