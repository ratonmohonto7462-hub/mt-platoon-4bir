<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইঞ্জিন অয়েল বদলি</title><style>body{margin:0;font-family:Arial;background:#eef2f5}.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.logout{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900}.wrap{padding:14px;max-width:1100px;margin:0 auto}.card{background:white;padding:16px;border-radius:16px;box-shadow:0 4px 12px #0001;margin-bottom:14px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-add{width:100%;padding:14px;background:#0a4d0a;color:white;border:none;border-radius:12px;font-weight:900}.tit{text-align:center;font-weight:900;margin:14px 0;color:#0a4d0a}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th{background:#0a4d0a;color:white;padding:10px;border:1px solid #000}td{padding:8px;border:1px solid #000;text-align:center}</style></head><body><div class="top"><b>ইঞ্জিন অয়েল বদলি - 4 BIR</b><button class="logout" onclick="location.href='fuel.html'">BACK TO FUEL</button></div><div class="wrap"><div id="box" class="card"><div class="grid2"><input type="date" id="fdate"><input id="vehicle" placeholder="গাড়ী নং"></div><div class="grid2"><input id="qty" type="number" placeholder="পরিমাণ (L)"><input id="km" type="number" placeholder="KM"></div><div class="grid2"><input id="nextkm" type="number" placeholder="Next KM"><input id="cost" type="number" placeholder="টাকা"></div><input id="remarks" placeholder="মন্তব্য"><button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button><p id="msg" style="text-align:center;font-weight:900;color:green"></p></div><div class="tit">ইঞ্জিন অয়েল বদলি রিপোর্ট</div><div class="card" style="overflow:auto"><table><thead><tr><th>তারিখ</th><th>গাড়ী</th><th>L</th><th>KM</th><th>Next</th><th>টাকা</th><th>মন্তব্য</th><th>একশন</th></tr></thead><tbody id="tbl"></tbody></table></div></div><script>const KEY="EngineOilData";let editIdx=-1;window.onload=function(){let r=localStorage.getItem('role')||'';if(r.toLowerCase()!=='clk' && r!=='admin7462'){alert('CLK দিয়ে Login করো, MT দিয়ে Add হবে না');location.href='index.html';return;}document.getElementById('fdate').valueAsDate=new Date();load();};function getData(){return JSON.parse(localStorage.getItem(KEY)||"[]");}function saveData(d){localStorage.setItem(KEY,JSON.stringify(d));}function load(){let d=getData();let tb=document.getElementById('tbl');tb.innerHTML='';if(!d.length){tb.innerHTML='<tr><td colspan="8">কোনো ডাটা নাই</td></tr>';return}d.forEach((x,i)=>{tb.innerHTML+=`<tr><td>${x.date}</td><td>${x.vehicle}</td><td>${x.qty}</td><td>${x.km}</td><td>${x.nextkm}</td><td>${x.cost}</td><td>${x.remarks}</td><td><button onclick="editD(${i})" style="background:orange;color:white;border:none;padding:5px 8px;border-radius:5px">Edit</button> <button onclick="delD(${i})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:5px">Del</button></td></tr>`});}function editD(i){let x=getData()[i];editIdx=i;fdate.value=x.date;vehicle.value=x.vehicle;qty.value=x.qty;km.value=x.km;nextkm.value=x.nextkm;cost.value=x.cost;remarks.value=x.remarks;mainBtn.innerText='Update করুন';window.scrollTo(0,0);}function delD(i){if(!confirm('Delete?'))return;let d=getData();d.splice(i,1);saveData(d);load();}function addData(){let dt=fdate.value,ve=vehicle.value.trim();if(!dt||!ve){document.getElementById('msg').innerText='তারিখ ও গাড়ী নং লাগবে';return;}let d=getData();let obj={date:dt,vehicle:ve,qty:qty.value||0,km:km.value||0,nextkm:nextkm.value||0,cost:cost.value||0,remarks:remarks.value.trim()};if(editIdx==-1){d.push(obj);document.getElementById('msg').innerText='✅ Add হয়েছে';}else{d[editIdx]=obj;editIdx=-1;mainBtn.innerText='Add করুন';document.getElementById('msg').innerText='✅ Update হয়েছে';}saveData(d);vehicle.value=qty.value=km.value=nextkm.value=cost.value=remarks.value='';load();}</script></body></html>
