<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT PLATOON - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2;padding-bottom:90px}
.top{background:#0a1a12;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center}
.call{background:#0e5d3e;color:#ffcc00;padding:11px 15px;font-weight:900;font-size:15px}
.welcome{background:#ffcc00;color:#0a1a12;padding:11px 15px;font-weight:900;font-size:15px;text-align:center;letter-spacing:1px}
.banner{width:100%;height:250px}.banner img{width:100%;height:100%;object-fit:cover}
.sec{padding:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#143d27;display:flex;justify-content:space-around;padding:12px 0}
.nav div{color:#fff;text-align:center;cursor:pointer}
.sir-card{background:#fff;border-radius:16px;padding:20px 15px;margin-bottom:18px;text-align:center;border:1px solid #ddd;position:relative}
.sir-card h4{color:#0e5d3e;font-weight:900;font-size:22px;margin-bottom:5px}
.sir-card .sena-name{font-weight:900;color:#000;font-size:18px;margin-bottom:15px}
.sir-card img{width:240px;height:300px;object-fit:cover;border-radius:14px;border:4px solid #0e5d3e}
.edit-btn{display:none;position:absolute;top:12px;right:12px;background:#ffcc00;color:#000;border:none;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:900;cursor:pointer}
.notice-item{background:#fffbe6;padding:12px;border-left:4px solid #ffcc00;margin-top:10px;border-radius:8px;position:relative}
.notice-actions{display:none;position:absolute;top:5px;right:5px}
.notice-actions button{border:none;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:900;margin-left:4px;cursor:pointer}
.btn-add{display:none;background:#0e5d3e;color:#fff;padding:8px 15px;border:none;border-radius:20px;font-weight:900;margin-top:10px;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <b>4 BIR - MT PLATOON</b>
  <b onclick="location.href='own-profile.html'" style="background:#ffcc00;color:#000;padding:7px 13px;border-radius:50%;cursor:pointer">R</b>
</div>

<div class="call">📞 Call Us: 01769-013433</div>
<div class="welcome">🎖️ Welcome To MT Platoon 🎖️</div>
<div class="banner"><img src="https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=800"></div>

<div class="sec">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="color:#0e5d3e">📢 NOTICE BOARD</h3>
    <button id="addNoticeBtn" class="btn-add" onclick="addNotice()">+ Add</button>
  </div>
  <div id="noticeList"></div>
</div>

<div class="sec">
  <h3 style="color:#0e5d3e;margin-bottom:14px">🎖️ MT COMMAND</h3>

  <div class="sir-card">
    <button class="edit-btn" onclick="editContact('qm')">✏️ Edit</button>
    <h4>QM</h4>
    <div class="sena-name" id="name-qm">Capt Mohammad Ali Akbor Arko</div>
    <img id="img-qm" src="https://i.imgur.com/8Km9tLL.png">
  </div>

  <div class="sir-card">
    <button class="edit-btn" onclick="editContact('jco')">✏️ Edit</button>
    <h4>MT JCO</h4>
    <div class="sena-name" id="name-jco">Subedar Name Here</div>
    <img id="img-jco" src="https://i.imgur.com/8Km9tLL.png">
  </div>

  <div class="sir-card">
    <button class="edit-btn" onclick="editContact('nco')">✏️ Edit</button>
    <h4>MT NCO</h4>
    <div class="sena-name" id="name-nco">Sgt Name Here</div>
    <img id="img-nco" src="https://i.imgur.com/8Km9tLL.png">
  </div>

</div>

<div class="nav">
  <div style="color:#22c55e;font-weight:900">🏡<br>Home Page</div>
  <div onclick="location.href='group.html'">👥<br>Group</div>
</div>

<script>
function checkAdmin(){
  let user = JSON.parse(localStorage.getItem('currentUser') || '{}');
  if(user.senaNo == "4521328"){
    user.isAdmin = true;
    localStorage.setItem('currentUser', JSON.stringify(user));
  }
  if(user.isAdmin || user.senaNo == "4521328"){
    document.querySelectorAll('.edit-btn').forEach(b=>b.style.display='block');
    document.getElementById('addNoticeBtn').style.display='block';
    document.querySelectorAll('.notice-actions').forEach(b=>b.style.display='block');
    return true;
  }
  return false;
}

function loadContacts(){
  let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}');
  if(data.qm){ document.getElementById('name-qm').innerText=data.qm.name; document.getElementById('img-qm').src=data.qm.img; }
  if(data.jco){ document.getElementById('name-jco').innerText=data.jco.name; document.getElementById('img-jco').src=data.jco.img; }
  if(data.nco){ document.getElementById('name-nco').innerText=data.nco.name; document.getElementById('img-nco').src=data.nco.img; }
}
loadContacts();

function editContact(type){
  let user = JSON.parse(localStorage.getItem('currentUser') || '{}');
  if(user.senaNo != "4521328" && !user.isAdmin){ alert("শুধু 4521328 Edit করতে পারবে!"); return; }
  let name = prompt("নতুন নাম লিখো:");
  let img = prompt("নতুন ছবির লিংক দাও:");
  if(!name && !img) return;
  let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}');
  data[type] = { name: name || document.getElementById('name-'+type).innerText, img: img || document.getElementById('img-'+type).src };
  localStorage.setItem('emergencyContacts', JSON.stringify(data));
  loadContacts();
  alert("✅ Update Done!");
}

// NOTICE BOARD SYSTEM
let notices = JSON.parse(localStorage.getItem('mtNotices') || '["📅 10/31/2026: যারা নাইট পাশ যেতে ইচ্ছুক তারা লিভ কার্ড জমা করেন"]');

function renderNotices(){
  let list = document.getElementById('noticeList');
  list.innerHTML = "";
  notices.forEach((n,i)=>{
    let isAdmin = checkAdmin();
    list.innerHTML += `<div class="notice-item">
      ${n}
      <span class="notice-actions" style="display:${isAdmin?'block':'none'}">
        <button style="background:#ffcc00" onclick="editNotice(${i})">Edit</button>
        <button style="background:#ff4444;color:#fff" onclick="deleteNotice(${i})">Delete</button>
      </span>
    </div>`;
  });
}
renderNotices();

function addNotice(){
  let user = JSON.parse(localStorage.getItem('currentUser') || '{}');
  if(user.senaNo != "4521328" && !user.isAdmin){ alert("শুধু Admin!"); return; }
  let txt = prompt("নতুন Notice লিখো:");
  if(txt){ notices.unshift(txt); localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); }
}
function editNotice(i){
  let txt = prompt("Notice Edit করো:", notices[i]);
  if(txt){ notices[i]=txt; localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); }
}
function deleteNotice(i){
  if(confirm("Delete করবে?")){ notices.splice(i,1); localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); }
}

checkAdmin();
</script>

</body>
</html>
