<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>MT PLATOON - Home</title> <style> *{margin:0;padding:0;box-sizing:border-box;font-family:Arial} body{background:#f2f2f2;padding-bottom:90px} .top{background:#0a1a12;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center} .call{background:#0e5d3e;color:#ffcc00;padding:11px 15px;font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center} .gc-btn{background:#ffcc00;color:#000;padding:5px 12px;border-radius:15px;font-size:13px;cursor:pointer} .welcome{background:#ffcc00;color:#0a1a12;padding:11px 15px;font-weight:900;font-size:15px;text-align:center} .banner{width:100%;height:280px;position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;color:#fff} .banner img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;opacity:0;transition:opacity 1s} .banner img.active{opacity:1} .banner-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:10} .banner-dots span{width:7px;height:7px;background:rgba(255,255,255,0.6);border-radius:50%;display:inline-block} .banner-dots span.active{background:#ffcc00;width:20px;border-radius:10px} .banner-add-btn{position:absolute;top:10px;right:10px;background:#ffcc00;color:#000;border:none;padding:7px 12px;border-radius:20px;font-weight:900;font-size:12px;z-index:20;cursor:pointer} .sec{padding:15px} .sir-card{background:#fff;border-radius:16px;padding:15px;margin-bottom:20px;text-align:center;border:1px solid #ddd;position:relative} .img-box{position:relative;width:280px;height:360px;margin:0 auto;border-radius:14px;overflow:hidden;border:4px solid #0e5d3e} .img-box img{width:100%;height:100%;object-fit:cover} .bottom-info{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.75);padding:10px 8px;text-align:center} .rank-text{color:#ffcc00;font-weight:900;font-size:18px} .name-text{color:#fff;font-weight:900;font-size:15px} .edit-btn{position:absolute;top:12px;right:12px;background:#ffcc00;color:#000;border:none;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:900;cursor:pointer} #editModal,#bannerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;justify-content:center;align-items:center;padding:20px} .modal-box{background:#fff;width:100%;max-width:380px;border-radius:15px;padding:20px} #sideMenu{position:fixed;top:0;left:0;bottom:0;width:280px;background:#0a1a12;z-index:999999;display:none;padding:20px} #menuOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999998;display:none} .menu-item{background:#143d27;color:#fff;padding:14px;border-radius:10px;margin-bottom:10px;cursor:pointer;font-weight:900} .nav{position:fixed;bottom:0;left:0;right:0;background:#0b1226;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #1e293b;z-index:999} .nav div{color:#94a3b8;text-align:center;font-size:12px;cursor:pointer} input{width:100%;padding:10px;margin-top:8px;border:1px solid #ccc;border-radius:8px} </style> </head> <body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, orderBy, query, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA99iSvbxKItztZTn8w7ImDHnAbem25ji0", authDomain: "mt-platoon-4bir.firebaseapp.com", projectId: "mt-platoon-4bir", storageBucket: "mt-platoon-4bir.firebasestorage.app", messagingSenderId: "720139134198", appId: "1:720139134198:web:4ed98d6e53a7e741dcb8d7" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let bannerImages = []; let currentIdx = 0; let slideTimer = null; let selectedFilesBase64 = []; let currentEditType = ''; let currentEditImg = '';
function compressImage(file){ return new Promise((resolve)=>{ const reader=new FileReader(); reader.onload=(e)=>{ const img=new Image(); img.onload=()=>{ const canvas=document.createElement('canvas'); let w=img.width,h=img.height; const MAX=800; if(w>MAX||h>MAX){ if(w>h){ h=h*MAX/w; w=MAX; } else { w=w*MAX/h; h=MAX; } } canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); resolve(canvas.toDataURL('image/jpeg',0.6)); }; img.src=e.target.result; }; reader.readAsDataURL(file); }); }

// --- BANNER ---
async function loadBannersFromDB(){ try{ const q=query(collection(db,"bannerPics"),orderBy("created","asc")); const snap=await getDocs(q); bannerImages=[]; snap.forEach(d=>{ bannerImages.push({id:d.id,...d.data()}); }); const bannerDiv=document.getElementById('armyBanner'); const placeholder=document.getElementById('bannerPlaceholder'); bannerDiv.querySelectorAll('img.banner-img').forEach(el=>el.remove()); if(bannerImages.length>0){ placeholder.style.display='none'; bannerImages.forEach((item,idx)=>{ const img=document.createElement('img'); img.src=item.src; img.className='banner-img'+(idx===0?' active':''); bannerDiv.insertBefore(img,document.getElementById('bannerDots')); }); renderDots(); startSlide(); document.getElementById('bannerAddBtn').innerText=`+ Add Pics (${bannerImages.length}/20)`; } }catch(e){} }
function renderDots(){ const dotsBox=document.getElementById('bannerDots'); dotsBox.innerHTML=''; bannerImages.forEach((_,idx)=>{ const s=document.createElement('span'); s.className=idx===0?'active':''; s.onclick=()=>goToSlide(idx); dotsBox.appendChild(s); }); }
function goToSlide(idx){ const imgs=document.querySelectorAll('.banner-img'); const dots=document.querySelectorAll('#bannerDots span'); imgs.forEach(im=>im.classList.remove('active')); dots.forEach(d=>d.classList.remove('active')); if(imgs[idx]){ imgs[idx].classList.add('active'); dots[idx].classList.add('active'); currentIdx=idx; } }
function startSlide(){ clearInterval(slideTimer); if(bannerImages.length<=1) return; slideTimer=setInterval(()=>{ let next=(currentIdx+1)%bannerImages.length; goToSlide(next); },4000); }
window.openBannerModal=()=>{ if(bannerImages.length>=20){ alert('20 টা হয়ে গেছে!'); return; } document.getElementById('bannerModal').style.display='flex'; document.getElementById('thumbGrid').innerHTML=''; document.getElementById('bannerStatus').innerText=''; selectedFilesBase64=[]; }
window.closeBannerModal=()=>{ document.getElementById('bannerModal').style.display='none'; }
document.getElementById('bannerFile').addEventListener('change', async (e)=>{ const files=Array.from(e.target.files); const grid=document.getElementById('thumbGrid'); grid.innerHTML=''; selectedFilesBase64=[]; if(bannerImages.length+files.length>20){ alert(`আর মাত্র ${20-bannerImages.length} টা!`); return; } document.getElementById('bannerStatus').innerText='Compressing...'; for(let f of files){ const b64=await compressImage(f); selectedFilesBase64.push(b64); const im=document.createElement('img'); im.src=b64; im.style.width='100%'; im.style.height='60px'; im.style.objectFit='cover'; im.style.borderRadius='5px'; grid.appendChild(im); } document.getElementById('bannerStatus').innerText=`${selectedFilesBase64.length} টা Ready`; });
window.saveBannerPics=async()=>{ if(selectedFilesBase64.length===0){ alert('ছবি সিলেক্ট কর!'); return; } document.getElementById('bannerStatus').innerText='Uploading...'; try{ for(let src of selectedFilesBase64){ await addDoc(collection(db,"bannerPics"),{src,created:Date.now()}); } alert('✅ Banner Save হইছে!'); closeBannerModal(); location.reload(); }catch(err){ alert('Error: '+err.message); } }

// --- MT COMMAND ---
async function loadCommands(){ try{ const snap=await getDocs(collection(db,"mtCommand")); snap.forEach(d=>{ const data=d.data(); const type=d.id; if(document.getElementById('img-'+type)){ if(data.img) document.getElementById('img-'+type).src=data.img; if(data.rank) document.getElementById('rank-'+type).innerText=data.rank; if(data.name) document.getElementById('name-'+type).innerText=data.name; } }); }catch(e){} }
window.openEdit=async(type)=>{ currentEditType=type; document.getElementById('editTitle').innerText='Edit '+type.toUpperCase(); document.getElementById('editRank').value=document.getElementById('rank-'+type).innerText; document.getElementById('editName').value=document.getElementById('name-'+type).innerText; currentEditImg=document.getElementById('img-'+type).src; document.getElementById('editModal').style.display='flex'; document.getElementById('editStatus').innerText=''; }
window.closeEdit=()=>{ document.getElementById('editModal').style.display='none'; }
document.getElementById('editFile').addEventListener('change', async (e)=>{ if(e.target.files[0]){ document.getElementById('editStatus').innerText='Compressing...'; currentEditImg=await compressImage(e.target.files[0]); document.getElementById('editStatus').innerText='Ready to Save'; } });
window.saveEdit=async()=>{ const rank=document.getElementById('editRank').value; const name=document.getElementById('editName').value; document.getElementById('editStatus').innerText='Saving...'; try{ await setDoc(doc(db,"mtCommand",currentEditType),{rank,name,img:currentEditImg,updated:Date.now()}); document.getElementById('rank-'+currentEditType).innerText=rank; document.getElementById('name-'+currentEditType).innerText=name; document.getElementById('img-'+currentEditType).src=currentEditImg; alert('✅ '+currentEditType+' Save হইছে!'); closeEdit(); }catch(err){ alert('Error: '+err.message); } }

loadBannersFromDB(); loadCommands();
</script>
</body> </html>
