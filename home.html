<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT PLATOON - Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f2;padding-bottom:90px}
.top{background:#0a1a12;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center}
.call{background:#0e5d3e;color:#ffcc00;padding:11px 15px;font-weight:900;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.gc-btn{background:#ffcc00;color:#000;padding:5px 12px;border-radius:15px;font-size:13px;cursor:pointer}
.welcome{background:#ffcc00;color:#0a1a12;padding:11px 15px;font-weight:900;font-size:15px;text-align:center}
.banner{width:100%;height:250px}.banner img{width:100%;height:100%;object-fit:cover}
.sec{padding:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#143d27;display:flex;justify-content:space-around;padding:12px 0}
.nav div{color:#fff;text-align:center;cursor:pointer}
.sir-card{background:#fff;border-radius:16px;padding:15px;margin-bottom:20px;text-align:center;border:1px solid #ddd;position:relative}
.img-box{position:relative;width:280px;height:360px;margin:0 auto;border-radius:14px;overflow:hidden;border:4px solid #0e5d3e}
.img-box img{width:100%;height:100%;object-fit:cover}
.bottom-info{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.75);padding:10px 8px;text-align:center}
.rank-text{color:#ffcc00;font-weight:900;font-size:18px;margin-bottom:4px}
.name-text{color:#fff;font-weight:900;font-size:15px}
.edit-btn{position:absolute;top:12px;right:12px;background:#ffcc00;color:#000;border:none;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:900;cursor:pointer;z-index:10}
.notice-item{background:#fffbe6;padding:12px;border-left:4px solid #ffcc00;margin-top:10px;border-radius:8px;position:relative}
.notice-actions{position:absolute;top:5px;right:5px}
.notice-actions button{border:none;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:900;margin-left:4px;cursor:pointer}
.btn-add{background:#0e5d3e;color:#fff;padding:8px 15px;border:none;border-radius:20px;font-weight:900;margin-top:10px;cursor:pointer}
#editModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;justify-content:center;align-items:center;padding:20px}
.modal-box{background:#fff;width:100%;max-width:350px;border-radius:15px;padding:20px}
.modal-box h3{color:#0e5d3e;margin-bottom:15px;text-align:center}
.modal-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:8px}
.modal-box .btn{width:100%;padding:10px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:5px}
.quick-btn{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>

<div class="top"><b>4 BIR - MT PLATOON</b><b onclick="location.href='own-profile.html'" style="background:#ffcc00;color:#000;padding:7px 13px;border-radius:50%;cursor:pointer">R</b></div>

<div class="call"><span>📞 Call Us: 01769-013433</span><span class="gc-btn" onclick="location.href='group.html'">💬 Group Chat</span></div>

<div class="welcome">🎖️ Welcome To MT Platoon 🎖️</div>

<div class="banner"><img src="https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=800"></div>

<!-- QUICK ACCESS - VEHICLE PROBLEM ADD KORA HOLO -->
<div class="sec" style="padding-bottom:5px">
  <div style="display:flex;gap:10px">
    <button class="quick-btn" onclick="location.href='vehicle-problem.html'" style="background:#b91c1c;color:#fff">🚛 Vehicle Problem <span id="vCount" style="background:#fff;color:#b91c1c;padding:2px 7px;border-radius:10px;font-size:11px;margin-left:4px">0</span></button>
    <button class="quick-btn" onclick="location.href='duty.html'" style="background:#0e5d3e;color:#ffcc00">📋 Duty Chart</button>
  </div>
</div>

<div class="sec">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="color:#0e5d3e">📢 NOTICE BOARD</h3><button id="addNoticeBtn" class="btn-add" onclick="addNotice()">+ Add</button></div>
  <div id="noticeList"></div>
</div>

<div class="sec">
  <h3 style="color:#0e5d3e;margin-bottom:14px">🎖️ MT COMMAND</h3>
  <div class="sir-card">
    <button class="edit-btn" onclick="openEdit('qm')">✏️ Edit</button>
    <div class="img-box"><img id="img-qm" src="https://i.imgur.com/8Km9tLL.png"><div class="bottom-info"><div class="rank-text" id="rank-qm">QM</div><div class="name-text" id="name-qm">Capt Mohammad Ali Akbor Arko</div></div></div>
  </div>
  <div class="sir-card">
    <button class="edit-btn" onclick="openEdit('jco')">✏️ Edit</button>
    <div class="img-box"><img id="img-jco" src="https://i.imgur.com/8Km9tLL.png"><div class="bottom-info"><div class="rank-text" id="rank-jco">MT JCO</div><div class="name-text" id="name-jco">Subedar Name Here</div></div></div>
  </div>
  <div class="sir-card">
    <button class="edit-btn" onclick="openEdit('nco')">✏️ Edit</button>
    <div class="img-box"><img id="img-nco" src="https://i.imgur.com/8Km9tLL.png"><div class="bottom-info"><div class="rank-text" id="rank-nco">MT NCO</div><div class="name-text" id="name-nco">Sgt Name Here</div></div></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal">
  <div class="modal-box">
    <h3>MT COMMAND Edit</h3>
    <input id="editRank" placeholder="পদবী - QM / MT JCO">
    <input id="editName" placeholder="নাম">
    <input id="editFile" type="file" accept="image/*">
    <p style="font-size:12px;color:#666;margin-bottom:10px">গ্যালারি থেকে ছবি সিলেক্ট করো</p>
    <button class="btn" style="background:#0e5d3e;color:#ffcc00" onclick="saveEdit()">✅ Save</button>
    <button class="btn" style="background:#ddd" onclick="closeEdit()">Cancel</button>
  </div>
</div>

<div class="nav">
  <div style="color:#22c55e;font-weight:900">🏡<br>Home Page</div>
  <div onclick="location.href='vehicle-problem.html'">🚛<br>Vehicle</div>
  <div onclick="location.href='group.html'">👥<br>Group</div>
</div>

<script>
let cur = JSON.parse(localStorage.getItem('currentUser') || 'null');
if(!cur){ localStorage.setItem('currentUser', JSON.stringify({name:"Ruhul", senaNo:"4521328", isAdmin:true})); }
function isAdmin(){ let u = JSON.parse(localStorage.getItem('currentUser') || '{}'); return u.senaNo == "4521328" || u.isAdmin == true; }
function checkAdmin(){ if(isAdmin()){ document.querySelectorAll('.edit-btn').forEach(b=>b.style.display='block'); document.getElementById('addNoticeBtn').style.display='block'; } }
checkAdmin();

let currentType = '';
function loadContacts(){
  let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}');
  if(data.qm){ document.getElementById('name-qm').innerText=data.qm.name; document.getElementById('rank-qm').innerText=data.qm.rank; document.getElementById('img-qm').src=data.qm.img; }
  if(data.jco){ document.getElementById('name-jco').innerText=data.jco.name; document.getElementById('rank-jco').innerText=data.jco.rank; document.getElementById('img-jco').src=data.jco.img; }
  if(data.nco){ document.getElementById('name-nco').innerText=data.nco.name; document.getElementById('rank-nco').innerText=data.nco.rank; document.getElementById('img-nco').src=data.nco.img; }
}
loadContacts();

function openEdit(type){ if(!isAdmin()){ alert("শুধু 4521328 পারবে!"); return; } currentType = type; document.getElementById('editRank').value = document.getElementById('rank-'+type).innerText; document.getElementById('editName').value = document.getElementById('name-'+type).innerText; document.getElementById('editModal').style.display='flex'; }
function closeEdit(){ document.getElementById('editModal').style.display='none'; currentType=''; document.getElementById('editFile').value=''; }
function saveEdit(){
  let rank = document.getElementById('editRank').value; let name = document.getElementById('editName').value; let fileInput = document.getElementById('editFile'); let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}');
  if(fileInput.files && fileInput.files[0]){ let reader = new FileReader(); reader.onload = function(e){ data[currentType] = { rank: rank, name: name, img: e.target.result }; localStorage.setItem('emergencyContacts', JSON.stringify(data)); loadContacts(); closeEdit(); alert("✅ Update Done!"); }; reader.readAsDataURL(fileInput.files[0]); } else { data[currentType] = { rank: rank, name: name, img: document.getElementById('img-'+currentType).src }; localStorage.setItem('emergencyContacts', JSON.stringify(data)); loadContacts(); closeEdit(); alert("✅ Update Done!"); }
}

let notices = JSON.parse(localStorage.getItem('mtNotices') || '["📅 10/31/2026: যারা নাইট পাশ যেতে ইচ্ছুক তারা লিভ কার্ড জমা করেন"]');
function renderNotices(){ let list = document.getElementById('noticeList'); list.innerHTML = ""; notices.forEach((n,i)=>{ let admin = isAdmin(); list.innerHTML += `<div class="notice-item">${n}${admin?`<span class="notice-actions"><button style="background:#ffcc00" onclick="editNotice(${i})">Edit</button><button style="background:#ff4444;color:#fff" onclick="deleteNotice(${i})">Del</button></span>`:''}</div>`; }); }
renderNotices();
function addNotice(){ if(!isAdmin()) return; let txt = prompt("Notice:"); if(txt){ notices.unshift(txt); localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); } }
function editNotice(i){ let txt = prompt("Edit:", notices[i]); if(txt){ notices[i]=txt; localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); } }
function deleteNotice(i){ if(confirm("Delete?")){ notices.splice(i,1); localStorage.setItem('mtNotices', JSON.stringify(notices)); renderNotices(); } }

// VEHICLE COUNT SHOW
let vData = JSON.parse(localStorage.getItem('vehicleProblems') || '[]');
document.getElementById('vCount').innerText = vData.length;
</script>
</body>
</html>
