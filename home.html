<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>MT PLATOON - Home</title> <style> *{margin:0;padding:0;box-sizing:border-box;font-family:Arial} body{background:#f2f2f2;padding-bottom:90px} .top{background:#0a1a12;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center} .call{background:#0e5d3e;color:#ffcc00;padding:11px 15px;font-weight:900} .banner{width:100%;height:250px}.banner img{width:100%;height:100%;object-fit:cover} .sec{padding:15px} .nav{position:fixed;bottom:0;left:0;right:0;background:#143d27;display:flex;justify-content:space-around;padding:12px 0} .nav div{color:#fff;text-align:center;cursor:pointer} .sir-card{background:#fff;border-radius:12px;padding:15px;margin-bottom:15px;text-align:center;border:1px solid #ddd;position:relative} .sir-card img{width:130px;height:150px;object-fit:cover;border-radius:10px;border:3px solid #0e5d3e} .sir-card h4{margin-top:10px;color:#0e5d3e;font-weight:900} .sir-card p{margin-top:3px;font-weight:bold;color:#333} .edit-btn{display:none;position:absolute;top:10px;right:10px;background:#ffcc00;color:#000;border:none;padding:5px 10px;border-radius:15px;font-size:12px;font-weight:900;cursor:pointer} </style> </head> <body> <div class="top"> <b>4 BIR - MT PLATOON</b> <b onclick="location.href='own-profile.html'" style="background:#ffcc00;color:#000;padding:7px 13px;border-radius:50%;cursor:pointer">R</b> </div> <div class="call">📞 Call Us: 01769-013433</div> <div class="banner"><img src="https://images.unsplash.com/photo-1556388158-158ea5ccacbd?w=800"></div> <div class="sec"> <h3 style="color:#0e5d3e">📢 NOTICE BOARD</h3> <div style="background:#fffbe6;padding:12px;border-left:4px solid #ffcc00;margin-top:10px;border-radius:8px">📅 10/31/2026: যারা নাইট পাশ যেতে ইচ্ছুক তারা লিভ কার্ড জমা করেন</div> </div> <div class="sec"> <h3 style="color:#0e5d3e;margin-bottom:12px">🚨 EMERGENCY CONTACTS</h3> <div class="sir-card"> <button class="edit-btn" onclick="editContact('qm')">✏️ Edit</button> <img id="img-qm" src="https://i.imgur.com/8Km9tLL.png"> <h4>QM</h4> <p id="name-qm">Capt Mohammad Ali Akbor Arko</p> <a id="call-qm" href="tel:01769013433" style="display:inline-block;margin-top:8px;background:#0e5d3e;color:#ffcc00;padding:6px 14px;border-radius:20px;text-decoration:none">📞 CALL</a> </div> <div class="sir-card"> <button class="edit-btn" onclick="editContact('jco')">✏️ Edit</button> <img id="img-jco" src="https://i.imgur.com/8Km9tLL.png"> <h4>MT JCO</h4> <p id="name-jco">Subedar Name Here</p> <a id="call-jco" href="tel:01700000000" style="display:inline-block;margin-top:8px;background:#0e5d3e;color:#ffcc00;padding:6px 14px;border-radius:20px;text-decoration:none">📞 CALL</a> </div> <div class="sir-card"> <button class="edit-btn" onclick="editContact('nco')">✏️ Edit</button> <img id="img-nco" src="https://i.imgur.com/8Km9tLL.png"> <h4>MT NCO</h4> <p id="name-nco">Sgt Name Here</p> <a id="call-nco" href="tel:01700000000" style="display:inline-block;margin-top:8px;background:#0e5d3e;color:#ffcc00;padding:6px 14px;border-radius:20px;text-decoration:none">📞 CALL</a> </div> </div> <div class="nav"> <div style="color:#22c55e;font-weight:900">🏡<br>Home Page</div> <div onclick="location.href='group.html'">👥<br>Group</div> </div> <script> // ADMIN BANANOR SYSTEM - ?makeadmin=1 dile admin hoye jabe
if(window.location.search.includes('makeadmin=1')){
  let u = JSON.parse(localStorage.getItem('currentUser') || '{"name":"Admin"}');
  u.isAdmin = true;
  localStorage.setItem('currentUser', JSON.stringify(u));
  alert('✅ তুই এখন Admin! Edit Button চলে আসবে');

function checkAdmin(){ let user = JSON.parse(localStorage.getItem('currentUser') || '{}'); if(user.isAdmin){ document.querySelectorAll('.edit-btn').forEach(b=>b.style.display='block'); } } checkAdmin(); function loadContacts(){ let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}'); if(data.qm){ document.getElementById('name-qm').innerText=data.qm.name; document.getElementById('img-qm').src=data.qm.img; document.getElementById('call-qm').href='tel:'+data.qm.phone; } if(data.jco){ document.getElementById('name-jco').innerText=data.jco.name; document.getElementById('img-jco').src=data.jco.img; document.getElementById('call-jco').href='tel:'+data.jco.phone; } if(data.nco){ document.getElementById('name-nco').innerText=data.nco.name; document.getElementById('img-nco').src=data.nco.img; document.getElementById('call-nco').href='tel:'+data.nco.phone; } } loadContacts(); function editContact(type){ let user = JSON.parse(localStorage.getItem('currentUser') || '{}'); if(!user.isAdmin){ alert("শুধু Admin Edit করতে পারবে!"); return; } let name = prompt("নতুন নাম লিখো:"); let phone = prompt("নতুন ফোন নম্বর লিখো:"); let img = prompt("নতুন ছবির লিংক দাও:"); let data = JSON.parse(localStorage.getItem('emergencyContacts') || '{}'); data[type] = { name: name || document.getElementById('name-'+type).innerText, phone: phone || '01700000000', img: img || document.getElementById('img-'+type).src }; localStorage.setItem('emergencyContacts', JSON.stringify(data)); loadContacts(); alert("Update Done!"); } </script> </body> </html>
