<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>এমটি প্লাটুন ৪ বীর</title>
<style>
body{font-family: sans-serif; background:#f0f2f5; margin:0}
.header{background:#0b6e2f; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center}
.header h1{font-size:15px; margin:0; line-height:1.2}
.back{background:#e11d48; color:white; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:bold}
.container{padding:15px}
input, select{width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid #ccc; font-size:16px; box-sizing:border-box; background:white}
.addBtn{width:100%; background:#0b6e2f; color:white; padding:14px; border:none; border-radius:12px; font-size:18px; font-weight:bold}
.card{background:white; padding:12px; border-radius:10px; margin-top:10px; display:flex; justify-content:space-between; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.title{text-align:center; margin-top:20px; font-weight:bold; font-size:20px}
.sub{text-align:center; color:#0b6e2f; font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>এমটি প্লাটুন ৪ বীর - সিনিয়রিটি</h1>
<a class="back" href="/">Back</a>
</div>
<div class="container">
<input id="senaNo" placeholder="সেনা নং লিখুন">
<select id="podobi">
<option value="">পদবি সিলেক্ট করুন</option>
<option>সৈনিক</option>
<option>ল্যান্স কর্পোরাল</option>
<option>কর্পোরাল</option>
<option>সার্জেন্ট</option>
</select>
<input id="name" placeholder="নাম বাংলা/ইংরেজি লিখুন">
<!-- প্লাটুন ফিক্সড, তাই হাইড করে দিলাম -->
<input type="hidden" id="platoon" value="এমটি প্লাটুন ৪ বীর">

<button class="addBtn" onclick="addData()">Add করুন</button>

<div class="title">সিনিয়ারিটি অনুযায়ী নামীয় তালিকা</div>
<div class="sub">এমটি প্লাটুন ৪ বীর</div>
<div id="list"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('mt4bir_final') || '[]');
function addData(){
 let s = document.getElementById('senaNo').value.trim();
 let p = document.getElementById('podobi').value;
 let n = document.getElementById('name').value.trim();
 let pl = document.getElementById('platoon').value;
 if(!s || !p || !n){ alert('সেনা নং, পদবি, নাম পূরণ করুন ভাই'); return; }
 data.push({s,p,n,pl});
 localStorage.setItem('mt4bir_final', JSON.stringify(data));
 document.getElementById('senaNo').value=''; 
 document.getElementById('name').value='';
 render();
}
function render(){
 let l = document.getElementById('list'); l.innerHTML='';
 data.sort((a,b)=> a.s.localeCompare(b.s, undefined, {numeric:true}));
 data.forEach((d,i)=>{
  l.innerHTML += `<div class="card"><div><b>${d.s}</b> - ${d.p}<br>${d.n}<br><small style="color:green">${d.pl}</small></div><div><button onclick="del(${i})" style="background:red;color:white;border:none;padding:6px 12px;border-radius:6px">X</button></div></div>`;
 });
}
function del(i){ if(confirm('ডিলিট করবেন?')){ data.splice(i,1); localStorage.setItem('mt4bir_final', JSON.stringify(data)); render(); } }
render();
</script>
</body>
</html>
