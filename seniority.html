<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUTY SENIORITY</title>
<style>
:root{--bg:#08121a;--card:#101f2e;--gold:#c8a951;--gold2:#ffdb70}
body{margin:0;background:var(--bg);color:#e8f0ff;font-family:Arial;padding:0}
.topBar{background:#0e1e2f;padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a324d}
.topBar h2{margin:0;color:var(--gold2);font-size:16px}
.searchWrap{padding:12px}.search{width:100%;box-sizing:border-box;padding:13px;border-radius:24px;border:1.5px solid var(--gold);background:#0e1e2f;color:#fff;outline:none}
.addBtn{margin:0 12px;width:calc(100% - 24px);padding:13px;border-radius:14px;border:1.5px solid var(--gold);background:linear-gradient(180deg,#2a2310,#1a160a);color:var(--gold2);font-weight:900;cursor:pointer}
.card{margin:12px;background:var(--card);border:1px solid #1a324d;border-radius:18px;padding:12px}
.badge{width:78px;height:78px;background:linear-gradient(180deg,#c8a951,#8a6d1e);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:14px;cursor:pointer;overflow:hidden;position:relative;border:2px solid var(--gold)}
.badge img{width:100%;height:100%;object-fit:cover}.badge span{position:absolute;bottom:0;background:rgba(0,0,0,.7);color:var(--gold2);font-size:9px;width:100%;text-align:center;padding:2px}
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px}
.field{background:#0c1a28;border:1px solid #1a324d;border-radius:10px;padding:8px}.field span{color:#8aa0bd;font-size:11px;display:block}.field b{color:#fff;font-size:13px}
.field.mot{border:1.5px solid var(--gold);background:#1a160a}.field.mot b{color:var(--gold2)}
.chuti4{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modalBox{background:#101f2e;border:1px solid var(--gold);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.modalBox label{color:var(--gold2);font-size:13px;margin-top:10px;display:block}
.modalBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #c8a951;background:#0e1e2f;color:#fff;margin-top:4px}
.btn{padding:11px;border-radius:12px;border:1.5px solid var(--gold);font-weight:900;cursor:pointer;width:100%}.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.roleTag{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}.role-command{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a}.role-mt{background:#1a3d22;color:var(--gold2);border:1px solid var(--gold)}
.viewNote{text-align:center;background:#1a1510;border:1px dashed var(--gold);color:var(--gold2);padding:8px;margin:10px 12px;border-radius:8px;font-size:12px}
</style></head><body>
<div class="topBar"><span onclick="location.href='dashboard.html'" style="font-size:22px;cursor:pointer"><</span><h2>SUTY SENIORITY</h2><span id="roleBadge" class="roleTag"></span></div>
<div id="viewNote" class="viewNote" style="display:none">👁️ VIEW ONLY - COMMAND - Edit Disabled</div>
<div class="searchWrap"><input id="q" class="search" placeholder="🔍 Search..." oninput="filter()"></div>
<button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD SENIORITY</button>
<div id="list"></div>
<input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePic(event)">
<div id="addModal" class="modal"><div class="modalBox">
<h3 id="modalTitle" style="margin:0;color:var(--gold2)">Add Seniority</h3>
<div style="text-align:center;margin:10px 0"><div id="addPicPreview" style="width:90px;height:90px;margin:0 auto;background:#0c1a28;border:2px dashed var(--gold);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" onclick="document.getElementById('addPicFile').click()">📷 Pic</div><input type="file" id="addPicFile" accept="image/*" style="display:none" onchange="handleAddPic(event)"></div>
<label>সেনা নং</label><input id="f_no"><label>পদবী</label><input id="f_podobi"><label>নাম</label><input id="f_nam"><label>যোগদানের তারিখ</label><input id="f_jogdan" type="date">
<label style="margin-top:14px;color:var(--gold2);border:1px dashed var(--gold);padding:6px;border-radius:8px;text-align:center">এই বছরে ছুটি</label>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px"><div><label style="font-size:10px">২৬ সালে মোট ছুটি</label><input id="f_mot_show" type="text" placeholder="Auto" disabled style="background:#1a160a;color:var(--gold2);font-weight:900;"></div><div><label style="font-size:11px">পিলিপ</label><input id="f_pl" type="text" placeholder="২০" oninput="calcMot()"></div><div><label style="font-size:11px">সিলিপ</label><input id="f_cl" type="text" placeholder="০" oninput="calcMot()"></div><div><label style="font-size:11px">নাইটপাশ</label><input id="f_np" type="text" placeholder="২০" oninput="calcMot()"></div></div>
<label>গ্রাম</label><input id="f_gram"><label>পোস্ট</label><input id="f_post"><label>থানা</label><input id="f_thana"><label>জেলা</label><input id="f_zilla"><label>মোবাইল-১</label><input id="f_moba1"><label>মোবাইল-২</label><input id="f_moba2">
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:var(--gold);color:#000" onclick="saveBoth()">✓ Save to Firebase</button><button class="btn" style="background:#2a0f14;color:#ff6b6b" onclick="closeAdd()">✕ Cancel</button></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBGiXYT6hsfbe5UzjqZEB7cfs7Oz8uKxYc",
  authDomain: "admin-clk.firebaseapp.com",
  projectId: "admin-clk",
  storageBucket: "admin-clk.firebasestorage.app",
  messagingSenderId: "515452290143",
  appId: "1:515452290143:web:42c55faae53fe3eb5907ea",
  measurementId: "G-JEJT3BD49W"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const colRef = collection(db, "seniority");
let mtRoleRaw = localStorage.getItem("mt_role") || localStorage.getItem("role") || "";
let urlRole = new URLSearchParams(window.location.search).get("role");
if(urlRole){ mtRoleRaw = urlRole; localStorage.setItem("mt_role", mtRoleRaw); }
if(!mtRoleRaw){ location.href='index.html'; }
let ROLE_UP = mtRoleRaw.toUpperCase().trim();
let CAN_EDIT = ROLE_UP.includes("MT") || ROLE_UP.includes("CLK") || ROLE_UP.includes("ADMIN");
let IS_COMMAND = !CAN_EDIT;
document.getElementById("roleBadge").innerText = IS_COMMAND ? "VIEW - COMMAND" : "EDIT - MT CLK";
document.getElementById("roleBadge").className = IS_COMMAND ? "roleTag role-command" : "roleTag role-mt";
document.getElementById("addBtn").style.display = IS_COMMAND ? "none" : "block";
document.getElementById("viewNote").style.display = IS_COMMAND ? "block" : "none";
let DATA = JSON.parse(localStorage.getItem("seniorityCache")||"[]");
let currentPicIdx = -1; let addPicBase64 = ""; let editingIdx = -1; let editingOldNo = "";
window.esc = (s)=> String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.bnToEn = (s)=> String(s||"").replace(/[০-৯]/g,d=>String.fromCharCode(d.charCodeAt(0)-2486));
window.enToBn = (s)=> String(s||"").replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
window.toNum = (s)=>{ let e = bnToEn(String(s||"0")).replace(/[^0-9-]/g,""); let n=parseInt(e||"0"); return isNaN(n)?0:n; };
function saveLocal(){ try{ localStorage.setItem("seniorityCache", JSON.stringify(DATA)); }catch(e){ let tmp = DATA.map(d=>({...d, pic:""})); localStorage.setItem("seniorityCache", JSON.stringify(tmp)); } }
window.fmtDate = (d)=>{ if(!d) return "-"; d=bnToEn(String(d)); let dt=new Date(d); if(isNaN(dt)) return d; return `${String(dt.getDate()).padStart(2,'0')}-${String(dt.getMonth()+1).padStart(2,'0')}-${dt.getFullYear()}`; };
window.formatMotDin = (jogdan)=>{ if(!jogdan) return "-"; let join=new Date(bnToEn(String(jogdan))); if(isNaN(join)) return "-"; let now=new Date(); let y=now.getFullYear()-join.getFullYear(); let m=now.getMonth()-join.getMonth(); let d=now.getDate()-join.getDate(); if(d<0){ m--; let prev=new Date(now.getFullYear(),now.getMonth(),0).getDate(); d+=prev; } if(m<0){ y--; m+=12; } if(y>0 && m>0) return `${enToBn(y)} বছর ${enToBn(m)} মাস ${enToBn(d)} দিন`; if(y>0) return `${enToBn(y)} বছর ${enToBn(d)} দিন`; if(m>0 && d>0) return `${enToBn(m)} মাস ${enToBn(d)} দিন`; if(m>0) return `${enToBn(m)} মাস`; return `${enToBn(d)} দিন`; };
window.calcTotalDays = (j)=>{ if(!j) return 0; let d=new Date(bnToEn(String(j))); return isNaN(d)?0:Math.floor((new Date()-d)/86400000); };
window.sortBySeniority = (arr)=> arr.sort((a,b)=> calcTotalDays(b.jogdan) - calcTotalDays(a.jogdan) );
window.calcMot = ()=>{ let pl=toNum(document.getElementById('f_pl').value||0); let cl=toNum(document.getElementById('f_cl').value||0); let np=toNum(document.getElementById('f_np').value||0); document.getElementById('f_mot_show').value = enToBn(pl+cl+np)+' দিন'; };
window.render = (arr)=>{ let sorted = sortBySeniority([...arr]); let h=""; sorted.forEach((r,i)=>{ let idx = DATA.indexOf(r); let motDinText = formatMotDin(r.jogdan); let total = toNum(r.pl)+toNum(r.cl)+toNum(r.np); let picHtml = r.pic ? `<img src="${r.pic}">` : `${esc(r.podobi||'সৈনিক')}`; let btns = IS_COMMAND ? "" : `<div class="btnRow"><button class="btn" style="background:#1e1705;color:var(--gold2)" onclick="editItem(${idx})">✏️ Edit</button><button class="btn" style="background:#2a0f14;color:#ff6b6b;border-color:#5a1a23" onclick="delItem(${idx})">🗑️ Del</button></div>`; h+=`<div class="card"><div style="display:flex;gap:12px"><div class="badge" onclick="pickPic(${idx})">${picHtml}<span>📷 Change</span></div><div><b>${esc(r.nam)}</b><div style="color:var(--gold2);font-size:13px;margin-top:3px">সেনা নং: ${enToBn(r.no)} • #${enToBn(i+1)}</div><div style="font-size:11px;color:#8aa0bd;margin-top:4px">যোগদান: ${fmtDate(r.jogdan)}</div></div></div><div class="fieldGrid"><div class="field"><span>যোগদানের তারিখ:</span><b>${fmtDate(r.jogdan)}</b></div><div class="field"><span>যোগদানের পর:</span><b style="color:var(--gold2)">${motDinText}</b></div><div class="chuti4"><div class="field mot"><span>২৬ সালে মোট ছুটি</span><b>${enToBn(total)} দিন</b></div><div class="field"><span>পিলিপ</span><b>${enToBn(r.pl||0)}</b></div><div class="field"><span>সিলিপ</span><b>${enToBn(r.cl||0)}</b></div><div class="field"><span>নাইটপাশ</span><b>${enToBn(r.np||0)}</b></div></div><div class="field"><span>গ্রাম:</span><b>${esc(r.gram||'-')}</b></div><div class="field"><span>পোস্ট:</span><b>${esc(r.post||'-')}</b></div><div class="field"><span>থানা:</span><b>${esc(r.thana||'-')}</b></div><div class="field"><span>জেলা:</span><b>${esc(r.zilla||'-')}</b></div><div class="field"><span>মোবাইল-১:</span><b>${enToBn(r.moba1||'-')}</b></div><div class="field"><span>মোবাইল-২:</span><b>${enToBn(r.moba2||'-')}</b></div></div>${btns}</div>`; }); document.getElementById("list").innerHTML=h||"<p style='padding:20px;text-align:center'>No Data - Add করো</p>"; };
function compressImage(file, cb){ let reader=new FileReader(); reader.onload=function(ev){ let img=new Image(); img.onload=function(){ let canvas=document.createElement('canvas'); let max=300; let w=img.width, h=img.height; if(w>h){ if(w>max){ h=h*max/w; w=max; } } else { if(h>max){ w=w*max/h; h=max; } } canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); cb(canvas.toDataURL('image/jpeg',0.7)); }; img.src=ev.target.result; }; reader.readAsDataURL(file); }
window.pickPic = (idx)=>{ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } currentPicIdx=idx; document.getElementById("picInput").click(); };
window.handlePic = (e)=>{ let file=e.target.files[0]; if(!file) return; compressImage(file, async (url)=>{ DATA[currentPicIdx].pic=url; saveLocal(); render(DATA); try{ await updateDoc(doc(db,"seniority", String(DATA[currentPicIdx].no)), {pic:url}); }catch(err){ console.log(err); } }); e.target.value=""; };
window.handleAddPic = (e)=>{ let file=e.target.files[0]; if(!file) return; compressImage(file, (url)=>{ addPicBase64=url; document.getElementById("addPicPreview").innerHTML=`<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">`; }); e.target.value=""; };
window.filter = ()=>{ let q=bnToEn(document.getElementById("q").value.toLowerCase()); render(DATA.filter(r=>bnToEn(JSON.stringify({...r,pic:""}).toLowerCase()).includes(q))); };
window.openAdd = ()=>{ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } editingIdx=-1; editingOldNo=""; document.getElementById("modalTitle").innerText="Add Seniority"; addPicBase64=""; document.getElementById("addPicPreview").innerHTML="📷 Pic"; ["f_no","f_podobi","f_nam","f_jogdan","f_pl","f_cl","f_np","f_gram","f_post","f_thana","f_zilla","f_moba1","f_moba2"].forEach(id=>document.getElementById(id).value=""); document.getElementById("f_mot_show").value=""; document.getElementById("addModal").style.display="flex"; };
window.closeAdd = ()=>{ editingIdx=-1; editingOldNo=""; document.getElementById("addModal").style.display="none"; };
window.saveBoth = async ()=>{ if(IS_COMMAND) return; let r={no:bnToEn(document.getElementById("f_no").value),podobi:document.getElementById("f_podobi").value,nam:document.getElementById("f_nam").value,jogdan:bnToEn(document.getElementById("f_jogdan").value),pl:toNum(document.getElementById("f_pl").value||0),cl:toNum(document.getElementById("f_cl").value||0),np:toNum(document.getElementById("f_np").value||0),gram:document.getElementById("f_gram").value,post:document.getElementById("f_post").value,thana:document.getElementById("f_thana").value,zilla:document.getElementById("f_zilla").value,moba1:bnToEn(document.getElementById("f_moba1").value),moba2:bnToEn(document.getElementById("f_moba2").value),pic:addPicBase64}; if(!r.nam){ alert("নাম লিখো"); return; } if(!r.no){ alert("সেনা নং লিখো"); return; } try{ if(editingIdx>=0){ if(editingOldNo !== r.no){ await deleteDoc(doc(db,"seniority", String(editingOldNo))); } r.pic = r.pic || DATA[editingIdx].pic || ""; await setDoc(doc(db,"seniority", String(r.no)), r); alert("✅ Update হয়েছে!"); } else { if(DATA.some(d=>d.no==r.no)){ alert("এই সেনা নং আগেই আছে!"); return; } await setDoc(doc(db,"seniority", String(r.no)), r); alert("✅ Firebase এ Save হয়েছে!"); } closeAdd(); }catch(e){ alert("Firebase Fail: "+e.message); } };
window.delItem = async (idx)=>{ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } if(confirm("Delete? "+DATA[idx].nam)){ try{ await deleteDoc(doc(db,"seniority", String(DATA[idx].no))); }catch(e){ alert("Delete Fail: "+e.message); } } };
window.editItem = (idx)=>{ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } editingIdx=idx; let r=DATA[idx]; editingOldNo=r.no; document.getElementById("modalTitle").innerText="Edit - "+r.nam; document.getElementById("addModal").style.display="flex"; document.getElementById("f_no").value=r.no; document.getElementById("f_podobi").value=r.podobi; document.getElementById("f_nam").value=r.nam; document.getElementById("f_jogdan").value=bnToEn(r.jogdan); document.getElementById("f_pl").value=r.pl||""; document.getElementById("f_cl").value=r.cl||""; document.getElementById("f_np").value=r.np||""; calcMot(); document.getElementById("f_gram").value=r.gram||""; document.getElementById("f_post").value=r.post||""; document.getElementById("f_thana").value=r.thana||""; document.getElementById("f_zilla").value=r.zilla||""; document.getElementById("f_moba1").value=r.moba1||""; document.getElementById("f_moba2").value=r.moba2||""; addPicBase64=r.pic||""; document.getElementById("addPicPreview").innerHTML = addPicBase64 ? `<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">` : "📷 Pic"; };
onSnapshot(colRef, (snap)=>{ DATA=[]; snap.forEach(d=>{ DATA.push({ ...d.data() }); }); saveLocal(); render(DATA); }, (err)=>{ console.log("Firebase load fail", err); render(DATA); });
render(DATA);
</script></body></html>
