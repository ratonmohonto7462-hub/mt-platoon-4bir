<!DOCTYPE html> <html><head> <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <title>SUTY SENIORITY</title> <style> :root{--bg:#08121a;--card:#101f2e;--gold:#c8a951;--gold2:#ffdb70} body{margin:0;background:var(--bg);color:#e8f0ff;font-family:Arial;padding:0} .topBar{background:#0e1e2f;padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a324d} .topBar h2{margin:0;color:var(--gold2);font-size:16px} .searchWrap{padding:12px}.search{width:100%;box-sizing:border-box;padding:13px;border-radius:24px;border:1.5px solid var(--gold);background:#0e1e2f;color:#fff;outline:none} .addBtn{margin:0 12px;width:calc(100% - 24px);padding:13px;border-radius:14px;border:1.5px solid var(--gold);background:linear-gradient(180deg,#2a2310,#1a160a);color:var(--gold2);font-weight:900;cursor:pointer} .card{margin:12px;background:var(--card);border:1px solid #1a324d;border-radius:18px;padding:12px} .badge{width:78px;height:78px;background:linear-gradient(180deg,#c8a951,#8a6d1e);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:14px;cursor:pointer;overflow:hidden;position:relative;border:2px solid var(--gold)} .badge img{width:100%;height:100%;object-fit:cover}.badge span{position:absolute;bottom:0;background:rgba(0,0,0,.7);color:var(--gold2);font-size:9px;width:100%;text-align:center;padding:2px} .fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px} .field{background:#0c1a28;border:1px solid #1a324d;border-radius:10px;padding:8px}.field span{color:#8aa0bd;font-size:11px;display:block}.field b{color:#fff;font-size:13px} .field.mot{border:1.5px solid var(--gold);background:#1a160a} .field.mot b{color:var(--gold2)} .chuti4{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px} .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:20} .modalBox{background:#101f2e;border:1px solid var(--gold);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:92vh;overflow:auto} .modalBox label{color:var(--gold2);font-size:13px;margin-top:10px;display:block} .modalBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #c8a951;background:#0e1e2f;color:#fff;margin-top:4px} .btn{padding:11px;border-radius:12px;border:1.5px solid var(--gold);font-weight:900;cursor:pointer;width:100%}.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} .roleTag{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}.role-command{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a}.role-mt{background:#1a3d22;color:var(--gold2);border:1px solid var(--gold)} .viewNote{text-align:center;background:#1a1510;border:1px dashed var(--gold);color:var(--gold2);padding:8px;margin:10px 12px;border-radius:8px;font-size:12px} </style></head><body> <div class="topBar"><span onclick="location.href='dashboard.html'" style="font-size:22px;cursor:pointer"><</span><h2>SUTY SENIORITY</h2><span id="roleBadge" class="roleTag"></span></div> <div id="viewNote" class="viewNote" style="display:none">👁️ VIEW ONLY - COMMAND - Edit Disabled</div> <div class="searchWrap"><input id="q" class="search" placeholder="🔍 Search..." oninput="filter()"></div> <button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD SENIORITY</button> <div id="list"></div> <input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePic(event)"> <div id="addModal" class="modal"><div class="modalBox"> <h3 style="margin:0;color:var(--gold2)">Add Seniority</h3> <div style="text-align:center;margin:10px 0"><div id="addPicPreview" style="width:90px;height:90px;margin:0 auto;background:#0c1a28;border:2px dashed var(--gold);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" onclick="document.getElementById('addPicFile').click()">📷 Pic</div><input type="file" id="addPicFile" accept="image/*" style="display:none" onchange="handleAddPic(event)"></div> <label>সেনা নং</label><input id="f_no"><label>পদবী</label><input id="f_podobi"><label>নাম</label><input id="f_nam"><label>যোগদানের তারিখ</label><input id="f_jogdan" type="date"><label style="margin-top:14px;color:var(--gold2);border:1px dashed var(--gold);padding:6px;border-radius:8px;text-align:center">এই বছরে ছুটি</label><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px"><div><label style="font-size:10px">২৬ সালে মোট ছুটি</label><input id="f_mot_show" type="text" placeholder="Auto" disabled style="background:#1a160a;color:var(--gold2);font-weight:900;"></div><div><label style="font-size:11px">পিলিপ</label><input id="f_pl" type="number" placeholder="পিলিপ" oninput="calcMot()"></div><div><label style="font-size:11px">সিলিপ</label><input id="f_cl" type="number" placeholder="সিলিপ" oninput="calcMot()"></div><div><label style="font-size:11px">নাইটপাশ</label><input id="f_np" type="number" placeholder="নাইটপাশ" oninput="calcMot()"></div></div><label>গ্রাম</label><input id="f_gram"><label>পোস্ট</label><input id="f_post"><label>থানা</label><input id="f_thana"><label>জেলা</label><input id="f_zilla"><label>মোবাইল-১</label><input id="f_moba1"><label>মোবাইল-২</label><input id="f_moba2"> <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:var(--gold);color:#000" onclick="saveBoth()">✓ Save to Google Sheet</button><button class="btn" style="background:#2a0f14;color:#ff6b6b" onclick="closeAdd()">✕ Cancel</button></div> </div></div> <script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycby8BQ0Dyo5s4otJEbRJcZXNiW3pyqDY9800nm8X7kGeOz49RVlQ1bdoF5IdByxL-l226w/exec";
let mtRoleRaw = localStorage.getItem("mt_role") || localStorage.getItem("role") || ""; let urlRole = new URLSearchParams(window.location.search).get("role"); if(urlRole){ mtRoleRaw = urlRole; localStorage.setItem("mt_role", mtRoleRaw); } if(!mtRoleRaw){ location.href='index.html'; } let ROLE_UP = mtRoleRaw.toUpperCase().trim(); let CAN_EDIT = ROLE_UP.includes("MT") || ROLE_UP.includes("CLK") || ROLE_UP.includes("ADMIN"); let IS_COMMAND = !CAN_EDIT; document.getElementById("roleBadge").innerText = IS_COMMAND ? "VIEW - COMMAND" : "EDIT - MT CLK"; document.getElementById("roleBadge").className = IS_COMMAND ? "roleTag role-command" : "roleTag role-mt"; document.getElementById("addBtn").style.display = IS_COMMAND ? "none" : "block"; document.getElementById("viewNote").style.display = IS_COMMAND ? "block" : "none"; let DATA = JSON.parse(localStorage.getItem("seniorityCache")||"[]"); let currentPicIdx = -1; let addPicBase64 = ""; function saveLocal(){ localStorage.setItem("seniorityCache", JSON.stringify(DATA)); } function fmtDate(d){ if(!d) return "-"; let dt=new Date(d); if(isNaN(dt)) return d; let dd=String(dt.getDate()).padStart(2,'0'); let mm=String(dt.getMonth()+1).padStart(2,'0'); let yy=dt.getFullYear(); return `${dd}-${mm}-${yy}`; } function formatMotDin(jogdan){ if(!jogdan) return "-"; let join=new Date(jogdan); if(isNaN(join)) return "-"; let now=new Date(); let y=now.getFullYear()-join.getFullYear(); let m=now.getMonth()-join.getMonth(); let d=now.getDate()-join.getDate(); if(d<0){ m--; let prev=new Date(now.getFullYear(),now.getMonth(),0).getDate(); d+=prev; } if(m<0){ y--; m+=12; } if(y>0 && m>0) return `${y} বছর ${m} মাস ${d} দিন`; if(y>0) return `${y} বছর ${d} দিন`; if(m>0 && d>0) return `${m} মাস ${d} দিন`; if(m>0) return `${m} মাস`; return `${d} দিন`; } function calcTotalDays(j){ if(!j) return 0; let d=new Date(j); return isNaN(d)?0:Math.floor((new Date()-d)/86400000); } function sortBySeniority(arr){ return arr.sort((a,b)=> calcTotalDays(b.jogdan) - calcTotalDays(a.jogdan) ); } function calcMot(){ let pl=parseInt(document.getElementById('f_pl').value||0); let cl=parseInt(document.getElementById('f_cl').value||0); let np=parseInt(document.getElementById('f_np').value||0); document.getElementById('f_mot_show').value = (pl+cl+np)+' দিন'; }
function render(arr){ let sorted = sortBySeniority([...arr]); let h=""; sorted.forEach((r,i)=>{ let idx = DATA.indexOf(r); let motDinText = formatMotDin(r.jogdan); let total = (parseInt(r.pl||0)+parseInt(r.cl||0)+parseInt(r.np||0)); let picHtml = r.pic ? `<img src="${r.pic}">` : `${r.podobi||'সৈনিক'}`; let btns = IS_COMMAND ? "" : `<div class="btnRow"><button class="btn" style="background:#1e1705;color:var(--gold2)" onclick="editItem(${idx})">✏️ Edit</button><button class="btn" style="background:#2a0f14;color:#ff6b6b;border-color:#5a1a23" onclick="delItem(${idx})">🗑️ Del</button></div>`; h+=`<div class="card"><div style="display:flex;gap:12px"><div class="badge" onclick="pickPic(${idx})">${picHtml}<span>📷 Change</span></div><div><b>${r.nam}</b><div style="color:var(--gold2);font-size:13px;margin-top:3px">সেনা নং: ${r.no} • #${i+1}</div><div style="font-size:11px;color:#8aa0bd;margin-top:4px">যোগদান: ${fmtDate(r.jogdan)}</div></div></div><div class="fieldGrid"><div class="field"><span>যোগদানের তারিখ:</span><b>${fmtDate(r.jogdan)}</b></div><div class="field"><span>যোগদানের পর:</span><b style="color:var(--gold2)">${motDinText}</b></div><div class="chuti4"><div class="field mot"><span>২৬ সালে মোট ছুটি</span><b>${total} দিন</b></div><div class="field"><span>পিলিপ</span><b>${r.pl||0}</b></div><div class="field"><span>সিলিপ</span><b>${r.cl||0}</b></div><div class="field"><span>নাইটপাশ</span><b>${r.np||0}</b></div></div><div class="field"><span>গ্রাম:</span><b>${r.gram||'-'}</b></div><div class="field"><span>পোস্ট:</span><b>${r.post||'-'}</b></div><div class="field"><span>থানা:</span><b>${r.thana||'-'}</b></div><div class="field"><span>জেলা:</span><b>${r.zilla||'-'}</b></div><div class="field"><span>মোবাইল-১:</span><b>${r.moba1||r.moba||'-'}</b></div><div class="field"><span>মোবাইল-২:</span><b>${r.moba2||'-'}</b></div></div>${btns}</div>`; }); document.getElementById("list").innerHTML=h||"<p style='padding:20px;text-align:center'>No Data - Add করো</p>"; } function pickPic(idx){ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } currentPicIdx=idx; document.getElementById("picInput").click(); } function handlePic(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(ev){ DATA[currentPicIdx].pic=ev.target.result; saveLocal(); render(DATA); }; reader.readAsDataURL(file); } function handleAddPic(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(ev){ addPicBase64=ev.target.result; document.getElementById("addPicPreview").innerHTML=`<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">`; }; reader.readAsDataURL(file); } function filter(){ let q=document.getElementById("q").value.toLowerCase(); render(DATA.filter(r=>JSON.stringify(r).toLowerCase().includes(q))); } function openAdd(){ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } addPicBase64=""; document.getElementById("addPicPreview").innerHTML="📷 Pic"; document.getElementById("addModal").style.display="flex"; } function closeAdd(){ document.getElementById("addModal").style.display="none"; } async function saveBoth(){ if(IS_COMMAND) return; let r={no:f_no.value,podobi:f_podobi.value,nam:f_nam.value,jogdan:f_jogdan.value,pl:document.getElementById("f_pl").value||0,cl:document.getElementById("f_cl").value||0,np:document.getElementById("f_np").value||0,gram:f_gram.value,post:f_post.value,thana:f_thana.value,zilla:f_zilla.value,moba1:document.getElementById("f_moba1").value,moba2:document.getElementById("f_moba2").value,pic:addPicBase64, action:"add"}; if(!r.nam){ alert("নাম লিখো"); return; } DATA.push(r); saveLocal(); render(DATA); closeAdd(); try{ await fetch(SCRIPT_URL,{method:"POST", mode:"no-cors", body:JSON.stringify(r)}); alert("✅ Save হয়েছে!"); }catch(e){ alert("Local Save হয়েছে, Sheet এ Fail: "+e); } } function delItem(idx){ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } if(confirm("Delete?")){ let row = idx+2; DATA.splice(idx,1); saveLocal(); render(DATA); fetch(SCRIPT_URL,{method:"POST", mode:"no-cors", body:JSON.stringify({action:"delete", row:row})}); } } function editItem(idx){ if(IS_COMMAND){ alert("⛔ COMMAND: View Only"); return; } openAdd(); let r=DATA[idx]; f_no.value=r.no; f_podobi.value=r.podobi; f_nam.value=r.nam; f_jogdan.value=r.jogdan; document.getElementById("f_pl").value=r.pl||""; document.getElementById("f_cl").value=r.cl||""; document.getElementById("f_np").value=r.np||""; calcMot(); f_gram.value=r.gram; f_post.value=r.post; f_thana.value=r.thana; f_zilla.value=r.zilla; document.getElementById("f_moba1").value=r.moba1||r.moba||""; document.getElementById("f_moba2").value=r.moba2||""; addPicBase64=r.pic||""; if(addPicBase64) document.getElementById("addPicPreview").innerHTML=`<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">`; DATA.splice(idx,1); } async function loadFromSheet(){ try{ let t = await fetch(SCRIPT_URL+"?t="+Date.now()).then(r=>r.text()); let rows = JSON.parse(t); if(!Array.isArray(rows)) return; let start = 0; if(rows[0] && rows[0][0] && String(rows[0][0]).includes("সেনা")) start = 1; let out=[]; for(let i=start;i<rows.length;i++){ let c=rows[i]; if(c[2]){ let existing = DATA.find(d=>d.no==c[0]); let jogdan, pl, cl, np, gram, post, thana, zilla, moba1, moba2; if(c.length>=13){ jogdan=c[3]; pl=c[4]; cl=c[5]; np=c[6]; gram=c[7]; post=c[8]; thana=c[9]; zilla=c[10]; moba1=c[11]; moba2=c[12]; } else { jogdan=c[3]; pl=c[4]||0; cl=c[5]||0; np=c[6]||0; gram=c[7]||""; post=c[8]||""; thana=c[9]||""; zilla=c[10]||""; moba1=c[11]||""; moba2=c[12]||""; } out.push({no:c[0],podobi:c[1],nam:c[2],jogdan:jogdan,pl:pl,cl:cl,np:np,gram:gram,post:post,thana:thana,zilla:zilla,moba1:moba1,moba2:moba2,pic:existing?existing.pic:""}); } } if(out.length>0){ DATA=out; saveLocal(); render(DATA); } }catch(e){ console.log("Load fail", e); render(DATA); } } render(DATA); loadFromSheet(); </script></body></html>
