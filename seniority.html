<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seniority - Sheet Only</title>
<style>
body{margin:0;background:#0a1a0f;color:#fff;font-family:Arial;padding:12px}
.top{background:#122e18;padding:12px;border-radius:12px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;background:#132a18;border-radius:12px;overflow:hidden;margin-top:12px}
th,td{padding:9px;border-bottom:1px solid #1e4a28;font-size:13px}
th{background:#1e4a28;color:#c8a951}
input{padding:10px;border-radius:10px;border:1px solid #c8a951;background:#0f2312;color:#fff}
.btn{background:#c8a951;color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:900;cursor:pointer}
.add{margin-top:12px;background:#132a18;border:1px solid #1e4a28;padding:10px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap}
</style>
</head><body>
<div class="top"><b>⭐ SENIORITY - Sheet Only</b><button class="btn" onclick="location.href='dashboard.html'">Back</button></div>

<input id="q" style="width:100%;margin-top:12px;box-sizing:border-box" placeholder="Search..." oninput="doFilter()" class="search">

<div class="add">
<input id="no" placeholder="No" style="width:80px">
<input id="podobi" placeholder="পদবী" style="width:100px">
<input id="nam" placeholder="নাম" style="flex:1">
<input id="date" type="date" style="width:140px">
<button class="btn" onclick="addToSheet()">Sheet এ Save</button>
</div>

<table><thead><tr><th>No</th><th>পদবী</th><th>নাম</th><th>ছুটি</th><th>ফেরত</th></tr></thead>
<tbody id="tb"><tr><td colspan=5>Loading Sheet...</td></tr></tbody></table>

<script>
const SHEET_ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
// এখানে তোমার Apps Script Link বসাও
const SCRIPT_URL="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

let DATA=[];

function render(arr){
 let h="";
 arr.forEach(r=>{
  let back=""; if(r.date){ let d=new Date(r.date); if(!isNaN(d)){ d.setDate(d.getDate()+75); back=d.toLocaleDateString('en-GB'); } }
  h+=`<tr><td>${r.no}</td><td>${r.rank}</td><td>${r.name}</td><td>${r.date}</td><td>${back}</td></tr>`;
 });
 document.getElementById("tb").innerHTML=h||"<tr><td colspan=5>No data in Sheet</td></tr>";
}

function doFilter(){
 let q=document.getElementById("q").value.toLowerCase();
 render(DATA.filter(r=> (r.no+r.rank+r.name+r.date).toLowerCase().includes(q)));
}

function loadSheet(){
 fetch(CSV_URL).then(r=>r.text()).then(t=>{
  let lines=t.split("\n").filter(l=>l.trim());
  let out=[];
  for(let i=1;i<lines.length;i++){
   let c=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim());
   if(c[2]) out.push({no:c[0],rank:c[1],name:c[2],date:c[3]});
  }
  DATA=out; render(DATA);
 });
}

function addToSheet(){
 let no=document.getElementById("no").value;
 let podobi=document.getElementById("podobi").value;
 let nam=document.getElementById("nam").value;
 let date=document.getElementById("date").value;
 if(!nam){ alert("নাম লিখো"); return; }
 if(SCRIPT_URL.includes("YOUR_SCRIPT_ID")){ alert("আগে SCRIPT_URL এ তোমার Apps Script Link বসাও"); return; }
 
 fetch(`${SCRIPT_URL}?no=${encodeURIComponent(no)}&podobi=${encodeURIComponent(podobi)}&nam=${encodeURIComponent(nam)}&date=${encodeURIComponent(date)}`, {mode:'no-cors'})
 .then(()=>{ alert("Sheet এ Save হয়ে গেছে! 2 সেকেন্ড পর List Update হবে"); setTimeout(loadSheet,2000); })
 .catch(()=>{ alert("Save হয়েছে, Sheet Check করো"); });
}

loadSheet();
</script>
</body></html>
