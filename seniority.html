<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seniority - 4 BIR</title>
<style>
body{margin:0;background:#eef2f7;font-family:Arial}
.header{background:#0a5c2f;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.back{background:#c0392b;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:bold}
.container{padding:12px;max-width:900px;margin:0 auto}
.inp{width:100%;padding:16px;border:2px solid #ddd;border-radius:18px;margin-bottom:12px;box-sizing:border-box;font-size:17px;background:white}
.btn-add{width:100%;padding:16px;background:#0a7a3a;color:white;border:none;border-radius:18px;font-size:20px;font-weight:900}
.title{font-size:26px;font-weight:900;text-align:center;margin:18px 0 5px}
.sub{color:#0a7a3a;text-align:center;font-size:20px;font-weight:900;margin-bottom:15px}
.btn-print{background:#1a4ee8;color:white;border:none;padding:12px 30px;border-radius:14px;font-size:18px;font-weight:900;display:block;margin:0 auto 15px auto}
table{width:100%;border-collapse:collapse;background:white}
th{background:#0a6b2e;color:white;padding:10px 4px;border:1px solid #fff;font-size:14px}
td{border:1px solid #999;padding:8px 4px;text-align:center;font-size:14px}
.hidden{display:none!important}
@media print{ .header, #adminBox, .btn-print {display:none!important} body{background:white} table{box-shadow:none} }
</style>
</head><body>
<div class="header"><h1>SENIORITY</h1><button class="back" onclick="location.href='dashboard.html'">BACK</button></div>
<div class="container">
<div id="adminBox">
<input id="s" class="inp" placeholder="সেনা নং">
<select id="p" class="inp"><option value="সৈনিক">সৈনিক</option><option value="ল্যান্স কর্পোরাল">ল্যান্স কর্পোরাল</option><option value="কর্পোরাল">কর্পোরাল</option><option value="সার্জেন্ট">সার্জেন্ট</option></select>
<input id="n" class="inp" placeholder="নাম বাংলা/ইংরেজি লিখুন">
<input id="d" class="inp" type="date">
<input id="m" class="inp" placeholder="মন্তব্য">
<button id="mainBtn" class="btn-add" onclick="saveData()">Add করুন</button>
<p id="msg" style="text-align:center;color:green;font-weight:bold"></p>
</div>
<div class="title">সিনিয়ারিটি অনুযায়ী নামীয় তালিকা</div><div class="sub">এমটি প্লাটুন ৪ বীর</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
<table><thead><tr><th>ক্রমিক</th><th>সেনা নং</th><th>পদবি</th><th>নাম</th><th>যোগদানের তারিখ</th><th>মোট দিন</th><th>মন্তব্য</th><th>একশন</th></tr></thead><tbody id="tb"><tr><td colspan="8">Loading...</td></tr></tbody></table>
</div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxolgAsqJPwu24tQK6iZ1usICQ8e4WhJqK-fuovsMKC_RMvK-110rpm1CbvY-ZG1GjCIA/exec";

let role = localStorage.getItem('role')||'';
if(role==='mt' || role==='platoon' || role==='viewer'){ document.getElementById('adminBox').classList.add('hidden'); }

function formatDate(dateStr){
  if(!dateStr) return '';
  let d = new Date(dateStr);
  if(isNaN(d)) return dateStr;
  let day = String(d.getDate()).padStart(2,'0');
  let month = String(d.getMonth()+1).padStart(2,'0');
  let year = d.getFullYear();
  return day+'-'+month+'-'+year;
}

async function loadData(){
  try{
    let res = await fetch(SHEET_URL);
    let data = await res.json();
    data.sort((a,b)=> new Date(a.D)-new Date(b.D));
    let tb=document.getElementById('tb'); tb.innerHTML='';
    if(data.length==0){tb.innerHTML='<tr><td colspan="8">কোনো ডাটা নাই</td></tr>'; return;}
    data.forEach((r,i)=>{
      let today=new Date(); today.setHours(0,0,0,0);
      let jd=new Date(r.D); jd.setHours(0,0,0,0);
      let diffDays = Math.floor((today - jd)/(1000*60*60*24));
      if(diffDays<0) diffDays=0;
      let dayText = diffDays + ' দিন';
      let dateShow = formatDate(r.D);
      let action = (role==='clk'||role==='admin')? `Admin` : 'View';
      tb.innerHTML+=`<tr><td>${i+1}</td><td>${r.S}</td><td>${r.P}</td><td>${r.N}</td><td>${dateShow}</td><td>${dayText}</td><td>${r.M||''}</td><td>${action}</td></tr>`;
    });
  }catch(e){ document.getElementById('tb').innerHTML='<tr><td colspan="8">Sheet Error</td></tr>'; }
}

async function saveData(){
  let S=document.getElementById('s').value.trim(), P=document.getElementById('p').value, N=document.getElementById('n').value.trim(), D=document.getElementById('d').value, M=document.getElementById('m').value.trim();
  if(!S||!N||!D) return alert('সব পূরণ করুন');
  document.getElementById('msg').innerText='Sheet এ পাঠানো হচ্ছে...';
  await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({S,P,N,D,M})});
  document.getElementById('msg').innerText='✅ Save হয়েছে!';
  document.getElementById('s').value=''; document.getElementById('n').value=''; document.getElementById('d').value=''; document.getElementById('m').value='';
  setTimeout(loadData,2000);
}
loadData();
</script></body></html>
