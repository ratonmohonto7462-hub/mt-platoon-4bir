<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seniority - ছুটি</title>
<style>
body{margin:0;font-family:Arial;background:#0a1a0f;color:#fff;padding:14px}
.top{background:#122e18;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#132a18;border-radius:12px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #1e4a28;text-align:left;font-size:13px}
th{background:#1e4a28;color:#c8a951}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid #c8a951;background:#132a18;color:#fff;margin-bottom:12px;outline:none}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:900}
.green{background:#22c55e;color:#000}
.red{background:#ef4444;color:#fff}
.yellow{background:#eab308;color:#000}
</style>
</head>
<body>
<div class="top">
<b>⭐ SENIORITY - ছুটির হিসাব</b>
<button onclick="location.href='dashboard.html'" style="padding:6px 12px;border-radius:8px;border:none;background:#c8a951;font-weight:900">Back</button>
</div>

<input id="s" class="search" placeholder="নাম লিখো: মশিউর, আজিজুল..." oninput="filter()">

<table id="tbl">
<thead><tr><th>No</th><th>Rank & Name</th><th>ছুটি গিয়েছে</th><th>ফেরত</th><th>বাকি</th></tr></thead>
<tbody id="body"><tr><td colspan="5">Loading...</td></tr></tbody>
</table>

<script>
const ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
const CSV="https://docs.google.com/spreadsheets/d/"+ID+"/export?format=csv";
let DATA=[];

function parseCSV(t){
 let lines=t.split("\n").filter(l=>l.trim());
 let out=[];
 for(let i=1;i<lines.length;i++){
  let c=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim());
  if(c[2]) out.push({no:c[0],rank:c[1],name:c[2],suty:c[3],mob:c[4]});
 }
 return out;
}
async function load(){
 try{
  let txt=await fetch(CSV).then(r=>r.text());
  DATA=parseCSV(txt);
  localStorage.setItem("seniorityCache",JSON.stringify(DATA));
 }catch(e){
  DATA=JSON.parse(localStorage.getItem("seniorityCache")||"[]");
 }
 render(DATA);
}
function render(arr){
 let today=new Date();
 let html="";
 arr.forEach(r=>{
  let sutyDate = r.suty ? new Date(r.suty) : null;
  let retDate = null;
  let diff = "";
  let cls="green";
  if(sutyDate && !isNaN(sutyDate)){
   retDate = new Date(sutyDate);
   retDate.setDate(retDate.getDate()+75);
   let d = Math.ceil((retDate-today)/86400000);
   if(d<0){ diff=d+" দিন আগে"; cls="red"; }
   else if(d<=7){ diff=d+" দিন বাকি"; cls="yellow"; }
   else { diff=d+" দিন বাকি"; cls="green"; }
  }
  html+=`<tr><td>${r.no}</td><td>${r.rank} ${r.name}<br><small style="color:#8aa88f">${r.mob||''}</small></td><td>${r.suty||'-'}</td><td>${retDate?retDate.toLocaleDateString('en-GB'):''}</td><td><span class="badge ${cls}">${diff||'-'}</span></td></tr>`;
 });
 document.getElementById("body").innerHTML=html||"<tr><td colspan=5>No data</td></tr>";
}
function filter(){
 let q=document.getElementById("s").value.toLowerCase();
 let f=DATA.filter(r=>(r.name+r.rank+r.no).toLowerCase().includes(q) || r.name.includes(document.getElementById("s").value));
 render(f);
}
load();
</script>
</body>
</html>
