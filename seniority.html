<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUTY SENIORITY</title>
<style>
:root{--bg:#08121a;--card:#101f2e;--gold:#c8a951;--gold2:#ffdb70}
body{margin:0;background:var(--bg);color:#e8f0ff;font-family:Arial;padding:0}
.topBar{background:#0e1e2f;padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a324d}
.topBar h2{margin:0;color:var(--gold2);font-size:16px}
.searchWrap{padding:12px}
.search{width:100%;box-sizing:border-box;padding:13px;border-radius:24px;border:1.5px solid var(--gold);background:#0e1e2f;color:#fff;outline:none}
.addBtn{margin:0 12px;width:calc(100% - 24px);padding:13px;border-radius:14px;border:1.5px solid var(--gold);background:linear-gradient(180deg,#2a2310,#1a160a);color:var(--gold2);font-weight:900;cursor:pointer}
.card{margin:12px;background:var(--card);border:1px solid #1a324d;border-radius:18px;padding:12px}
.badge{width:72px;height:72px;background:linear-gradient(180deg,#c8a951,#8a6d1e);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:15px}
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px}
.field{background:#0c1a28;border:1px solid #1a324d;border-radius:10px;padding:8px}
.field span{color:#8aa0bd;font-size:11px;display:block}
.field b{color:#fff;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modalBox{background:#101f2e;border:1px solid var(--gold);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.modalBox label{color:var(--gold2);font-size:13px;margin-top:10px;display:block}
.modalBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #c8a951;background:#0e1e2f;color:#fff;margin-top:4px}
.btn{padding:11px;border-radius:12px;border:1.5px solid var(--gold);font-weight:900;cursor:pointer;width:100%}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.roleTag{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}
.role-command{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a}
.role-mt{background:#1a3d22;color:var(--gold2);border:1px solid var(--gold)}
</style>
</head><body>

<div class="topBar"><span onclick="location.href='dashboard.html'" style="font-size:22px;cursor:pointer"><</span><h2>SUTY SENIORITY</h2><span id="roleBadge" class="roleTag"></span></div>

<div class="searchWrap"><input id="q" class="search" placeholder="🔍 Search..." oninput="filter()"></div>
<button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD SENIORITY</button>
<div id="list"></div>

<div id="addModal" class="modal">
<div class="modalBox">
<h3 style="margin:0;color:var(--gold2)">Add Seniority</h3>
<label>সেনা নং</label><input id="f_no">
<label>পদবী</label><input id="f_podobi">
<label>নাম</label><input id="f_nam">
<label>যোগদানের তারিখ</label><input id="f_jogdan" type="date">
<label>ছুটির তারিখ</label><input id="f_suty" type="date">
<label>মোট ছুটি</label><input id="f_mot">
<label>গ্রাম</label><input id="f_gram">
<label>পোস্ট</label><input id="f_post">
<label>থানা</label><input id="f_thana">
<label>জেলা</label><input id="f_zilla">
<label>মোবা.</label><input id="f_moba">
<div style="display:flex;gap:8px;margin-top:14px">
<button class="btn" style="background:var(--gold);color:#000" onclick="saveBoth()">✓ Save Local + Sheet</button>
<button class="btn" style="background:#2a0f14;color:#ff6b6b" onclick="closeAdd()">✕ Cancel</button>
</div>
</div>
</div>

<script>
const SHEET_ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const SCRIPT_URL="https://script.google.com/macros/s/YOUR_ID/exec";

let urlRole = new URLSearchParams(window.location.search).get("role");
if(urlRole) localStorage.setItem("role", urlRole);
let ROLE = (localStorage.getItem("role")||"mt_clk").toLowerCase();
let IS_COMMAND = ROLE.includes("command")||ROLE.includes("cmd")||ROLE.includes("co");
let IS_MT = !IS_COMMAND;

document.getElementById("roleBadge").innerText = IS_COMMAND ? "COMMAND - View Only" : "MT CLK - Editor";
document.getElementById("roleBadge").className = IS_COMMAND ? "roleTag role-command" : "roleTag role-mt";
document.getElementById("addBtn").style.display = IS_COMMAND ? "none" : "block";

let DATA = JSON.parse(localStorage.getItem("seniorityCache")||"[]");
if(DATA.length==0){
 DATA=[{no:"4521328",podobi:"সৈনিক",nam:"রতন চন্দ্র মহন্ত",suty:"2026-10-15",jogdan:"2015-03-15",mot:"70",gram:"সীট বাগপুর",post:"উত্তর পানাপুকুর",thana:"গংগাচড়া",zilla:"রংপুর",moba:"01737912094"}];
}
function saveLocal(){ localStorage.setItem("seniorityCache", JSON.stringify(DATA)); }

// মোট দিন অনুযায়ী Sort - যোগদান আগে হলে Senior
function sortBySeniority(arr){
 return arr.sort((a,b)=>{
  let da=new Date(a.jogdan), db=new Date(b.jogdan);
  if(isNaN(da)) return 1;
  if(isNaN(db)) return -1;
  return da - db; // আগে যোগদান = #1
 });
}

function render(arr){
 let sorted = sortBySeniority([...arr]);
 let h="";
 sorted.forEach((r,i)=>{
  let motDin="-"; if(r.jogdan){ let d=new Date(r.jogdan); if(!isNaN(d)) motDin=Math.floor((new Date()-d)/86400000)+" দিন"; }
  let btns = IS_COMMAND ? "" : `
    <div class="btnRow">
      <button class="btn" style="background:#1e1705;color:var(--gold2)" onclick="editItem(${DATA.indexOf(r)})">✏️ Edit</button>
      <button class="btn" style="background:#2a0f14;color:#ff6b6b;border-color:#5a1a23" onclick="delItem(${DATA.indexOf(r)})">🗑️ Del</button>
    </div>`;
  h+=`<div class="card">
   <div style="display:flex;gap:12px"><div class="badge">${r.podobi||'সৈনিক'}</div><div><b>${r.nam}</b><div style="color:var(--gold2);font-size:13px;margin-top:3px">সেনা নং: ${r.no} • #${i+1} - ${motDin} Senior</div></div></div>
   <div class="fieldGrid">
    <div class="field"><span>যোগদানের তারিখ:</span><b>${r.jogdan||'-'}</b></div>
    <div class="field"><span>মোট দিন:</span><b style="color:var(--gold2)">${motDin}</b></div>
    <div class="field"><span>মোট ছুটি:</span><b>${r.mot||'-'} দিন</b></div>
    <div class="field"><span>গ্রাম:</span><b>${r.gram||'-'}</b></div>
    <div class="field"><span>পোস্ট:</span><b>${r.post||'-'}</b></div>
    <div class="field"><span>থানা:</span><b>${r.thana||'-'}</b></div>
    <div class="field"><span>জেলা:</span><b>${r.zilla||'-'}</b></div>
    <div class="field"><span>মোবা:</span><b>${r.moba||'-'}</b></div>
   </div>
   ${btns}
  </div>`;
 });
 document.getElementById("list").innerHTML=h;
}

function filter(){ let q=document.getElementById("q").value.toLowerCase(); render(DATA.filter(r=>JSON.stringify(r).toLowerCase().includes(q))); }
function openAdd(){ if(IS_COMMAND){ alert("Command শুধু দেখতে পারবে"); return; } document.getElementById("addModal").style.display="flex"; }
function closeAdd(){ document.getElementById("addModal").style.display="none"; }
function saveBoth(){
 if(IS_COMMAND) return;
 let r={no:f_no.value,podobi:f_podobi.value,nam:f_nam.value,jogdan:f_jogdan.value,suty:f_suty.value,mot:f_mot.value,gram:f_gram.value,post:f_post.value,thana:f_thana.value,zilla:f_zilla.value,moba:f_moba.value};
 if(!r.nam){ alert("নাম লিখো"); return; }
 DATA.push(r); saveLocal(); render(DATA); closeAdd();
 if(!SCRIPT_URL.includes("YOUR_ID")){
  let qs=`?no=${encodeURIComponent(r.no)}&podobi=${encodeURIComponent(r.podobi)}&nam=${encodeURIComponent(r.nam)}&jogdan=${encodeURIComponent(r.jogdan)}&suty=${encodeURIComponent(r.suty)}&motChuti=${encodeURIComponent(r.mot)}&gram=${encodeURIComponent(r.gram)}&post=${encodeURIComponent(r.post)}&thana=${encodeURIComponent(r.thana)}&zilla=${encodeURIComponent(r.zilla)}&moba=${encodeURIComponent(r.moba)}`;
  fetch(SCRIPT_URL+qs,{mode:'no-cors'});
 }
}
function delItem(idx){ if(IS_COMMAND) return; if(confirm("Delete?")){ DATA.splice(idx,1); saveLocal(); render(DATA); } }
function editItem(idx){ if(IS_COMMAND) return; openAdd(); let r=DATA[idx]; f_no.value=r.no; f_podobi.value=r.podobi; f_nam.value=r.nam; f_jogdan.value=r.jogdan; f_suty.value=r.suty; f_mot.value=r.mot; f_gram.value=r.gram; f_post.value=r.post; f_thana.value=r.thana; f_zilla.value=r.zilla; f_moba.value=r.moba; DATA.splice(idx,1); }
function loadFromSheet(){
 fetch(CSV_URL).then(r=>r.text()).then(t=>{
  let lines=t.split("\n").filter(l=>l.trim());
  let out=[];
  for(let i=1;i<lines.length;i++){
   let c=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim());
   if(c[2]) out.push({no:c[0],podobi:c[1],nam:c[2],suty:c[3],jogdan:c[4],mot:c[5],gram:c[6],post:c[7],thana:c[8],zilla:c[9],moba:c[10]});
  }
  if(out.length>0){ DATA=out; saveLocal(); render(DATA); }
 });
}
render(DATA); loadFromSheet();
</script>
</body></html>
