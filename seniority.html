<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT 4 BIR SUTY SENIORITY - Online</title>
<style>
 body{font-family:Arial;background:#0f172a;color:#fff;padding:10px}
 .card{background:#1e293b;padding:12px;border-radius:10px;margin-bottom:10px}
 input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:none}
 button{background:#22c55e;color:#000;font-weight:bold}
 table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;color:#000}
 th,td{border:1px solid #ccc;padding:6px;font-size:12px;text-align:center}
 th{background:#0f172a;color:#fff}
 .online{color:#22c55e;font-weight:bold}
</style>
</head>
<body>
<h2>MT 4 BIR - SUTY SENIORITY <span class="online">● ONLINE SHEET</span></h2>
<div class="card">
<input id="soinik" placeholder="সৈনিক নং">
<input id="podobi" placeholder="পদবী">
<input id="nam" placeholder="নাম">
<input id="suty" type="date">
<select id="bodli"><option>বদলী হ্যাঁ</option><option>বদলী না</option></select>
<input id="jogdan" type="date">
<button onclick="save()">SAVE TO SHEET</button>
<button onclick="load()" style="background:#38bdf8">RELOAD</button>
</div>
<table><thead><tr><th>সৈনিক</th><th>পদবী</th><th>নাম</th><th>সুটি</th><th>বদলী</th><th>যোগদান</th></tr></thead><tbody id="tb"></tbody></table>
<script>
const URL="https://script.google.com/macros/s/AKfycby5H3t7wx8RgyUhQLGN2uk4KA4uM03JyiHW7lmiFEDm-7GyFMf6o2DFO6HLQhqEy1ibEQ/exec";
function save(){
 let d={soinik:soinik.value,podobi:podobi.value,nam:nam.value,suty:suty.value,bodli:bodli.value,jogdan:jogdan.value};
 if(!d.soinik||!d.nam){alert("সৈনিক নং ও নাম লিখো ভাই");return;}
 fetch(URL,{method:"POST",body:JSON.stringify(d)}).then(r=>{alert("Sheet এ Save হইছে ভাই!");load();});
}
function load(){
 tb.innerHTML="<tr><td colspan=6>Loading...</td></tr>";
 fetch(URL).then(r=>r.json()).then(data=>{
  tb.innerHTML="";
  data.reverse().forEach(r=>{
   tb.innerHTML+=`<tr><td>${r.soinik}</td><td>${r.podobi}</td><td>${r.nam}</td><td>${r.suty}</td><td>${r.bodli}</td><td>${r.jogdan}</td></tr>`;
  });
 });
}
load();
</script>
</body>
</html>
