<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suty Seniority - 4 BIR</title>
<style>
body{margin:0;background:#f2f4f7;font-family:Arial,sans-serif}
.head{text-align:center;background:white;padding:20px 10px}
.head h1{margin:0;font-size:26px;font-weight:900}
.head h2{margin:4px 0 0;color:#0a7a00;font-size:22px}
.print{background:#1a4dff;color:white;border:none;padding:14px 32px;border-radius:14px;font-weight:900;font-size:18px;margin-top:14px;cursor:pointer}
.form{background:white;margin:14px;border-radius:16px;padding:16px}
.inp{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:12px;margin-bottom:12px;font-size:16px}
.save{width:100%;background:#1db954;border:none;padding:14px;border-radius:12px;font-weight:900;font-size:18px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:white;margin-top:10px}
th{background:#0a6b2e;color:white;padding:10px 4px;font-size:14px}
td{border:1px solid #ddd;padding:8px 4px;text-align:center;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="head">
<h1>সিনিয়ারিটি অনুযায়ী নামীয় তালিকা</h1>
<h2>এমটি প্লাটুন ৪ বীর</h2>
<button class="print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
</div>

<div id="adminBox" class="form">
<input id="sena" class="inp" placeholder="সেনা নং">
<input id="podobi" class="inp" placeholder="পদবি">
<input id="name" class="inp" placeholder="নাম">
<label style="font-weight:700">যোগদানের তারিখ</label>
<input id="jdate" class="inp" type="date">
<button class="save" onclick="add()">SAVE</button>
</div>

<table>
<thead><tr><th>ক্রমিক</th><th>সেনা নং</th><th>পদবি</th><th>নাম</th><th>যোগদানের তারিখ</th><th>মোট দিন</th><th id="actH">একশন</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
let list = JSON.parse(localStorage.getItem("seniority_data")||"[]");
let role = localStorage.getItem("role"); // mt or clk

// যদি MT PLATOON দিয়ে ঢুকে
if(role === "mt"){
  document.getElementById("adminBox").classList.add("hide");
  document.getElementById("actH").classList.add("hide");
}

function add(){
  let s=document.getElementById("sena").value, p=document.getElementById("podobi").value, n=document.getElementById("name").value, d=document.getElementById("jdate").value;
  if(!s||!n||!d){alert("সব পূরণ করুন");return;}
  list.push({s,p,n,d});
  localStorage.setItem("seniority_data",JSON.stringify(list));
  render();
}
function render(){
  let tb=document.getElementById("tbody"); tb.innerHTML="";
  list.sort((a,b)=> new Date(a.d)-new Date(b.d));
  list.forEach((r,i)=>{
    let days = Math.floor((new Date() - new Date(r.d))/86400000);
    tb.innerHTML += `<tr>
      <td>${i+1}</td><td>${r.s}</td><td>${r.p}</td><td>${r.n}</td><td>${r.d}</td><td>${days} দিন</td>
      <td class="${role==='mt'?'hide':''}">
        <button onclick="edit(${i})">Edit</button>
        <button onclick="del(${i})" style="background:red;color:white;border:none;border-radius:5px;padding:4px 8px">Del</button>
      </td>
    </tr>`;
  });
}
function del(i){ if(confirm("Delete করবো?")){ list.splice(i,1); localStorage.setItem("seniority_data",JSON.stringify(list)); render(); } }
function edit(i){
  let r=list[i];
  let ns=prompt("সেনা নং:",r.s); if(ns) r.s=ns;
  let np=prompt("পদবি:",r.p); if(np) r.p=np;
  let nn=prompt("নাম:",r.n); if(nn) r.n=nn;
  localStorage.setItem("seniority_data",JSON.stringify(list)); render();
}
render();
</script>
</body>
</html>
