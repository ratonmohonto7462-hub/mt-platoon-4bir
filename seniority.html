<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সিনিয়রিটি অনুযায়ী নামীয় তালিকা - এমটি প্লাটুন ৪ বীর</title>
<style>
  body{font-family:'Noto Sans Bengali',sans-serif;background:#0f172a;color:#fff;margin:0;padding:15px}
 .container{max-width:1100px;margin:auto;background:#1e293b;padding:20px;border-radius:16px}
  h1{text-align:center;color:#facc15;font-size:22px;margin-bottom:20px}
 .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:15px}
  input,select{padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;width:100%}
  button{padding:10px 15px;border-radius:8px;border:none;cursor:pointer;font-weight:bold}
 .btn-save{background:#22c55e;color:#000;width:100%;margin-top:10px}
 .btn-print{background:#3b82f6;color:#fff;margin-bottom:15px}
  table{width:100%;border-collapse:collapse;margin-top:15px;background:#0f172a;border-radius:10px;overflow:hidden}
  th,td{border:1px solid #334155;padding:8px;text-align:center;font-size:14px}
  th{background:#334155;color:#facc15}
 .action-btn{padding:5px 8px;font-size:12px;margin:2px}
 .del{background:#ef4444;color:#fff}
 .edit{background:#eab308;color:#000}
  @media print{.form-grid,.btn-save,.btn-print,.action-col{display:none!important} body{background:#fff;color:#000}.container{background:#fff} th{background:#ddd!important;color:#000!important}}
</style>
</head>
<body>
<div class="container">
  <h1>সিনিয়রিটি অনুযায়ী নামীয় তালিকা - এমটি প্লাটুন ৪ বীর</h1>
  <button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

  <div class="form-grid">
    <input type="text" id="senaNo" placeholder="সেনা নং">
    <select id="rank">
      <option value="">পদবি</option><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option>
    </select>
    <input type="text" id="name" placeholder="নাম">
    <input type="date" id="joinDate">
  </div>
  <button class="btn-save" onclick="saveData()">সেভ করুন</button>

  <table id="seniorityTable">
    <thead><tr><th>ক্রঃ নং</th><th>সেনা নং</th><th>পদবি</th><th>নাম</th><th>যোগদানের তারিখ</th><th class="action-col">অ্যাকশন</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDMkXQ_D-vMfLOzgnYTurbj1N5PlaROgAjORIYXwirRg--9mENS9IzCxAi1UqR6Km1Fg/exec";
let data = []; let editIndex = -1;

async function loadData(){
  try{
    const res = await fetch(SCRIPT_URL);
    data = await res.json();
    render();
  }catch(e){ console.log(e); }
}
function render(){
  data.sort((a,b)=> new Date(a.joinDate) - new Date(b.joinDate));
  const tbody = document.querySelector("#seniorityTable tbody");
  tbody.innerHTML = "";
  data.forEach((row,i)=>{
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${row.senaNo}</td><td>${row.rank}</td><td>${row.name}</td><td>${row.joinDate}</td><td class="action-col"><button class="action-btn edit" onclick="editData(${i})">এডিট</button><button class="action-btn del" onclick="deleteData(${i})">ডিলিট</button></td></tr>`;
  });
}
async function saveData(){
  const obj = { senaNo: document.getElementById("senaNo").value, rank: document.getElementById("rank").value, name: document.getElementById("name").value, joinDate: document.getElementById("joinDate").value };
  if(!obj.senaNo ||!obj.name ||!obj.joinDate){ alert("সব তথ্য পূরণ করুন"); return; }
  if(editIndex > -1){ data[editIndex]=obj; editIndex=-1; } else { data.push(obj); }
  await fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", body: JSON.stringify(data)});
  document.getElementById
