<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seniority - 4 BIR</title>
<style>
body{margin:0;background:#eef2f7;font-family:'SolaimanLipi',Arial}
.header{background:#0a5c2f;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;font-size:18px}
.back{background:#c0392b;color:white;border:none;padding:8px 14px;border-radius:8px;font-weight:bold}
.container{padding:12px;max-width:900px;margin:0 auto}
.inp{width:100%;padding:16px;border:2px solid #ddd;border-radius:18px;margin-bottom:12px;box-sizing:border-box;font-size:17px;background:white;outline:none}
.btn-add{width:100%;padding:16px;background:#0a7a3a;color:white;border:none;border-radius:18px;font-size:20px;font-weight:900;cursor:pointer;margin-top:5px}
.title{font-size:28px;font-weight:900;text-align:center;line-height:1.2;margin:18px 0 5px 0}
.sub{color:#0a7a3a;text-align:center;font-size:22px;font-weight:900;margin-bottom:15px}
.btn-print{background:#1a4ee8;color:white;border:none;padding:12px 30px;border-radius:14px;font-size:18px;font-weight:900;display:block;margin:0 auto 15px auto}
table{width:100%;border-collapse:collapse;background:white;box-shadow:0 2px 8px #0001}
th{background:#0a6b2e;color:white;padding:10px 4px;font-size:15px;border:1px solid #fff}
td{border:1px solid #999;padding:8px 4px;text-align:center;font-size:15px;background:white}
.btn-edit{background:#2a7bff;color:white;border:none;padding:7px 12px;border-radius:10px;font-weight:900;margin-bottom:4px;width:60px}
.btn-del{background:#ff1a1a;color:white;border:none;padding:6px 10px;border-radius:10px;font-weight:900;width:40px}
@media print{.header,.inp,.btn-add,.btn-print,.btn-edit,.btn-del{display:none!important} body{background:white}}
</style>
</head>
<body>
<div class="header">
<h1>SENIORITY</h1>
<button class="back" onclick="location.href='dashboard.html'">BACK</button>
</div>

<div class="container">
<input id="s" class="inp" placeholder="সেনা নং">
<select id="p" class="inp">
<option value="সৈনিক">সৈনিক</option>
<option value="ল্যান্স কর্পোরাল">ল্যান্স কর্পোরাল</option>
<option value="কর্পোরাল">কর্পোরাল</option>
<option value="সার্জেন্ট">সার্জেন্ট</option>
</select>
<input id="n" class="inp" placeholder="নাম বাংলা/ইংরেজি লিখুন">
<input id="d" class="inp" type="date">
<button id="mainBtn" class="btn-add" onclick="saveData()">Add করুন</button>

<div class="title">সিনিয়ারিটি অনুযায়ী নামীয় তালিকা</div>
<div class="sub">এমটি প্লাটুন ৪ বীর</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

<table>
<thead><tr><th>ক্রমিক</th><th>সেনা নং</th><th>পদবি</th><th>নাম</th><th>যোগদানের তারিখ</th><th>মোট দিন</th><th>একশন</th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>

<script>
let db = JSON.parse(localStorage.getItem('suty')||'[]');
let editIdx = -1;

function saveData(){
  let S=s.value.trim(), P=p.value, N=n.value.trim(), D=d.value;
  if(!S||!N||!D) return alert('সব পূরণ করুন');
  if(editIdx>=0){ db[editIdx]={S,P,N,D}; editIdx=-1; mainBtn.innerText='Add করুন'; }
  else{ db.push({S,P,N,D}); }
  localStorage.setItem('suty', JSON.stringify(db));
  s.value=''; n.value=''; d.value=''; p.value='সৈনিক';
  render();
}
function render(){
  let tb=document.getElementById('tb'); tb.innerHTML='';
  db.sort((a,b)=> new Date(a.D)-new Date(b.D));
  if(db.length==0){ tb.innerHTML='<tr><td colspan="7">কোনো ডাটা নাই</td></tr>'; return; }
  db.forEach((r,i)=>{
    let today=new Date(); today.setHours(0,0,0,0);
    let jd=new Date(r.D); let diff=Math.ceil((jd-today)/(1000*60*60*24));
    let dayText='';
    if(diff>0) dayText=diff+'<br>দিন<br>বাকি';
    else if(diff==0) dayText='আজ';
    else dayText=Math.abs(diff)+' দিন';
    tb.innerHTML+=`<tr><td>${i+1}</td><td>${r.S}</td><td>${r.P}</td><td>${r.N}</td><td>${r.D}</td><td>${dayText}</td><td><button class="btn-edit" onclick="editRow(${i})">Edit</button><br><button class="btn-del" onclick="delRow(${i})">X</button></td></tr>`;
  });
}
function editRow(i){ let r=db[i]; s.value=r.S; p.value=r.P; n.value=r.N; d.value=r.D; editIdx=i; mainBtn.innerText='Update করুন'; window.scrollTo(0,0); }
function delRow(i){ if(confirm('ডিলিট করবে?')){ db.splice(i,1); localStorage.setItem('suty',JSON.stringify(db)); render(); } }
render();
</script>
</body>
</html>
