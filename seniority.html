<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENIORITY - MT PLATOON</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0a1a0f;color:#fff}.top{background:#122e18;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1px solid #c8a951}.top b{color:#c8a951}.backBtn{background:#1a3d22;border:1px solid #c8a951;color:#c8a951;padding:8px 14px;border-radius:8px;font-weight:900}.wrap{padding:10px}.searchBox{display:flex;align-items:center;gap:8px;background:#132a18;border:2px solid #c8a951;border-radius:12px;padding:12px 14px;margin:10px 0}.searchBox input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:15px;font-weight:700}.searchBox input::placeholder{color:#8aa88f}table{width:100%;border-collapse:collapse;background:#fff;color:#000;font-size:13px}th{background:#122e18;color:#c8a951;padding:10px 6px;font-size:12px;position:sticky;top:0}td{padding:8px 6px;border:1px solid #ccc;text-align:center}tr:nth-child(even){background:#f2f2f2}tr.hidden{display:none}.editBtn{background:#0a4d0a;color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:900}.delBtn{background:#d50000;color:#fff;border:none;padding:4px 8px;border-radius:6px;margin-top:4px}.highlight{background:yellow;color:#000;font-weight:900}</style></head><body>
<div class="top"><b>SENIORITY - MT PLATOON</b><button class="backBtn" onclick="location.href='dashboard.html'">BACK</button></div>
<div class="wrap">
<div class="searchBox"><span>🔍</span><input id="search" type="text" placeholder="নাম লিখুন - যেমন: মশিউর, আজিজুল, রহমান..." oninput="filterTable()"></div>
<div id="count" style="color:#c8a951;font-size:12px;font-weight:700;margin-bottom:6px">Loading...</div>
<table id="mainTable"><thead><tr><th>ক্রঃ</th><th>নং</th><th>পদবী</th><th>নাম</th><th>ছুটির তারিখ</th><th>বাকি</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
const SENIORITY_ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
const SENIORITY_CSV="https://docs.google.com/spreadsheets/d/"+SENIORITY_ID+"/export?format=csv";
let allData=[];
function parseCSV(t){try{let lines=t.split("\n").filter(l=>l.trim().length>0);let out=[];for(let i=1;i<lines.length;i++){let cols=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,'').trim());if(cols[0]||cols[1]||cols[2]||cols[3]) out.push(cols);}return out;}catch(e){return [];}}
async function load(){
  try{
    let txt=await fetch(SENIORITY_CSV+"?t="+Date.now()).then(r=>r.text());
    let rows=parseCSV(txt);
    allData=rows.map((c,i)=>({sl:i+1,no:c[0],rank:c[1],name:c[2],date:c[3],baki:c[4]}));
    if(allData.length>0) localStorage.setItem("seniorityCacheFull",JSON.stringify(allData));
    render(allData);
  }catch(e){
    allData=JSON.parse(localStorage.getItem("seniorityCacheFull")||localStorage.getItem("seniorityCache")||"[]");
    if(allData.length==0){
      allData=[
        {sl:21,no:"৪৫০৪৩০৭",rank:"সৈনিক",name:"মোঃ মশিউর রহমান",date:"09-09-2026",baki:"49 দিন"},
        {sl:24,no:"৪৫০২০৫৫",rank:"সৈনিক",name:"আজিজুল শিকদার",date:"19-10-2026",baki:"9 দিন"}
      ];
    }
    render(allData);
  }
}
function render(data){
  let tb=document.getElementById('tbody'); tb.innerHTML='';
  data.forEach(r=>{
    tb.innerHTML+=`<tr><td>${r.sl}</td><td>${r.no}</td><td>${r.rank}</td><td><b>${r.name}</b></td><td>${r.date}</td><td>${r.baki}</td><td><button class="editBtn">Edit</button><br><button class="delBtn">X</button></td></tr>`;
  });
  document.getElementById('count').innerText=`মোট: ${data.length} জন | Showing: ${data.length} জন`;
}
function filterTable(){
  let q=document.getElementById('search').value.trim();
  let tb=document.getElementById('tbody'); tb.innerHTML='';
  if(!q){ render(allData); return; }
  let filtered=allData.filter(r=>{
    let txt=`${r.no} ${r.rank} ${r.name} ${r.date} ${r.baki}`.toLowerCase();
    return txt.includes(q.toLowerCase()) || `${r.name}`.includes(q);
  });
  filtered.forEach(r=>{
    let highlighted=r.name.replace(new RegExp(q,'gi'), match=>`<span class="highlight">${match}</span>`);
    tb.innerHTML+=`<tr><td>${r.sl}</td><td>${r.no}</td><td>${r.rank}</td><td><b>${highlighted}</b></td><td>${r.date}</td><td>${r.baki}</td><td><button class="editBtn">Edit</button><br><button class="delBtn">X</button></td></tr>`;
  });
  document.getElementById('count').innerText=`🔍 "${q}" - পাওয়া গেছে: ${filtered.length} জন`;
  if(filtered.length==0){
    tb.innerHTML=`<tr><td colspan="7" style="padding:20px;color:#d50000">🔍 "${q}" নামে কেউ পাওয়া যায়নি<br><small>যেমন: মশিউর, আজিজুল, রহমান লিখুন</small></td></tr>`;
  }
}
load();
</script></body></html>
