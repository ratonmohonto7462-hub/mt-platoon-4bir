<!DOCTYPE html> <html><head> <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"> <title>SUTY SENIORITY</title> <style> :root{--bg:#08121a;--card:#101f2e;--gold:#c8a951;--gold2:#ffdb70} body{margin:0;background:var(--bg);color:#e8f0ff;font-family:Arial;padding:0} .topBar{background:#0e1e2f;padding:12px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #1a324d} .topBar h2{margin:0;color:var(--gold2);font-size:16px} .searchWrap{padding:12px} .search{width:100%;box-sizing:border-box;padding:13px;border-radius:24px;border:1.5px solid var(--gold);background:#0e1e2f;color:#fff;outline:none} .addBtn{margin:0 12px;width:calc(100% - 24px);padding:13px;border-radius:14px;border:1.5px solid var(--gold);background:linear-gradient(180deg,#2a2310,#1a160a);color:var(--gold2);font-weight:900;cursor:pointer} .card{margin:12px;background:var(--card);border:1px solid #1a324d;border-radius:18px;padding:12px} .badge{width:78px;height:78px;background:linear-gradient(180deg,#c8a951,#8a6d1e);border-radius:18px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:14px;cursor:pointer;overflow:hidden;position:relative;border:2px solid var(--gold)} .badge img{width:100%;height:100%;object-fit:cover} .badge span{position:absolute;bottom:0;background:rgba(0,0,0,.7);color:var(--gold2);font-size:9px;width:100%;text-align:center;padding:2px} .fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px} .field{background:#0c1a28;border:1px solid #1a324d;border-radius:10px;padding:8px} .field span{color:#8aa0bd;font-size:11px;display:block} .field b{color:#fff;font-size:13px} .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:20} .modalBox{background:#101f2e;border:1px solid var(--gold);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:92vh;overflow:auto} .modalBox label{color:var(--gold2);font-size:13px;margin-top:10px;display:block} .modalBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #c8a951;background:#0e1e2f;color:#fff;margin-top:4px} .btn{padding:11px;border-radius:12px;border:1.5px solid var(--gold);font-weight:900;cursor:pointer;width:100%} .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} .roleTag{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900} .role-command{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a} .role-mt{background:#1a3d22;color:var(--gold2);border:1px solid var(--gold)} </style> </head><body> <div class="topBar"><span onclick="location.href='dashboard.html'" style="font-size:22px;cursor:pointer"><</span><h2>SUTY SENIORITY</h2><span id="roleBadge" class="roleTag"></span></div> <div class="searchWrap"><input id="q" class="search" placeholder="🔍 Search..." oninput="filter()"></div> <button id="addBtn" class="addBtn" onclick="openAdd()">+ ADD SENIORITY</button> <div id="list"></div> <input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePic(event)"> <div id="addModal" class="modal"> <div class="modalBox"> <h3 style="margin:0;color:var(--gold2)">Add Seniority</h3> <div style="text-align:center;margin:10px 0"> <div id="addPicPreview" style="width:90px;height:90px;margin:0 auto;background:#0c1a28;border:2px dashed var(--gold);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden" onclick="document.getElementById('addPicFile').click()">📷 Pic</div> <input type="file" id="addPicFile" accept="image/*" style="display:none" onchange="handleAddPic(event)"> </div> <label>সেনা নং</label><input id="f_no"> <label>পদবী</label><input id="f_podobi"> <label>নাম</label><input id="f_nam"> <label>যোগদানের তারিখ</label><input id="f_jogdan" type="date"> <label>ছুটির তারিখ</label><input id="f_suty" type="date"> <label>মোট ছুটি</label><input id="f_mot"> <label>গ্রাম</label><input id="f_gram"> <label>পোস্ট</label><input id="f_post"> <label>থানা</label><input id="f_thana"> <label>জেলা</label><input id="f_zilla"> <label>মোবা.</label><input id="f_moba"> <div style="display:flex;gap:8px;margin-top:14px"> <button class="btn" style="background:var(--gold);color:#000" onclick="saveBoth()">✓ Save Local + Sheet</button> <button class="btn" style="background:#2a0f14;color:#ff6b6b" onclick="closeAdd()">✕ Cancel</button> </div> </div> </div> 
<script>
 const SHEET_ID="1H0aSiqMyxn9bg9PLyjAt6dXPGLMNAWFN7v8hTrj1TZg";
 const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
 const SCRIPT_URL="https://script.google.com/macros/s/YOUR_ID/exec";
 
 let urlRole = new URLSearchParams(window.location.search).get("role");
 if(urlRole) localStorage.setItem("role", urlRole);
 
 let ROLE = (localStorage.getItem("role")||"").toLowerCase().trim();
 let CAN_EDIT = ROLE.includes('mt_clk') || ROLE === 'clk';
 let IS_COMMAND = !CAN_EDIT;

 document.getElementById("roleBadge").innerText = IS_COMMAND ? "VIEW - COMMAND" : "EDIT - MT CLK";
 document.getElementById("roleBadge").className = IS_COMMAND ? "roleTag role-command" : "roleTag role-mt";
 document.getElementById("addBtn").style.display = IS_COMMAND ? "none" : "block";

 let DATA = JSON.parse(localStorage.getItem("seniorityCache")||"[]");
 let currentPicIdx = -1;
 let addPicBase64 = "";
 function saveLocal(){ localStorage.setItem("seniorityCache", JSON.stringify(DATA)); }
 function fmtDate(d){ if(!d) return "-"; let dt=new Date(d); if(isNaN(dt)) return d; let dd=String(dt.getDate()).padStart(2,'0'); let mm=String(dt.getMonth()+1).padStart(2,'0'); let yy=dt.getFullYear(); return `${dd}-${mm}-${yy}`; }
 function formatMotDin(jogdan){ if(!jogdan) return "-"; let join=new Date(jogdan); if(isNaN(join)) return "-"; let now=new Date(); let y=now.getFullYear()-join.getFullYear(); let m=now.getMonth()-join.getMonth(); let d=now.getDate()-join.getDate(); if(d<0){ m--; let prev=new Date(now.getFullYear(),now.getMonth(),0).getDate(); d+=prev; } if(m<0){ y--; m+=12; } if(y>0 && m>0) return `${y} বছর ${m} মাস ${d} দিন`; if(y>0) return `${y} বছর ${d} দিন`; if(m>0 && d>0) return `${m} মাস ${d} দিন`; if(m>0) return `${m} মাস`; return `${d} দিন`; }
 function calcTotalDays(j){ if(!j) return 0; let d=new Date(j); return isNaN(d)?0:Math.floor((new Date()-d)/86400000); }
 function sortBySeniority(arr){ return arr.sort((a,b)=> calcTotalDays(b.jogdan) - calcTotalDays(a.jogdan) ); }
 function render(arr){ let sorted = sortBySeniority([...arr]); let h=""; sorted.forEach((r,i)=>{ let idx = DATA.indexOf(r); let motDinText = formatMotDin(r.jogdan); let picHtml = r.pic ? `<img src="${r.pic}">` : `${r.podobi||'সৈনিক'}`; let btns = IS_COMMAND ? "" : ` <div class="btnRow"> <button class="btn" style="background:#1e1705;color:var(--gold2)" onclick="editItem(${idx})">✏️ Edit</button> <button class="btn" style="background:#2a0f14;color:#ff6b6b;border-color:#5a1a23" onclick="delItem(${idx})">🗑️ Del</button> </div>`; h+=`<div class="card"> <div style="display:flex;gap:12px"> <div class="badge" onclick="pickPic(${idx})">${picHtml}<span>📷 Change</span></div> <div><b>${r.nam}</b><div style="color:var(--gold2);font-size:13px;margin-top:3px">সেনা নং: ${r.no} • #${i+1}</div><div style="font-size:11px;color:#8aa0bd;margin-top:4px">যোগদান: ${fmtDate(r.jogdan)}</div></div> </div> <div class="fieldGrid"> <div class="field"><span>যোগদানের তারিখ:</span><b>${fmtDate(r.jogdan)}</b></div> <div class="field"><span>মোট দিন:</span><b style="color:var(--gold2)">${motDinText}</b></div> <div class="field"><span>মোট ছুটি:</span><b>${r.mot||'-'} দিন</b></div> <div class="field"><span>গ্রাম:</span><b>${r.gram||'-'}</b></div> <div class="field"><span>পোস্ট:</span><b>${r.post||'-'}</b></div> <div class="field"><span>থানা:</span><b>${r.thana||'-'}</b></div> <div class="field"><span>জেলা:</span><b>${r.zilla||'-'}</b></div> <div class="field"><span>মোবা:</span><b>${r.moba||'-'}</b></div> </div> ${btns} </div>`; }); document.getElementById("list").innerHTML=h||"<p style='padding:20px;text-align:center'>No Data - Add করো</p>"; }
 function pickPic(idx){ if(IS_COMMAND){ alert("Command Pic Change করতে পারবে না"); return; } currentPicIdx=idx; document.getElementById("picInput").click(); }
 function handlePic(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(ev){ DATA[currentPicIdx].pic=ev.target.result; saveLocal(); render(DATA); }; reader.readAsDataURL(file); }
 function handleAddPic(e){ let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=function(ev){ addPicBase64=ev.target.result; document.getElementById("addPicPreview").innerHTML=`<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">`; }; reader.readAsDataURL(file); }
 function filter(){ let q=document.getElementById("q").value.toLowerCase(); render(DATA.filter(r=>JSON.stringify(r).toLowerCase().includes(q))); }
 function openAdd(){ if(IS_COMMAND) return; addPicBase64=""; document.getElementById("addPicPreview").innerHTML="📷 Pic"; document.getElementById("addModal").style.display="flex"; }
 function closeAdd(){ document.getElementById("addModal").style.display="none"; }
 function saveBoth(){ if(IS_COMMAND) return; let r={no:f_no.value,podobi:f_podobi.value,nam:f_nam.value,jogdan:f_jogdan.value,suty:f_suty.value,mot:f_mot.value,gram:f_gram.value,post:f_post.value,thana:f_thana.value,zilla:f_zilla.value,moba:f_moba.value,pic:addPicBase64}; if(!r.nam){ alert("নাম লিখো"); return; } DATA.push(r); saveLocal(); render(DATA); closeAdd(); }
 function delItem(idx){ if(IS_COMMAND) return; if(confirm("Delete?")){ DATA.splice(idx,1); saveLocal(); render(DATA); } }
 function editItem(idx){ if(IS_COMMAND) return; openAdd(); let r=DATA[idx]; f_no.value=r.no; f_podobi.value=r.podobi; f_nam.value=r.nam; f_jogdan.value=r.jogdan; f_suty.value=r.suty; f_mot.value=r.mot; f_gram.value=r.gram; f_post.value=r.post; f_thana.value=r.thana; f_zilla.value=r.zilla; f_moba.value=r.moba; addPicBase64=r.pic||""; if(addPicBase64) document.getElementById("addPicPreview").innerHTML=`<img src="${addPicBase64}" style="width:100%;height:100%;object-fit:cover">`; DATA.splice(idx,1); }
 function loadFromSheet(){ fetch(CSV_URL).then(r=>r.text()).then(t=>{ let lines=t.split("\n").filter(l=>l.trim()); let out=[]; for(let i=1;i<lines.length;i++){ let c=lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim()); if(c[2]){ let existing = DATA.find(d=>d.no==c[0]); out.push({no:c[0],podobi:c[1],nam:c[2],suty:c[3],jogdan:c[4],mot:c[5],gram:c[6],post:c[7],thana:c[8],zilla:c[9],moba:c[10],pic:existing?existing.pic:""}); } } if(out.length>0){ DATA=out; saveLocal(); render(DATA); } }); }
 render(DATA); loadFromSheet();
</script> </body></html>
