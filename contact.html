d" id="mainBtn" onclick="addData()">Add করুন</button><p id="msg" style="text-align:center;color:green;font-weight:900"></p></div><div class="tit">MT PLATOON MOBILE NUMBER - 4 BIR</div><button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button><table><thead><tr><th>ক্র/নং</th><th>পদবী</th><th>নাম</th><th>মোবাইল</th><th>মন্তব্য</th><th id="actH">একশন</th></tr></thead><tbody id="tbl"><tr><td colspan="6">Loading...</td></tr></tbody></table></div><script>const SHEET_URL="https://script.google.com/macros/s/AKfycbwPXKd8ecRThPwF0wVTg4id88ru0RZtpWKrk6Jb6oFp-Xq8KuzwZVM_Zmw05gaevpZT/exec";let role=localStorage.getItem('role')||'mt platoon';let editRow=-1;async function load(){let tb=document.getElementById('tbl');try{let r=await fetch(SHEET_URL+"?sheet=Mobile&t="+Date.now());let d=await r.json();tb.innerHTML='';if(!d.length){tb.innerHTML='<tr><td colspan="6">কোনো ডাটা নাই</td></tr>';return}d.forEach((x,i)=>{let act=role.toLowerCase().includes('clk')?`<button class="btn-edt" onclick="editD(${x.row},'${x.PADOBI}','${x.NAME}','${x.NUMBER}','${x.MONTOBBO||''}')">Edit</button> <button class="btn-del" onclick="delD(${x.row})">Del</button>`:`View Only`;tb.innerHTML+=`<tr><td>${i+1}</td><td>${x.PADOBI}</td><td style="text-align:left">${x.NAME}</td><td>${x.NUMBER}</td><td>${x.MONTOBBO||''}</td><td>${act}</td></tr>`});}catch(e){tb.innerHTML='<tr><td colspan="6">Failed to fetch - Deploy Anyone করুন</td></tr>';}}function editD(row,PADOBI,NAME,NUMBER,MONTOBBO){if(!role.toLowerCase().includes('clk')){alert('Permission নাই');return}editRow=row;padobi.value=PADOBI;name.value=NAME;number.value=NUMBER;remarks.value=MONTOBBO;mainBtn.innerText='Update করুন';}async function delD(row){if(!confirm('Delete?'))return;await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({sheet:"Mobile",action:"delete",row})});alert('Deleted');setTimeout(load,2000);}async function addData(){let PADOBI=padobi.value.trim(),NAME=name.value.trim(),NUMBER=number.value.trim(),MONTOBBO=remarks.value.trim();if(!PADOBI||!NAME||!NUMBER){alert('পদবী, নাম, নম্বর লাগবে');return}let p=editRow==-1?{sheet:"Mobile",PADOBI,NAME,NUMBER,MONTOBBO}:{sheet:"Mobile",action:"edit",row:editRow,PADOBI,NAME,NUMBER,MONTOBBO};msg.innerText='পাঠানো হচ্ছে...';await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)});msg.innerText='✅ Done';padobi.value=name.value=number.value=remarks.value='';editRow=-1;mainBtn.innerText='Add করুন';setTimeout(load,2000);}window.onload=function(){load();}</script></body></html>
