<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MT PLATOON MOBILE NUMBER</title><style>body{margin:0;font-family:Arial;background:#eef2f7}.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:16px;font-weight:900}.logout{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900;cursor:pointer}.wrap{padding:14px;max-width:1100px;margin:0 auto}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box;font-size:16px}.btn-add{width:100%;padding:14px;background:#0a4d0a;color:white;border:none;border-radius:10px;font-size:17px;font-weight:900;cursor:pointer}.tit{text-align:center;font-size:20px;font-weight:900;margin:14px 0;color:#0a4d0a;text-decoration:underline}.btn-print{background:blue;color:white;border:none;padding:10px 18px;border-radius:10px;font-weight:900;cursor:pointer;margin:10px auto;display:block}table{width:100%;border-collapse:collapse;background:white;font-size:14px}th{background:#0a4d0a;color:white;padding:10px;border:1px solid #000}td{padding:8px;border:1px solid #000;text-align:center}.btn-del{background:red;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer}.btn-edt{background:orange;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer}@media print{.top,#box,.btn-print{display:none!important}th:last-child,td:last-child{display:none!important}body{background:white}.wrap{padding:0}table{font-size:12px}}</style></head><body><div class="top"><b>MT PLATOON MOBILE NUMBER</b><button class="logout" onclick="location.href='dashboard.html'">BACK</button></div><div class="wrap"><div id="box"><input id="padobi" placeholder="পদবী"><input id="name" placeholder="নাম"><input id="number" placeholder="মোবাইল নম্বর"><input id="remarks" placeholder="মন্তব্য"><button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button><p id="msg" style="text-align:center;color:green;font-weight:900"></p></div><div class="tit">MT PLATOON MOBILE NUMBER - 4 BIR</div><button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button><table><thead><tr><th>ক্র/নং</th><th>পদবী</th><th>নাম</th><th>মোবাইল</th><th>মন্তব্য</th><th id="actH">একশন</th></tr></thead><tbody id="tbl"><tr><td colspan="6">Loading...</td></tr></tbody></table></div><script>const SHEET_URL="https://script.google.com/macros/s/AKfycbxmAoKJMIq4Y62B5yLPsUb0_L0sD5HHgMR_A5o8m-WHlPksCxByeSK1Mr8yaXHUdAwi/exec";let role=(localStorage.getItem('role')||'').toLowerCase();let editRow=-1;window.onload=function(){if(!role.includes('clk')){document.getElementById('box').style.display='none';document.getElementById('actH').style.display='none';}load();};async function load(){let tb=document.getElementById('tbl');try{let r=await fetch(SHEET_URL+"?t="+Date.now());let d=await r.json();tb.innerHTML='';if(!d.length){tb.innerHTML='<tr><td colspan="6">কোনো ডাটা নাই</td></tr>';return}d.forEach((x,i)=>{let act=role.includes('clk')?`<button class="btn-edt" onclick="editD(${x.row},'${x.PADOBI}','${x.NAME}','${x.NUMBER}','${x.MONTOBBO||''}')">Edit</button> <button class="btn-del" onclick="delD(${x.row})">Del</button>`:`-`;tb.innerHTML+=`<tr><td>${i+1}</td><td>${x.PADOBI}</td><td style="text-align:left">${x.NAME}</td><td>${x.NUMBER}</td><td>${x.MONTOBBO||''}</td><td>${act}</td></tr>`});}catch(e){tb.innerHTML='<tr><td colspan="6">Load Fail</td></tr>';}}function editD(row,pa,na,nu,re){editRow=row;padobi.value=pa;name.value=na;number.value=nu;remarks.value=re;mainBtn.innerText='Update করুন';window.scrollTo(0,0);}async function delD(row){if(!confirm('Delete?'))return;await fetch(`${SHEET_URL}?action=delete&row=${row}`);alert('Deleted');load();}async function addData(){if(!role.includes('clk')){alert('আপনার Add করার অনুমতি নাই');return}let pa=padobi.value.trim(),na=name.value.trim(),nu=number.value.trim(),re=remarks.value.trim();if(!pa||!na||!nu){alert('পদবী, নাম, নম্বর লাগবে');return}msg.innerText='পাঠানো হচ্ছে...';let url=editRow==-1?`${SHEET_URL}?action=add&padobi=${encodeURIComponent(pa)}&name=${encodeURIComponent(na)}&number=${encodeURIComponent(nu)}&remarks=${encodeURIComponent(re)}`:`${SHEET_URL}?action=edit&row=${editRow}&padobi=${encodeURIComponent(pa)}&name=${encodeURIComponent(na)}&number=${encodeURIComponent(nu)}&remarks=${encodeURIComponent(re)}`;await fetch(url);msg.innerText='✅ Done';padobi.value=name.value=number.value=remarks.value='';editRow=-1;mainBtn.innerText='Add করুন';setTimeout(load,1500);}</script></body></html>
