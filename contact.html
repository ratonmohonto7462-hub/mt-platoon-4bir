<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Communication</title>
<style>
body{margin:0;background:#0a1a0f;color:#fff;font-family:Arial}
.top{background:#122e18;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e4a28}
.top b{color:#c8a951}.backBtn{background:#1a3d22;border:1px solid #c8a951;color:#c8a951;padding:7px 12px;border-radius:8px;font-weight:900}
.wrap{padding:14px 14px 80px 14px}
.search{width:100%;padding:12px;background:#132a18;border:1px solid #c8a951;border-radius:12px;color:#fff;margin-bottom:14px}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:#132a18;border:1px solid #c8a951;border-radius:18px;padding:24px 8px;text-align:center}
.box div{font-size:42px}.box b{color:#c8a951;font-size:13px;display:block;margin-top:8px;line-height:1.2}
.box small{color:#8aa88f;font-size:10px}.box span{background:#0f2110;border:1px solid #c8a951;color:#c8a951;padding:3px 10px;border-radius:12px;font-size:11px;display:inline-block;margin-top:8px}
.list{display:none}.card{background:#132a18;border:1px solid #1e4a28;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card b{font-size:13px}.card a{background:#0a4d0a;border:1px solid #22c55e;color:#22ff88;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:900;font-size:12px}
</style></head><body>
<div class="top"><b>COMMUNICATION</b><button class="backBtn" onclick="location.href='dashboard.html'">BACK</button></div>
<div class="wrap">
<input id="s" class="search" placeholder="🔍 Search..." oninput="search()">

<div id="fView" class="folders">
<div class="box" onclick="openF('mt')"><div>👥</div><b>MT PLATOON<br>MOBILE NUMBER</b><small>Platoon</small><br><span id="n1">0</span></div>
<div class="box" onclick="openF('req')"><div>⭐</div><b>REQUIRED<br>MOBILE NUMBER</b><small>Emergency</small><br><span id="n2">0</span></div>
<div class="box" onclick="openF('bir')"><div>🪖</div><b>4 BIR<br>MOBILE NUMBER</b><small>Battalion</small><br><span id="n3">0</span></div>
<div class="box" onclick="openF('off')"><div>👮</div><b>OFFICERS<br>MOBILE NUMBER</b><small>Officers</small><br><span id="n4">0</span></div>
</div>

<div id="lView" class="list">
<div style="display:flex;justify-content:space-between;margin-bottom:10px"><b id="t" style="color:#c8a951"></b><button onclick="closeF()" style="background:#1a3d22;border:1px solid #c8a951;color:#c8a951;padding:5px 10px;border-radius:12px">Close</button></div>
<div id="list"></div>
</div>
</div>

<script>
const ID="1CvMdG_fTG4mGnL-epIh3fsPhGVwwBX0rbkMPN7AqHJE";
const CSV="https://docs.google.com/spreadsheets/d/"+ID+"/export?format=csv";
let data=[];
function pCSV(t){let l=t.split("\n").filter(x=>x.trim());let o=[];for(let i=1;i<l.length;i++){let c=l[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s=>s.replace(/^"|"$/g,'').trim());if(c[2]||c[3])o.push({no:c[0],rank:c[1],name:c[2],mob:c[3],grp:(c[4]||'').toLowerCase()})}return o}
async function load(){try{let t=await fetch(CSV).then(r=>r.text());data=pCSV(t);localStorage.setItem("mob",JSON.stringify(data))}catch(e){data=JSON.parse(localStorage.getItem("mob")||"[]")}document.getElementById('n1').innerText=data.length+" nums";document.getElementById('n2').innerText="12 nums";document.getElementById('n3').innerText=data.length+" nums";document.getElementById('n4').innerText="15 nums"}
function openF(type){
document.getElementById('fView').style.display='none';document.getElementById('lView').style.display='block';
let titles={mt:"MT PLATOON MOBILE NUMBER",req:"REQUIRED MOBILE NUMBER",bir:"4 BIR MOBILE NUMBER",off:"OFFICERS MOBILE NUMBER"};
document.getElementById('t').innerText=titles[type];
let f=data; // সব data দেখাবে, চাইলে filter করতে পারো
if(f.length==0)f=[{rank:"Sgt",name:"Demo",mob:"01700000000",no:"1"}];
document.getElementById('list').innerHTML=f.map(d=>`<div class="card"><div><b>${d.rank} ${d.name}</b><br><small style="color:#8aa88f">${d.mob}</small></div><a href="tel:${d.mob}">📞 CALL</a></div>`).join('');
}
function closeF(){document.getElementById('fView').style.display='grid';document.getElementById('lView').style.display='none'}
function search(){let q=document.getElementById('s').value.toLowerCase();if(!q){closeF();return}let f=data.filter(d=>(d.name+d.mob+d.rank).toLowerCase().includes(q));document.getElementById('fView').style.display='none';document.getElementById('lView').style.display='block';document.getElementById('t').innerText="Search: "+q;document.getElementById('list').innerHTML=f.map(d=>`<div class="card"><div><b>${d.rank} ${d.name}</b><br><small style="color:#8aa88f">${d.mob}</small></div><a href="tel:${d.mob}">📞</a></div>`).join('')}
load();
</script>
</body></html>
