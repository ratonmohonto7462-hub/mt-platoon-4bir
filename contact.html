<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT PLATOON MOBILE NUMBER - 4 BIR</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f7}
.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:15px;font-weight:900}
.logout{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900;cursor:pointer}
.wrap{padding:14px;max-width:1100px;margin:0 auto}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin-bottom:10px;box-sizing:border-box;font-size:16px}
.btn-add{width:100%;padding:14px;background:#0a4d0a;color:white;border:none;border-radius:10px;font-size:17px;font-weight:900;cursor:pointer}
.tit{text-align:center;font-size:20px;font-weight:900;margin:14px 0;color:#0a4d0a;text-decoration:underline}
.btn-print{background:blue;color:white;border:none;padding:10px 18px;border-radius:10px;font-weight:900;cursor:pointer;margin:10px auto;display:block}
table{width:100%;border-collapse:collapse;background:white;font-size:14px}
th{background:#0a4d0a;color:white;padding:10px;border:1px solid #000}
td{padding:8px;border:1px solid #000;text-align:center}
@media print{
  .top,#box,.btn-print{display:none!important}
  th:last-child,td:last-child{display:none!important}
  body{background:white}.wrap{padding:0}
}
</style>
</head>
<body>
<div class="top"><b>MT PLATOON MOBILE NUMBER</b><button class="logout" onclick="location.href='dashboard.html'">BACK</button></div>

<div class="wrap">
<div id="box">
<input id="padobi" placeholder="পদবী">
<input id="name" placeholder="নাম">
<input id="number" placeholder="মোবাইল নম্বর">
<input id="remarks" placeholder="মন্তব্য">
<button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button>
<p id="msg" style="text-align:center;color:green;font-weight:900"></p>
</div>

<div class="tit">MT PLATOON MOBILE NUMBER - 4 BIR</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>

<table>
<thead><tr><th>ক্র/নং</th><th>পদবী</th><th>নাম</th><th>মোবাইল</th><th>মন্তব্য</th><th>একশন</th></tr></thead>
<tbody id="tbl"><tr><td colspan="6">Loading...</td></tr></tbody>
</table>
</div>

<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbxmAoKJMIq4Y62B5yLPsUb0_L0sD5HHgMR_A5o8m-WHlPksCxByeSK1Mr8yaXHUdAwi/exec";
let role=(localStorage.getItem('role')||'').toLowerCase();
let editRow=-1;

window.onload=function(){
  // mt হলে Add Box লুকাবে, clk হলে দেখাবে
  if(role!=='clk'){
    document.getElementById('box').style.display='none';
  }
  load();
};

async function load(){
  try{
    let r=await fetch(SHEET_URL+"?t="+Date.now());
    let d=await r.json();
    let tb=document.getElementById('tbl');
    tb.innerHTML='';
    if(!d.length){
      tb.innerHTML='<tr><td colspan="6">কোনো ডাটা নাই</td></tr>';
      return;
    }
    d.forEach((x,i)=>{
      let act = role==='clk' ? `<button onclick="editD(${x.row},'${x.PADOBI}','${x.NAME}','${x.NUMBER}','${x.MONTOBBO||''}')" style="background:orange;color:white;border:none;padding:5px 8px;border-radius:5px">Edit</button> <button onclick="delD(${x.row})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:5px">Del</button>` : `-`;
      tb.innerHTML+=`<tr><td>${i+1}</td><td>${x.PADOBI}</td><td style="text-align:left">${x.NAME}</td><td>${x.NUMBER}</td><td>${x.MONTOBBO||''}</td><td>${act}</td></tr>`;
    });
  }catch(e){}
}

function editD(row,pa,na,nu,re){
  editRow=row;
  document.getElementById('padobi').value=pa;
  document.getElementById('name').value=na;
  document.getElementById('number').value=nu;
  document.getElementById('remarks').value=re;
  document.getElementById('mainBtn').innerText='Update করুন';
  window.scrollTo(0,0);
}

function delD(row){
  if(!confirm('Delete করবেন?'))return;
  new Image().src=SHEET_URL+"?action=delete&row="+row+"&t="+Date.now();
  setTimeout(()=>{alert('Deleted');load();},1500);
}

function addData(){
  if(role!=='clk'){alert('Permission নাই');return}
  let pa=document.getElementById('padobi').value.trim();
  let na=document.getElementById('name').value.trim();
  let nu=document.getElementById('number').value.trim();
  let re=document.getElementById('remarks').value.trim();
  if(!pa||!na||!nu){alert('পদবী, নাম, নম্বর লাগবে');return}
  document.getElementById('msg').innerText='পাঠানো হচ্ছে...';
  let url = editRow==-1 ? SHEET_URL+"?action=add&padobi="+encodeURIComponent(pa)+"&name="+encodeURIComponent(na)+"&number="+encodeURIComponent(nu)+"&remarks="+encodeURIComponent(re)+"&t="+Date.now() : SHEET_URL+"?action=edit&row="+editRow+"&padobi="+encodeURIComponent(pa)+"&name="+encodeURIComponent(na)+"&number="+encodeURIComponent(nu)+"&remarks="+encodeURIComponent(re)+"&t="+Date.now();
  new Image().src=url;
  setTimeout(()=>{
    document.getElementById('msg').innerText='✅ Done';
    document.getElementById('padobi').value='';
    document.getElementById('name').value='';
    document.getElementById('number').value='';
    document.getElementById('remarks').value='';
    editRow=-1;
    document.getElementById('mainBtn').innerText='Add করুন';
    load();
  },2000);
}
</script>
</body>
</html>
