<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - MT PLATOON</title>
<style>body{margin:0;font-family:Arial;background:#f4f4f4}.top{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}.wrap{padding:16px;max-width:500px;margin:0 auto}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;border-left:5px solid #ff9800;box-shadow:0 2px 6px rgba(0,0,0,0.1)}.card.approved{border-left-color:#00c853}.btn{padding:8px 14px;border:none;border-radius:20px;font-weight:700;cursor:pointer;margin-right:6px}.btn-a{background:#00c853;color:#fff}.btn-r{background:#ff3d00;color:#fff}#loginBox{height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1a0f}input{width:100%;padding:14px;border:1.5px solid #111;border-radius:10px;margin-top:10px}.pic{width:55px;height:55px;border-radius:50%;object-fit:cover;border:2px solid #111}.tab{padding:10px 16px;border:none;border-radius:20px;font-weight:800;cursor:pointer;margin-right:6px;background:#ddd}.tab.active{background:#111;color:#fff}</style></head><body>
<div id="loginBox"><div style="background:#fff;padding:24px;border-radius:16px;width:90%;max-width:320px"><h2>🔐 Admin Login</h2><input id="apass" type="password" placeholder="Admin Password"><button onclick="checkAdmin()" style="width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:30px;margin-top:12px;font-weight:700">Login</button><p style="text-align:center;font-size:12px;color:#888">Password: mtadmin123<br>or MT CLK ID</p><p style="text-align:center;font-size:11px;color:green">Version: FIXED - Pending + Approved</p></div></div>
<div id="mainBox" style="display:none"><div class="top"><span>MT PLATOON - ADMIN (Firebase)</span><span onclick="location.href='dashboard.html'" style="cursor:pointer;font-size:22px">X</span></div>
<div class="wrap">
<div style="margin-bottom:12px"><button class="tab active" id="tabPending" onclick="showTab('pending')">⏳ Pending <span id="countPending">0</span></button><button class="tab" id="tabApproved" onclick="showTab('approved')">✅ Approved <span id="countApproved">0</span></button><button class="tab" id="tabAll" onclick="showTab('all')">👥 All <span id="countAll">0</span></button></div>
<div id="list">Loading...</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:4d24320f792d7e86fdca80", measurementId: "G-E1M0WH2RD9" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allUsers = [];
let currentTab = 'pending';

window.checkAdmin = function(){ let pass = document.getElementById('apass').value; let role = localStorage.getItem('mt_role'); if(pass==="mtadmin123" || role==="MT CLK" || pass==="MT CLK"){ document.getElementById('loginBox').style.display="none"; document.getElementById('mainBox').style.display="block"; loadData(); } else alert("⛔ Wrong! Only MT CLK"); }
if(localStorage.getItem('mt_role')==="MT CLK"){ document.getElementById('loginBox').style.display="none"; document.getElementById('mainBox').style.display="block"; loadData(); }

window.showTab = function(t){ currentTab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); if(t==='pending') document.getElementById('tabPending').classList.add('active'); if(t==='approved') document.getElementById('tabApproved').classList.add('active'); if(t==='all') document.getElementById('tabAll').classList.add('active'); renderList(); }

async function loadData(){
 try{
  const snap = await getDocs(collection(db,"users"));
  allUsers = [];
  snap.forEach(d=>{ let r=d.data(); allUsers.push({ id:d.id, sena:r.sena||r.sena_no||d.id, name:r.name||"", mobile:r.mobile||"", podobi:r.podobi||r.rank||"", company:r.company||"", blood:r.blood||"", photo:r.photo||"", status:r.status||"approved" }); });
  document.getElementById('countPending').innerText = allUsers.filter(u=>u.status==="pending").length;
  document.getElementById('countApproved').innerText = allUsers.filter(u=>u.status==="approved").length;
  document.getElementById('countAll').innerText = allUsers.length;
  renderList();
 }catch(e){ document.getElementById('list').innerHTML="<p style='text-align:center;color:red'>Firebase Error: "+e.message+"</p>"; }
}

function renderList(){
 let list = allUsers;
 if(currentTab==='pending') list = allUsers.filter(u=>u.status==="pending");
 if(currentTab==='approved') list = allUsers.filter(u=>u.status==="approved");
 let html="";
 list.forEach(row=>{
  let pic = row.photo ? `<img class="pic" src="${row.photo}">` : `👤`;
  let badge = row.status==="pending" ? `<b style="color:orange">PENDING</b>` : `<b style="color:green">APPROVED ✅</b>`;
  let btns = row.status==="pending" ? `<button class="btn btn-a" onclick="approve('${row.id}')">✓ Approve</button><button class="btn btn-r" onclick="reject('${row.id}')">X Reject</button>` : `<button class="btn btn-r" onclick="reject('${row.id}')">X Reject</button>`;
  html+=`<div class="card ${row.status==="approved"?"approved":""}"><div style="display:flex;gap:10px;align-items:center">${pic}<div><b>${row.sena} - ${row.name}</b><br>Mobile: ${row.mobile}<br>Rank: ${row.podobi} | Company: ${row.company} | Blood: ${row.blood}<br>${badge}</div></div><br>${btns}</div>`;
 });
 if(!html) html="<p style='text-align:center;color:green;padding:20px'>✅ এই লিস্টে কেউ নাই!</p>";
 document.getElementById('list').innerHTML=html;
}

window.approve = async function(id){ if(!confirm(id+" Approve?")) return; try{ await updateDoc(doc(db,"users",id),{status:"approved",approvedAt:new Date().toISOString()}); alert("✅ Approved!"); loadData(); }catch(e){ alert("Error: "+e.message); } }
window.reject = async function(id){ if(!confirm(id+" Reject?")) return; try{ await updateDoc(doc(db,"users",id),{status:"rejected"}); alert("❌ Rejected!"); loadData(); }catch(e){ alert("Error: "+e.message); } }
</script></body></html>
