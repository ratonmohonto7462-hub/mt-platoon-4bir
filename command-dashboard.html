<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MT Platoon</title>
<style>body{margin:0;font-family:Arial;background:#f2f2f2;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;max-width:400px;margin:40px auto}.card input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:12px 0}.card button{width:100%;background:#111;color:#fff;padding:16px;border:none;border-radius:50px;font-size:19px;font-weight:bold}.msg{margin-top:12px;padding:10px;border-radius:10px;display:none}.ok{background:#d4edda}.err{background:#f8d7da}</style></head><body>
<div class="card"><h2>🔐 Command Login</h2><input id="sena" placeholder="Army - 4534981"><input id="mobile" placeholder="Mobile - 01988546452"><input id="pass" type="password" placeholder="Password - 4242"><button id="btn" onclick="login()">Login</button><div id="msg" class="msg"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
// ★ Home এ যা আছে, হুবহু ঐটাই - Home Change করতে হইবো না ★
const firebaseConfig={apiKey:"AIzaSyA99iSvbxKItztZTn8w7ImDHnAbem25ji0",authDomain:"mt-platoon-4bir.firebaseapp.com",projectId:"mt-platoon-4bir",storageBucket:"mt-platoon-4bir.firebasestorage.app",messagingSenderId:"720139134198",appId:"1:720139134198:web:4ed98d6e53a7e741dcb8d7"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
function show(t,ok){var m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.innerHTML=t;}
// Home এর মতোই cleanSena
function cleanSena(s){return String(s||"").replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,'');}
function cleanMob(s){return String(s||"").replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/^\+?88/,'').replace(/\D/g,'');}
// আগেই Login থাকলে সোজা Home - Home এর মতো
if(localStorage.getItem("sena_no")||localStorage.getItem("mt_army")){ location.href='home/home.html'; }
window.login=async function(){
var sena=cleanSena(document.getElementById('sena').value);
var mob=cleanMob(document.getElementById('mobile').value);
var ps=document.getElementById('pass').value.trim();
if(!sena||!mob||!ps){show('❌ ৩ টাই দাও');return;}
var btn=document.getElementById('btn');btn.disabled=true;btn.innerText='Checking...';
try{
var d=await getDoc(doc(db,"users",sena));
if(!d.exists()){show('❌ এই Army দিয়া Account নাই');btn.disabled=false;btn.innerText='Login';return;}
var f=d.data();
if(cleanMob(f.mobile||'')!==mob){show('❌ Mobile মিলে নাই');btn.disabled=false;btn.innerText='Login';return;}
if(String(f.pass||'')!==ps){show('❌ Password মিলে নাই');btn.disabled=false;btn.innerText='Login';return;}
if((f.status||'approved')!=='approved'){show('❌ Approved না');btn.disabled=false;btn.innerText='Login';return;}
// ★ Home যেই নামে খুঁজে, ঐ নামেই Save করলাম ★
localStorage.setItem('sena_no',sena);localStorage.setItem('mt_army',sena);localStorage.setItem('mt_sena',sena);localStorage.setItem('mt_name',f.name||'');localStorage.setItem('mt_role',f.role||'');localStorage.setItem('pending_sena',sena);
show('✅ Login হইছে! Home এ যাইতেছি...',true);
setTimeout(function(){ location.href='home/home.html'; },600);
}catch(e){show('❌ '+e.message);btn.disabled=false;btn.innerText='Login';}
}
</script></body></html>
