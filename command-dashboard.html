<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT Platoon - Command</title>
<style>
body{margin:0;font-family:sans-serif;background:#0a1a12;color:#fff}
.top{background:#1a3a2a;padding:15px;display:flex;justify-content:space-between;align-items:center}
.card{background:#1e4a32;border-radius:16px;padding:20px;margin:15px;text-align:center}
.big{font-size:64px;font-weight:bold;color:#22c55e}
.folder{background:#1e4a32;border-radius:16px;padding:25px;margin:15px;text-align:center;border:2px solid #facc15}
.folder h2{margin:10px 0 0 0}
a{text-decoration:none;color:#fff}
.bottom{position:fixed;bottom:0;width:100%;background:#1a3a2a;display:flex;justify-content:space-around;padding:10px 0}
</style>
</head>
<body>

<div class="top">
<b>4 BIR - MT PLATOON</b>
<div><a href="profile.html" style="border:1px solid #fff;padding:5px 10px;border-radius:6px">My Profile</a></div>
</div>

<div style="padding:20px">
<h1 id="greet">Assalamualaikum</h1>
<p style="opacity:.7">Stay prepared. Everything up to date.</p>
</div>

<div class="card">
<div style="opacity:.8">👥 Group Members</div>
<div class="big" id="memberCount">0</div>
</div>

<a href="group.html">
<div class="folder">
<div style="font-size:50px">💬</div>
<h2>GROUP CHAT</h2>
</div>
</a>

<div style="height:80px"></div>
<div class="bottom">
<div>🏠<br>Dashboard</div>
<div>👥<br>Group</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzaoyIu0aETzIv0MC94SIJgcJ_nIQgbTLECGig_xhezPEYaGfoi91PLBjUgjAsEevbBzw/exec";
const MY_SENA = localStorage.getItem("sena_no") || "4521328";
const MY_NAME = localStorage.getItem("name") || "Roton";

// Name Show
document.getElementById("greet").innerText = "Assalamualaikum " + MY_NAME;

// Group Member Count Fix
fetch(API+"?action=getMembers")
.then(r=>r.json())
.then(data=>{
  document.getElementById("memberCount").innerText = data.length;
});
</script>

</body>
</html>
