<script>
// REPLACE YOUR OLD openMyProfile FUNCTION WITH THIS NEW ONE
function openMyProfile(){
let sena = localStorage.getItem('sena_no') || localStorage.getItem('senaNumber') || localStorage.getItem('army_no') || localStorage.getItem('sena') || '৪৫২১৩২৮';
let nameL = localStorage.getItem('profile_name') || localStorage.getItem('name') || localStorage.getItem('fullName') || localStorage.getItem('userName') || '-';
let pod = localStorage.getItem('podobi') || localStorage.getItem('rank') || localStorage.getItem('pod') || '-';
let com = localStorage.getItem('company') || localStorage.getItem('comp') || '-';
let mob = localStorage.getItem('mobile_no') || localStorage.getItem('mobile') || localStorage.getItem('phone') || '01737912094';
let blood = localStorage.getItem('blood') || localStorage.getItem('blood_group') || '-';
let pic = localStorage.getItem('profile_pic') || localStorage.getItem('photo') || '';

document.getElementById('popName').innerText = nameL;
document.getElementById('popSena').innerText = "Sena No: " + sena;
document.getElementById('popPod').innerText = pod;
document.getElementById('popCom').innerText = com;
document.getElementById('popMob').innerText = mob;
document.getElementById('popBlood').innerText = blood;

if(pic){
 document.getElementById('popPic').innerHTML=`<img src="${pic}" style="width:100%;height:100%;object-fit:cover">`;
 document.getElementById('topPic').innerHTML=`<img src="${pic}" style="width:100%;height:100%;object-fit:cover">`;
 document.getElementById('drawerPic').innerHTML=`<img src="${pic}" style="width:100%;height:100%;object-fit:cover">`;
}
document.getElementById('drawerName').innerText=nameL;
document.getElementById('drawerSena').innerText="Sena: "+sena;
document.getElementById('myProfileModal').classList.add('show');

// AUTO FIX: যদি নাম - থাকে তাহলে Sheet থেকে আনবে
if(nameL=='-' || pod=='-'){
 fetch("https://script.google.com/macros/s/AKfycbx50AvsmCN5Pt-ROba7d4H3Us3YyUKj_UBb73-YvVToPQMRAM5MpLe_xfM5tWZfuds/exec?action=getMembers&t="+Date.now())
 .then(r=>r.text()).then(t=>{
   try{
     let data=JSON.parse(t);
     let me = data.find(p=> String(p.sena).includes('4521328') || p.sena==sena);
     if(me){
       document.getElementById('popName').innerText = me.name;
       document.getElementById('popPod').innerText = me.podobi;
       document.getElementById('drawerName').innerText = me.name;
       localStorage.setItem('profile_name', me.name);
       localStorage.setItem('podobi', me.podobi);
     }
   }catch(e){}
 });
}
}
function closeMyProfile(){document.getElementById('myProfileModal').classList.remove('show');}
</script>
