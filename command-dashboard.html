<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Command Dashboard</title>
<style>body{margin:0;font-family:sans-serif;background:#0a1a12;padding-bottom:80px;color:#fff}.topArmy{background:#0a1a12;padding:12px;text-align:center;font-weight:bold;border-bottom:2px solid #1a4d2e}.cardLink{background:#1a4d2e;border:2px solid #facc15;border-radius:16px;padding:35px 20px;margin:25px 15px;color:#fff;display:flex;align-items:center;justify-content:center;gap:18px;text-align:center}.btn2{background:#fff;color:#000;padding:12px 20px;border-radius:30px;font-weight:bold;border:none;cursor:pointer;margin:6px}.loginCard{background:#fff;color:#000;border-radius:16px;padding:22px;margin:22px 15px}.loginCard h2{margin:0 0 6px}.loginCard p{color:#666;margin:0 0 14px}input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:8px 0 16px;box-sizing:border-box}button.loginBtn{width:100%;background:#111;color:#fff;border:none;padding:16px;border-radius:50px;font-size:19px;font-weight:bold}.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:15px;display:none}.ok{background:#d4edda}.err{background:#f8d7da}</style></head><body>
<div class="topArmy">4 BIR - MT PLATOON | Command Dashboard</div>

<!-- LOGIN PART - Login না থাকলে এইটা দেখাবে -->
<div id="loginBox">
<div class="loginCard"><h2>🔐 Command Login</h2><p>Army + Mobile + Password দাও</p>
<input id="sena" placeholder="Army - যেমন: 4534981" inputmode="numeric" autocomplete="off">
<input id="mobile" placeholder="Mobile - যেমন: 01988546452" inputmode="tel" autocomplete="off">
<input id="pass" type="password" placeholder="Password - যেমন: 4242" autocomplete="off">
<button class="loginBtn" id="btn" onclick="login()">Login</button>
<div id="msg" class="msg"></div>
</div>
</div>

<!-- DASHBOARD PART - Login হইলে এইটা দেখাবে -->
<div id="dashBox" style="display:none">
<div id="welcomeBox" style="background:#00c853;color:#000;padding:10px;text-align:center;font-weight:800"></div>
<a href="group.html" style="text-decoration:none"><div class="cardLink"><div style="font-size:55px">💬</div><div><h2 style="margin:0">GROUP CHAT</h2><small>Tap to Open Chat</small></div></div></a>
<div style="text-align:center">
<button class="btn2" onclick="location.href='admin.html'">🔐 Admin Approve</button>
<button class="btn2" onclick="logout()">🚪 Logout</button>
</div>
</div>

<div style="text-align:center;color:#aaa;font-size:12px;margin-top:20px">Version: NEW APP - 95106bb74</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U",authDomain:"mt-messenger-63922.firebaseapp.com",projectId:"mt-messenger-63922",storageBucket:"mt-messenger-63922.firebasestorage.app",messagingSenderId:"184454055809",appId:"1:184454055809:web:95106bb74fab8444fdca80"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
function show(t,ok){var m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.innerHTML=t;}
function showDash(sena){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dashBox').style.display='block';
  document.getElementById('welcomeBox').innerText="✅ Welcome, "+sena+" | "+(localStorage.getItem("mt_name")||"");
}
var saved = localStorage.getItem("sena_no") || localStorage.getItem("mt_army") || localStorage.getItem("mt_sena");
if(saved){ showDash(saved); }
async function login(){
  var sena=document.getElementById('sena').value.trim();
  var mob=document.getElementById('mobile').value.trim();
  var ps=document.getElementById('pass').value.trim();
  var btn=document.getElementById('btn');
  if(!sena||!mob||!ps){show('❌ ৩ টাই দাও');return;}
  btn.disabled=true;btn.innerText='Checking...';
  try{
    var d=await db.collection('users').doc(sena).get();
    if(!d.exists){show('❌ এই Army দিয়া Account নাই');btn.disabled=false;btn.innerText='Login';return;}
    var f=d.data();
    var fm=String(f.mobile||'').trim();
    var fp=String(f.pass||'').trim();
    var mob2=mob.replace(/^\+?88/,'').replace(/\s/g,'');
    var fm2=fm.replace(/^\+?88/,'').replace(/\s/g,'');
    if(fm2!==mob2){show('❌ Mobile মিলে নাই<br>তুমি দিছো: '+mob+'<br>Firebase এ আছে: '+fm);btn.disabled=false;btn.innerText='Login';return;}
    if(fp!==ps){show('❌ Password মিলে নাই<br>তুমি দিছো: '+ps+'<br>Firebase এ আছে: '+fp);btn.disabled=false;btn.innerText='Login';return;}
    if((f.status||'approved')!=='approved'){show('❌ Account Approved না - Status: '+f.status);btn.disabled=false;btn.innerText='Login';return;}
    localStorage.setItem('sena_no',sena);
    localStorage.setItem('mt_army',sena);
    localStorage.setItem('mt_sena',sena);
    localStorage.setItem('mt_name',f.name||'');
    localStorage.setItem('mt_mobile',fm);
    show('✅ Login হইছে ভাই! '+(f.name||''),true);
    setTimeout(function(){showDash(sena);},600);
  }catch(e){show('❌ Error: '+e.message);btn.disabled=false;btn.innerText='Login';}
}
function logout(){ localStorage.clear(); location.href='command-dashboard.html'; }
</script></body></html>
