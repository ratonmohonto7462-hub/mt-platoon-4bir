<!DOCTYPE html> 
<html> 
<head> 
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>MT Platoon</title> 
<style> 
body{margin:0;font-family:sans-serif;background:#f5f5f5;color:#000;padding-bottom:80px} 
.topArmy{background:#0a1a12;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.profilePic{width:44px;height:44px;border-radius:50%;background:#facc15;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;border:2px solid #fff;overflow:hidden;cursor:pointer} 
.greenBar{background:#0e5d3e;color:#ffc107;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold}
.bannerArmy{background:#1a2e1a;color:#fff;padding:14px 15px;display:flex;align-items:center;gap:12px;font-weight:bold;font-size:18px;border-bottom:3px solid #ffc107}
.slider{width:100%;height:240px;background:#000;overflow:hidden;position:relative}
.slider img{width:100%;height:100%;object-fit:cover}
.whiteBox{background:#fff;text-align:center;padding:20px 15px}
.coasImg{width:280px;min-height:340px;margin:10px auto;background:#d9d9d9;border-radius:12px;overflow:hidden;border:3px solid #0e5d3e;position:relative;display:flex;align-items:center;justify-content:center}
.coasImg img{width:100%;height:100%;object-fit:cover}
.uploadBtn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#0e5d3e;color:#ffc107;border:1px solid #ffc107;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.card{background:#1a4d2e;border-radius:16px;padding:20px;margin:15px;text-align:center;color:#fff}
.big{font-size:64px;font-weight:bold;color:#22c55e}
.footerArmy{text-align:center;padding:15px;color:#888;font-size:13px;background:#fff;border-top:1px solid #eee}
.memberList{background:#1a4d2e;border-radius:16px;margin:10px 15px;padding:5px 10px;color:#fff}
.member{padding:12px 5px;border-bottom:1px solid #2a5a3a;display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#22c55e;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold}
.folder{background:#1a4d2e;border:2px solid #facc15;border-radius:16px;padding:25px;margin:15px;text-align:center;color:#fff}
.bottom{position:fixed;bottom:0;width:100%;background:#143d27;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #2a5a3a;z-index:10}
.bottom div{text-align:center;cursor:pointer;opacity:.6;padding:5px 15px;font-size:14px;color:#fff}
.bottom div.active{opacity:1;color:#22c55e;font-weight:bold}
.hidden{display:none}
</style> 
</head> 
<body> 

<div class="topArmy"> 
<b>4 BIR - MT PLATOON</b> 
<div id="topProfile" class="profilePic" onclick="location.href='profile.html'">R</div> 
</div> 

<div id="homeView">
  <div class="greenBar">
    <div>📞 Call Us: 01769-013433</div>
  </div>
  
  <div class="bannerArmy">
    <div style="width:42px;height:42px;background:#ffc107;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000">⚔️</div>
    <div>Welcome to Mt Platoon</div>
  </div>

  <div class="slider" id="bannerBox">
    <img id="bannerImg" src="" style="display:none">
    <div id="bannerPlaceholder" style="width:100%;height:100%;background:url('https://images.unsplash.com/photo-1540962351504-03099e0a754b') center/cover"></div>
    <input type="file" id="bannerInput" accept="image/*" style="display:none" onchange="uploadHome('banner', this)">
    <div id="bannerUploadBtn" class="uploadBtn hidden" onclick="document.getElementById('bannerInput').click()">✏️ Change Banner (Admin)</div>
  </div>

  <div class="whiteBox">
    <div class="coasImg" id="platoonBox">
      <img id="platoonImg" src="" style="display:none">
      <div id="platoonPlaceholder" style="color:#888;font-size:22px;font-weight:bold;opacity:.6">MT PLATOON</div>
      <input type="file" id="platoonInput" accept="image/*" style="display:none" onchange="uploadHome('platoon', this)">
      <div id="platoonUploadBtn" class="uploadBtn hidden" onclick="document.getElementById('platoonInput').click()">✏️ Add Photo (Admin)</div>
    </div>

    <div class="card"> 
      <div style="opacity:.8">👥 Group Members</div> 
      <div class="big" id="memberCountHome">0</div> 
    </div> 
  </div>
  <div class="footerArmy">Copyright © 2026 <span style="color:#0e5d3e">BANGLADESH ARMY</span></div>
</div>

<div id="dashboardView" class="hidden" style="background:#0a1a12;min-height:80vh;padding-top:10px"> 
  <div style="padding:15px;color:#fff"><h3 style="margin:0">Dashboard</h3></div>
  <a href="group.html" style="text-decoration:none"> 
    <div class="folder"> 
      <div style="font-size:45px">💬</div> 
      <h2 style="margin:10px 0 0 0">GROUP CHAT</h2> 
    </div> 
  </a> 
</div> 

<div id="groupView" class="hidden" style="background:#0a1a12;min-height:80vh;padding-top:10px"> 
  <div style="padding:15px;color:#fff;font-weight:bold">Group Members - Seniority Wise</div> 
  <div class="memberList" id="memberListBox"></div> 
</div> 

<div class="bottom"> 
<div id="btnDash" onclick="switchTab('dash')">🏠<br>Dashboard</div> 
<div id="btnHome" class="active" onclick="switchTab('home')">🏡<br>Home Page</div> 
<div id="btnGroup" onclick="switchTab('group')">👥<br>Group</div> 
</div> 

<script> 
const API = "https://script.google.com/macros/s/AKfycbzaoyIu0aETzIv0MC94SIJgcJ_nIQgbTLECGig_xhezPEYaGfoi91PLBjUgjAsEevbBzw/exec"; 
const MY_SENA = localStorage.getItem("sena_no") || "4521328";
const MY_NAME = localStorage.getItem("name") || "Roton Chandro Mohonto";
const IS_ADMIN = MY_SENA == "4521328"; // sudu tumi admin

document.getElementById("topProfile").innerText = MY_NAME.charAt(0).toUpperCase(); 
let savedPic = localStorage.getItem("profile_pic"); 
if(savedPic){ document.getElementById("topProfile").innerHTML = '<img src="'+savedPic+'" style="width:100%;height:100%;border-radius:50%">'; }

if(IS_ADMIN){
  document.getElementById("bannerUploadBtn").classList.remove("hidden");
  document.getElementById("platoonUploadBtn").classList.remove("hidden");
}

function switchTab(tab){ 
  document.getElementById('dashboardView').classList.add('hidden'); 
  document.getElementById('homeView').classList.add('hidden'); 
  document.getElementById('groupView').classList.add('hidden'); 
  document.getElementById('btnDash').classList.remove('active'); 
  document.getElementById('btnHome').classList.remove('active'); 
  document.getElementById('btnGroup').classList.remove('active'); 
  if(tab==='dash'){ document.getElementById('dashboardView').classList.remove('hidden'); document.getElementById('btnDash').classList.add('active'); }
  else if(tab==='home'){ document.getElementById('homeView').classList.remove('hidden'); document.getElementById('btnHome').classList.add('active'); }
  else{ document.getElementById('groupView').classList.remove('hidden'); document.getElementById('btnGroup').classList.add('active'); }
} 

function loadHomeImages(){
  let b = localStorage.getItem("home_banner");
  let p = localStorage.getItem("home_platoon");
  if(b){ document.getElementById("bannerImg").src=b; document.getElementById("bannerImg").style.display="block"; document.getElementById("bannerPlaceholder").style.display="none"; }
  if(p){ document.getElementById("platoonImg").src=p; document.getElementById("platoonImg").style.display="block"; document.getElementById("platoonPlaceholder").style.display="none"; }
  // Sheet theke sobar jonno load
  fetch(API+"?action=getHomeImages").then(r=>r.json()).then(d=>{
    if(d.banner){ localStorage.setItem("home_banner", d.banner); document.getElementById("bannerImg").src=d.banner; document.getElementById("bannerImg").style.display="block"; document.getElementById("bannerPlaceholder").style.display="none"; }
    if(d.platoon){ localStorage.setItem("home_platoon", d.platoon); document.getElementById("platoonImg").src=d.platoon; document.getElementById("platoonImg").style.display="block"; document.getElementById("platoonPlaceholder").style.display="none"; }
  }).catch(()=>{});
}

function uploadHome(type, input){
  let file = input.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(e){
    let base64 = e.target.result;
    if(type=='banner'){
      localStorage.setItem("home_banner", base64);
      document.getElementById("bannerImg").src=base64; document.getElementById("bannerImg").style.display="block"; document.getElementById("bannerPlaceholder").style.display="none";
    }else{
      localStorage.setItem("home_platoon", base64);
      document.getElementById("platoonImg").src=base64; document.getElementById("platoonImg").style.display="block"; document.getElementById("platoonPlaceholder").style.display="none";
    }
    // Google Sheet a save - sobai dekhbe
    fetch(API, {method:"POST", body: JSON.stringify({action:"saveHomeImage", type:type, image:base64})}).then(()=>{ alert("Saved! Sobai ekhon dekhbe"); });
  };
  reader.readAsDataURL(file);
}

function loadMembers(){ 
fetch(API+"?action=getMembers").then(r=>r.json()).then(data=>{ 
data.sort((a,b)=> parseInt(a.sena) - parseInt(b.sena)); 
document.getElementById("memberCountHome").innerText = data.length; 
let html=""; 
data.forEach((m, i)=>{ 
let ini = m.name ? m.name.charAt(0).toUpperCase() : "M"; 
html+='<div class="member"><div style="opacity:.5">'+(i+1)+'.</div><div class="avatar">'+ini+'</div><div><b>'+m.name+'</b><br><span style="font-size:12px;opacity:.6">'+m.sena+'</span></div></div>'; 
}); 
document.getElementById("memberListBox").innerHTML = html; 
}); 
} 
loadHomeImages();
loadMembers(); 
</script> 
</body> 
</html>
