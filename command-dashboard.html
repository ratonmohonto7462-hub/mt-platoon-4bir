<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - MT Platoon</title> <style>body{margin:0;font-family:Arial;background:#f2f2f2;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;max-width:400px;margin:40px auto}.card input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:12px 0}.card button{width:100%;background:#111;color:#fff;padding:16px;border:none;border-radius:50px;font-size:19px;font-weight:bold}.msg{margin-top:12px;padding:10px;border-radius:10px;display:none;word-break:break-all}.ok{background:#d4edda}.err{background:#f8d7da}</style></head><body> <div class="card"><h2>🔐 Command Login</h2><input id="sena" placeholder="Army - 4534981"><input id="mobile" placeholder="Mobile - 01988546452"><input id="pass" type="password" placeholder="Password - 4242"><button id="btn" onclick="login()">Login</button><div id="msg" class="msg"></div><div id="debug" style="font-size:11px;color:#666;margin-top:10px;word-break:break-all"></div></div> <script type="module"> import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"; import {getFirestore,doc,getDoc,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; const firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:4d24320f792d7e86fdca80", measurementId: "G-E1M0WH2RD9" }; const db = getFirestore(initializeApp(firebaseConfig)); function show(t,ok){var m=document.getElementById('msg');m.style.display='block';m.className='msg '+(ok?'ok':'err');m.innerHTML=t;} function cleanSena(s){return String(s||"").replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/\D/g,'');} function cleanMob(s){return String(s||"").replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).replace(/^\+?88/,'').replace(/\D/g,'');} function cleanPass(s){return String(s||"").replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d)).trim();} if(localStorage.getItem("sena_no")||localStorage.getItem("mt_army")){ location.href='home/home.html'; } function doLogin(sena,f){ localStorage.setItem('sena_no',sena);localStorage.setItem('mt_army',sena);localStorage.setItem('mt_sena',sena);localStorage.setItem('mt_name',f.name||f.Name||'');localStorage.setItem('mt_role',f.role||f.podobi||f.Podobi||'');localStorage.setItem('pending_sena',sena);localStorage.setItem('name',f.name||f.Name||'');localStorage.setItem('podobi',f.podobi||f.Podobi||f.role||'');localStorage.setItem('company',f.company||f.Company||'');localStorage.setItem('mobile',f.mobile||f.Mobile||'');localStorage.setItem('blood',f.blood||f.Blood||''); show('✅ Login হইছে! Home এ যাইতেছি...',true); setTimeout(function(){ location.href='home/home.html'; },600); } window.login=async function(){ var sena=cleanSena(document.getElementById('sena').value); var mob=cleanMob(document.getElementById('mobile').value); var ps=cleanPass(document.getElementById('pass').value); if(!sena||!mob||!ps){show('❌ ৩ টাই দাও');return;} var btn=document.getElementById('btn');btn.disabled=true;btn.innerText='Checking...'; document.getElementById('debug').innerText='তুমি দিছো - Sena:'+sena+' Mob:'+mob+' Pass:'+ps; async function findUser(){ try{let d=await getDoc(doc(db,"users",sena)); if(d.exists()) return d.data();}catch(e){ document.getElementById('debug').innerText+=' | Error: '+e.message; } try{let q=await getDocs(query(collection(db,"users"),where("sena_no","==",sena))); if(!q.empty) return q.docs[0].data();}catch(e){ document.getElementById('debug').innerText+=' | Query Error: '+e.message; } return null; } try{ let f=await findUser(); if(!f){ show('❌ Firebase এ Account পাই নাই - '+sena+'<br>আগে Create Profile করো, Admin Approve করবো'); btn.disabled=false; btn.innerText='Login'; return; } let fbMob=cleanMob(f.mobile??f.Mobile??f.phone??""); if(fbMob && fbMob!==mob){ show('❌ Mobile মিলে নাই - তুমি: '+mob+' Firebase: '+fbMob); btn.disabled=false; btn.innerText='Login'; return; } let fbPass=cleanPass(f.pass??f.password??f.Password??""); if(fbPass && fbPass!==ps){ show('❌ Password ভুল'); btn.disabled=false; btn.innerText='Login'; return; } if(f.status && f.status!=="approved"){ show('❌ এখনো Pending - Admin Approve করে নাই'); btn.disabled=false; btn.innerText='Login'; return; } doLogin(sena,f); return; }catch(e){ show('❌ Error: '+e.message); document.getElementById('debug').innerText+=' | '+e.message; btn.disabled=false; btn.innerText='Login'; } } </script></body></html>
