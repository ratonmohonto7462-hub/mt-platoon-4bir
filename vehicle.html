<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vehicle - MT PLATOON 4 BIR</title> <style>*{box-sizing:border-box}body{margin:0;font-family:Arial;min-height:100vh;background:#0a1a0f;color:#fff}.top{background:#122e18;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #1e4a28}.top b{font-size:16px;font-weight:900;letter-spacing:0.5px;color:#c8a951}.backBtn{background:#1a3d22;border:1px solid #c8a951;color:#c8a951;padding:8px 14px;border-radius:8px;font-weight:900}.wrap{padding:14px 14px 90px 14px}.searchWrap input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #c8a951;background:#132a18;color:#fff;box-sizing:border-box;font-size:14px}.searchWrap input::placeholder{color:#8aa88f}.addBtn{margin:12px 0;width:100%;padding:12px;background:#132a18;color:#c8a951;border:1px solid #c8a951;border-radius:12px;font-weight:900;letter-spacing:0.5px}.autoAlert{background:#2a1a0a;border:2px solid #ffcc00;border-radius:12px;padding:10px;margin-bottom:12px;display:none}.autoAlert h4{margin:0 0 8px 0;color:#ffcc00;font-size:14px}.notifItem{background:#132a18;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;font-weight:700;border-left:4px solid #d50000;color:#fff}.card{background:#132a18;border:1px solid #c8a951;border-radius:18px;padding:12px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.4)}.cardTop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e4a28;padding-bottom:10px;margin-bottom:8px}.cardTitle{font-weight:900;color:#c8a951;font-size:15px}.badgeDue{background:#4a0a0a;color:#ff6666;border:1px solid #ff4444;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900}.badgeOk{background:#0a4d0a;color:#22ff88;border:1px solid #22c55e;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:900}.rows{background:#0f2110;border-radius:12px;padding:6px;margin-top:8px;border:1px solid #1e4a28}.row{display:flex;justify-content:space-between;padding:10px 8px;border-bottom:1px solid #1a3d22;font-size:13px;font-weight:600;border-radius:8px;margin-bottom:4px;color:#c8ffc8}.row:last-child{border:none}.row.due{background:#d50000 !important;color:white !important;border:1px solid #ff4444}.row b{color:#fff}.btns{display:flex;gap:8px;margin-top:10px}.editBtn{flex:1;background:#1a3d22;color:#c8a951;border:1px solid #c8a951;padding:10px;border-radius:10px;font-weight:900}.delBtn{flex:1;background:#4a0a0a;color:#ff6666;border:1px solid #ff4444;padding:10px;border-radius:10px;font-weight:900}#formModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:12px}#formBox{background:#0f2110;border:1px solid #c8a951;border-radius:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}#formBox h3{margin:0;padding:14px 16px;background:#122e18;color:#c8a951;border-radius:18px 18px 0 0;text-align:center;border-bottom:1px solid #1e4a28}.formInner{padding:14px}.formInner label{font-size:12px;font-weight:900;display:block;margin:10px 0 4px 0;color:#c8a951}.formInner input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #1e2f4a;background:#132a18;color:#fff;box-sizing:border-box;font-size:14px;font-weight:600}.formBtns{display:flex;gap:10px;margin-top:16px}.saveBtn{flex:1;background:#c8a951;color:#0a1a0f;border:none;padding:12px;border-radius:10px;font-weight:900}.cancelBtn{flex:1;background:#1e4a28;color:#fff;border:1px solid #1e4a28;padding:12px;border-radius:10px;font-weight:900}.alertBtn{background:#132a18;color:#ffcc00;border:1px solid #c8a951;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px;position:relative}.alertCount{background:#d50000;color:white;border-radius:50%;padding:2px 7px;font-size:11px;position:absolute;top:-7px;right:-7px}.roleTag{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}.role-cmd{background:#1a2a4a;color:#8ab4ff;border:1px solid #2a4a8a}.role-mt{background:#1a3d22;color:#ffdb70;border:1px solid #c8a951}</style></head><body><div class="top"><b>VEHICLE UPDATE</b><div style="display:flex;gap:8px;align-items:center"><span id="roleShow" class="roleTag"></span><span class="alertBtn">🚨 <span id="alertCount" class="alertCount">0</span></span><button class="backBtn" onclick="location.href='dashboard.html'">BACK</button></div></div><div class="wrap"><div class="searchWrap"><input id="search" placeholder="🔍 গাড়ি সার্চ... BA No" oninput="render()"></div><div id="autoAlertArea" class="autoAlert"><h4>🚨 Alert - 7 দিনের মধ্যে Due (<span id="alertNum">0</span>)</h4><div id="autoAlertList"></div></div><button id="addBtnMain" class="addBtn" onclick="openAdd()">+ ADD NEW VEHICLE</button><div id="list"><p style="padding:40px;text-align:center;color:#c8a951">⏳ Please Wait...</p></div></div><div id="formModal" onclick="if(event.target==this)closeForm()"><div id="formBox"><h3 id="formTitle">Edit Vehicle</h3><div class="formInner"><label>BA No / Truck No</label><input id="f_ba"><label>বর্তমান KM</label><input id="f_cur" type="number"><label>Engine Oil - শেষ চেঞ্জ KM</label><input id="f_eKm" type="number"><label>Engine Oil - শেষ চেঞ্জ তারিখ </label><input id="f_eDate" type="text" placeholder="26-10-2026"><label>Trans Oil - শেষ চেঞ্জ KM</label><input id="f_tKm" type="number"><label>Trans Oil - শেষ চেঞ্জ তারিখ </label><input id="f_tDate" type="text" placeholder="26-10-2026"><label>ATF - শেষ চেঞ্জ তারিখ </label><input id="f_atf" type="text" placeholder="26-10-2024"><label>Coolant - শেষ চেঞ্জ তারিখ </label><input id="f_cool" type="text" placeholder="26-10-2023"><input type="hidden" id="f_row"><div class="formBtns"><button class="cancelBtn" onclick="closeForm()">Cancel</button><button class="saveBtn" onclick="saveForm()">✅</button></div><p id="msg" style="text-align:center;font-size:11px"></p></div></div></div> <script>
 const API_URL = "https://script.google.com/macros/s/AKfycbxpf548ZQtTwAHT1_WENAdfUKuIwtAIv2zj3HhGEtX1L_n9zvhvyObHmY5zFYVEHgZp/exec";
 // === FINAL ROLE FIX ===
 let mtRoleRaw = localStorage.getItem("mt_role") || localStorage.getItem("role") || "";
 if(!mtRoleRaw){ location.href='index.html'; }
 let ROLE_UP = mtRoleRaw.toUpperCase().trim();
 let CAN_EDIT = ROLE_UP.includes("MT CLK") || ROLE_UP.includes("ADMIN") || ROLE_UP === "MT CLK";
 if(ROLE_UP.includes("COMMAND")) CAN_EDIT = false;
 function applyRole(){ let ab=document.getElementById('addBtnMain'); let rs=document.getElementById('roleShow'); if(CAN_EDIT){ if(rs){ rs.innerText = 'EDIT - MT CLK'; rs.className='roleTag role-mt'; } if(ab) ab.style.display='block'; } else { if(rs){ rs.innerText = 'VIEW - COMMAND'; rs.className='roleTag role-cmd'; } if(ab) ab.style.display='none'; } }
 let today=new Date();let vehicles=[];async function loadFromSheet(){try{let res=await fetch(API_URL+"?t="+Date.now());let txt=await res.text();vehicles=JSON.parse(txt);render();}catch(e){document.getElementById('list').innerHTML=`<p style='padding:20px;text-align:center;color:#ff4444'>❌ Access Denied / Failed<br><small>${e}</small><br><br>Deploy -> Anyone করো<br><button onclick='loadFromSheet()' style='padding:8px 16px;border-radius:8px'>Retry</button></p>`;}}
 function toISO(dmy){if(!dmy)return new Date().toISOString().slice(0,10);dmy=String(dmy).trim();if(dmy.split("-")[0].length==4)return dmy;if(dmy.includes("/")){let p=dmy.split("/");if(p.length==3)return`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}let p=dmy.split("-");if(p.length!=3)return new Date().toISOString().slice(0,10);return`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
 function toDMY(iso){if(!iso)return"";iso=String(iso).trim();if(iso.includes("T"))iso=iso.split("T")[0];if(iso.split("-")[0].length==2)return iso;let p=iso.split("-");if(p.length!=3)return iso;return`${p[2]}-${p[1]}-${p[0]}`;}
 function getTodayDMY(){let d=new Date();return`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;}
 function daysPassed(dmy){let iso=toISO(dmy);let d=new Date(iso);let diff=Math.floor((today-d)/(1000*60*60*24));return diff<0?0:diff;}
 function formatDays(d){if(d<30)return d+"দিন";let m=Math.floor(d/30);let r=d%30;return r==0?m+"মাস":m+"মা "+r+"দিন";}
 function openAdd(){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); document.getElementById('formTitle').innerText="Add New Vehicle";['f_ba','f_cur','f_eKm','f_eDate','f_tKm','f_tDate','f_atf','f_cool','f_row'].forEach(id=>document.getElementById(id).value='');document.getElementById('f_eDate').value=getTodayDMY();document.getElementById('f_tDate').value=getTodayDMY();document.getElementById('f_atf').value=getTodayDMY();document.getElementById('f_cool').value=getTodayDMY();document.getElementById('formModal').style.display='flex';}
 function openEdit(idx){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); let v=vehicles[idx];document.getElementById('formTitle').innerText="Edit - "+v.ba;document.getElementById('f_ba').value=v.ba;document.getElementById('f_cur').value=v.currentKM;document.getElementById('f_eKm').value=v.engineKM;document.getElementById('f_eDate').value=toDMY(v.engineDate);document.getElementById('f_tKm').value=v.transKM;document.getElementById('f_tDate').value=toDMY(v.transDate);document.getElementById('f_atf').value=toDMY(v.atfDate);document.getElementById('f_cool').value=toDMY(v.coolDate);document.getElementById('f_row').value=v.row;document.getElementById('formModal').style.display='flex';}
 function closeForm(){document.getElementById('formModal').style.display='none';}
 async function saveForm(){ if(!CAN_EDIT) return; let p={ba:document.getElementById('f_ba').value.trim(),currentKM:parseInt(document.getElementById('f_cur').value)||0,engineKM:parseInt(document.getElementById('f_eKm').value)||0,engineDate:toISO(document.getElementById('f_eDate').value),transKM:parseInt(document.getElementById('f_tKm').value)||0,transDate:toISO(document.getElementById('f_tDate').value),atfDate:toISO(document.getElementById('f_atf').value),coolDate:toISO(document.getElementById('f_cool').value),row:document.getElementById('f_row').value?parseInt(document.getElementById('f_row').value):0};p.action=p.row?"edit":"add";if(!p.ba){alert("BA No দাও");return;}document.getElementById('msg').innerText="⏳ Saving...";await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(p)});document.getElementById('msg').innerText="✅ Saved!";setTimeout(()=>location.reload(),1000);}
 async function deleteVehicle(idx){ if(!CAN_EDIT) return alert('⛔ COMMAND View Only'); if(!confirm("Delete?"))return;let v=vehicles[idx];await fetch(API_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"delete",row:v.row})});location.reload();}
 function render(){let q=document.getElementById('search').value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let alerts=[];vehicles.forEach((v,idx)=>{if(q&&!String(v.ba).toLowerCase().includes(q))return;let eDP=daysPassed(v.engineDate);let eKP=(parseInt(v.currentKM)||0)-(parseInt(v.engineKM)||0);if(eKP<0)eKP=0;let eDL=180-eDP;let eKL=5000-eKP;let eDue=eDL<=0||eKL<=0;let eAlert=eDL<=7||eKL<=300;let tDP=daysPassed(v.transDate);let tKP=(parseInt(v.currentKM)||0)-(parseInt(v.transKM)||0);if(tKP<0)tKP=0;let tDL=365-tDP;let tKL=14000-tKP;let tDue=tDL<=0||tKL<=0;let tAlert=tDL<=7||tKL<=300;let atfDP=daysPassed(v.atfDate);let atfDL=730-atfDP;let atfDue=atfDL<=0;let atfAlert=atfDL<=7;let coolDP=daysPassed(v.coolDate);let coolDL=1095-coolDP;let coolDue=coolDL<=0;let coolAlert=coolDL<=7;if(eAlert)alerts.push({ba:v.ba,item:'Engine Oil',over:eDue});if(tAlert)alerts.push({ba:v.ba,item:'Trans Oil',over:tDue});if(atfAlert)alerts.push({ba:v.ba,item:'ATF',over:atfDue});if(coolAlert)alerts.push({ba:v.ba,item:'Coolant',over:coolDue});let anyOver=eDue||tDue||atfDue||coolDue; let editDel = CAN_EDIT ? `<div class="btns"><button class="editBtn" onclick="openEdit(${idx})">🗡️</button><button class="delBtn" onclick="deleteVehicle(${idx})">⚔️</button></div>` : ''; list.innerHTML+=`<div class="card"><div class="cardTop"><div class="cardTitle">🚚🚙 ${v.ba} - ${v.currentKM}km</div><div class="${anyOver?'badgeDue':'badgeOk'}">${anyOver?'⚠️ Due':'✅ OK'}</div></div><div class="rows"><div class="row ${eDue?'due':''}"><span>🛢️ Engine Oil (5000km/6m)</span><b>${eKP}km / ${formatDays(eDP)}</b></div><div class="row ${tDue?'due':''}"><span>⚙️ Trans Oil (14000km/1y)</span><b>${tKP}km / ${formatDays(tDP)}</b></div><div class="row ${atfDue?'due':''}"><span>💧 ATF (2y)</span><b>${formatDays(atfDP)}</b></div><div class="row ${coolDue?'due':''}"><span>❄️ Coolant (3y)</span><b>${formatDays(coolDP)}</b></div></div>${editDel}</div>`;});document.getElementById('alertCount').innerText=alerts.length;document.getElementById('alertNum').innerText=alerts.length;let auto=document.getElementById('autoAlertList');auto.innerHTML='';if(alerts.length==0){document.getElementById('autoAlertArea').style.display='none';}else{document.getElementById('autoAlertArea').style.display='block';alerts.forEach(a=>{auto.innerHTML+=`<div class="notifItem">🚨 <b>${a.ba}</b> - ${a.item} ${a.over?'🔴 Due':'🟡 7 দিনের মধ্যে Due'}</div>`;});} applyRole();}
 applyRole(); loadFromSheet();
</script></body></html>
