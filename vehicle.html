<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEHICLE UPDATE - MT Platoon 4 BIR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2f7}
.top{background:#0a4d0a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:16px;font-weight:900}
.back{background:#d50000;color:white;border:none;padding:8px 14px;border-radius:10px;font-weight:900;cursor:pointer}
.badge{background:#e8f5e9;color:#0a4d0a;padding:8px 12px;margin:10px 14px;border-radius:12px;font-weight:900;display:flex;justify-content:space-between;font-size:13px;border:1px solid #a5d6a7}
.search{margin:0 14px 14px 14px;background:white;border-radius:14px;padding:12px;display:flex;gap:10px;box-shadow:0 2px 8px #0001}
.search input{flex:1;border:none;outline:none;font-size:14px;font-weight:700}
.grid{padding:0 14px 20px 14px;display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.card{background:white;border-radius:16px;padding:12px;box-shadow:0 4px 12px #0001;cursor:pointer;border-left:5px solid #0a4d0a}
.card.due{border-left-color:#ff9800}
.head{display:flex;justify-content:space-between;align-items:center}
.head b{font-size:16px;color:#0a2e0a}
.st{font-size:10px;padding:4px 8px;border-radius:20px;font-weight:900}
.st.due{background:#fff3e0;color:#e65100} .st.good{background:#e8f5e9;color:#2e7d32}
.inner{margin-top:8px;background:#f9faf9;border-radius:10px;padding:8px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:5px 6px;margin:3px 0;background:white;border-radius:6px}
.row b{font-size:12px}
</style>
</head>
<body>
<div class="top"><b>VEHICLE UPDATE - 35 VEH</b><button class="back" onclick="location.href='dashboard.html'">BACK</button></div>
<div class="badge"><span>🛡️ MT Platoon 4 BIR</span><span id="count">35 Vehicles</span></div>
<div class="search"><span>🔍</span><input id="q" placeholder="গাড়ি সার্চ করুন... যেমন: Truck-05" oninput="render()"></div>
<div id="list" class="grid"></div>
<script>
const vehicles=["Truck-01","Truck-02","Truck-03","Truck-04","Truck-05","Truck-06","Truck-07","Truck-08","Truck-09","Truck-10","Jeep-01","Jeep-02","Jeep-03","Jeep-04","Jeep-05","Pickup-01","Pickup-02","Pickup-03","Pickup-04","Pickup-05","Ambulance-01","Ambulance-02","Bowser-01","Bowser-02","Bowser-03","Recovery-01","Recovery-02","Bus-01","Bus-02","Car-01","Car-02","Car-03","Car-04","Car-05","Bike-01"];
const data=vehicles.map((v,i)=>{return{name:v,eng:i%3==0?'Due Soon':'Good',trans:i%5==0?'Due Soon':'Good',coolant:'92%',atf:i%4==0?'Due Soon':'Good',isDue:i%3==0||i%4==0}});
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const list=document.getElementById('list');list.innerHTML='';let due=0;
  data.filter(d=>d.name.toLowerCase().includes(q)).forEach(d=>{
    if(d.isDue)due++;
    list.innerHTML+=`<div class="card ${d.isDue?'due':''}" onclick="location.href='vehicle_details.html?v=${d.name}'">
      <div class="head"><b>🚚 ${d.name}</b><span class="st ${d.isDue?'due':'good'}">${d.isDue?'⚠️ Due Soon':'✅ Good'}</span></div>
      <div class="inner">
        <div class="row"><span>Engine Oil</span><b style="color:${d.eng=='Due Soon'?'#e65100':'#2e7d32'}">${d.eng}</b></div>
        <div class="row"><span>Transmission Oil</span><b style="color:${d.trans=='Due Soon'?'#e65100':'#2e7d32'}">${d.trans}</b></div>
        <div class="row"><span>Coolant</span><b>${d.coolant}</b></div>
        <div class="row"><span>ATF</span><b style="color:${d.atf=='Due Soon'?'#e65100':'#2e7d32'}">${d.atf}</b></div>
      </div>
    </div>`;
  });
  document.getElementById('count').innerText=due>0?due+' Due / '+vehicles.length+' Vehicles':vehicles.length+' Vehicles';
}
render();
</script>
</body>
</html>
