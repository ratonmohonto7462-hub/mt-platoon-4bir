<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT PLATOON MOBILE NUMBER - 4 BIR</title>
<style>
body{margin:0;font-family:'SolaimanLipi',Arial;background:#f5f5f5}
.dashboard-header{background:green;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.dashboard-header h1{margin:0;font-size:18px}.logout{background:red;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;font-weight:bold}
.container{padding:20px;max-width:1300px;margin:0 auto}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;box-sizing:border-box;font-size:16px}
.btn-add{width:100%;padding:15px;background:green;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
.table-title{text-align:center;font-size:22px;font-weight:bold;margin:15px 0 5px;color:#333;text-decoration:underline}
.btn-print{background:blue;color:white;border:none;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin:15px auto;display:block;font-size:16px}
table{width:100%;border-collapse:collapse;background:white;font-size:14px}
th{background:green;color:white;padding:10px;text-align:center;border:1px solid #000}
td{padding:8px;text-align:center;border:1px solid #000}
.btn-delete{background:red;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer;margin:2px}
.btn-edit{background:orange;color:white;border:none;padding:5px 8px;border-radius:5px;cursor:pointer;margin:2px}
.disabled{opacity:0.5;pointer-events:none}
</style>
</head>
<body>
<div class="dashboard-header"><h1>MT PLATOON 4 BIR - MOBILE NUMBER</h1><button class="logout" onclick="location.href='dashboard.html'">Back</button></div>
<div class="container">
<div id="adminControls">
<input type="text" id="padobi" placeholder="পদবী">
<input type="text" id="name" placeholder="নাম">
<input type="text" id="number" placeholder="মোবাইল নম্বর">
<input type="text" id="remarks" placeholder="মন্তব্য">
<button class="btn-add" id="mainBtn" onclick="addData()">Add করুন</button><p id="msg" style="text-align:center;color:green;font-weight:bold"></p>
</div>
<div class="table-title">MT PLATOON MOBILE NUMBER - 4 BIR</div>
<button class="btn-print" onclick="window.print()">🖨️ প্রিন্ট করুন</button>
<table><thead><tr><th>ক্র/নং</th><th>পদবী</th><th>নাম</th><th>মোবাইল নম্বর</th><th>মন্তব্য</th><th id="actionHead">একশন</th></tr></thead>
<tbody id="dataTable"><tr><td colspan="6">Loading...</td></tr></tbody></table>
</div>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbwPXKd8ecRThPwF0wVTg4id88ru0RZtpWKrk6Jb6oFp-Xq8KuzwZVM_Zmw05gaevpZT/exec";
let selectedRole=localStorage.getItem('role'); let editRowNum=-1;
async function loadData(){
 let tbody=document.getElementById('dataTable');
 try{
  let res=await fetch(SHEET_URL+"?sheet=Mobile&t="+Date.now());
  let data=await res.json();
  tbody.innerHTML='';
  if(!data.length){tbody.innerHTML='<tr><td colspan="6">কোনো ডাটা নাই</td></tr>';return}
  data.forEach((item,index)=>{
   let btn=(selectedRole && selectedRole.toLowerCase().includes('clk'))? `<button class="btn-edit" onclick="editData(${item.row},'${item.PADOBI}','${item.NAME}','${item.NUMBER}','${item.MONTOBBO||''}')">Edit</button><button class="btn-delete" onclick="deleteData(${item.row})">Delete</button>` : `View Only`;
   tbody.innerHTML+=`<tr><td>${index+1}</td><td>${item.PADOBI}</td><td style="text-align:left">${item.NAME}</td><td><a href="tel:${item.NUMBER}">${item.NUMBER}</a></td><td>${item.MONTOBBO||''}</td><td>${btn}</td></tr>`;
  });
 }catch(e){tbody.innerHTML=`<tr><td colspan="6">Error: ${e.message}</td></tr>`;}
}
function editData(row,PADOBI,NAME,NUMBER,MONTOBBO){
 editRowNum=row; padobi.value=PADOBI; name.value=NAME; number.value=NUMBER; remarks.value=MONTOBBO;
 mainBtn.innerText='Update করুন'; window.scrollTo(0,0);
}
async function deleteData(row){ if(!confirm('Delete করবেন?'))return; await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({sheet:"Mobile",action:"delete",row})}); alert('ডিলিট হয়েছে'); setTimeout(loadData,2000); }
async function addData(){
 let PADOBI=padobi.value.trim(), NAME=name.value.trim(), NUMBER=number.value.trim(), MONTOBBO=remarks.value.trim();
 if(!PADOBI||!NAME||!NUMBER){alert('পদবী, নাম, নম্বর পূরণ করুন');return}
 let payload=editRowNum==-1? {sheet:"Mobile",PADOBI,NAME,NUMBER,MONTOBBO} : {sheet:"Mobile",action:"edit",row:editRowNum,PADOBI,NAME,NUMBER,MONTOBBO};
 msg.innerText='পাঠানো হচ্ছে...'; await fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});
 msg.innerText='✅ Done!'; padobi.value=name.value=number.value=remarks.value=''; editRowNum=-1; mainBtn.innerText='Add করুন'; setTimeout(loadData,2000);
}
window.onload=function(){ if(selectedRole && selectedRole.toLowerCase().includes('clk')){adminControls.classList.remove('disabled');} else{adminControls.classList.add('disabled'); actionHead.innerText='Status';} loadData(); }
</script>
</body>
</html>
