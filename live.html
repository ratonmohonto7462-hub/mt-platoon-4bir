<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Convoy Tracking - MT Platoon 4 BIR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;padding-bottom:70px}
.header{background:#0b1226;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:16px}.header h1 span{font-size:11px;color:#94a3b8;display:block;font-weight:400}
.live{color:#10b981;border:1px solid #10b981;background:#10b98122;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
#map{height:58vh;width:100%;background:#111}
.bottom{padding:14px;background:#0b1226;border-radius:22px 22px 0 0;margin-top:-20px;position:relative}
.join{display:flex;gap:8px;margin-bottom:12px}
.join input{flex:1;padding:12px;border-radius:10px;border:none;background:#162040;color:#fff;outline:none}
.join button{padding:12px 20px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:800;cursor:pointer}
.list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:5px 12px;background:#1e293b;border-radius:20px;font-size:12px;border:1px solid #334155}
.tag.me{background:#3b82f6;border-color:#3b82f6;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.grid div{background:#162040;padding:12px;border-radius:12px}
.grid b{color:#38bdf8;font-size:18px;display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1226;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #1e293b}
.nav div{text-align:center;font-size:12px;color:#94a3b8;cursor:pointer}
.nav div.mid{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:20px;margin-top:-18px;font-weight:800}
</style>
</head>
<body>
<div class="header"><h1>Live Convoy Tracking<span>সবাই সবাইকে দেখবে • 10 Trucks</span></h1><div class="live">● LIVE</div></div>
<div id="map"></div>
<div class="bottom">
<div class="join"><input id="name" placeholder="তোমার গাড়ি: Truck-05"><button onclick="join()">Join</button></div>
<div class="list" id="list"></div>
<div class="grid"><div><b id="sp">58</b>km/h</div><div><b>3h 12m</b>ETA</div><div><b>142km</b>Left</div></div>
</div>
<div class="nav">
<div onclick="location.href='/home/'">🏡<br>Home Page</div>
<div class="mid">🛰️<br>Live Convoy</div>
<div onclick="location.href='/home/group.html'">👥<br>Group</div>
</div>
<script>
const route=[[23.81,90.41],[23.72,90.25],[23.55,89.95],[23.35,89.75],[23.05,89.45],[22.85,89.2]];
const map=L.map('map',{zoomControl:false}).setView([23.4,89.9],9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
L.polyline(route,{color:'#38bdf8',weight:4}).addTo(map);
let trucks={},my=localStorage.getItem('myTruck')||'';
for(let i=1;i<=10;i++){let n=`Truck-${String(i).padStart(2,'0')}`;let b=route[i%route.length];let p=[b[0]+(Math.random()-0.5)*0.3,b[1]+(Math.random()-0.5)*0.3];let ic=L.divIcon({html:`<div style="background:#22c55e;color:#fff;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;border:2px solid #fff">🚚 ${n}</div>`,className:''});let m=L.marker(p,{icon:ic}).addTo(map).bindPopup(n);trucks[n]={marker:m,pos:p};}
function render(){let h='';Object.keys(trucks).forEach(n=>{h+=`<span class="tag ${n===my?'me':''}">${n}${n===my?' (You)':''}</span>`});document.getElementById('list').innerHTML=h;}render();
function join(){let v=document.getElementById('name').value.trim();if(!v)return alert('নাম লিখো');my=v;localStorage.setItem('myTruck',v);if(!trucks[v]){let p=route[2];let ic=L.divIcon({html:`<div style="background:#3b82f6;color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;border:2px solid #fff">📍 ${v}</div>`,className:''});let m=L.marker(p,{icon:ic}).addTo(map).bindPopup(v+' (You)').openPopup();trucks[v]={marker:m,pos:p};map.setView(p,13);}if(navigator.geolocation){navigator.geolocation.watchPosition(pos=>{let np=[pos.coords.latitude,pos.coords.longitude];trucks[my].marker.setLatLng(np);trucks[my].pos=np;},{enableHighAccuracy:true});}render();alert('✅ Joined!');}
setInterval(()=>{Object.keys(trucks).forEach(n=>{if(n!==my){let la=trucks[n].pos[0]+(Math.random()-0.5)*0.008;let ln=trucks[n].pos[1]+(Math.random()-0.5)*0.008;trucks[n].pos=[la,ln];trucks[n].marker.setLatLng([la,ln]);}});document.getElementById('sp').innerText=Math.floor(50+Math.random()*18);},2500);
if(my)document.getElementById('name').value=my;
</script>
</body>
</html>
