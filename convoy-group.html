<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convoy Group Tracking - MT Platoon 4 BIR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;padding-bottom:75px}
.header{background:#0b1226;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:15px}.header h1 span{font-size:11px;color:#94a3b8;display:block;font-weight:400}
#map{height:42vh;width:100%;background:#111}
.bottom{padding:12px 14px;background:#0b1226;border-radius:20px 20px 0 0;margin-top:-16px;position:relative}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:8px;text-align:center;background:#162040;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid #1e293b;color:#94a3b8}
.tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6;font-weight:700}
.group-list{display:flex;flex-direction:column;gap:8px;max-height:32vh;overflow-y:auto}
.truck-row{display:flex;justify-content:space-between;align-items:center;background:#162040;padding:10px 12px;border-radius:12px;border:1px solid #1e293b}
.truck-row.me{border-color:#3b82f6;background:#1e3a5f}
.truck-row b{color:#38bdf8;font-size:13px}
.truck-row small{color:#94a3b8;font-size:11px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1226;display:flex;justify-content:space-around;padding:11px 0;border-top:1px solid #1e293b;z-index:999}
.nav div{text-align:center;font-size:11px;color:#94a3b8;cursor:pointer}
.nav div.mid{background:#3b82f6;color:#fff;padding:8px 16px;border-radius:20px;margin-top:-18px;font-weight:800}
</style>
</head>
<body>
<div class="header">
<h1>🛰️ Convoy Group Tracking<span>10 Trucks • Everyone sees everyone • Dhaka → Jessore</span></h1>
<div style="color:#10b981;border:1px solid #10b981;background:#10b98122;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700">● LIVE TRACKING</div>
</div>

<div id="map"></div>

<div class="bottom">
<div class="tabs">
<div class="tab active">📍 Live Map</div>
<div class="tab">🚚 Group (10)</div>
<div class="tab">📊 Status</div>
</div>

<div class="group-list" id="groupList"></div>
</div>

<div class="nav">
<div onclick="location.href='../index.html'">🏡<br>Home Page</div>
<div class="mid">🛰️<br>Convoy Group</div>
<div onclick="location.href='../message.html'">💬<br>Message</div>
</div>

<script>
const route=[[23.81,90.41],[23.72,90.25],[23.55,89.95],[23.35,89.75],[23.05,89.45],[22.85,89.2]];
const map=L.map('map',{zoomControl:false}).setView([23.4,89.9],9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
L.polyline(route,{color:'#38bdf8',weight:4}).addTo(map);

let trucks={};
let html='';
for(let i=1;i<=10;i++){
  let name=`Truck-${String(i).padStart(2,'0')}`;
  let b=route[i%route.length];
  let p=[b[0]+(Math.random()-0.5)*0.3,b[1]+(Math.random()-0.5)*0.3];
  let color = i==5 ? '#3b82f6' : '#22c55e';
  let ic=L.divIcon({html:`<div style="background:${color};color:#fff;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;border:2px solid #fff">🚚 ${name}</div>`,className:''});
  let m=L.marker(p,{icon:ic}).addTo(map).bindPopup(name);
  trucks[name]={marker:m,pos:p};
  
  let speed=Math.floor(55+Math.random()*12);
  let dist=Math.floor(Math.random()*40+120);
  html+=`<div class="truck-row ${i==5?'me':''}">
    <div><b>${name} ${i==5?'(You)':''}</b><br><small>${speed} km/h • ${dist}km left</small></div>
    <div style="text-align:right;font-size:11px"><span class="dot"></span> Live<br><small style="color:#22c55e">Active</small></div>
  </div>`;
}
document.getElementById('groupList').innerHTML=html;

setInterval(()=>{
  Object.keys(trucks).forEach(n=>{
    let la=trucks[n].pos[0]+(Math.random()-0.5)*0.006;
    let ln=trucks[n].pos[1]+(Math.random()-0.5)*0.006;
    trucks[n].pos=[la,ln];
    trucks[n].marker.setLatLng([la,ln]);
  });
},2500);
</script>
</body>
</html>
