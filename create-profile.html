<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Profile</title>
<style>body{margin:0;font-family:sans-serif;background:#fff;padding:24px}input{width:100%;border:none;border-bottom:2px solid #111;padding:12px 0;font-size:18px;outline:none;margin:8px 0 18px}button{width:100%;background:#111;color:#fff;border:none;padding:16px;border-radius:50px;font-size:20px;font-weight:bold}#msg{color:red;text-align:center;margin-top:10px;font-weight:bold;display:none}#ok{color:green;text-align:center;margin-top:10px;font-weight:bold;display:none}</style></head><body>
<h1>Create Profile</h1>
<input id="sena" placeholder="Army Number"><input id="name" placeholder="Name"><input id="mobile" placeholder="Mobile"><input id="pass" type="password" placeholder="Password">
<button onclick="createAcc()">Create Account</button><div id="msg"></div><div id="ok"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
var firebaseConfig = { apiKey: "AIzaSyDee9QiF2Dq3yGBgLhymFC7zrbWfo0PB2U", authDomain: "mt-messenger-63922.firebaseapp.com", projectId: "mt-messenger-63922", storageBucket: "mt-messenger-63922.firebasestorage.app", messagingSenderId: "184454055809", appId: "1:184454055809:web:95106bb74fab8444fdca80", measurementId: "G-PTEBJFVKZF" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
async function createAcc(){
 var sena=document.getElementById('sena').value.trim();
 var name=document.getElementById('name').value.trim();
 var mobile=document.getElementById('mobile').value.trim();
 var pass=document.getElementById('pass').value.trim();
 var msg=document.getElementById('msg'), ok=document.getElementById('ok');
 msg.style.display='none'; ok.style.display='none';
 if(!sena||!name||!mobile||!pass){msg.style.display='block';msg.innerText='সব ঘর পূরণ করো';return;}
 try{ await db.collection('users').doc(sena).set({sena:sena,name:name,mobile:mobile,pass:pass,status:'approved'});
 ok.style.display='block'; ok.innerText='✅ Account হইছে! এখন Login করো';
 setTimeout(()=>{location.href='dashboard.html';},800);
 }catch(e){msg.style.display='block';msg.innerText='Error: '+e.message;}
}
</script></body></html>
