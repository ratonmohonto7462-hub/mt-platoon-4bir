<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Profile - 4 BIR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05140a;display:flex;justify-content:center;min-height:100vh;padding:12px}
.box{width:100%;max-width:400px;background:#101010;border:1.5px solid #00ff88;border-radius:18px;padding:18px}
h2{color:#00ff88;text-align:center;margin:8px 0 14px}
label{color:#00ff88;font-size:13px;margin:14px 0 6px 2px;display:block}
input,select{width:100%;padding:13px;background:#000;border:1.5px solid #00ff88;border-radius:10px;color:#7cff7c;font-size:14px;outline:none}
.btn{width:100%;padding:14px;background:#4dff8a;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:18px;letter-spacing:0.5px}
.back{text-align:center;color:#c8a951;margin-top:14px;cursor:pointer}
</style></head><body>
<div class="box">
<h2>Create New Profile</h2>
<label>সেনা নং</label><input id="sena" value="৪৫২১৩২৮">
<label>পদবি</label><select id="podobi"><option>সৈনিক</option><option>ল্যান্স কর্পোরাল</option><option>কর্পোরাল</option><option>সার্জেন্ট</option><option>ক্যাপ্টেন</option></select>
<label>নাম</label><input id="name" value="রতন চন্দ্র মহন্ত">
<label>কোম্পানি</label><select id="company"><option>সদর</option><option>আলফা</option><option>ব্রাভো</option><option>চার্লি</option></select>
<label>মোবাইল</label><input id="mobile" value="০১৭৩৭৯১২০৯৪">
<label>রক্তের গ্রুপ</label><input id="blood" value="বি নেগেটিভ">
<button class="btn" onclick="submitNow()">SUBMIT FOR APPROVAL</button>
<div class="back" onclick="location.href='/profile'">← Back to Login</div>
<p id="msg" style="text-align:center;font-size:12px;margin-top:10px"></p>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycby8BQ0Dyo5s4otJEbRJcZXNiW3pyqDY9800nm8X7kGeOz49RVlQ1bdoF5IdByxL-l226w/exec";
function toEnglishNum(str){return str.replace(/[০-৯]/g,d=> "০১২৩৪৫৬৭৮৯".indexOf(d));}
function submitNow(){
let sena=toEnglishNum(document.getElementById('sena').value.trim());
let pod=document.getElementById('podobi').value;
let name=document.getElementById('name').value;
let com=document.getElementById('company').value;
let mob=toEnglishNum(document.getElementById('mobile').value.trim());
let blood=document.getElementById('blood').value;
if(!sena||!mob){document.getElementById('msg').innerText="সেনা নং ও মোবাইল দিন";return;}
let data={sena_no:sena,podobi:pod,name:name,company:com,mobile:mob,blood:blood,status:"PENDING",time:new Date().toLocaleString()};
localStorage.setItem('sena_no',sena);
localStorage.setItem('mobile_no',mob);
localStorage.setItem('profile_name',name);
localStorage.setItem('podobi',pod);
localStorage.setItem('company',com);
localStorage.setItem('blood',blood);
localStorage.setItem('pending_profile',JSON.stringify(data));
document.getElementById('msg').innerHTML="<span style='color:#7CFC00'>✅ Submitted! Admin approval এর পর Login করতে পারবেন</span>";
// Google Sheet এ পাঠাবে (Admin Approval Sheet)
fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"new_profile",...data})});
setTimeout(()=>{location.href="/profile";},1500);
}
</script></body></html>
