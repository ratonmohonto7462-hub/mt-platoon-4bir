<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Profile - 4 BIR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial;display:flex;justify-content:center;min-height:100vh;padding:0}
.top-bar{background:#111;color:#fff;width:100%;position:fixed;top:0;left:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;z-index:10}
.wrap{width:100%;max-width:420px;background:#fff;padding:70px 20px 30px 20px}
.title{font-size:28px;font-weight:800;margin:10px 0 24px 0;color:#111;line-height:1.2}
label{color:#555;font-size:13px;margin:16px 0 6px 2px;display:block}
input,select{width:100%;padding:14px 12px;background:#f9f9f9;border:1.5px solid #111;border-radius:10px;color:#111;font-size:15px;outline:none}
input:focus,select:focus{border-color:#000;background:#fff}
.btn{width:100%;padding:16px;background:#111;color:#fff;border:none;border-radius:30px;font-weight:800;margin-top:22px;font-size:17px;cursor:pointer}
.btn-green{width:100%;padding:16px;background:#00c853;color:#000;border:none;border-radius:30px;font-weight:900;margin-top:22px;font-size:17px;cursor:pointer}
.back{text-align:center;color:#666;margin-top:18px;cursor:pointer;font-size:14px}
.msg{text-align:center;font-size:13px;margin-top:12px}
</style>
</head>
<body>

<div class="top-bar"><span>MT PLATOON</span><span onclick="location.href='index.html'" style="font-size:28px;cursor:pointer">×</span></div>

<div class="wrap">
  <div class="title">Create New<br>MT Profile</div>

  <label>সেনা নং / Army No *</label>
  <input id="sena" type="text" placeholder="Enter Army No">

  <label>পদবি / Rank</label>
  <select id="podobi">
    <option>সৈনিক</option>
    <option>ল্যান্স কর্পোরাল</option>
    <option>কর্পোরাল</option>
    <option>সার্জেন্ট</option>
    <option>ক্যাপ্টেন</option>
  </select>

  <label>নাম / Name *</label>
  <input id="name" type="text" placeholder="Enter Full Name">

  <label>কোম্পানি / Company</label>
  <select id="company">
    <option>সদর</option>
    <option>আলফা</option>
    <option>ব্রাভো</option>
    <option>চার্লি</option>
  </select>

  <label>মোবাইল / Mobile *</label>
  <input id="mobile" type="tel" placeholder="01XXXXXXXXX">

  <label>রক্তের গ্রুপ / Blood Group</label>
  <input id="blood" type="text" placeholder="e.g. B+ / বি+">

  <label>Password *</label>
  <input id="pass" type="password" placeholder="Create Password (min 6 digit)">

  <label>Confirm Password *</label>
  <input id="cpass" type="password" placeholder="Confirm Password">

  <button class="btn-green" onclick="submitNow()">SUBMIT FOR APPROVAL</button>
  
  <div class="back" onclick="location.href='profile.html'">← Back to Login</div>
  <p id="msg" class="msg"></p>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycby8BQ0Dyo5s4otJEbRJcZXNiW3pyqDY9800nm8X7kGeOz49RVlQ1bdoF5IdByxL-l226w/exec";

function toEnglishNum(str){
  return str.replace(/[০-৯]/g,d=> "০১২৩৪৫৬৭৮৯".indexOf(d));
}

function submitNow(){
  let sena=toEnglishNum(document.getElementById('sena').value.trim());
  let pod=document.getElementById('podobi').value;
  let name=document.getElementById('name').value.trim();
  let com=document.getElementById('company').value;
  let mob=toEnglishNum(document.getElementById('mobile').value.trim());
  let blood=document.getElementById('blood').value.trim();
  let pass=document.getElementById('pass').value;
  let cpass=document.getElementById('cpass').value;

  if(!sena||!name||!mob||!pass){
    document.getElementById('msg').innerHTML="<span style='color:red'>সেনা নং, নাম, মোবাইল, Password লাগবেই!</span>";
    return;
  }
  if(pass.length<6){
    document.getElementById('msg').innerHTML="<span style='color:red'>Password 6 digit এর বেশি দাও</span>";
    return;
  }
  if(pass!==cpass){
    document.getElementById('msg').innerHTML="<span style='color:red'>Password মিলে নাই!</span>";
    return;
  }

  let data={
    sena_no:sena,
    podobi:pod,
    name:name,
    company:com,
    mobile:mob,
    blood:blood,
    password:pass,
    status:"PENDING",
    time:new Date().toLocaleString()
  };

  // Local save
  localStorage.setItem('sena_no',sena);
  localStorage.setItem('mobile_no',mob);
  localStorage.setItem('pending_profile',JSON.stringify(data));

  document.getElementById('msg').innerHTML="<span style='color:green;font-weight:700'>✅ Submitted! Admin approval এর পর Login করতে পারবেন</span>";

  // Google Sheet এ পাঠাবে
  fetch(API,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({action:"new_profile",...data})
  });

  setTimeout(()=>{
    location.href="profile.html";
  },1500);
}
</script>

</body>
</html>
